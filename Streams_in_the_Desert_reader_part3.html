            {
              "en": "A number of years ago I went to America with a steamship captain who was a very <span class=\"vocab-trigger\" data-vocab=\"devoted\">devoted<\/span> Christian. When we were off the coast of <span class=\"vocab-trigger\" data-vocab=\"Newfoundland\">Newfoundland<\/span>, he said to me, “The last time I sailed here, which was five weeks ago, something happened that <span class=\"vocab-trigger\" data-vocab=\"revolutionized\">revolutionized<\/span> my entire Christian life. I had been on the bridge for twenty-four straight hours when <span class=\"vocab-trigger\" data-vocab=\"George Mueller\">George Mueller<\/span> of Bristol, England, who was a passenger on board, came to me and said, ‘Captain, I need to tell you that I must be in <span class=\"vocab-trigger\" data-vocab=\"Quebec\">Quebec<\/span> on Saturday afternoon.’ ‘That is impossible,’ I replied. ‘Very well,’ Mueller responded, ‘if your ship cannot take me, God will find some other way, for I have never missed an <span class=\"vocab-trigger\" data-vocab=\"engagement\">engagement<\/span> in fifty-seven years. Let’s go down to the <span class=\"vocab-trigger\" data-vocab=\"chartroom\">chartroom<\/span> to pray.’",
              "zh": "多年前，我随一位非常敬虔的船长乘轮船去美国。当船驶近纽芬兰海岸时，他对我说：“五周前我上次航行到这里时，发生了一件事，彻底改变了我整个基督徒生命。当时我已连续在驾驶台上工作了二十四个小时，来自英国布里斯托的乔治·慕勒是船上的乘客，他来对我说：‘船长，我必须告诉你，我周六下午必须到达魁北克。’‘那不可能。’我答道。‘很好，’慕勒回答，‘如果你的船不能载我去，神会找到别的办法，因为我五十七年来从未失约。我们到海图室去祷告吧。’",
              "simpEn": "Years ago I went to America with a ship captain who was a deeply faithful Christian. Near Newfoundland, he told me: 'The last time I sailed here, something happened that completely changed my Christian life. I had been on the bridge for 24 hours when George Mueller of England came and said, “Captain, I must be in Quebec Saturday afternoon.” I said it was impossible. Mueller said, “If your ship can't take me, God will find another way, for I have never missed an appointment in 57 years. Let's go to the chartroom and pray.”'",
              "simpZh": "好几年前，我和一位非常敬虔的基督徒船长一起乘船去美国。在纽芬兰附近，他告诉我：“五个星期前我经过这里时，发生了一件事，完全改变了我基督徒的生命。当时我已经在驾驶台连续站了二十四个小时，英国布里斯托的乔治·慕勒是船上乘客，他来找我说：‘船长，我必须星期六下午到达魁北克。’我说不可能。慕勒说：‘没关系，如果你的船不能带我去，神会预备别的路，因为五十七年来我从来没有失约过。我们到海图室去祷告。’”"
            },
            {
              "en": "“I looked at this man of God and thought to myself, ‘What <span class=\"vocab-trigger\" data-vocab=\"lunatic asylum\">lunatic asylum<\/span> did he escape from?’ I had never encountered someone like this. ‘Mr. Mueller,’ I said, ‘do you realize how <span class=\"vocab-trigger\" data-vocab=\"dense\">dense<\/span> the fog is?’ ‘No,’ he replied. ‘My eye is not on the dense fog but on the living God, who controls every <span class=\"vocab-trigger\" data-vocab=\"circumstance\">circumstance<\/span> of my life.’ He then knelt down and prayed one of the most simple prayers I’ve ever heard. When he had finished, I started to pray, but he put his hand on my shoulder and told me not to pray. He said, ‘First, you do not believe God will answer, and second, I BELIEVE HE HAS. <span class=\"vocab-trigger\" data-vocab=\"Consequently\">Consequently<\/span>, there is no need whatsoever for you to pray about it.’",
              "zh": "“我看着这位神人，心里想：‘他是从哪个疯人院逃出来的？’我从未遇见过这样的人。‘慕勒先生，’我说，‘你知道雾有多浓吗？’‘不，’他回答，‘我的眼目不看浓雾，而是仰望那位掌管我生活中每一环境的永生神。’然后他跪下，作了我听过的最简单的祷告。他祷告完了，我正要开口祷告，他却把手放在我肩上，叫我不要祷告。他说：‘第一，你不相信神会应允；第二，我相信祂已经应允了。所以，你根本不需要为此祷告。’",
              "simpEn": "'I looked at this man of God and thought, “What mental hospital did he come from?” I had never met anyone like him. “Mr. Mueller,” I said, “do you know how thick the fog is?” “No,” he answered, “my eye is not on the thick fog but on the living God, who controls everything in my life.” He knelt and prayed a very simple prayer. When he finished, I started to pray, but he put his hand on my shoulder and stopped me. He said, “First, you don't believe God will answer, and second, I BELIEVE HE HAS. So there is no need at all for you to pray about it.”'",
              "simpZh": "“我看著这位属神的人，心想：‘他是从哪个精神病院跑出来的？’我从没见过这样的人。‘慕勒先生，’我说，‘你知道雾有多浓吗？’‘不，’他说，‘我的眼睛不看浓雾，而是看那位掌管我生命中每一件事的永生神。’然后他跪下来，做了一个非常简单的祷告。他祷告完，我正要开始祷告，他却按着我的肩膀叫我不要祷告。他说：‘第一，你不相信神会答应；第二，我相信祂已经答应了。所以，你完全不需要为这件事祷告了。’”"
            },
            {
              "en": "“As I looked at him, he said, ‘Captain, I have known my Lord for fifty-seven years, and there has never been even a single day that I have failed to get an <span class=\"vocab-trigger\" data-vocab=\"audience\">audience<\/span> with the King. Get up, Captain, and open the door, and you will see that the fog is gone.’ I got up, and indeed the fog was gone. And on Saturday afternoon George Mueller was in Quebec for his meeting.” <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "“我看着他的时候，他说：‘船长，我认识我的主五十七年了，从来没有一天我不能觐见这位君王。起来，船长，去开门，你会看见雾已经散了。’我站起来，雾果然散了。而周六下午，乔治·慕勒准时在魁北克出席了他的聚会。” 选自",
              "simpEn": "'As I looked at him, he said, “Captain, I have known my Lord for 57 years, and not a single day have I failed to meet with the King. Get up, Captain, open the door, and you will see the fog is gone.” I got up, and the fog was truly gone. And Saturday afternoon George Mueller was in Quebec for his meeting.' selected",
              "simpZh": "“我看着他的时候，他说：‘船长，我认识我的主五十七年了，从来没有一天我不能朝见这位君王。起来，船长，去开门，你会看见雾已经散了。’我站起来，雾果真散了。到了星期六下午，乔治·慕勒就在魁北克参加聚会了。”选自"
            },
            {
              "en": "If our love were just more simple, We would take Him at His word; And our lives would be all sunshine, In the sweetness of our Lord.",
              "zh": "如果我们爱得更单纯，就必照祂话而行；我们的生活也必充满阳光，沐浴在我们主的甘甜之中。",
              "simpEn": "If our love were more simple, we would just trust His word; and our lives would be full of sunshine in the sweetness of our Lord.",
              "simpZh": "如果我们爱得更简单一点，就会直接相信祂的话；我们的生命就会在主的美好里充满阳光。"
            }
          ],

        {
          "sectionId": 7,

          "audio": "audio/streams in the desert - August 18.m4a",
          "paragraphs": [
            {
              "en": "The Lord alone led him. (Deuteronomy 32:12)",
              "zh": "耶和华独自引导他。（申命记32:12）",
              "simpEn": "The Lord alone led him.",
              "simpZh": "只有耶和华引导他。"
            },
            {
              "en": "The hill was <span class=\"vocab-trigger\" data-vocab=\"steep\">steep<\/span>, but cheered along the way By conversation sweet, climbing with the thought That it might be so till the height was reached; But suddenly a narrow <span class=\"vocab-trigger\" data-vocab=\"winding path\">winding path<\/span> Appeared, and then the Master said, “My child, Here you will walk safest with Me alone.” I <span class=\"vocab-trigger\" data-vocab=\"trembled\">trembled<\/span>, yet my heart’s deep trust replied, “So be it, Lord.” He took my <span class=\"vocab-trigger\" data-vocab=\"feeble\">feeble<\/span> hand In His, accepting thus my will to <span class=\"vocab-trigger\" data-vocab=\"yield\">yield<\/span> Him All, and to find all in Him. One long, dark moment, And no friend I saw, save Jesus only. But oh! so <span class=\"vocab-trigger\" data-vocab=\"tenderly\">tenderly<\/span> He led me on And up, and spoke to me such words of cheer, Such secret whisperings of His <span class=\"vocab-trigger\" data-vocab=\"wondrous\">wondrous<\/span> love, That soon I told Him all my grief and fear, And leaned on His strong arm <span class=\"vocab-trigger\" data-vocab=\"confidingly\">confidingly<\/span>. And then I found my footsteps <span class=\"vocab-trigger\" data-vocab=\"quickened\">quickened<\/span>, And light <span class=\"vocab-trigger\" data-vocab=\"unspeakable\">unspeakable<\/span>, the <span class=\"vocab-trigger\" data-vocab=\"rugged\">rugged<\/span> way <span class=\"vocab-trigger\" data-vocab=\"Illumined\">Illumined<\/span>, such light as only can be seen In close <span class=\"vocab-trigger\" data-vocab=\"companionship\">companionship<\/span> with God.",
              "zh": "山势陡峭，但一路上有甜美的交谈鼓舞，心中以为直攀到顶皆如此；但忽然出现了一条窄小的弯径，于是主说：“我的孩子，在这里你与我单独同行是最安全的。”我颤栗，然而心底深处的信赖回答：“主啊，愿祢的旨意成就。”祂握住我软弱的手，接纳我愿将一切降服于祂、在祂里面寻见一切的心志。漫长幽暗的一刻，除耶稣外不见一友。但哦！祂何等温柔地引领我前行、向上，并对我说鼓励的话，将祂奇妙的爱悄悄低诉，以至我很快将所有的忧惧都告诉了祂，全心倚靠在祂大能的膀臂上。于是我发现脚步加速了，并有无法言喻的光照亮崎岖之路，这光只有在与神亲密的交通中才能看见。",
              "simpEn": "The hill was steep, but cheered by sweet talk along the way, I climbed thinking it might stay so until the top. But suddenly a narrow twisting path appeared, and the Master said, 'My child, here you will walk safest alone with Me.' I shook with fear, yet my heart's deep trust said, 'So be it, Lord.' He took my weak hand in His, accepting my will to give Him everything, and to find all in Him. One long, dark moment, I saw no friend except Jesus. But oh, so gently He led me on and up, speaking cheering words and whispering His wonderful love, that soon I told Him all my sadness and fear, and leaned on His strong arm with full trust. Then I found my steps grew faster, and a light too great for words lit up the rough path, a light seen only in close friendship with God.",
              "simpZh": "山很陡，但一路上有甜蜜的谈话鼓励，我就继续爬，以为一直会这样直到山顶。忽然出现了一条窄窄弯弯的小路，然后主说：“我的孩子，在这里你跟我单独走是最安全的。”我害怕得发抖，但心里深处的信任回答说：“主啊，愿照祢的话成就。”祂握住我无力的手，接受了我要把一切都交给祂、并在祂里面找到一切的心。一段又长又黑的时刻，除了耶稣我看不见一个朋友。可是哦，祂那么温柔地领我向前向上，对我说鼓励的话，悄悄地告诉我祂奇妙的爱，不久我就把所有悲伤和恐惧都告诉祂，并完全信任地靠在祂有力的膀臂上。然后我发现自己的脚步变快了，一种说不出的亮光照亮了崎岖的路，这种光只有在与神亲近的交往中才能看见。"
            },
            {
              "en": "A little while, and we will meet again The loved and lost; but in the <span class=\"vocab-trigger\" data-vocab=\"rapturous\">rapturous<\/span> joy Of greetings, such as here we cannot know, And happy song, and heavenly embraces, And tender <span class=\"vocab-trigger\" data-vocab=\"recollections\">recollections<\/span> rushing back Of life now passed, I think one memory More dear and <span class=\"vocab-trigger\" data-vocab=\"sacred\">sacred<\/span> than the rest, will rise, And we who gather in the golden streets, Will oft be stirred to speak with grateful love Of that dark day Jesus called us to climb Some narrow steep, leaning on Him alone.",
              "zh": "再过片时，我们就要重逢所爱与所失者；在那种此地无法领略的狂喜重逢、快乐歌声、天上的拥抱，以及对逝去人生的温柔回忆涌来时，我想有一件记忆，比其余的更亲爱、更神圣，会浮起来；我们这些聚集在黄金街上的，将常被感动，怀着感恩的爱讲说那黑暗的日子，耶稣呼召我们靠着祂独自攀登某个窄峭的山路。",
              "simpEn": "In a little while we will meet again those we loved and lost. In the ecstatic joy of greetings we cannot know here, with happy songs, heavenly hugs, and gentle memories rushing back of the life we lived, I think one memory will rise, more dear and holy than the rest. And we who gather on the golden streets will often be moved to speak with thankful love of that dark day when Jesus called us to climb some narrow steep, leaning on Him alone.",
              "simpZh": "再过不久，我们就要再见到那些我们爱过又失去的人。在那份这里无法体会的狂喜重逢里，有快乐的歌声、天上的拥抱，以及对过去人生的温柔回忆涌上来时，我想有一个回忆会比其他的更亲爱、更神圣，会浮现出来。我们这些在黄金街相聚的人，会常常被感动，用感恩的爱讲述那个黑暗的日子，那时耶稣呼召我们独自靠祂攀登某个又窄又陡的山。"
            },
            {
              "en": "There is never a <span class=\"vocab-trigger\" data-vocab=\"majestic\">majestic<\/span> mountain without a deep valley, and there is no birth without pain. <span class=\"vocab-trigger\" data-vocab=\"Daniel Crawford\">Daniel Crawford<\/span>",

              "simpEn": "There is no grand mountain without a deep valley, and no birth without pain. Daniel Crawford",

          "paragraphs": [
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Sorrowful\">Sorrowful<\/span>, yet always <span class=\"vocab-trigger\" data-vocab=\"rejoicing\">rejoicing<\/span>. (2 Corinthians 6:10)",
              "zh": "似乎忧愁，却是常常快乐的。（哥林多后书6:10）",
              "simpEn": "Sad, yet always full of joy.",
              "simpZh": "难过，却常常充满喜乐。"
            },
            {
              "en": "Sorrow was beautiful, but his beauty was the beauty of the moonlight shining through the leafy branches of the trees in the woods. His gentle light made little pools of silver here and there on the soft green <span class=\"vocab-trigger\" data-vocab=\"moss\">moss<\/span> of the forest floor. And when he sang, his song was like the low, sweet calls of the <span class=\"vocab-trigger\" data-vocab=\"nightingale\">nightingale<\/span>, and in his eyes was the <span class=\"vocab-trigger\" data-vocab=\"unexpectant gaze\">unexpectant gaze<\/span> of someone who has ceased to look for coming gladness. He could weep in tender sympathy with those who weep, but to rejoice with those who rejoice was unknown to him.",
              "zh": "忧愁很美，但他的美是月光透过林中浓密枝叶照耀的那种美。他柔和的光在林地柔软的绿苔上，到处洒下银色的浅潭。他歌唱时，歌声犹如夜莺低沉甜美的呼唤，他的目光中含着一份不再期待即将来临之欢乐的神情。他能与哀哭的人同哭，温柔同情，但对于与喜乐的人同乐，他却是陌生的。",
              "simpEn": "Sorrow was beautiful, but his beauty was like moonlight shining through leafy branches in the woods. His soft light made small silver puddles here and there on the green moss of the forest floor. When he sang, his song was like the low, sweet calls of a nightingale, and in his eyes was the look of one who has stopped expecting happiness to come. He could cry with gentle care for those who cry, but he did not know how to be happy with those who are happy.",
              "simpZh": "忧愁很美，但他的美就像月光穿过树林里叶子间的树枝照出来的样子。他柔和的光在森林地面的绿苔上这里那里洒下小小的银色水潭。他唱歌的时候，歌声像夜莺低沉又好听的叫声，他的眼神里带着一种不再期待快乐来临的表情。他能够温柔同情地和哭泣的人一起哭，但是要和喜乐的人一起快乐，他却不知道怎么做。"
            },
            {
              "en": "Joy was beautiful, too, but hers was the <span class=\"vocab-trigger\" data-vocab=\"radiant\">radiant<\/span> beauty of a summer morning. Her eyes still held the happy laughter of childhood, and her hair <span class=\"vocab-trigger\" data-vocab=\"glistened\">glistened<\/span> with the sunshine’s kiss. When she sang, her voice <span class=\"vocab-trigger\" data-vocab=\"soared\">soared<\/span> upward like a <span class=\"vocab-trigger\" data-vocab=\"skylark\">skylark<\/span>, and her steps were the march of a <span class=\"vocab-trigger\" data-vocab=\"conqueror\">conqueror<\/span> who has never known defeat. She could rejoice with anyone who rejoices, but to weep with those who weep was unknown to her.",
              "zh": "喜乐也很美，但她的美是夏日清晨那种光辉的美。她眼中仍存着童年欢乐的笑声，她的头发因阳光亲吻而闪闪发亮。她歌唱时，声音如云雀般向上翱翔，她的步伐就像从未尝过失败滋味的得胜者之进行。她能与任何喜乐的人同乐，但对于与哀哭的人同哭，她却是陌生的。",
              "simpEn": "Joy was also beautiful, but hers was the bright, glowing beauty of a summer morning. Her eyes still held the happy laughter of a child, and her hair shone with the sunlight's kiss. When she sang, her voice flew upward like a skylark, and her steps were like the march of a winner who has never known loss. She could be happy with anyone who is happy, but she did not know how to cry with those who cry.",
              "simpZh": "喜乐也很美，但她的美是夏天早晨那种明亮发光的美。她的眼睛里还留着小时候那种快乐的笑声，她的头发因为阳光的亲吻闪闪发亮。她唱歌的时候，声音像云雀一样向上飞，她的脚步像一个从来没尝过失败滋味的得胜者那样。她能和任何快乐的人一同快乐，但她不知道怎么和哭泣的人一同哭泣。"
            },
            {
              "en": "Sorrow longingly said, “We can never be united as one.” “No, never,” responded Joy, with eyes <span class=\"vocab-trigger\" data-vocab=\"misting\">misting<\/span> as she spoke, “for my path lies through the sunlit <span class=\"vocab-trigger\" data-vocab=\"meadows\">meadows<\/span>, the sweetest roses bloom when I arrive, and songbirds await my coming to sing their most joyous <span class=\"vocab-trigger\" data-vocab=\"melodies\">melodies<\/span>.” “Yes, and my path,” said Sorrow, turning slowly away, “leads through the dark forest, and <span class=\"vocab-trigger\" data-vocab=\"moonflowers\">moonflowers<\/span>, which open only at night, will fill my hands. Yet the sweetest of all earthly songs—the love song of the night—will be mine. So <span class=\"vocab-trigger\" data-vocab=\"farewell\">farewell<\/span>, dear Joy, farewell.”",
              "zh": "忧愁依依不舍地说：“我们永远不能合而为一。”“是的，永不能，”喜乐眼泛泪光地回答，“因我的路穿越洒满阳光的草场，最美的玫瑰在我来时绽放，歌鸟等候我来唱出最欢乐的旋律。”“不错，而我的路，”忧愁缓缓转身离去，“则穿过幽暗的森林，只在夜间绽放的月亮花会满握我手。然而全地最美的歌——夜间的爱情之歌——将属于我。再会了，亲爱的喜乐，再会。”",
              "simpEn": "Sorrow said with longing, 'We can never be joined as one.' 'No, never,' answered Joy, her eyes growing wet as she spoke, 'for my path lies through sunny meadows, the sweetest roses bloom when I come, and songbirds wait for me to sing their happiest songs.' 'Yes, and my path,' said Sorrow, turning slowly away, 'leads through the dark woods, and moonflowers, which open only at night, will fill my hands. But the sweetest of all songs on earth—the love song of the night—will be mine. So goodbye, dear Joy, goodbye.'",
              "simpZh": "忧愁充满渴望地说：“我们永远不能合在一起。”“是的，永远不会。”喜乐回答，说话时眼睛湿了，“因为我的路穿过阳光满满的草地，最美的玫瑰在我来到时开放，小鸟等着我来唱它们最快乐的歌。”“是的，而我的路，”忧愁慢慢转过身，“穿过黑暗的树林，只在晚上开的月亮花会装满我的手。但全地上最甜美的歌——夜晚的爱情歌——会是我的。所以再见了，亲爱的喜乐，再见。”"
            },
            {
              "en": "Yet even as Sorrow spoke, he and Joy became <span class=\"vocab-trigger\" data-vocab=\"aware\">aware<\/span> of someone standing beside them. In spite of the dim light, they sensed a <span class=\"vocab-trigger\" data-vocab=\"kingly\">kingly<\/span> Presence, and suddenly a great and holy <span class=\"vocab-trigger\" data-vocab=\"awe\">awe<\/span> <span class=\"vocab-trigger\" data-vocab=\"overwhelmed\">overwhelmed<\/span> them. They then sank to their knees before Him. “I see Him as the King of Joy,” whispered Sorrow, “for on His head are many crowns, and the <span class=\"vocab-trigger\" data-vocab=\"nailprints\">nailprints<\/span> in His hands and feet are the <span class=\"vocab-trigger\" data-vocab=\"scars\">scars<\/span> of a great victory. And before Him all my sorrow is melting away into deathless love and gladness. I now give myself to Him forever.” “No, Sorrow,” said Joy softly, “for I see Him as the King of Sorrow, and the crown on His head is a <span class=\"vocab-trigger\" data-vocab=\"crown of thorns\">crown of thorns<\/span>, and the nailprints in His hands and feet are the scars of terrible <span class=\"vocab-trigger\" data-vocab=\"agony\">agony<\/span>. I also give myself to Him forever, for sorrow with Him must be sweeter than any joy I have ever known.”",
              "zh": "然而，正说话间，忧愁与喜乐察觉到有人站在他们身边。虽然光线暗淡，他们却感到一种君王般的同在，突然，一种极大而圣洁的敬畏淹没了他们。于是他们在祂面前双膝跪下。“我视祂为喜乐的王，”忧愁低声说，“因祂头上戴着许多冠冕，手脚上的钉痕是大胜利的伤疤。在祂面前，我一切的忧愁都融化了，变成不死的爱与欢欣。我现在把自己永远给祂。”“不，忧愁，”喜乐柔声说，“因我看祂是忧愁的王，祂头上的冠冕是荆棘冠冕，手脚上的钉痕是可怕痛苦的伤痕。我也把自己永远给祂，因为与祂同受的忧愁，定比我曾知道的任何喜乐更甜。”",
              "simpEn": "But even as Sorrow spoke, he and Joy became aware of someone standing beside them. Though the light was dim, they felt a kingly Presence, and suddenly a great and holy wonder swept over them. They fell to their knees before Him. 'I see Him as the King of Joy,' whispered Sorrow, 'for on His head are many crowns, and the nail marks in His hands and feet are the scars of a great victory. Before Him all my sadness is melting into never-ending love and happiness. I give myself to Him forever.' 'No, Sorrow,' said Joy softly, 'for I see Him as the King of Sorrow. The crown on His head is a crown of thorns, and the nail marks are the scars of terrible pain. I also give myself to Him forever, for sorrow with Him must be sweeter than any joy I have ever known.'",
              "simpZh": "可是就在忧愁说话的时候，他和喜乐都察觉到有人站在他们旁边。虽然光线很暗，他们感受到一种君王般的同在，突然一阵巨大的、圣洁的敬畏淹没了他们。他们就跪在祂面前。“我看祂是喜乐的王，”忧愁轻声说，“因为祂头上戴着许多冠冕，手脚上的钉痕是大得胜的伤疤。在祂面前，我所有的忧愁都融化了，变成永不死的爱和快乐。我现在把自己永远给祂。”“不，忧愁，”喜乐温柔地说，“我看祂是忧愁的王，祂头上的冠冕是荆棘冠冕，手脚上的钉痕是极大痛苦的伤疤。我也把自己永远给祂，因为与祂一同受苦，比我尝过的任何喜乐都更甜。”"
            },
            {
              "en": "“Then we are one in Him,” they cried in gladness, “for no one but He could unite Joy and Sorrow.” Therefore they walked hand in hand into the world, to follow Him through storms and sunshine, through winter’s severe cold and the warmth of summer’s gladness, and to be “sorrowful, yet always rejoicing.”",
              "zh": "“那么我们在祂里面合而为一了，”他们欢然呼喊，“因为除了祂，没有人能将喜乐与忧愁联合。”于是他们手拉手走进世界，在风雨和阳光下，在严冬和夏日的温暖中跟随祂，成为“似乎忧愁，却是常常快乐的”。",
              "simpEn": "'Then we are one in Him,' they cried with joy, 'for no one but He could join Joy and Sorrow.' So they walked hand in hand into the world, to follow Him through storms and sunshine, through winter's bitter cold and warm summer gladness, and to be 'sad, yet always full of joy.'",
              "simpZh": "“那么我们在祂里面合一了，”他们开心地喊出来，“因为除了祂，没有人能把喜乐和忧愁连在一起。”于是他们手牵着手走进世界，在风暴和阳光中，在冬天的严寒和夏天温暖的快乐中跟随祂，并且成为“难过，却常常喜乐”的人。"
            },
            {
              "en": "Does Sorrow lay his hand upon your shoulder, And walk with you in silence on life’s way, While Joy, your bright companion once, grown colder, Becomes to you more distant day by day? Run not from the companionship of Sorrow, He is the messenger of God to thee; And you will thank Him in His great tomorrow— For what you do not know now, you then will see; He is God’s angel, clothed in <span class=\"vocab-trigger\" data-vocab=\"veils of night\">veils of night<\/span>, With whom “we walk by <span class=\"vocab-trigger\" data-vocab=\"faith\">faith<\/span>” and “not by <span class=\"vocab-trigger\" data-vocab=\"sight\">sight<\/span>” [2 Cor. 5:7 KJV].",
              "zh": "忧愁是否将手搭在你肩，在你人生路上默默同行，而你昔日的光明伴侣喜乐却变得冷淡，一天比一天疏远？不要逃离忧愁的陪伴，他是神差来给你的使者；你必在祂伟大的明天感谢祂——因你如今不知道的，那时必看见；他是神的使者，披着黑夜的面纱，我们“行事为人是凭着信心，不是凭着眼见”[林后5:7]。",
              "simpEn": "Does Sorrow put his hand on your shoulder and walk with you quietly through life, while Joy, your once-bright companion, grows colder and more distant day by day? Do not run from Sorrow's company; he is God's messenger to you. And you will thank God in His great tomorrow—for what you do not understand now, you will then see. He is God's angel, dressed in the coverings of night, with whom we walk by faith and not by sight.",
              "simpZh": "忧愁是不是把手搭在你肩上，在你的路上安静地陪着你走，而你原来那光明的同伴喜乐却变得冷淡，一天比一天疏远？不要从忧愁的同在中逃跑，他是神差到你这里来的使者；你将会在祂那伟大的明天感谢祂——因为你现在不明白的，那时就会看见；他是神的使者，披着黑夜的面纱，我们“行事为人是凭着信心，不是凭着眼见”。"
            }
          ],

          "paragraphs": [
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Jacob\">Jacob<\/span> was left alone, and a man <span class=\"vocab-trigger\" data-vocab=\"wrestled\">wrestled<\/span> with him till daybreak. (Genesis 32:24)",
              "zh": "只剩下雅各一人。有一个人来和他摔跤，直到黎明。（创世记32:24）",
              "simpEn": "Jacob was left alone, and a man wrestled with him until dawn.",
              "simpZh": "只剩下雅各一个人。有一个人来和他摔跤，一直到天亮。"
            },
            {
              "en": "In this passage, God is wrestling with Jacob more than Jacob is wrestling with God. The “man” referred to here is the <span class=\"vocab-trigger\" data-vocab=\"Son of Man\">Son of Man<\/span>—the Angel of the <span class=\"vocab-trigger\" data-vocab=\"Covenant\">Covenant<\/span>. It was God in human form, pressing down on Jacob to press his old life from him. And by daybreak God had <span class=\"vocab-trigger\" data-vocab=\"prevailed\">prevailed<\/span>, for Jacob’s “hip was <span class=\"vocab-trigger\" data-vocab=\"wrenched\">wrenched<\/span>” (v. 25). As Jacob “fell” from his old life, he fell into the arms of God, clinging to Him but also wrestling until his blessing came. His blessing was that of a new life, so he rose from the earthly to the heavenly, the human to the <span class=\"vocab-trigger\" data-vocab=\"divine\">divine<\/span>, and the natural to the <span class=\"vocab-trigger\" data-vocab=\"supernatural\">supernatural<\/span>. From that morning forward, he was a weak and broken man from a human perspective, but God was there. And the Lord’s heavenly voice <span class=\"vocab-trigger\" data-vocab=\"proclaimed\">proclaimed<\/span>, “Your name will no longer be Jacob, but <span class=\"vocab-trigger\" data-vocab=\"Israel\">Israel<\/span>, because you have struggled with God and with men and have <span class=\"vocab-trigger\" data-vocab=\"overcome\">overcome<\/span>” (v. 28).",
              "zh": "这段经文中，神与雅各摔跤，更胜于雅各与神摔跤。这里提到的“人”乃是人子——立约的使者。那是神以人的形状显现，压在雅各身上，要从他身上挤出旧生命。到黎明时，神已经得胜，因为雅各的“大腿窝扭了”（25节）。当雅各从旧生命“倒下”时，他倒在了神的怀抱中，既紧紧抓住祂，又继续摔跤直到得着祝福。他的福分是新生命，因此他从属地进入属天，从人进入神，从自然进入超自然。从那天早晨起，从人的角度看他是一个软弱破碎的人，但神在那里。主从天上的声音宣告：“你的名不要再叫雅各，要叫以色列；因为你与神与人较力，都得了胜”（28节）。",
              "simpEn": "In this passage, God is wrestling with Jacob more than Jacob wrestles with God. The 'man' is the Son of Man—the Angel of the Covenant. It was God in human shape, pressing down on Jacob to push his old life out of him. By dawn God had won, for Jacob's hip was pulled out of joint. As Jacob 'fell' from his old life, he fell into God's arms, holding on to Him but still wrestling until his blessing came. His blessing was a new life, so he rose from earthly to heavenly, human to God-like, and natural to supernatural. From that morning on, he was a weak and broken man in human eyes, but God was there. And the Lord's voice from heaven said, 'Your name will no longer be Jacob, but Israel, because you have struggled with God and with men and have overcome.'",
              "simpZh": "在这段经文里，神和雅各摔跤，比雅各和神摔跤更多。这里说的“人”就是人子——那位立约的使者。那是神以人的样子显现，压在雅各身上，要把他里面的旧生命压出去。到天亮的时候，神已经得胜了，因为雅各的大腿窝扭了。当雅各从旧生命“倒下”时，他倒进了神的怀抱里，既紧紧抓住祂，又继续摔跤直到得到了祝福。他的祝福是一个新生命，所以他从此从地上进入天上，从人性进入神性，从自然进入超自然。从那天早晨起，从人的角度看他又软弱又破碎，但神就在那里。主从天上来的声音宣告：“你的名字不要再叫雅各，要叫以色列；因为你与神与人较力，都得了胜。”"
            },
            {
              "en": "Beloved, this should be a typical scene in the life of everyone who has been <span class=\"vocab-trigger\" data-vocab=\"transformed\">transformed<\/span>. If God has called us to His highest and best, each of us will have a time of <span class=\"vocab-trigger\" data-vocab=\"crisis\">crisis<\/span>, when all our resources will fail and when we face either ruin or something better than we have ever dreamed. But before we can receive the blessing, we must rely on God’s <span class=\"vocab-trigger\" data-vocab=\"infinite\">infinite<\/span> help. We must be willing to let go, <span class=\"vocab-trigger\" data-vocab=\"surrendering\">surrendering<\/span> completely to Him, and <span class=\"vocab-trigger\" data-vocab=\"cease\">cease<\/span> from our own wisdom, strength, and righteousness. We must be “<span class=\"vocab-trigger\" data-vocab=\"crucified with Christ\">crucified with Christ<\/span>” (Gal. 2:20) and yet alive in Him. God knows how to lead us to the point of crisis, and He knows how to lead us through it.",
              "zh": "亲爱的，这应当是每个被改变之人生命中典型的一幕。如果神呼召我们进入祂至好至高的境地，我们每个人都必经历一个危机时刻，那时一切资源都耗尽，我们面临要么毁坏要么更美梦境成真。但在我们领受祝福之前，我们必须仰赖神无穷的帮助。我们必须甘愿放手，完全降服于祂，停止依靠自己的智慧、力量与公义。我们必须“与基督同钉十字架”（加拉太书2:20），却又在祂里面活着。神知道如何领我们到危机之处，也知道如何领我们通过。",
              "simpEn": "Dear friends, this should be a common picture in the life of everyone who has been changed. If God has called us to His best, each of us will have a time of trouble when all our strength fails and we face either total loss or something better than we ever dreamed. But before we can get the blessing, we must lean on God's endless help. We must be willing to let go, give up everything to Him, and stop using our own wisdom, strength, and goodness. We must be 'nailed to the cross with Christ' and yet alive in Him. God knows how to bring us to the point of crisis, and He knows how to lead us through it.",
              "simpZh": "亲爱的啊，这应当是每一个被神改变过的人生命中常见的图画。如果神呼召我们进入祂最好的境地，我们每一个人都会经历一个危机时刻，那时候我们所有的力量都用尽了，面对的是要么全毁，要么得到比梦想更好的东西。但在我们得到祝福之前，我们必须依靠神无限的帮助。我们必须愿意放手，完全降服于祂，停止用自己的智慧、力量和公义。我们必须“与基督同钉十字架”，却又在祂里面活着。神知道怎样把我们带到那个危机的点，也知道怎样领我们通过。"
            },
            {
              "en": "Is God leading you in this way? Is this the meaning of your <span class=\"vocab-trigger\" data-vocab=\"mysterious trial\">mysterious trial<\/span>, your difficult circumstances, your impossible situation, or that trying place you cannot seem to move past without Him? But do you have enough of Him to win the victory? Then turn to Jacob’s God! Throw yourself helplessly at His feet. <span class=\"vocab-trigger\" data-vocab=\"Die\">Die<\/span> in His loving arms to your own strength and wisdom, and rise like Jacob into His strength and <span class=\"vocab-trigger\" data-vocab=\"sufficiency\">sufficiency<\/span>. There is no way out of your difficult and narrow situation except at the top. You must win <span class=\"vocab-trigger\" data-vocab=\"deliverance\">deliverance<\/span> by rising higher, coming into a new experience with God. And may it bring you into all that is meant by the revelation of “<span class=\"vocab-trigger\" data-vocab=\"the Mighty One of Jacob\">the Mighty One of Jacob<\/span>” (Isa. 60:16)! There is no way out but God.",
              "zh": "神是否正如此引领你？这岂非你奥秘试炼的意义，你艰难的环境，你似乎无法度过的绝境，那没有祂就无法离开的窘困之处？但你可有足够的祂来赢得胜利？那么，转向雅各的神吧！将自己无助地抛在祂脚前。在祂慈爱的膀臂中，向着自己的能力和智慧死，像雅各一样，复活进入祂的能力与充足。在又难又窄的困境中，除了在顶峰之处，别无出路。你必须借着升到更高，进入与神新的经历而赢得拯救。愿这带你进入“雅各的大能者”（以赛亚书60:16）启示的一切丰富！除神以外，别无出路。",
              "simpEn": "Is God leading you this way? Is this what your hard trial, your difficult place, your impossible situation, or the testing spot you can't leave without Him means? But do you have enough of Him to win? Then turn to the God of Jacob! Throw yourself down helpless at His feet. Die to your own strength and wisdom in His loving arms, and rise like Jacob into His power and all-sufficiency. There is no way out of your tight, hard place except at the top. You must find rescue by going higher, stepping into a new walk with God. And may it bring you into all that the name 'the Mighty One of Jacob' means! There is no way out but God.",
              "simpZh": "神是不是正在这样带领你？这就是你那个奥秘试炼的意义吗？是你艰难的环境、好像不可能的情况、那个没有祂就没法走出来的地方吗？可是你有没有足够的祂来得胜呢？那就转向雅各的神吧！把自己无依无靠地倒在祂脚前。在祂爱的怀抱里，向着自己的能力和智慧死掉，然后像雅各那样，复活进入祂的能力和充足里面。在又难又窄的地方，除了在最高处，没有别的出路。你必须借着升得更高、进入与神全新的经历来得到释放。愿这带你进入“雅各的大能者”所启示的一切！除了神，没有别的出路。"
            },

              "en": "He brought me out into a <span class=\"vocab-trigger\" data-vocab=\"spacious place\">spacious place<\/span>; he rescued me because he <span class=\"vocab-trigger\" data-vocab=\"delighted\">delighted<\/span> in me. (Psalm 18:19)",

              "simpEn": "What is this 'spacious place'? What can it be but God Himself—the endless One in whom all others find their start and finish of life? God truly is a 'wide-open place.' And it was through being brought low, shamed, and feeling worthless that David was taken there. Madame Guyon",

      "title": "August 26–September 1",
      "sections": [
        {
          "sectionId": 1,
          "heading": "August 26",
          "audio": "audio/streams in the desert - August 26.m4a",
          "paragraphs": [
            {
              "en": "It is not in me. (Job 28:14)",
              "zh": "不在我里面。（约伯记28:14）",
              "simpEn": "It is not in me.",
              "simpZh": "它不在我里面。"
            },
            {
              "en": "I remember saying one summer, “What I really need is a trip to the ocean.” So I went to the beach, but the ocean seemed to say, “It is not in me!” The ocean did not do for me what I thought it would. Then I said, “Perhaps the mountains will provide the rest I need.” I went to the mountains, and when I awoke the first morning, I gazed at the <span class=\"vocab-trigger\" data-vocab=\"magnificent\">magnificent<\/span> mountain I had so longed to see. But the sight did not <span class=\"vocab-trigger\" data-vocab=\"satisfy\">satisfy<\/span>, and the mountain said, “It is not in me!”",
              "zh": "我记得有一年夏天曾说：“我真正需要的是一次海滨之行。”于是我去了海边，但大海似乎在说：“不在我里面！”大海并没有带给我预期的效果。后来我又说：“也许大山能提供我所需要的安息。”我去了山里，当我头一个早晨醒来，凝望那座我渴慕已久的壮丽山峦时，那景象并没有使我满足，大山也在说：“不在我里面！”",
              "simpEn": "I remember one summer saying, 'What I really need is a trip to the ocean.' So I went to the beach, but the ocean seemed to say, 'It is not in me!' The ocean didn't do what I thought it would. Then I said, 'Maybe the mountains will give me the rest I need.' I went to the mountains, and the first morning I looked at the grand mountain I had wanted so much to see. But the sight didn't fill me, and the mountain said, 'It is not in me!'",
              "simpZh": "我记得有一年夏天说：“我真需要去海边一趟。”我就去了，可是大海好像说：“不在我这里！”大海没有给我我以为的那种帮助。然后我说：“也许高山能给我安息。”我去了山里，第一天早上醒来，望着那座我一直想看的雄伟山峰。但那景色没有满足我，高山也在说：“不在我这里！”"
            },
            {
              "en": "What I really needed was the deep ocean of God’s love, and the high mountains of His truth within me. His wisdom had depths and heights that neither the ocean nor the mountains could contain and that could not be compared with <span class=\"vocab-trigger\" data-vocab=\"jewels\">jewels<\/span>, gold, or <span class=\"vocab-trigger\" data-vocab=\"precious stones\">precious stones<\/span>. Christ is wisdom and He is our deepest need. Our inner restlessness can only be <span class=\"vocab-trigger\" data-vocab=\"pacified\">pacified<\/span> by the revelation of His eternal friendship and love for us. <span class=\"vocab-trigger\" data-vocab=\"Margaret Bottome\">Margaret Bottome<\/span>",
              "zh": "我真正需要的是神之爱的深海，是祂真理在我里面的高山。祂的智慧所包含的深度与高度，远非海洋和山峦所能容纳，也非珠宝、黄金或宝石可比。基督就是智慧，祂是我们最深的需要。我们内在的焦躁不安，唯有靠着祂永恒的友谊和爱向我们显明，才能得以平息。 玛格丽特·伯顿",
              "simpEn": "What I really needed was the deep ocean of God's love and the high mountains of His truth inside me. His wisdom has depths and heights that neither the ocean nor the mountains could hold, and it cannot be compared to jewels, gold, or valuable stones. Christ is wisdom and He is our deepest need. Our inner restlessness can only be calmed by the showing of His forever friendship and love for us. Margaret Bottome",
              "simpZh": "我真正需要的是神爱的深海，和神真理在我里面的高山。祂智慧的深度和高度，海洋和高山都装不下，也不是珠宝、金子、宝石可以比的。基督就是智慧，是我们最根本的需要。我们内心的烦躁，只有祂显明了永远的朋友之爱，才能安静下来。玛格丽特·伯顿"
            },
            {
              "en": "My heart is there! Where, on eternal hills, my loved one dwells Among the lilies and <span class=\"vocab-trigger\" data-vocab=\"asphodels\">asphodels<\/span>; Clad in the brightness of the Great White Throne, Glad in the smile of Him who sits thereon, The glory gilding all His wealth of hair And making His immortal face more fair— THERE IS MY TREASURE and my heart is there.",
              "zh": "我的心在那里！那永恒山岭上，我所爱者居住之处，在百合与水仙丛中；披戴着那伟大白色宝座的荣光，欣然沐浴坐宝座者的笑容，荣耀镀满祂丰盛的头发，使祂不朽的面容更显荣美——我的财宝在那里，我的心也在那里。",
              "simpEn": "My heart is there! Where, on everlasting hills, my loved one lives among the lilies and white flowers; dressed in the brightness of the Great White Throne, glad in the smile of Him who sits there, the glory covering all His thick hair and making His never-dying face more lovely— MY TREASURE IS THERE and my heart is there.",
              "simpZh": "我的心在那里！在永恒的山上，我所爱的那位住在百合花和仙花之中；穿着大宝座的亮光，在坐着的那位的微笑中欢喜，荣耀镀满祂浓密的头发，使祂不朽的脸更美——我的财宝在那里，我的心也在那里。"
            },
            {
              "en": "My heart is there! With Him who made all earthly life so grand, So fit to live, and yet to die His plan; So mild, so great, so gentle and so brave, So ready to forgive, so strong to save. His fair, pure Spirit makes the Heavens more fair, And that is where rises my longing prayer— THERE IS MY TREASURE and my heart is there. <span class=\"vocab-trigger\" data-vocab=\"Favorite poem of the late Charles E. Cowman\">Favorite poem of the late Charles E. Cowman<\/span>",
              "zh": "我的心在那里！与那位同在，祂使地上生命如此恢宏，如此值得活，又按祂计划死去；祂如此温柔，如此伟大，如此柔和，如此勇敢，如此乐意饶恕，如此能拯救。祂美善纯洁的灵使诸天更加美丽，那正是我渴慕祈祷上达之处——我的财宝在那里，我的心也在那里。 查理·考门先生生前最爱的诗",
              "simpEn": "My heart is there! With Him who made all earthly life so wonderful, so good to live, and yet to die was His plan; so mild, so great, so gentle and so brave, so ready to forgive, so strong to save. His fair, pure Spirit makes the heavens more beautiful, and that is where my deep prayer rises— MY TREASURE IS THERE and my heart is there. Favorite poem of the late Charles E. Cowman",
              "simpZh": "我的心在那里！跟祂在一起，祂让地上生命这么伟大，这么值得活，按祂的计划死去；祂那么温柔，那么伟大，那么柔和，那么勇敢，那么愿意饶恕，那么有拯救的大能。祂美丽纯洁的灵让天更美，那正是我渴望的祷告上升的地方——我的财宝在那里，我的心也在那里。查理·考门先生生前最爱的诗"
            },
            {
              "en": "You can never expect to keep an eagle in the forest. You might be able to gather a group of the most beautiful birds around him, provide a <span class=\"vocab-trigger\" data-vocab=\"perch\">perch<\/span> for him on the tallest pine, or enlist other birds to bring him the choicest of delicacies, but he will reject them all. He will spread his proud wings and, with his eye on an <span class=\"vocab-trigger\" data-vocab=\"Alpine cliff\">Alpine cliff<\/span>, <span class=\"vocab-trigger\" data-vocab=\"soar\">soar<\/span> away to his own <span class=\"vocab-trigger\" data-vocab=\"ancestral halls\">ancestral halls<\/span> of rock, where storms and waterfalls make their natural music. Our soul longs to soar as an eagle and will find rest with nothing short of the <span class=\"vocab-trigger\" data-vocab=\"Rock of Ages\">Rock of Ages<\/span>. Its ancestral halls are the halls of heaven, made with the rock of the <span class=\"vocab-trigger\" data-vocab=\"attributes of God\">attributes of God<\/span>. And the span of its majestic flight is <span class=\"vocab-trigger\" data-vocab=\"eternity\">eternity<\/span>! “Lord, YOU have been our <span class=\"vocab-trigger\" data-vocab=\"dwelling place\">dwelling place<\/span> throughout all generations” (Ps. 90:1). <span class=\"vocab-trigger\" data-vocab=\"J. R. Macduff\">J. R. Macduff<\/span>",
              "zh": "你永不可能期望将鹰关在森林里。也许你能聚拢一群最美的鸟环绕他，在最高的松树上为他预备栖木，或差派其他鸟给他衔来最精美的珍馐，但他必全部拒绝。他会展开骄傲的翅膀，眼望阿尔卑斯的山崖，腾飞向他那古老本族的岩石殿堂，那里有风暴和瀑布作天然的音乐。我们的灵魂渴望如鹰翱翔，除了那万古磐石之外，绝无安息。它本族的殿宇就是天上的殿宇，是用神属性的磐石建成的。它壮丽飞翔的跨度乃是永恒！“主啊，祢世世代代作我们的居所”（诗篇90:1）。 麦克达夫",
              "simpEn": "You can never hope to keep an eagle in the woods. You might gather the most beautiful birds around him, give him a branch on the tallest pine, or send other birds to bring him the finest foods, but he will refuse them all. He will spread his proud wings and, with his eye on a high mountain cliff, fly away to his own family halls of rock, where storms and waterfalls make their natural music. Our soul longs to fly like an eagle and will find rest only in the Rock of Ages. Its family halls are the halls of heaven, built with the rock of God's own character. And the reach of its grand flight is forever! 'Lord, You have been our home through all generations.' J. R. Macduff",
              "simpZh": "你不可能把老鹰关在森林里。你可以招聚最美的鸟围绕它，在最高松树上给它一根栖木，或者派别的鸟叼来最好的食物，但它都会拒绝。它会展开骄傲的翅膀，眼望着阿尔卑斯的峭壁，飞回到它祖传的岩石厅堂，那里有风暴和瀑布做天然的音乐。我们的灵魂也渴望像鹰一样飞翔，除了万古磐石，什么都不能让它安息。它的祖传厅堂就是天上的殿，是用神本性的磐石建的。它雄伟飞翔的跨度是永恒！“主啊，你世世代代是我们的居所。”麦克达夫"
            },
            {
              "en": "“My Home is God Himself”; Christ brought me there. I placed myself within His mighty arms; He took me up, and safe from all alarms He bore me “where no foot but His has trod,” Within the <span class=\"vocab-trigger\" data-vocab=\"holiest\">holiest<\/span> at Home with God, And had me dwell in Him, rejoicing there. O Holy Place! O Home divinely fair! And we, God’s little ones, abiding there. “My Home is God Himself”; it was not so! A long, long road I traveled night and day, And sought to find within myself some way. Nothing I did or felt could bring me near. Self-effort failed, and I was filled with fear, And then I found Christ was the only way, That I must come to Him and in Him stay, And God had told me so. And now “my Home is God,” and sheltered there, God meets the trials of my earthly life, God compasses me round from storm and strife, God takes the burden of my daily care. O Wondrous Place! O Home divinely fair! And I, God’s little one, safe hidden there. Lord, as I dwell in You and You in me, So make me dead to everything but Thee; That as I rest within my Home most fair, My soul may evermore and only see My God in everything and everywhere; My Home is God. <span class=\"vocab-trigger\" data-vocab=\"author unknown\">author unknown<\/span>",
              "zh": "“我的家就是神自己”；基督领我到了那里。我将自己放在祂大能的膀臂中；祂抱起我，脱离一切惊恐，将我带到“除了祂无人踏足之处”，就在至圣所，安居在神里面，并让我住在祂里面，在那里欢欣。圣哉这地！美哉这属天的家！我们，神的小子们，安居在那里。“我的家就是神自己”；从前并非如此！我跋涉了漫漫长路，日夜兼程，试图在自己里面找一条路。我所做的、所感的，无一样能带我亲近神。自我努力全然失败，我充满了恐惧，然后我发现基督是唯一的道路，我必须来到祂面前，住在祂里面，神曾这样告诉我。如今“我的家就是神”，在那里藏身，神应付我属地生活的试炼，神四围环绕我，使我脱离风暴与纷争，神背负我每日挂虑的重担。奇妙之处！美哉这属天的家！我，神的小子，安稳隐藏在那里。主啊，我住在祢里面，祢也住在我里面，求祢使我向除祢以外的一切都死；好叫我安息在最荣美之家时，我的灵魂能永永远远、单单在万事万处看见我的神；我的家就是神。 佚名",
              "simpEn": "'My Home is God Himself'; Christ brought me there. I put myself in His strong arms; He took me up, safe from all fears, and carried me where only He has walked, into the most holy place at home with God, and let me live in Him, full of joy there. O Holy Place! O Home so perfectly beautiful! And we, God's little ones, staying there. 'My Home is God Himself'; it wasn't always so! I traveled a long, long road day and night, trying to find some way inside myself. Nothing I did or felt could bring me close. My own effort failed, and I was full of fear. Then I found Christ was the only way, that I must come to Him and stay in Him, and God had told me so. And now 'my Home is God,' and sheltered there, God meets the trials of my earth-life, God surrounds me from storm and fighting, God carries the load of my daily worries. O Wondrous Place! O Home so perfectly beautiful! And I, God's little one, safe and hidden there. Lord, as I live in You and You in me, make me dead to everything but You; so that as I rest in my most beautiful Home, my soul may forever and only see my God in everything and everywhere; My Home is God. author unknown",
              "simpZh": "“我的家就是神自己”；基督把我带到那里。我把自己放在祂大能的手臂里；祂抱起我，远离一切惊吓，带我到了“只有祂踏过的地方”，就在至圣所，与神同在的家中，让我住在祂里面，欢欢喜喜。圣洁之处！美丽无比的家！我们，神的小孩子，就住在那儿。“我的家就是神自己”；从前不是这样！我日夜走了很长很长的路，想在自己里面找一条路。我做的、我感觉的，都不能让我靠近。自己的努力失败了，我充满恐惧，然后我发现基督是唯一的路，我必须到祂那里，住在祂里面，神早就这样告诉了我。现在“我的家就是神”，藏在那里，神应付我地上生活的试炼，神从风暴和争斗中四围环绕我，神背起我每天挂虑的重担。奇妙之地！美丽无比的家！我，神的小孩子，安全地藏在那里。主啊，我住在你里面，你在我里面，求你让我除了你，对一切都死；好让我安息在最美丽的家中时，我的灵魂永远只看见我的神在万事中、在各处；我的家就是神。佚名"
            }
          ],

        {
          "sectionId": 2,
          "heading": "August 27",
          "audio": "audio/streams in the desert - August 27.m4a",
          "paragraphs": [
            {
              "en": "He took him aside, away from the crowd. (Mark 7:33)",
              "zh": "耶稣领他离开众人，到一边去。（马可福音7:33）",
              "simpEn": "He took him aside, away from the crowd.",
              "simpZh": "祂把他带到一边，离开人群。"
            },
            {
              "en": "Paul withstood not only the tests that came while he was active in his service to Christ but also the tests of <span class=\"vocab-trigger\" data-vocab=\"solitude\">solitude<\/span> during captivity. We may be able to withstand the strain of the most intense labor, even if coupled with severe suffering, and yet completely break down if set aside from all Christian activity and work. This would be especially true if we were forced to endure <span class=\"vocab-trigger\" data-vocab=\"solitary confinement\">solitary confinement<\/span> in a prison cell.",
              "zh": "保罗不仅经受了积极服事基督时临到的考验，也经受了被囚期间孤独的考验。我们或许能承受最剧烈劳苦的压力，即使加上沉重的苦难；可一旦被搁置一旁，脱离所有基督徒的活动和工作，就可能完全崩溃。如果被迫在牢房中忍受单独监禁，情况尤其如此。",
              "simpEn": "Paul stood not only the tests that came while he was busy serving Christ, but also the tests of being alone while in prison. We may be able to handle the pressure of the hardest work, even with deep suffering, and yet fall apart if we are put aside from all Christian work and activity. This would be even more true if we had to go through being alone in a prison cell.",
              "simpZh": "保罗不仅经受了忙于服事基督时的考验，也经受了坐牢时孤独的考验。我们可能承受得住最辛苦的工作压力，哪怕加上深重的苦难，可一旦被放到一边，从所有基督徒工作和活动里抽出来，就可能完全崩溃。如果被关在牢房里单独监禁，那就更会如此。"
            },
            {
              "en": "Even the most majestic bird, which soars higher than all others and endures the longest flights, will sink into despair when placed in a cage, where it is forced to helplessly beat its wings against its prison bars. Have you ever seen a <span class=\"vocab-trigger\" data-vocab=\"magnificent\">magnificent<\/span> eagle forced to <span class=\"vocab-trigger\" data-vocab=\"languish\">languish<\/span> in a small cage? With bowed head and <span class=\"vocab-trigger\" data-vocab=\"drooping\">drooping<\/span> wings, it is a sad picture of the sorrow of <span class=\"vocab-trigger\" data-vocab=\"inactivity\">inactivity<\/span>.",
              "zh": "即便是最雄伟的鸟，比一切飞鸟飞得更高、能承受最长飞行，一旦被关在笼中，被迫无可奈何地以翅膀拍打笼条，也会陷入绝望。你可曾见过一只雄壮的鹰被迫在一只小笼中凋萎？它耷拉着头，垂下翅膀，这真是一幅因停顿不能活动而悲哀的凄凉图画。",
              "simpEn": "Even the most grand bird, which flies higher than all others and can take the longest flights, will fall into despair when put in a cage, forced to beat its wings helplessly against the bars. Have you ever seen a great eagle made to grow weak in a tiny cage? With head down and wings hanging low, it is a sad picture of the pain of not being able to act.",
              "simpZh": "就连最雄伟的鸟，比所有鸟飞得都高、能飞最远，一旦被关在笼子里，被迫无奈地拍打笼条，也会陷入绝望。你有没有见过一只雄壮的鹰被迫在小小的笼子里奄奄一息？它低着头，垂着翅膀，真是无法活动的悲哀画面。"
            },
            {
              "en": "To see Paul in prison is to see another side of life. Have you noticed how he handled it? He seemed to be looking over the top of his prison wall and over the heads of his enemies. Notice how he even signed his name to his letters—not as the prisoner of <span class=\"vocab-trigger\" data-vocab=\"Festus\">Festus<\/span>, nor of <span class=\"vocab-trigger\" data-vocab=\"Caesar\">Caesar<\/span>, and not as a victim of the <span class=\"vocab-trigger\" data-vocab=\"Sanhedrin\">Sanhedrin<\/span>, but as “a prisoner for the Lord” (Eph. 4:1). Through it all, he saw only the hand of God at work. To him, the prison became a palace, with its corridors <span class=\"vocab-trigger\" data-vocab=\"resounding\">resounding<\/span> with shouts of <span class=\"vocab-trigger\" data-vocab=\"triumphant\">triumphant<\/span> praise and joy.",
              "zh": "看保罗在狱中，就是看生命的另一面。你可曾留意他如何应对？他似乎超越了监狱的围墙，也越过了仇敌的头顶。请留意他甚至在信末如何署名——不是非斯都的囚犯，也不是凯撒的囚犯，更不是公会迫害的对象，而是“为基督耶稣被囚的”（以弗所书4:1）。在这一切之中，他单单看见神的手在动工。对他来说，监狱变成宫殿，廊道间回响着凯旋的赞美与喜乐。",
              "simpEn": "Seeing Paul in prison is seeing another side of life. Did you notice how he dealt with it? He seemed to be looking over the top of his prison wall and over the heads of his enemies. Notice how he even signed his letters—not as the prisoner of Festus, or of Caesar, and not as a victim of the Sanhedrin, but as 'a prisoner for the Lord.' Through everything, he saw only the hand of God at work. To him, the prison became a palace, its hallways ringing with shouts of winning praise and joy.",
              "simpZh": "看保罗在监狱里，是看生活的另一面。你注意到他怎么应对了吗？他好像在从监狱墙上望过去，也在敌人头顶上望过去。注意他连签名都怎么签的——不是非斯都的囚犯，不是凯撒的囚犯，也不是公会的受害者，而是“为基督耶稣被囚的”。在整个过程中，他只看见神的手在做工。对他来说，监狱变成了宫殿，走廊里回响着得胜的赞美和喜乐。"
            },
            {
              "en": "Forced from the missionary work he loved so well, Paul built a new <span class=\"vocab-trigger\" data-vocab=\"pulpit\">pulpit<\/span>—a new witness stand. And from his place of <span class=\"vocab-trigger\" data-vocab=\"bondage\">bondage<\/span> arose some of the most encouraging and helpful ministries of Christian liberty. What precious messages of light came from the dark shadows of his captivity.",
              "zh": "被迫离开他深爱的宣教工作后，保罗建造了一座新的讲坛——一个新的见证台。从他被捆绑的地方，兴起了最鼓舞人、最能帮助人的基督徒自由事工。何等宝贵的光明信息，竟从他囚禁的暗影中出来！",
              "simpEn": "Forced out of the missionary work he loved, Paul built a new preaching place—a new witness stand. And from his place of chains came some of the most heart-lifting and helpful works of Christian freedom. What dear messages of light came from the dark shadows of his prison!",
              "simpZh": "保罗被迫离开他深爱的宣教工作，却建起了一个新的讲台——一个新的见证台。从他被捆绑的地方，兴起了最鼓舞人、最有帮助的基督徒自由事工。多么宝贵的光明信息，竟然从他坐牢的暗影中出来！"
            },
            {
              "en": "Also think of the long list of saints who have followed in the footsteps of Paul and were imprisoned for their faith. For twelve long years, <span class=\"vocab-trigger\" data-vocab=\"John Bunyan\">John Bunyan<\/span>’s voice was silenced in an English jail in <span class=\"vocab-trigger\" data-vocab=\"Bedford\">Bedford<\/span>. Yet it was there he wrote the greatest work of his life, <span class=\"vocab-trigger\" data-vocab=\"Pilgrim’s Progress\">Pilgrim’s Progress<\/span>—read by more people than any other book except the Bible. He once said, “I was at home in prison, and my great joy led me to sit and write and write.” And the darkness of his long captivity became a wonderful dream to light the path of millions of weary <span class=\"vocab-trigger\" data-vocab=\"pilgrims\">pilgrims<\/span>.",
              "zh": "也要想一想那长长一串跟随保罗脚踪、为信仰被囚的圣徒。约翰·班扬的声音在贝德福德的英国监狱中沉默了十二年之久。然而正是在那里，他写下了生平最伟大的著作《天路历程》——除了圣经以外，阅读人数最多的书。他曾说：“我在狱中如在家中，我极大的喜乐使我坐下，写了又写。”他漫长被囚的黑暗，竟成了照亮千万疲惫天路客旅程的美妙梦境。",
              "simpEn": "Think also of the long line of holy people who followed in Paul's steps and were put in jail for their faith. For twelve long years, John Bunyan's voice was quiet in an English jail in Bedford. Yet it was there he wrote the greatest work of his life, Pilgrim's Progress—read by more people than any book but the Bible. He once said, 'I was at home in prison, and my great joy led me to sit and write and write.' And the darkness of his long prison time became a wonderful dream to light the path of millions of tired travelers.",
              "simpZh": "也要想想一长串跟从保罗脚踪、为信仰坐牢的圣徒。约翰·班扬的声音在贝德福德的英国监狱里沉默了十二年。然而就是在那里，他写下了他一生最伟大的作品《天路历程》——除圣经外最多人读的书。他曾经说：“我在监牢里就像在家一样，我极大的喜乐让我坐下，写了又写。”他漫长被囚的黑暗，变成了奇妙的梦，照亮了千千万万疲惫天路客的道路。"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Madam Guyon\">Madam Guyon<\/span>, the sweet-spirited French saint, endured a lengthy time behind prison walls. And like the sounds of some caged birds whose songs are more beautiful as a result of their <span class=\"vocab-trigger\" data-vocab=\"confinement\">confinement<\/span>, the music of her soul has traveled far beyond her <span class=\"vocab-trigger\" data-vocab=\"dungeon\">dungeon<\/span> walls to remove the sadness of many discouraged hearts.",
              "zh": "盖恩夫人，那位心灵甜美的法国圣徒，在监狱墙壁后忍受了漫长的时间。如同有些笼中鸟，其歌声因着被囚反而更加优美，她灵魂的音乐远远飘出了她地牢的墙壁，消除了许多灰心之人的忧伤。",
              "simpEn": "Madam Guyon, the sweet-hearted French saint, went through a long time behind prison walls. And like some caged birds whose songs are more beautiful because they are shut in, the music of her soul has traveled far beyond her prison walls to take away the sadness of many hearts that had lost hope.",
              "simpZh": "盖恩夫人，那位心灵甜美的法国圣徒，在监狱高墙后经过了漫长的时间。就像有些被关的鸟，因为被关起来歌声反而更美，她灵魂的音乐远远飘出了她地牢的墙壁，挪去了许多灰心人心里的忧伤。"
            },
            {
              "en": "Oh, the heavenly <span class=\"vocab-trigger\" data-vocab=\"consolation\">consolation<\/span> that God has caused to flow out of places of solitude! <span class=\"vocab-trigger\" data-vocab=\"S. C. Rees\">S. C. Rees<\/span>",
              "zh": "哦，神从孤寂之处流出的那属天安慰！ 里斯",
              "simpEn": "Oh, the heavenly comfort that God has made to flow out of lonely places! S. C. Rees",
              "simpZh": "哦，神从孤独的地方流出的天上安慰！里斯"
            },
            {
              "en": "Taken aside by Jesus, To feel the touch of His hand; To rest for a while in the shadow Of the Rock in a weary land. Taken aside by Jesus, In the loneliness dark and drear, Where no other comfort may reach me, Than His voice to my heart so dear. Taken aside by Jesus, To be quite alone with Him, To hear His wonderful tones of love ’Mid the silence and shadows dim. Taken aside by Jesus, Shall I resist the desert place, When I hear as I never heard before, And see Him “face to face”?",
              "zh": "被耶稣带到一旁，感受祂手的触摸；在困乏之地，安息于磐石的荫下片时。被耶稣带到一旁，在幽暗阴郁的孤寂中，除了祂那对我心至宝的声音，再无别的安慰可以临到。被耶稣带到一旁，全然单独与祂同在，在寂静和朦胧暗影中，听见祂奇妙的慈爱声调。被耶稣带到一旁，我岂能抗拒那旷野之地，当我前所未有地听见，并得见祂的“面”？",
              "simpEn": "Taken aside by Jesus, to feel the touch of His hand; to rest a while in the shadow of the Rock in a tired land. Taken aside by Jesus, in the dark and gloomy loneliness, where no comfort reaches me except His voice so dear to my heart. Taken aside by Jesus, to be all alone with Him, to hear His wonderful tones of love in the middle of silence and dim shadows. Taken aside by Jesus, shall I fight against the desert place, when I hear as I never heard before, and see Him 'face to face'?",
              "simpZh": "被耶稣带到一旁，感受祂手的抚摸；在困倦之地，在磐石的荫下休息一会儿。被耶稣带到一旁，在又黑又闷的孤单里，除了祂对我心说的宝贵声音，没有别的安慰能到我这里。被耶稣带到一旁，单独和祂在一起，在寂静和暗影之中，听见祂奇妙的爱的声音。被耶稣带到一旁，我怎能抗拒那旷野之地呢？那时我要前所未有地听见，并且亲眼“面对面”见祂。"
            }
          ],

        {
          "sectionId": 3,
          "heading": "August 28",
          "audio": "audio/streams in the desert - August 28.m4a",
          "paragraphs": [
            {
              "en": "There he tested them. (Exodus 15:25)",
              "zh": "在那里试验他们。（出埃及记15:25）",
              "simpEn": "There He tested them.",
              "simpZh": "在那里祂试验他们。"
            },
            {
              "en": "I once visited the testing room of a large steel mill. I was surrounded by instruments and equipment that tested pieces of steel to their limits and measured their breaking point. Some pieces had been twisted until they broke, and then were labeled with the level of pressure they could withstand. Some had been stretched to their breaking point, with their level of strength also noted. Others had been <span class=\"vocab-trigger\" data-vocab=\"compressed\">compressed<\/span> to their <span class=\"vocab-trigger\" data-vocab=\"crushing\">crushing<\/span> point and measured. Because of the testing, the manager of the mill knew exactly how much stress and strain each piece of steel could endure if it was used to build a ship, building, or bridge.",
              "zh": "我曾参观过一家大型钢厂的测试室。我周围都是仪器设备，它们把一块块钢铁测试到极限，并量出它们的断裂点。有的钢块被扭转到断裂，然后贴上标签，注明所能承受的压力值。有的被拉伸到断裂点，强度也被记录下来。还有的被压缩到粉碎点，并进行测量。正因为这些测试，工厂经理才精确地知道每一块钢如果要用来建造轮船、大楼或桥梁，能承受多少应力与张力。",
              "simpEn": "I once visited the testing room of a big steel factory. I was surrounded by tools and machines that pushed pieces of steel to their limits and found their breaking point. Some had been twisted until they snapped, then marked with the pressure they could stand. Some had been pulled to the breaking point, with their strength noted. Others had been squeezed to the crushing point and measured. Because of the testing, the manager knew exactly how much pushing and pulling each piece of steel could take if used to build a ship, a building, or a bridge.",
              "simpZh": "我曾去过一个大钢铁厂的测试室。四周都是仪器，它们把钢铁样本测试到极限，量出断裂点。有的被扭到断裂，然后贴上能承受多少压力的标签。有的被拉到断裂点，也记录下了强度。还有的被压缩到压碎点来测量。正因为这些测试，工厂经理才准确知道，每一块钢如果要拿去造船、建楼或修桥，能承受多少拉扯和压力。"
            },
            {
              "en": "It is often much the same with God’s children. He does not want us to be like fragile <span class=\"vocab-trigger\" data-vocab=\"vases\">vases<\/span> of glass or <span class=\"vocab-trigger\" data-vocab=\"porcelain\">porcelain<\/span>. He wants us to be like these <span class=\"vocab-trigger\" data-vocab=\"toughened\">toughened<\/span> pieces of steel, able to endure twisting and crushing pressure to the utmost without collapse.",
              "zh": "神的儿女也常常如此。祂不要我们像脆弱的玻璃瓶或瓷器，而要我们像这些经过韧化的钢块，能承受极度的扭转和压碎之力，却不崩溃。",
              "simpEn": "It is much the same with God's children. He doesn't want us to be like breakable glass or fine china pots. He wants us to be like these hardened pieces of steel, able to take twisting and crushing to the limit without falling apart.",
              "simpZh": "神儿女的情况也很相似。祂不要我们像易碎的玻璃花瓶或瓷器，而要我们像这些变硬的钢块，能经得住扭和压到极限却不垮掉。"
            },
            {
              "en": "God does not want us to be like greenhouse plants, which are sheltered from rough weather, but like storm-beaten <span class=\"vocab-trigger\" data-vocab=\"oaks\">oaks<\/span>; not like sand dunes that are driven back and forth by every gust of wind but like <span class=\"vocab-trigger\" data-vocab=\"granite\">granite<\/span> mountains that withstand the fiercest storms. Yet to accomplish this, He must take us into His testing room of suffering. And many of us need no other <span class=\"vocab-trigger\" data-vocab=\"argument\">argument<\/span> than our own experiences to prove that suffering is indeed God’s testing room of faith. <span class=\"vocab-trigger\" data-vocab=\"J. H. M.\">J. H. M.<\/span>",
              "zh": "神不要我们像温室里的花草，被护蔽免遭恶劣天气，而要像饱经风暴的橡树；不要像被每一阵风吹来吹去的沙丘，而要像抵挡最猛烈风暴的花岗岩山。然而，要达到这目的，祂必须带我们进入祂苦难的测试室。我们许多人无需别的论证，自己的经历就足以证明，苦难实在是神信心的测试室。 J. H. M.",
              "simpEn": "God does not want us to be like greenhouse plants, protected from rough weather, but like storm-hit oak trees; not like sand piles blown back and forth by every breeze, but like granite mountains that stand against the wildest storms. But to make this happen, He must take us into His testing room of pain. And many of us need no other proof than our own lives to show that suffering is truly God's testing room of faith. J. H. M.",
              "simpZh": "神不要我们像温室里的花草，受保护躲开恶劣天气，而要像被风暴击打的橡树；不要像被每阵风吹来吹去的沙堆，而要像能顶住最猛风暴的花岗岩山。但要达到这样，祂必须带我们进祂苦难的检验室。我们很多人不需要别的证据，自己经历就证明，受苦的确是神信心的检验室。 J. H. M."
            },
            {
              "en": "It is quite easy for us to talk and to <span class=\"vocab-trigger\" data-vocab=\"theorize\">theorize<\/span> about faith, but God often puts us into His <span class=\"vocab-trigger\" data-vocab=\"crucible\">crucible<\/span> of affliction to test the purity of our gold and to separate the <span class=\"vocab-trigger\" data-vocab=\"dross\">dross<\/span> from the metal. How happy we are if the hurricanes that blow across life’s raging sea have the effect of making Jesus more precious to us! It is better to weather the storm with Christ than to sail smooth waters without Him. <span class=\"vocab-trigger\" data-vocab=\"J. R. Macduff\">J. R. Macduff<\/span>",
              "zh": "我们谈论和空谈信心相当容易，但神常把我们放进祂苦难的熔炉中，试验我们金子的纯度，把渣滓从金属中分离出来。倘若刮过人生怒海的飓风能使耶稣对我们显得更加宝贵，我们该何等喜乐啊！与基督一同经历风暴，比没有祂而航行在风平浪静中要更好。 麦克达夫",
              "simpEn": "It is easy for us to talk and think about faith, but God often puts us into His hot pot of suffering to test how pure our gold is and to take away the waste from the metal. How glad we are if the wild storms that blow across life's raging sea make Jesus more dear to us! It is better to go through the storm with Christ than to sail on smooth waters without Him. J. R. Macduff",
              "simpZh": "我们很容易谈论和空想信心，但神常把我们放进祂苦难的熔炉里，考验我们金子的纯度，把渣滓从金属中分开。如果人生怒海上刮过的飓风能让耶稣对我们更宝贵，我们该多快乐啊！与基督一起经历风暴，比没有祂而走平顺的水路更好。麦克达夫"
            },
            {
              "en": "What if God could not manage to mature your life without suffering?",
              "zh": "倘若神无法不用苦难来使你的生命成熟，那又如何？",
              "simpEn": "What if God could not make your life grow up without suffering?",
              "simpZh": "如果神不借着苦难就不能让你的生命成熟呢？"
            }
          ],
          "quiz": [

              "text": "The steel mill tested steel to its limits so the manager knew its breaking point.",

              "answer": false
            }
          ]

        {
          "sectionId": 4,
          "heading": "August 29",
          "audio": "audio/streams in the desert - August 29.m4a",
          "paragraphs": [
            {
              "en": "Carrying his own cross. (John 19:17)",
              "zh": "耶稣背着自己的十字架。（约翰福音19:17）",
              "simpEn": "Carrying His own cross.",
              "simpZh": "背着祂自己的十字架。"
            },
            {
              "en": "“The Changed Cross” is a poem that tells of a weary woman who thought that the cross she must bear surely was heavier than those of other people, so she wished she could choose another person’s instead. When she went to sleep, she dreamed she was taken to a place where there were many different crosses from which to choose. There were various shapes and sizes, but the most beautiful one was covered with <span class=\"vocab-trigger\" data-vocab=\"jewels\">jewels<\/span> and gold. “This I could wear with comfort,” she said. So she picked it up, but her weak body <span class=\"vocab-trigger\" data-vocab=\"staggered\">staggered<\/span> beneath its weight. The jewels and gold were beautiful, yet they were much too heavy for her to carry.",
              "zh": "有一首诗叫《被更换的十字架》，讲到一个困乏的妇人，她认为自己背的十字架一定比别人更重，便希望能换一个别人的十字架来背。她睡着后，梦见自己被带到一个地方，那里有许多不同的十字架可供选择。有各种形状和大小，但最美的那个镶满了宝石和黄金。她说：“这个我能舒舒服服地背着。”于是她把它拿起来，但她软弱的身体在它的重量下踉跄摇晃。宝石和黄金固然美丽，但她背着实在太重了。",
              "simpEn": "'The Changed Cross' is a poem about a tired woman who thought her cross was surely heavier than others', so she wished she could choose another's. She fell asleep and dreamed she was taken to a place with many crosses to pick from. There were different shapes and sizes, but the prettiest was covered with jewels and gold. 'I could wear this one easily,' she said. She picked it up, but her weak body stumbled under its weight. The jewels and gold were lovely, but they were far too heavy for her to carry.",
              "simpZh": "《被换掉的十字架》是一首诗，讲一个疲惫的妇人，觉得自己的十字架一定比别人更重，就希望能换一个别人的来背。她睡着后，梦见到了一个地方，有许多不同十字架可以选。形状大小各样，但最漂亮的那个镶满了宝石和金子。她说：“这个我可以舒服地背着。”就拿起来，但她虚弱的身体被压得摇摇晃晃。宝石和金子很美，可是对她来说太重了，根本背不动。"
            },
            {
              "en": "The next cross she noticed was quite lovely, with beautiful flowers <span class=\"vocab-trigger\" data-vocab=\"entwined\">entwined<\/span> around its <span class=\"vocab-trigger\" data-vocab=\"sculptured\">sculptured<\/span> form. Surely this was the one for her. She lifted it, but beneath the flowers were large <span class=\"vocab-trigger\" data-vocab=\"thorns\">thorns<\/span> that pierced and tore her skin.",
              "zh": "接下来她留意到一个相当可爱的十字架，雕刻的架身上缠绕着美丽的花朵。这一个必定是给她的。她把它举起来，但在花朵下面竟藏着大刺，刺穿并撕裂了她的皮肤。",
              "simpEn": "The next cross she saw was very pretty, with lovely flowers wrapped around its carved shape. Surely this was for her. She lifted it, but under the flowers were big thorns that cut and tore her skin.",
              "simpZh": "下一个她注意到的十字架非常可爱，雕刻形状上绕着美丽的花。这一个肯定适合她。她拿起来，但花下面竟有大刺，扎破撕开了她的皮肤。"
            },
            {
              "en": "Finally she came to a plain cross without jewels or any carvings and with only a few words of love <span class=\"vocab-trigger\" data-vocab=\"inscribed\">inscribed<\/span> on it. When she picked it up, it proved to be better than all the rest, and the easiest to carry. And as she looked at it, she noticed it was bathed in a <span class=\"vocab-trigger\" data-vocab=\"radiance\">radiance<\/span> that fell from heaven. Then she recognized it as her own old cross. She had found it once again, and it was the best of all, and the lightest for her.",
              "zh": "最后她走到一个朴素的十字架前，没有宝石，没有雕花，只刻着几句爱的话语。她拿起来，发觉它比所有别的都更好，也最容易背。当她看着它时，注意到它沐浴在从天而降的光辉中。那时她认出这就是她自己原来的那个十字架。她再次找到了它，而它对她乃是最好的，也是最轻的。",
              "simpEn": "At last she came to a plain cross with no jewels or carvings, only a few words of love written on it. When she lifted it, it turned out to be better than all the rest and the easiest to carry. As she looked at it, she saw it was washed in a brightness that fell from heaven. Then she knew it was her own old cross. She had found it again, and it was the best of all and the lightest for her.",
              "simpZh": "最后她走到一个朴素的十字架前，没有宝石，没有雕刻，只写着几句爱的话语。她拿起来，发现它比所有别的都更好，也最容易背。当她看着它时，看见它沐浴在从天上照下来的光辉里。她认出这就是她自己原来的十字架。她重新找回了它，对她来说，这是最好的，也是最轻的。"
            },
            {
              "en": "You see, God knows best what cross we need to bear, and we never know how heavy someone else’s cross may be. We envy someone who is rich, with a cross of gold adorned with jewels, but we do not know how heavy it is. We look at someone whose life seems so easy and who carries a cross covered with flowers. Yet if we could actually test all the crosses we think are lighter than ours, we would never find one better suited for us than our own. <span class=\"vocab-trigger\" data-vocab=\"from Glimpses through Life’s Windows\">from Glimpses through Life’s Windows<\/span>",
              "zh": "你看，神最清楚我们需要背什么十字架，而我们永远不知道别人的十字架有多重。我们嫉妒那富有的人，他的十字架是金子做的，镶着宝石，但我们不知道它有多重。我们看那生活似乎轻松愉快、背的十字架铺满鲜花的人。然而，如果我们真能试遍那些我们认为比自己的更轻的十字架，我们就绝不会找到一个比自己的更合适。 摘自《人生窗口掠影》",
              "simpEn": "You see, God knows best what cross we need to carry, and we never know how heavy someone else's cross may be. We are jealous of someone rich, whose cross is gold with jewels, but we don't know how heavy it is. We look at someone whose life seems easy, carrying a cross covered with flowers. Yet if we could really test all the crosses we think are lighter than ours, we would never find one that fits us better than our own. from Glimpses through Life's Windows",
              "simpZh": "你看，神最清楚我们需要背哪个十字架，我们永远不知道别人的十字架有多重。我们羡慕那个有钱人，他的十字架是金的、镶着宝石，但我们不知道它有多重。我们看那个生活好像很轻松、背的十字架全是花的人。但如果我们真的能把那些我们以为比自己轻的十字架都试一遍，就绝对不会找到一个比自己的更合适的。摘自《人生窗口掠影》"
            },
            {
              "en": "If you, with <span class=\"vocab-trigger\" data-vocab=\"impatience\">impatience<\/span>, give up your cross, You will not find it in this world again; Nor in another, but here and here alone Is given for you to suffer for God’s sake. In the next world we may more perfectly Love Him and serve Him, praise Him, Grow nearer and nearer to Him with delight. But then we will not anymore Be called to suffer, which is our assignment here. Can you not suffer, then, one hour or two? If He should call you from your cross today, Saying, “It is finished—that hard cross of yours From which you pray for deliverance,” Do you not think that some emotion of regret Would overcome you? You would say, “So soon? Let me go back and suffer yet awhile More patiently. I have not yet praised God.” So whenever it comes, that <span class=\"vocab-trigger\" data-vocab=\"summons\">summons<\/span> we all look for, It will seem soon, too soon. Let us take heed in life That God may now be <span class=\"vocab-trigger\" data-vocab=\"glorified\">glorified<\/span> in us. <span class=\"vocab-trigger\" data-vocab=\"Ugo Bassi’s Sermon in a Hospital\">Ugo Bassi’s Sermon in a Hospital<\/span>",
              "zh": "你若因不耐烦而丢弃你的十字架，你就再不会在此世寻见它；在来世也不能，惟独在今生今地赐给你，为神的缘故受苦。在来世，我们可能更完美地爱祂、事奉祂、赞美祂，欢然与祂越来越亲近。但那时，我们再不会被召受苦，受苦乃是今生的任务。那么，你不能受一两个小时吗？倘若祂今天呼召你离开十字架，说：“那副你不断祷告求脱离的、难背的十字架已经完成了”，你岂不觉得某种不舍之情会漫过你身？你会说：“这么快？让我回去再稍加忍耐地受一阵子苦吧。我还没有赞美神呢。”所以，无论那召唤何时来到——那是我们众所等候的——都会显得太快、太快。让我们在生命中留心，好叫神现今在我们身上得荣耀。 乌戈·巴西《医院中的讲道》",
              "simpEn": "If you, with no patience, throw away your cross, you will not find it again in this world, nor in the next. Here and here alone it is given you to suffer for God's sake. In the next world we may love and serve and praise Him better, drawing nearer and nearer with joy. But then we will no longer be called to suffer; that is our task here. Can you not suffer, then, for an hour or two? If He should call you from your cross today, saying, 'It is finished—that hard cross of yours from which you pray to be set free,' do you not think a feeling of sadness would come over you? You would say, 'So soon? Let me go back and suffer a little longer, more patiently. I have not praised God yet.' So whenever it comes, that call we all wait for, it will seem soon, too soon. Let us be careful in life that God may be given glory in us now. Ugo Bassi's Sermon in a Hospital",
              "simpZh": "如果你因为没有耐心，就扔掉你的十字架，你在这个世界再也找不到它了；在来世也不能，只有今生今地，是给你为神的缘故受苦的。在将来的世界，我们可以更完全地爱祂、事奉祂、赞美祂，喜乐地与祂越来越近。但那时我们就不再被召受苦了，受苦是今生的任务。那么，你连一两个小时都不能受吗？如果祂今天就叫你从十字架上下来，说：“那副你一直祷告求脱离的、难背的十字架已经完了”，你难道不觉得有一种惋惜之情会涌上来吗？你会说：“这么快？让我回去再更忍耐地受一会儿吧。我还没有赞美神呢。”所以，无论那个我们都等候的召唤什么时候来，都会显得太快、太快。让我们在人生中留心，好让神现在就因我们得荣耀。乌戈·巴西《医院中的讲道》"
            }

              "en": "Others went out on the sea in ships; they were <span class=\"vocab-trigger\" data-vocab=\"merchants\">merchants<\/span> on the mighty waters. They saw the works of the Lord, his wonderful deeds in the deep. (Psalm 107:23–24)",

              "simpEn": "Others went out on the sea in ships; they did business on the great waters. They saw what the Lord does, His wonderful deeds in the deep.",

            {
              "en": "The person who has not learned that every wind that blows can be used to guide us toward heaven has certainly not mastered the art of sailing and is nothing but an <span class=\"vocab-trigger\" data-vocab=\"apprentice\">apprentice<\/span>. In fact, the only thing that helps no one is a dead calm. Every wind, whether from the north, south, east, or west, may help us toward that blessed <span class=\"vocab-trigger\" data-vocab=\"port\">port<\/span>. So seek only this: to stay well out to sea—and then have no fear of stormy winds. May our prayer be that of an old Englishman: “O Lord, send us into the deep water of the sea, for we are so close to shore that even a small breeze from the Devil could break our ship to pieces on the rocks. Again, Lord, send us into the deep water of the sea, where there will be plenty of room to win a glorious victory.” <span class=\"vocab-trigger\" data-vocab=\"Mark Guy Pearse\">Mark Guy Pearse<\/span>",
              "zh": "未曾学会每一阵风都能被利用、引导我们朝向天堂的人，必定还未精通航海的技艺，仅仅是个学徒。事实上，惟一毫无帮助的就是全然无风。每一阵风，无论北风、南风、东风、西风，都可能帮助我们趋向那蒙福的港湾。所以只要追求这一件事：远远驶入深海——然后就别怕风暴。愿我们的祷告像一位老英国人的祷告：“主啊，差我们进入海的深处，因我们离岸太近，就是从魔鬼来的微风吹过，也能把我们的船在礁石上摔碎。主啊，再差我们进入海的深处，在那里有足够空间去赢得荣耀的胜利。” 马克·盖·皮尔斯",
              "simpEn": "The person who hasn't learned that every wind can be used to steer us toward heaven has not mastered sailing and is only a beginner. In truth, the only thing that helps nobody is a complete calm. Every wind, from north, south, east, or west, can help us toward that happy harbor. So just aim for this: stay far out at sea—and then don't fear stormy winds. May our prayer be like that of an old Englishman: 'O Lord, send us out into the deep sea, for we are so near the shore that even a light breeze from the Devil could smash our ship on the rocks. Again, Lord, send us out into the deep sea, where there is plenty of room to win a great victory.' Mark Guy Pearse",
              "simpZh": "一个人如果没有学到每一阵风都可以被用来领我们向天家，那他就还没有学会航海，只是个学徒。事实上，唯一对谁都没帮助的就是完全的平静。每一阵风，不管是北风、南风、东风、西风，都可能帮我们到达那蒙福的港湾。所以只求这一件事：远远待在深海——然后就别怕风暴。愿我们的祷告像一位老英国人的：“主啊，差我们到海的深处去，因为我们太靠近岸边了，连魔鬼吹来的一阵小风都能把我们的船在礁石上撞碎。主啊，再一次，差我们到海的深处去，那里有足够的地方赢得荣耀的得胜。”马克·盖·皮尔斯"

            {
              "en": "Remember, our faith is always at its greatest point when we are in the middle of the trial, and confidence in the flesh will never endure testing. <span class=\"vocab-trigger\" data-vocab=\"Fair-weather faith\">Fair-weather faith<\/span> is not faith at all. <span class=\"vocab-trigger\" data-vocab=\"Charles H. Spurgeon\">Charles H. Spurgeon<\/span>",

              "simpEn": "God had to bring Abraham to the end of his own strength and let him see that with his own body he could do nothing. He had to think of his own body as 'as good as dead' and then trust God to do all the work. When he looked away from himself and trusted only God, he became 'fully sure that God had power to do what He had promised.'",

            {

        {
          "sectionId": 7,
          "heading": "September 1",
          "audio": "audio/streams in the desert - September 1.m4a",
          "paragraphs": [
            {
              "en": "I will build you with stones of <span class=\"vocab-trigger\" data-vocab=\"turquoise\">turquoise<\/span>. (Isaiah 54:11)",
              "zh": "我要以绿宝石建造你。（以赛亚书54:11）",
              "simpEn": "I will build you with turquoise stones.",
              "simpZh": "我要用绿松石建造你。"
            },
            {
              "en": "The stones in the wall said, “We have come from mountains far away—from the sides of <span class=\"vocab-trigger\" data-vocab=\"rugged cliffs\">rugged cliffs<\/span>. Fire and water have worked on us for ages but have only produced <span class=\"vocab-trigger\" data-vocab=\"crevices\">crevices<\/span>. Yet human hands like yours have made us into homes where children of your <span class=\"vocab-trigger\" data-vocab=\"immortal\">immortal<\/span> race are born, suffer, rejoice, find rest and shelter, and learn the lessons that our Maker and yours is teaching. But to come to the point of being used for this purpose, we have endured much. <span class=\"vocab-trigger\" data-vocab=\"Dynamite\">Dynamite<\/span> has torn at our very heart, and <span class=\"vocab-trigger\" data-vocab=\"pickaxes\">pickaxes<\/span> have broken and split us into pieces. Often as we lay <span class=\"vocab-trigger\" data-vocab=\"disfigured\">disfigured<\/span> and broken in the <span class=\"vocab-trigger\" data-vocab=\"quarry\">quarry<\/span>, everything seemed to be without design or meaning. But gradually we were cut into blocks, and some of us were <span class=\"vocab-trigger\" data-vocab=\"chiseled\">chiseled<\/span> with sharper instruments until we had a fine edge. Now we are complete, are in our proper places, and are of service.",
              "zh": "墙上的石头说：“我们是从远方山岭而来的——从崎岖的悬崖边上。火与水在我们身上作用了无数年代，却只造成了裂缝。然而，像你们这样的人手，把我们建造成房屋，让属于你们那不朽族类的孩子，在这里出生、受苦、喜乐、得着安息和庇护，并学习我们和你们那造物主所教导的功课。但是，要达到被如此使用的程度，我们忍受了许多。炸药撕裂了我们的心，镐头把我们打碎劈开。常常我们面目全非、破碎不堪地躺在采石场上时，一切似乎都没有计划和意义。但渐渐地，我们被切成方块，有些还被更锋利的工具凿出细边。如今我们完整了，各就各位，并派上了用场。”",
              "simpEn": "The stones in the wall said, 'We have come from mountains far away—from the sides of rough cliffs. Fire and water worked on us for ages but only made cracks. Yet human hands like yours have made us into homes where children of your never-dying race are born, suffer, are happy, find rest and covering, and learn the lessons that our Maker and yours is teaching. But to be used for this, we have gone through much. Dynamite has torn our hearts, and pickaxes have broken and split us. Often as we lay twisted and broken in the stone pit, everything seemed to have no plan. But slowly we were cut into blocks, and some were carved with sharper tools to a fine edge. Now we are whole, in our right places, and useful.'",
              "simpZh": "墙上的石头说：“我们是从很远的大山来的——从陡峭的悬崖边。火和水在我们身上作用了很久很久，却只弄出了裂缝。可是像你们这样的人手，把我们建成了房屋，让那些不会灭亡的人类的孩子，在这里出生、受苦、快乐、安息和得庇护，学习那位造我们又造你们的主所教的功课。但是，要被用到这个地步，我们受了很多苦。炸药撕开了我们的心，镐头把我们打碎劈开。许多时候，我们歪歪扭扭、破碎地躺在采石场里，一切看起来似乎没有计划。但渐渐地，我们被切成方块，有些还被更利的工具凿出细边。现在我们完整了，待在合适的地方，有用处了。”"
            },
            {
              "en": "“You, however, are still in your quarry. You are not complete, and because of that, as once was the case with us, there is much you do not understand. But you are <span class=\"vocab-trigger\" data-vocab=\"destined\">destined<\/span> for a higher building, and someday you will be placed in it by <span class=\"vocab-trigger\" data-vocab=\"angelic\">angelic<\/span> hands, becoming a living stone in a heavenly temple.”",

          "paragraphs": [
            {
              "en": "When you hear them sound a long blast on the trumpets, have all the people give a <span class=\"vocab-trigger\" data-vocab=\"loud shout\">loud shout<\/span>; then the wall of the city will collapse and the people will go up, every man straight in. (Joshua 6:5)",
              "zh": "你们听见角声拖长的时候，众百姓要大声呼喊，城墙就必塌陷，百姓都要往前直上。（约书亚记6:5）",
              "simpEn": "When you hear the long trumpet sound, have everyone give a loud shout; then the city wall will fall down, and everyone will go straight in.",
              "simpZh": "当你们听见号角拉长的声音，所有人要大声呼喊；那时城墙就会倒塌，每个人都可以直直冲上去。"
            },
            {
              "en": "The “loud shout” of <span class=\"vocab-trigger\" data-vocab=\"steadfast\">steadfast<\/span> faith is the exact opposite of the <span class=\"vocab-trigger\" data-vocab=\"groans\">groans<\/span> of wavering faith and the complaints of discouraged hearts. Of all “the <span class=\"vocab-trigger\" data-vocab=\"secret of the Lord\">secret of the Lord<\/span>” (Ps. 25:14 KJV), I do not believe there are any more valuable than the secret of this “loud shout” of faith. “The Lord said to Joshua, ‘See, I have delivered <span class=\"vocab-trigger\" data-vocab=\"Jericho\">Jericho<\/span> into your hands, along with its king and its fighting men’” (Josh. 6:2). He did not say, “I will deliver” but “I have delivered.” The victory already belonged to the children of Israel, and now they were called to take <span class=\"vocab-trigger\" data-vocab=\"possession\">possession<\/span> of it. But the big question still remaining was how. It looked impossible, but the Lord had a plan.",
              "zh": "坚定不移的信心之“大声呼喊”，与动摇信心之呻吟和沮丧心灵之抱怨恰恰相反。在所有“耶和华的秘密”（诗篇25:14）中，我不信有比这信心“大声呼喊”的秘诀更宝贵的了。“耶和华对约书亚说：‘看哪，我已经把耶利哥和耶利哥的王，并大能的勇士，都交在你手中’”（约书亚记6:2）。祂不是说“我将要交”，而是说“我已经交了”。胜利本已属于以色列民，如今他们奉召去得着它。但最大的问题是怎样得着。在人看来不可能，但耶和华有一个计划。",
              "simpEn": "The 'loud shout' of firm faith is the complete opposite of the groans of shaky faith and the complaints of discouraged hearts. Of all 'the secret of the Lord,' I don't believe there is any more valuable secret than this 'loud shout' of faith. 'The Lord said to Joshua, “See, I have handed Jericho over to you, along with its king and its soldiers.”' He didn't say 'I will hand over' but 'I have handed over.' The win already belonged to Israel, and now they were called to take hold of it. But the big question left was how. It looked impossible, but the Lord had a plan.",
              "simpZh": "坚定信心的“大声呼喊”和摇摆信心的呻吟、灰心人的抱怨完全相反。在“耶和华的秘密”中，我不相信有什么比这个信心“大声呼喊”的秘诀更宝贵。“耶和华对约书亚说：‘看，我已经把耶利哥和它的王、勇士都交在你手里了。’”祂没有说“我将会交”，而是说“我已经交了”。得胜早就属于以色列人了，现在他们只是被召去拿。但最大的问题是怎么拿。看起来不可能，但耶和华有个计划。"
            },
            {
              "en": "No one would normally believe that a shout could cause city walls to fall. Yet the secret of their victory lay precisely in just that shout, for it was the shout of faith. And it was a faith that dared to claim a promised victory solely on the basis of the authority of God’s Word, even though there were no physical signs of <span class=\"vocab-trigger\" data-vocab=\"fulfillment\">fulfillment<\/span>. God answered His promise in response to their faith, for when they shouted, He caused the walls to fall.",
              "zh": "通常没有人会相信呼喊声能叫城墙倒塌。然而他们得胜的秘诀恰恰就在那一声呼喊，因为那是信心的呼喊。并且那信心敢于仅仅依据神话语的权柄，在尚未见到任何物质上的应验迹象时，就宣告所应许的胜利。神回应他们的信心，兑现了祂的应许，因为他们呼喊的时候，祂就叫城墙倒塌了。",
              "simpEn": "Normally no one would believe that a shout could make city walls fall down. Yet the secret of their win was exactly that shout, because it was the shout of faith. And it was a faith that dared to take a promised win based only on the authority of God's Word, even with no outward signs that it was happening. God answered His promise because of their faith, for when they shouted, He made the walls fall.",
              "simpZh": "通常没有人会相信，喊一声就能让城墙倒塌。但他们得胜的秘诀正是那一声喊叫，因为那是信心的呼喊。那信心敢只根据神话语的权柄，在还没有任何外在实现迹象时，就把应许的胜利拿过来。神因他们的信心回应祂的应许，当他们呼喊时，祂就让墙倒塌了。"
            },
            {
              "en": "God had declared, “I have delivered Jericho into your hands,” and faith believed this to be true. And many centuries later the Holy Spirit recorded this <span class=\"vocab-trigger\" data-vocab=\"triumph\">triumph<\/span> of faith in the book of Hebrews as follows: “By faith the walls of Jericho fell, after the people had marched around them for seven days” (Heb. 11:30). <span class=\"vocab-trigger\" data-vocab=\"Hannah Whitall Smith\">Hannah Whitall Smith<\/span>",
              "zh": "神已宣告：“我已将耶利哥交在你们手中，”信心就以此为真实。许多世纪之后，圣灵在希伯来书中这样记下这信心的胜利：“以色列人因着信，围绕耶利哥城七日，城墙就倒塌了”（希伯来书11:30）。 汉娜·惠特·史密斯",
              "simpEn": "God had said, 'I have handed Jericho over to you,' and faith believed it was true. Many hundreds of years later, the Holy Spirit wrote this victory of faith in Hebrews: 'By faith the walls of Jericho fell, after the people had marched around them for seven days.' Hannah Whitall Smith",
              "simpZh": "神已经宣告：“我已经把耶利哥交在你们手里了”，信心就相信这是真的。许多世纪以后，圣灵在希伯来书记下了这个信心的胜利：“因着信，耶利哥城墙在百姓绕了七天之后倒塌了。”汉娜·惠特·史密斯"
            },
            {
              "en": "Faith can never reach its <span class=\"vocab-trigger\" data-vocab=\"consummation\">consummation<\/span>, Till the victor’s thankful song we raise: In the glorious city of salvation, God has told us all the gates are praise.",
              "zh": "信心永不能达到完全，直到我们唱起得胜感恩之歌：在那荣耀的救恩之城里，神已告诉我们，所有城门都是赞美。",
              "simpEn": "Faith can never reach its finish until we lift up the winner's thankful song: in the glorious city of salvation, God has told us all the gates are praise.",
              "simpZh": "信心永远达不到圆满，直到我们举起得胜者的感谢之歌：在荣耀的救恩之城里，神告诉我们，所有的门都是赞美。"
            }
          ],
