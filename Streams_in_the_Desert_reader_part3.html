          "audio": "audio/streams in the desert - July 2.m4a",
          "paragraphs": [
            {
              "en": "When you walk, your steps will not be <span class=\"vocab-trigger\" data-vocab=\"hampered\">hampered<\/span>; when you run, you will not stumble. (Proverbs 4:12)",
              "zh": "你行走，脚步必不受阻碍；你奔跑，也不致跌倒。（箴言4:12）",
              "simpEn": "When you walk, nothing will hold back your steps; when you run, you will not trip.",
              "simpZh": "你走路的时候，没有什么能拦阻你的脚步；你奔跑的时候，也不会绊倒。"
            },
            {
              "en": "The Lord only builds a bridge of faith directly under the feet of a faithful traveler. He never builds the bridge a few steps ahead, for then it would not be one of faith. “We live by faith, not by sight” (2 Cor. 5:7).",
              "zh": "主只为忠心的行路者脚前架设信心的桥梁。祂从不提前几步造桥，否则那就不是信心的桥了。“因我们行事为人是凭着信心，不是凭着眼见”（哥林多后书5:7）。",
              "simpEn": "The Lord builds a bridge of faith only right under the feet of someone who faithfully walks. He does not build the bridge a few steps ahead, because then it would not be faith. “We live by faith, not by what we see.”",
              "simpZh": "主只把信心的桥建在忠心赶路的人脚前。祂不会提前几步把桥建好，那样就不是信心了。“我们活着是靠信心，不是靠眼见。”"
            },
            {
              "en": "Years ago <span class=\"vocab-trigger\" data-vocab=\"automatic gates\">automatic gates<\/span> were sometimes used on country roads. They would securely block the road as a vehicle approached, and if the traveler stopped before coming to the gate, it would not open. But if the traveler drove straight toward it, the weight of the vehicle would compress the springs below the roadway, and the gate would swing back to let him pass. The vehicle had to keep moving forward, or the gate would remain closed.",
              "zh": "多年前，乡间道路上有时会使用自动门。当车辆驶近时，门会牢牢挡住道路；如果行路者在到达门前停了下来，门就不会打开。但如果他径直朝门驶去，车身的重量会压下路面下的弹簧，门就会旋开让他通过。车辆必须继续前行，否则门会一直关闭。",
              "simpEn": "Long ago, some country roads had gates that opened by themselves. When a car came near, the gate blocked the road. If the driver stopped before the gate, it would not open. But if he drove straight at it, the weight of the car would push down springs under the road, and the gate would swing open. The car had to keep moving, or the gate would stay shut.",
              "simpZh": "很久以前，乡村路上有时会有自动门。车子靠近时，门会挡住路。如果司机在门前停下来，门就不会开。但如果他直直地开过去，车的重量会压下路下面的弹簧，门就会转开让他过去。车子必须一直向前开，否则门会一直关着。"
            },
            {
              "en": "This illustrates the way to pass through every barrier that blocks the road of service for God. Whether the barrier is a river, a mountain, or a gate, all a child of Jesus must do is head directly toward it. If it is a river, it will dry up as he comes near it, as long as he still <span class=\"vocab-trigger\" data-vocab=\"forges ahead\">forges ahead<\/span>. If it is a mountain, it will be removed and “cast into the sea” (Mark 11:23 KJV), providing he approaches it with <span class=\"vocab-trigger\" data-vocab=\"unflinching confidence\">unflinching confidence<\/span>.",
              "zh": "这说明了如何穿越一切阻挡事奉神之路的障碍。无论这障碍是江河、高山还是大门，耶稣的孩子所要做的就是直接朝它走去。如果是江河，只要他继续奋力前行，靠近时水就会干涸。如果是高山，只要他以毫不退缩的信心迎向它，山就会被挪开，投在海里（马可福音11:23）。",
              "simpEn": "This shows how to get past any wall that blocks the road of serving God. Whether the wall is a river, a mountain, or a gate, a child of Jesus just needs to go straight at it. If it is a river, it will become dry as he gets near, if he keeps moving forward. If it is a mountain, it will be taken away and thrown into the sea, as long as he faces it with strong, steady confidence.",
              "simpZh": "这说明了怎样穿过任何挡住服事神之路的障碍。不管障碍是河、是山还是门，耶稣的孩子只需要直直地朝它走去。如果是河，只要他一直向前走，靠近时河就会干。如果是山，只要他用不动摇的信心面对它，山就会被挪开，丢进海里。"
            },
            {
              "en": "Is some great barrier blocking your path of service right now? Then head straight for it, in the name of the Lord, and it will no longer be there. <span class=\"vocab-trigger\" data-vocab=\"Henry Clay Trumbull\">Henry Clay Trumbull<\/span>",
              "zh": "现在是否有巨大的障碍挡在你事奉的路上？那么奉主的名径直朝它走去，它就不复存在了。亨利·克莱·特朗布尔",
              "simpEn": "Is a big wall blocking your path of service now? Then go straight at it in the name of the Lord, and it will not be there anymore. Henry Clay Trumbull",
              "simpZh": "现在是不是有个很大的障碍挡住了你服事的路？那就奉主的名直直地朝它走去，它就不会再在那里了。亨利·克莱·特朗布尔"
            },
            {
              "en": "We sit and weep in vain, while the voice of the Almighty tells us to never stop moving upward and onward. Let us advance boldly, whether it is dark and we can barely see the forest in front of us, or our road leads us through the mountain pass, where from any <span class=\"vocab-trigger\" data-vocab=\"vantage point\">vantage point<\/span> we can only see a few steps ahead. Press on! And if necessary, like the ancient Israelites we will find a pillar of clouds and fire to lead the way on our journey through the wilderness.",
              "zh": "我们徒然坐着哭泣，而全能者的声音吩咐我们永不停歇地向上向前。让我们勇敢前进，不论是在黑暗中几乎看不清眼前树林的时候，还是道路引领我们穿过山隘、从任何角度都只能看见前面几步路的时候。继续前行吧！如果需要，我们必像古时的以色列人一样，有云柱和火柱引领我们走旷野的路。",
              "simpEn": "We sit and cry for nothing, while the voice of the Almighty tells us never to stop moving up and forward. Let us go ahead bravely, whether it is dark and we can hardly see the forest ahead, or our road takes us through a mountain pass where we can only see a few steps ahead from any place. Press on! And if needed, like the old Israelites we will find a pillar of cloud and fire to lead us through the wilderness.",
              "simpZh": "我们白白坐着哭，而全能者的声音告诉我们不要停止向前向上。让我们勇敢前进，不管是天很黑、几乎看不清前面的树林，还是路带我们穿过山间窄道、从每个地方都只能看到前面几步路。继续向前吧！如果需要，就像古时的以色列人，我们会找到云柱和火柱带领我们走过旷野。"
            },
            {
              "en": "God will provide guides and <span class=\"vocab-trigger\" data-vocab=\"inns\">inns<\/span> along the road, and we will discover food, clothing, and friends at every stage of our journey. And as <span class=\"vocab-trigger\" data-vocab=\"Samuel Rutherford\">Samuel Rutherford<\/span>, the great Scottish minister, once stated so simply, “Whatever happens, the worst will only be a weary traveler receiving a joyful and heavenly welcome home.”",
              "zh": "神必沿途赐下向导和客栈，我们会在旅程的每个阶段得到食物、衣服和朋友。正如伟大的苏格兰牧师撒母耳·卢瑟福曾简明地说过：“无论发生什么事，最坏的情形也不过是一个疲惫的旅人得到喜乐属天的欢迎回家。”",
              "simpEn": "God will give guides and resting places along the road, and we will find food, clothes, and friends at every part of our journey. And as Samuel Rutherford, the great Scottish pastor, once said so simply, “Whatever happens, the worst will just be a tired traveler getting a joyful, heavenly welcome home.”",
              "simpZh": "神会在路上赐下向导和歇脚的地方，我们在旅程的每一段都会找到食物、衣服和朋友。就像伟大的苏格兰牧师撒母耳·卢瑟福曾简单说的那样：“不管发生什么，最坏的情况也只是一个疲惫的旅客得到喜乐属天的欢迎回家。”"
            },
            {
              "en": "I’m going by the upper road, for that still holds the sun, I’m climbing through night’s pastures where the starry rivers run: If you should think to seek me in my old dark abode, You’ll find this writing on the door, “He’s on the Upper Road.” <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "我要走上边的路，因那里仍有阳光，我正攀登穿过夜晚的草场，那里星河奔流：你若想在我的旧日黑暗住处寻找我，你会看见门上写着：“他已走上边的路。” 选自",
              "simpEn": "I am going by the higher road, because it still has the sun. I am climbing through the fields of night where starry rivers flow. If you think to look for me in my old dark home, you will find these words on the door: ‘He is on the Upper Road.’ selected",
              "simpZh": "我要走上面那条路，因为那里还有阳光。我正爬过夜晚的草地，那里有星星的河流过。如果你想去我原来黑暗的家找我，你会看到门上写着：‘他走上边的路了。’ 选自"

          "paragraphs": [
            {
              "en": "When a farmer plows for planting, does he plow <span class=\"vocab-trigger\" data-vocab=\"continually\">continually<\/span>? (Isaiah 28:24)",
              "zh": "那耕地为要撒种的，岂是常常耕地呢？（以赛亚书28:24）",
              "simpEn": "When a farmer plows the ground to plant seeds, does he plow without stopping?",
              "simpZh": "农夫耕地为了撒种，他难道会不停地耕下去吗？"
            },
            {
              "en": "One day in early summer I walked past a lovely meadow. The grass was as soft, thick, and beautiful as an <span class=\"vocab-trigger\" data-vocab=\"immense\">immense<\/span> green Oriental rug. At one end of the meadow stood a fine old tree that served as a <span class=\"vocab-trigger\" data-vocab=\"sanctuary\">sanctuary<\/span> for countless wild birds, whose happy songs seemed to fill the crisp, sweet air. I saw two cows who lay in the shade as the very picture of <span class=\"vocab-trigger\" data-vocab=\"contentment\">contentment<\/span>. And down by the road, eye-catching dandelions mingled their gold with the royal purple of the wild violets. I leaned against the fence for a long time, feasting my hungry eyes and thinking in my soul that God never made a more beautiful place than this lovely meadow.",
              "zh": "初夏的一天，我走过一片可爱的草地。青草柔软、浓密、美丽，如同一张巨大的东方绿色地毯。草地一端矗立着一棵古树，成为无数野鸟的避难所，它们快乐的歌声仿佛充满了清爽甜美的空气。我看见两只母牛躺在树荫下，心满意足的画面。路边，引人注目的蒲公英与高贵的紫罗兰交相辉映。我久久倚在栅栏上，饱享眼福，心里想着神从未造过比这更美的草地了。",
              "simpEn": "One day in early summer, I walked by a beautiful meadow. The grass was soft, thick, and pretty like a huge green oriental carpet. At one end of the meadow stood a nice old tree that was a safe place for many wild birds. Their happy songs seemed to fill the cool, sweet air. I saw two cows resting in the shade, looking perfectly happy. Near the road, bright dandelions mixed their gold color with the royal purple of wild violets. I leaned on the fence for a long time, enjoying the view with my hungry eyes, and I thought God had never made a more beautiful place than this lovely meadow.",
              "simpZh": "初夏的一天，我经过一片很美的草地。草又软又厚又好看，像一张巨大的绿色东方地毯。草地一头有棵很好的老树，是无数野鸟的安全住处，它们快乐的歌声好像充满了清爽甜美的空气。我看见两头牛躺在树荫下，看上去非常满足。路边，亮眼的蒲公英和紫罗兰的金色与紫色混在一起。我在栅栏上靠了很久，饱饱地看着，心里想，神从来没有造过比这片可爱草地更美的地方。"
            },
            {
              "en": "The next day I passed that way again, and to my great <span class=\"vocab-trigger\" data-vocab=\"dismay\">dismay<\/span>, the hand of the destroyer had been there. A farmer with a large tractor, which was now sitting idle in the meadow, had in one day inflicted terrible <span class=\"vocab-trigger\" data-vocab=\"devastation\">devastation<\/span>. Instead of seeing the soft, green grass, I now saw the ugly, bare, and brown earth. Gone were the dandelions and the pretty violets. And instead of the multitude of singing birds, there were now only a few, who were <span class=\"vocab-trigger\" data-vocab=\"industriously\">industriously<\/span> scratching the ground for worms. In my grief I said, “How could anyone spoil something so beautiful?”",
              "zh": "第二天我再次经过那里，令我极其惊愕的是，毁灭者的手已临到那里。一个农夫开着大拖拉机，此刻正闲置在草地上，仅仅一天就造成了可怕的毁坏。我看到的再不是柔软的青草，而是丑陋、光秃、褐色的土地。蒲公英和美丽的紫罗兰都不见了。众多歌唱的鸟儿不见了，只剩下寥寥几只，正勤奋地在地上刨虫。我在悲伤中说：“怎么会有人忍心破坏如此美丽的东西？”",
              "simpEn": "The next day I went that way again, and to my great shock, someone had destroyed it. A farmer with a big tractor, which was now sitting unused in the meadow, had caused terrible damage in one day. Instead of seeing soft, green grass, I now saw ugly, bare, brown dirt. The dandelions and pretty violets were gone. And instead of many singing birds, there were only a few, busy scratching the ground for worms. In my sadness I said, “How could anyone ruin something so beautiful?”",
              "simpZh": "第二天我又经过那里，让我大为惊恐的是，有人把它毁了。一个农夫开着一辆大拖拉机，现在那拖拉机就闲着停在草地上，一天之内就造成了可怕的破坏。我看见的不再是软软的青草，而是难看、光秃秃的棕色泥土。蒲公英和漂亮的紫罗兰都没了。许多唱歌的鸟儿也不见了，只剩下几只，忙着在地上刨虫子。我难过地说：“怎么会有人把这么美的东西弄坏呢？”"
            },
            {
              "en": "Then suddenly my eyes were opened, as if by some <span class=\"vocab-trigger\" data-vocab=\"unseen hand\">unseen hand<\/span>, and I saw a vision. The vision was that of a field of ripe corn ready for harvest. I could see the giant, heavily laden stalks in the autumn sun, and I could almost hear the music of the wind as it swept across the golden tassels. And before I realized it, the bare earth took on a <span class=\"vocab-trigger\" data-vocab=\"splendor\">splendor<\/span> it did not have the day before.",
              "zh": "忽然，仿佛被一只无形的手开启，我看到了一个异象。那是一片成熟的玉米田，等待收割。我仿佛看见秋日阳光下巨大而沉甸甸的禾秆，几乎听见风掠过金色穗子的音乐。在我尚未察觉之际，那光秃的土地竟披上了前一日所没有的荣光。",
              "simpEn": "Then suddenly my eyes were opened, as if by some invisible hand, and I saw a picture in my mind. It was a field of ripe corn ready to be harvested. I could see the tall, heavy stalks in the autumn sun, and I could almost hear the music of the wind as it blew over the golden tops. Before I knew it, the bare ground had a beauty it did not have the day before.",
              "simpZh": "然后突然，好像有一只无形的手打开了我的眼睛，我看到了一个景象。那是一片成熟的玉米田，等着收割。我几乎能看见秋日阳光下又高又重的禾秆，几乎能听见风吹过金色穗子的音乐。我还没反应过来，那片光秃秃的土地就有了一种前一天没有的荣美。"
            },
            {
              "en": "Oh, if only we would always catch the vision of the abundant harvest when the great Master Farmer comes, as He often does, to plow through our very souls—<span class=\"vocab-trigger\" data-vocab=\"uprooting\">uprooting<\/span> and turning under that which we thought most beautiful and leaving only the bare and the <span class=\"vocab-trigger\" data-vocab=\"unlovely\">unlovely<\/span> before our agonizing eyes. <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "哦，巴不得我们总能在伟大的农夫主人来耕耘我们的灵魂时——祂常常这样做——就看见那丰收的异象；祂把我们认为最美丽的东西连根拔起、翻入土中，只留下光秃荒凉的景象在我们痛苦眼前。选自",
              "simpEn": "Oh, if only we could always see the picture of the rich harvest when the great Master Farmer comes, as He often does, to plow through our very souls. He pulls up and turns under what we thought was most beautiful, leaving only what is bare and ugly before our pained eyes. selected",
              "simpZh": "哦，要是我们总能看到那个大丰收的景象就好了，当那位大主人农夫来耕我们的灵魂时——祂常常这样做——祂把我们认为最美的连根拔起，翻到土下，只在我们痛苦的眼睛前留下光秃秃、不好看的东西。选自"

            {
              "en": "Why should I be frightened and surprised by the plow of the Lord, which makes deep <span class=\"vocab-trigger\" data-vocab=\"furrows\">furrows<\/span> in my soul? I know He is not some arbitrary or irrational farmer—His purpose is to yield a harvest. <span class=\"vocab-trigger\" data-vocab=\"Samuel Rutherford\">Samuel Rutherford<\/span>",

              "simpZh": "在一本吸引人的小书《盼望角》里，有个叫亚当·慢人的角色，他被带进了神的宝库。在那里显给他看的许多奇妙东西中，有一个“延迟祝福办公室”，神把对某些祷告的回答存放在那里，直到合适的时候才发出。"

              "zh": "对一些祷告盼望回应的人来说，需要很长时间才能学会：回应迟延并非拒绝。事实上，在“迟延的祝福办公室”里，有我们从未想到过的爱和智慧的深奥秘密！我们往往想在果子还青的时候就把祝福从树上摘下来，但神要我们等到它们完全成熟。",
              "simpEn": "For some who pray and expect an answer, it takes a long time to learn that a delayed answer is not a ‘no.’ Actually, in the ‘Delayed Blessing Office,’ there are deep secrets of love and wisdom that we never imagined! We usually want to pick our blessings from the tree while they are still green, but God wants us to wait until they are fully ripe.",
              "simpZh": "有些祷告并期待回应的人，要花很长时间才能明白：回应晚了并不是拒绝。其实，在“延迟祝福办公室”里，有我们从未想过的爱与智慧的深奥秘密！我们常常想在果子还青的时候就把它从树上摘下来，但神希望我们等到它完全熟透。"
            },
            {
              "en": "“The Lord longs to be gracious to you. . . . Blessed are all who wait for him!” (Isa. 30:18). The Lord watches over us in all the difficult places, and He will not allow even one trial that is too much for us. He will use His refining fire to burn away our <span class=\"vocab-trigger\" data-vocab=\"impurities\">impurities<\/span> and will then gloriously come to our rescue.",
              "zh": "“耶和华必然等候，要施恩给你们……凡等候祂的都是有福的！”（以赛亚书30:18）主在一切艰难之处看顾我们，祂必不许可任何试炼过于我们所能承受。祂要用炼净的火烧去我们的杂质，然后荣耀地来拯救我们。",
              "simpEn": "“The Lord longs to be kind to you. . . . Blessed are all who wait for him!” The Lord watches over us in every hard place, and He will not let even one trial be too much for us. He will use His fire to burn away what is not pure in us and then will wonderfully come to save us.",
              "simpZh": "“主很想施恩给你们……凡等候祂的人都是有福的！”主在每一个困难的地方看顾我们，祂不会让任何试炼超过我们能承受的。祂会用炼净的火烧掉我们里面的杂质，然后荣耀地来拯救我们。"
            },
            {
              "en": "Do not grieve Him by doubting His love. Instead, lift up your eyes and begin praising Him right now for the <span class=\"vocab-trigger\" data-vocab=\"deliverance\">deliverance<\/span> that is on its way to you. Then you will be abundantly rewarded for the delay that has tried your faith.",
              "zh": "不要因怀疑祂的爱而使祂忧伤。相反，抬起眼睛，现在就开始为那正在临到你的拯救赞美祂。这样，你必因那试炼你信心的迟延而大得赏赐。",
              "simpEn": "Do not make Him sad by doubting His love. Instead, look up and start praising Him right now for the rescue that is coming to you. Then you will be greatly rewarded for the delay that has tested your faith.",
              "simpZh": "不要因为怀疑祂的爱而让祂难过。相反，抬起眼睛，现在就开始为那正在临到你的拯救赞美祂。这样，你就会因为那考验你信心的延迟而得到丰盛的奖赏。"
            },
            {
              "en": "O you of little faith, God has not failed you yet! When all looks dark and gloomy, You do so soon forget— Forget that He has led you, And gently cleared your way; On clouds has poured His sunshine, And turned your night to day. And if He’s helped you to this point, He will not fail you now; How it must wound His loving heart To see your anxious brow! Oh! doubt not any longer, To Him commit your way, Whom in the past you trusted, And is just the same today. <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "你这小信的人哪，神还没有让你失望过！当一切看似黑暗阴郁，你竟这么快就忘了——忘了祂曾引领你，温柔地为你开路；在云上倾洒祂的阳光，将你的黑夜变为白昼。祂既已帮助你到如今，如今也不会让你失望；看见你焦虑的眉头，祂爱的心是何等伤痛！哦！不要再怀疑，将你的道路交托给祂，就是你过去所信靠、今日仍旧一样的神。选自",
              "simpEn": "Oh you who have little faith, God has never failed you yet! When everything looks dark and sad, you forget so quickly— forget that He has led you and gently made your path clear; He has poured His sunshine on the clouds and turned your night into day. And if He has helped you up to now, He will not fail you now. How it must hurt His loving heart to see your worried face! Oh! do not doubt any longer. Trust your way to Him, the One you trusted in the past, who is just the same today. selected",
              "simpZh": "哦，小信的人哪，神还从来没有让你失望过呢！当一切看起来又黑又暗的时候，你这么快就忘了——忘了祂曾经带领你，温柔地为你清开道路；在乌云上洒下阳光，把你的黑夜变成白天。如果祂已经帮你到了现在，祂现在也不会让你失望。看到你焦虑的脸，祂那充满爱的心该多么受伤啊！哦！不要再怀疑了，把你的路交给祂，就是你过去信靠、今天也一样的那一位。选自"

              "en": "The desert is certainly a strange place to find vineyards! Can it be true that the riches of life that we need can be found in the desert—a place that symbolizes loneliness, and through which we can seldom find our way? Not only is this true but verse 15 goes on to say, “I . . . will make the Valley of <span class=\"vocab-trigger\" data-vocab=\"Achor\">Achor<\/span> a door of hope. There she will sing as in the days of her youth.” “Achor” means “troubled,” yet the Valley of Achor is called “a door of hope.”",

              "simpEn": "The desert is certainly a strange place to find vineyards! Can it be true that the good things of life we need can be found in the desert—a place that means loneliness and where we can hardly find our way? Not only is this true, but verse 15 continues, “I will make the Valley of Achor a door of hope. There she will sing like in the days when she was young.” “Achor” means “trouble,” but the Valley of Achor is called “a door of hope.”",
              "simpZh": "旷野确实是个奇怪的地方，竟然能找到葡萄园！我们生命里需要的好东西，真能在旷野——一个代表孤独、我们常常找不到路的地方——找到吗？这不仅是真的，第15节还接着说：“我必使亚割谷成为盼望的门。她会在那里歌唱，像年轻时一样。”“亚割”意思是“麻烦、搅扰”，可是亚割谷却被叫作“盼望的门”。"
            },
            {
              "en": "Yes, God knows our need for a desert experience. He knows exactly where and how to produce <span class=\"vocab-trigger\" data-vocab=\"enduring qualities\">enduring qualities<\/span> in us. The person who has been idolatrous, has been rebellious, has forgotten God, and has said with total self-will, “I will go after my lovers” (Hos. 2:5), will find her path blocked by God. “She will chase after her lovers but not catch them; she will look for them but not find them” (Hos. 2:7). And once she feels totally hopeless and abandoned, God will say, “I am now going to allure her; I will lead her into the desert and speak tenderly to her.”",
              "zh": "是的，神知道我们需要旷野的经历。祂确切知道该在何处、如何在我们里面塑造恒久的品格。那曾拜偶像、悖逆、忘记神，并完全凭己意说“我要随从我所爱的人”（何西阿书2:5）的人，会发现自己的道路被神挡住。“她必追随所爱的人，却追不上；寻找他们，却寻不见”（何西阿书2:7）。一旦她感到全然绝望和被弃，神就要说：“我必劝导她，领她到旷野，对她说安慰的话。”",
              "simpEn": "Yes, God knows we need a desert experience. He knows exactly where and how to build lasting character in us. The person who has worshiped idols, has been rebellious, has forgotten God, and has said with full self-will, “I will go after my lovers,” will find her path blocked by God. “She will chase after her lovers but not catch them; she will look for them but not find them.” And once she feels completely hopeless and left alone, God will say, “I am now going to draw her gently; I will lead her into the desert and speak kindly to her.”",
              "simpZh": "是的，神知道我们需要旷野的经历。祂完全知道该在哪里、怎样在我们里面塑造持久的品格。那个拜过偶像、叛逆过、忘记了神，并且完全凭自己意思说“我要去追我的情人们”的人，会发现她的路被神挡住了。“她会去追她的情人们，却追不上；去找他们，却找不到。”一旦她感到彻底绝望、被抛弃了，神就会说：“我现在要温柔地吸引她，带她进旷野，对她说温柔的话。”"

            {

            {
              "en": "We never know where God has hidden His streams. We see a large stone and have no idea that it covers the source of a <span class=\"vocab-trigger\" data-vocab=\"spring\">spring<\/span>. We see a rocky area and never imagine that it is hiding a fountain. God leads me into hard and difficult places, and it is there I realize I am where eternal streams <span class=\"vocab-trigger\" data-vocab=\"abide\">abide<\/span>. <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",

            {
              "en": "We do not know what to do, but our eyes are upon you. (2 Chronicles 20:12)",

            {

              "zh": "一个名叫乌撒的以色列人因“伸手扶住神的约柜”（撒母耳记下6:6）而丧命。他出于最好的动机——因“牛失前蹄”（撒母耳记下6:6）而想扶稳约柜——然而他越过了界限，摸了主的工，“因此神击杀了他”（撒母耳记下6:7）。过信心的生活常要求我们放手不管。",
              "simpEn": "An Israelite named Uzzah lost his life because he reached out and grabbed the ark of God. He put his hands on it with the best reason—to keep it steady because the oxen stumbled—but still, he went too far by touching the Lord's work, so God struck him down. Living a life of faith often means we must not touch things.",
              "simpZh": "有个叫乌撒的以色列人因为伸手抓住神的约柜而丧命。他伸手的动机是好的——因为牛绊倒了，他想扶稳约柜——但是，他越界摸了神的工，所以神击杀了他。过信心的生活常常需要我们不要去碰那些事。"

              "simpEn": "If we have completely handed something over to God, we must keep our hands off it. He can protect it better than we can, and He does not need our help. “Be quiet before the Lord and wait patiently for him; do not get upset when people succeed in their ways, when they do their evil plans.”",
              "simpZh": "如果我们已经把事情完全交给神了，我们就得把手拿开。祂能比我们更好地保护它，也不需要我们帮忙。“要在主面前安静，耐心等候祂；不要因为别人做事顺利、坏人计谋成功就心里烦躁。”"

              "zh": "我们生活中的事可能看似一团糟，但神比我们更清楚我们的处境。只要我们完全信靠祂，让祂按自己的方式和时间作工，祂就会在完美的时刻行事。很多时候，我们安静不动是最敬虔的举动，而焦躁忙碌则最为有害，因为神已经应许要成就祂至高的旨意。宣信",
              "simpEn": "Things in our lives may seem to be going completely wrong, but God knows our situation better than we do. He will act at the perfect moment, if we fully trust Him to work in His own way and at His own time. Often there is nothing more holy than us doing nothing, and nothing more harmful than restless activity, because God has promised to do what He in His supreme authority wills. A. B. Simpson",
              "simpZh": "我们生活中发生的事可能看起来全都错了，但神比我们更了解我们的情况。如果我们完全信靠祂，让祂用自己的方式和时间来做工，祂就会在最完美的时候行动。很多时候，我们安静不动是最敬虔的，焦躁地忙碌是最有害的，因为神已经应许要成就祂自己至高的旨意。宣信"

            {

              "simpZh": "在困惑中，我说：“主啊，求你把它弄对！黑夜对你就像白天，黑暗就像光明。我不敢去碰那些牵涉很多的事情；我发抖的手可能会晃，我笨手可能会打破；你的手永远不会出错。”"

            {

              "zh": "疑惑之中，我说：“主啊，求你指明；哪条是真实、稳妥的路？哪条会有益处？我不够聪明去分辨，脚步也不够稳当去行走；对祢如此清晰的事，主啊，求祢也向我显明！”将生活中纠缠不清和令人困惑的事都交在神手里，留在那里，这是何等的安慰。",

              "en": "<span class=\"vocab-trigger\" data-vocab=\"Pebble Beach\">Pebble Beach<\/span>, on the California coast, has become quite famous for the beautiful pebbles found there. The raging white surf continually roars, thundering and pounding against the rocks on the shore. These stones are trapped in the arms of the merciless waves. They are tossed, rolled, rubbed together, and ground against the sharp edges of the cliffs. Both day and night, this process of grinding continues <span class=\"vocab-trigger\" data-vocab=\"relentlessly\">relentlessly<\/span>. And what is the result?",
              "zh": "加利福尼亚海岸的圆石滩，因那里美丽的卵石而颇为著名。翻腾的白色巨浪不住咆哮，雷鸣般地撞击着岸边的岩石。这些石头被困在无情海浪的臂弯中，被抛掷、滚动、互相摩擦，又被磨在悬崖的尖利边缘上。这磨碾的过程昼夜不息，毫不留情。结果如何呢？",
              "simpEn": "Pebble Beach on the coast of California has become famous for the pretty smooth stones found there. The wild white waves keep roaring, thundering and crashing against the rocks on the shore. These stones are caught in the arms of the cruel waves. They are thrown, rolled, rubbed together, and ground against the sharp edges of the cliffs. Day and night, this grinding goes on without stopping. And what is the result?",
              "simpZh": "加州海岸的圆石滩因为那里漂亮的鹅卵石而很有名。猛烈翻腾的白色海浪不停地吼叫，像打雷一样冲击着岸边的岩石。这些石头被困在无情海浪的怀抱里，被抛来抛去、滚来滚去、互相摩擦，被磨在悬崖的锋利边缘上。白天黑夜，这种研磨不停地继续。结果是什么呢？"
            },
            {
              "en": "Tourists from around the world flock there to collect the beautiful round stones. They display them in cabinets and use them to decorate their homes. Yet a little farther up the coast, just around the point of the cliff, is a quiet cove. Protected from the face of the ocean, sheltered from the storms, and always in the sun, the sands are covered with an abundance of pebbles never sought by the travelers.",
              "zh": "世界各地的游客蜂拥而至，收集这些美丽的圆石。他们把石头陈列在柜子里，用来装饰家居。然而沿着海岸稍远一点，绕过悬崖的岬角，有一个安静的小海湾。那里不受大洋直面冲击，不受风暴侵袭，常年阳光普照，沙滩上布满了大量的卵石，却从未有游人去寻找。",
              "simpEn": "Tourists from all over the world come in crowds to collect the pretty round stones. They put them in display cases and use them to decorate their homes. But a little farther up the coast, just around the rocky point, there is a quiet cove. Protected from the open ocean, safe from storms, and always sunny, the sands are covered with many pebbles that travelers never look for.",
              "simpZh": "世界各地的游客成群结队地去那里捡那些漂亮的圆石头。他们把石头放在陈列柜里，用来装饰家。但是沿着海岸再往前走一点，绕过悬崖的尖角，有一个安静的小海湾。那里不受大海直接冲击，有风暴也吹不到，总是阳光明媚，沙滩上到处都是鹅卵石，却从来没有游客去寻找。"
            },
            {
              "en": "So why have these stones been left untouched through all the years? Simply because they have escaped all the turmoil and the grinding of the waves. The quietness and peace have left them as they have always been—rough, unpolished, and <span class=\"vocab-trigger\" data-vocab=\"devoid of beauty\">devoid of beauty<\/span>—for polish is the result of difficulties.",
              "zh": "那么，为何这些石头多年来从未被碰过呢？仅仅因为它们躲避了一切的动荡和海浪的研磨。宁静与平安使它们保持了原本的样子——粗糙、未经打磨、毫无美感——因为光亮是艰难的结果。",
              "simpEn": "So why have these stones been left alone all these years? Simply because they have missed all the rough movement and grinding of the waves. The quietness and peace have left them just as they always were—rough, not smooth, and without beauty—because smoothness comes from hard times.",
              "simpZh": "那么，为什么这些石头这么多年来都没人碰呢？只是因为它们躲开了所有的动荡和海浪的磨擦。安静和平安让它们保持了老样子——粗糙、没有磨光、没有美丽——因为光滑是困难带来的结果。"
            },
            {
              "en": "Since God knows what <span class=\"vocab-trigger\" data-vocab=\"niche\">niche<\/span> we are to fill, let us trust Him to shape us to it. And since He knows what work we are to do, let us trust Him to grind us so we will be properly prepared. O blows that strike! O hurts that pierce This fainting heart of mine! What are you but the Master’s tools Forming a work Divine? Nearly all of God’s jewels are crystallized tears.",
              "zh": "既然神知道我们要填补的岗位是什么，就让我们信靠祂把我们塑造得合宜。既然祂知道我们要做什么工，就让我们信靠祂来研磨我们，使我们预备妥当。哦，打击临到！哦，创伤刺入我这昏厥的心！你们不过是主的工具，为要塑造神圣的杰作？神几乎所有的宝石都是泪水结晶而成。",
              "simpEn": "Since God knows what special place we are to fill, let us trust Him to shape us for it. And since He knows what work we are to do, let us trust Him to grind us so we will be properly prepared. Oh blows that hit! Oh hurts that cut this weak heart of mine! What are you but the Master's tools making a wonderful work of God? Almost all of God's jewels are tears that have turned into crystals.",
              "simpZh": "既然神知道我们要填补的特别位置是什么，就让我们信靠祂来塑造我们适合那个位置。既然祂知道我们要做什么工作，就让我们信靠祂来磨我们，使我们准备好。哦，击打我的打击！哦，刺穿我这软弱心灵的伤痛！你们不过是主人的工具，为要做出神圣的作品吗？几乎神所有的宝石都是泪水变成的结晶。"
            }
          ],

        {

          "audio": "audio/streams in the desert - July 10.m4a",
          "paragraphs": [
            {
              "en": "I called him but he did not answer. (Song of Songs 5:6)",

            {

              "zh": "主一旦赐给我们极大的信心，祂也常以长久的迟延来试验这信心。祂容让仆人们的呼声在耳边回响，仿佛他们的祷告从轻蔑的穹苍反弹回来。信徒们叩击天门，门却纹丝不动，好像门铰已经锈住。他们像耶利米一样呼喊：“你以密云遮盖自己，以致祈祷不得透过”（耶利米哀歌3:44）。",
              "simpEn": "Once the Lord gives us great faith, He often tests it with long waiting. He lets His servants' voices bounce back to their ears, as if their prayers were bouncing off a sneering sky. Believers have knocked on heaven's gate, but it stayed shut tight, as if the hinges were rusty. Like Jeremiah, they cried, 'You have wrapped yourself in a cloud so that no prayer can pass through.'",
              "simpZh": "主一旦给我们很大的信心，祂常常用长时间的等待来考验它。祂让仆人们的声音在耳边回响，好像祷告从看不起人的天上弹回来一样。信徒们敲天堂的门，门却一动不动，好像门铰生锈了。他们像耶利米一样喊着：“你用云把自己包起来，让祷告透不过去。”"

            {
              "en": "True saints of God have endured lengthy times of patient waiting with no reply, not because their prayers were prayed without intensity, nor because God did not accept their pleas. They were required to wait because it pleased Him who is <span class=\"vocab-trigger\" data-vocab=\"sovereign\">sovereign<\/span> and who gives “<span class=\"vocab-trigger\" data-vocab=\"according to his good purpose\">according to his good purpose<\/span>” (Phil. 2:13). And if it pleases Him to cause our patience to be <span class=\"vocab-trigger\" data-vocab=\"exercised\">exercised<\/span>, should He not do as He desires with His own?",

              "simpEn": "God's true holy people have gone through long times of patient waiting with no answer, not because they didn't pray hard enough, nor because God didn't accept their cries. They had to wait because it pleased the One who rules over all and gives 'according to His good plan.' If it pleases Him to stretch our patience, should He not do what He wants with His own?",

              "simpEn": "Christ sometimes waits to help so He can test our faith and make our prayers stronger. Our boat may be rocked by the waves while He sleeps, but He will wake up before it goes under. He sleeps but never sleeps too long; He is never too late. Alexander Maclaren",
              "simpZh": "基督有时候迟延帮助，为要考验我们的信心，也让我们的祷告更有力量。我们的船可能被波浪摇来摇去，祂还在睡觉，但祂会在船沉之前醒来。祂睡觉，但从来不会睡过头，因为祂永远不会太晚。亚历山大·麦克拉伦"
            },
            {
              "en": "Be still, sad soul! lift up no <span class=\"vocab-trigger\" data-vocab=\"passionate cry\">passionate cry<\/span>, But spread the desert of your being bare To the full searching of the All-seeing eye; Wait! and through dark <span class=\"vocab-trigger\" data-vocab=\"misgiving\">misgiving<\/span>, deep despair, God will come down in pity, and fill the dry Dead place with light, and life, and <span class=\"vocab-trigger\" data-vocab=\"springlike\">springlike<\/span> air. <span class=\"vocab-trigger\" data-vocab=\"John Campbell Shairp\">John Campbell Shairp<\/span>",

            {

              "simpEn": "Week after week, with a steady and firm spirit, Elijah watched the stream grow smaller and finally dry up. Often tempted to fall into doubt, he still would not let what was happening come between him and God. Unbelief looks at God through the troubles, like seeing the sun made dim by clouds or smoke. But faith puts God between itself and the trouble, and looks at the trouble through Him.",

              "simpZh": "以利亚的溪流缩小成一条银线，在大石头底下积成小水坑。然后水坑干了，鸟飞走了，田野和树林里的野兽也不再来喝水，因为溪水完全干了。只有到了那时候，耶和华的话才临到以利亚那忍耐忠心的心灵，说：“你马上往撒勒法去。”"

            {

            {
              "en": "Faith is that God-given ability that, when exercised, brings the unseen into plain view. It deals with the <span class=\"vocab-trigger\" data-vocab=\"supernatural\">supernatural<\/span> and makes impossible things possible. And yes, it grows during storms—that is, it grows through <span class=\"vocab-trigger\" data-vocab=\"disturbances\">disturbances<\/span> in the spiritual atmosphere. Storms are caused by conflicts between the physical elements, and the storms of the spiritual world are conflicts with supernatural, <span class=\"vocab-trigger\" data-vocab=\"hostile\">hostile<\/span> elements. And it is in this atmosphere of conflict that faith finds its most <span class=\"vocab-trigger\" data-vocab=\"fertile soil\">fertile soil<\/span> and grows most rapidly to <span class=\"vocab-trigger\" data-vocab=\"maturity\">maturity<\/span>.",
              "zh": "信心是神所赐的能力，一旦运用，便将那未见之事显明。它涉及超自然领域，使不可能变为可能。是的，它在暴风雨中成长——就是在属灵气氛的扰动中成长。暴风雨源于自然元素之间的冲突，而属灵世界的暴风雨则是与超自然、敌对势力的冲突。正是在这种冲突的气氛中，信心找到了最肥沃的土壤，最迅速地迈向成熟。",
              "simpEn": "Faith is an ability God gives. When it is used, it makes things we cannot see become clear. It works with things beyond the natural world and makes impossible things happen. And yes, it grows during storms—that is, it grows through trouble in the spiritual air. Physical storms come from clashing air and water, and spiritual storms come from clashing with unseen, hateful forces. In this atmosphere of battle, faith finds its best soil and grows up most quickly.",
              "simpZh": "信心是神给的一种能力。用它的时候，它能把看不见的东西变得清楚看见。它处理超自然的事，让不可能变成可能。是的，信心在风暴中长大——就是说，在属灵气氛的动荡中长大。自然界的风暴是由天气冲突引起的，属灵世界的风暴是与看不见的敌对力量的冲突。在这种冲突的环境中，信心找到了最肥沃的土壤，最快地长大成熟。"
            },
            {
              "en": "The strongest trees are found not in the thick shelter of the forest but out in the open, where winds from every direction bear down upon them. The fierce winds bend and twist them until they become giant in <span class=\"vocab-trigger\" data-vocab=\"stature\">stature<\/span>. These are the trees that <span class=\"vocab-trigger\" data-vocab=\"toolmakers\">toolmakers<\/span> seek for <span class=\"vocab-trigger\" data-vocab=\"handles\">handles<\/span> for their tools, because of the wood’s great strength.",
              "zh": "最强壮的树木并非长在森林的浓密遮蔽里，而是长在露天之处，四方来风都压向它们。猛烈的风弯折扭曲它们，直到它们身材巨大。这些正是工具制造者为工具手柄所寻找的树木，因为其木质极其坚韧。",
              "simpEn": "The strongest trees are not found hidden deep in the forest, but out in the open, where winds from all sides hit them. The strong winds bend and twist them until they grow into giants. These are the trees that toolmakers want for handles, because the wood is so strong.",
              "simpZh": "最强壮的树不是在森林浓密的遮挡里找到的，而是长在空阔的地方，风从四面八方吹过来。大风把它们吹弯、扭曲，直到它们长得非常高大。这些就是做工具的人找来当把手的树，因为木头非常结实。"
            },
            {
              "en": "It is the same in the spiritual world. Remember, when you see a person of great spiritual stature, the road you must travel to walk with him is not one where the sun always shines and wildflowers always bloom. Instead, the way is a <span class=\"vocab-trigger\" data-vocab=\"steep\">steep<\/span>, rocky, and narrow path, where the winds of hell will try to knock you off your feet, and where sharp rocks will cut you, <span class=\"vocab-trigger\" data-vocab=\"prickly\">prickly<\/span> <span class=\"vocab-trigger\" data-vocab=\"thorns\">thorns<\/span> will scratch your face, and poisonous snakes will <span class=\"vocab-trigger\" data-vocab=\"slither\">slither<\/span> and <span class=\"vocab-trigger\" data-vocab=\"hiss\">hiss<\/span> all around you.",
              "zh": "属灵世界也是如此。切记，当你看见一个属灵身量高大的人，你要与他同行之路并非阳光常照、野花盛开的坦途。相反，那是一条陡峭、崎岖、狭窄的小径，地狱的风要试图将你吹倒，尖利的石头要割伤你，带刺的荆棘要划破你的脸，毒蛇要在你四周窸窣吐信。",
              "simpEn": "It is the same in the spiritual life. Remember, when you see a person who is big and strong in spirit, the road you must travel to walk with him is not one where the sun always shines and flowers always bloom. Instead, the way is steep, full of rocks, and narrow. The winds of hell will try to knock you down, sharp rocks will cut you, thorny bushes will scratch your face, and poisonous snakes will slide and hiss all around you.",
              "simpZh": "在属灵世界里也是一样。记住，当你看到一个灵命高大强壮的人，你要和他同行的路，不是那种总是阳光明媚、野花盛开的路。相反，那条路又陡又满是石头，还很窄。地狱的风会试图把你吹倒，尖石头会割伤你，带刺的荆棘会划破你的脸，毒蛇会在你周围爬行发出嘶嘶声。"
            },
            {
              "en": "The path of faith is one of sorrow and joy, suffering and healing comfort, tears and smiles, trials and victories, conflicts and triumphs, and also hardships, dangers, beatings, persecutions, misunderstanding, trouble, and distress. Yet “in all these things we are more than <span class=\"vocab-trigger\" data-vocab=\"conquerors\">conquerors<\/span> through him who loved us” (Rom. 8:37).",
              "zh": "信心之路有忧伤也有喜乐，有痛苦也有医治的安慰，有眼泪也有欢笑，有试炼也有得胜，有争战也有凯旋，还有艰难、危险、鞭打、逼迫、误解、麻烦和困苦。然而“靠着爱我们的主，在这一切的事上已经得胜有余了”（罗马书8:37）。",
              "simpEn": "The path of faith has sadness and joy, suffering and healing comfort, tears and smiles, tests and victories, fights and wins, and also hard times, dangers, beatings, being attacked for your faith, being misunderstood, trouble, and great stress. Yet in all these things we are more than winners through the One who loved us.",
              "simpZh": "信心的路上有悲伤也有快乐，有受苦也有医治的安慰，有眼泪也有微笑，有试炼也有胜利，有冲突也有得胜，还有困难、危险、挨打、被逼迫、被误解、麻烦和困苦。但是靠着那位爱我们的主，在这一切事上我们都超过得胜者了。"
            },
            {
              "en": "Yes, “in all these”—even during storms, when the winds are the most intense—“we are more than conquerors.” You may be tempted to run from the <span class=\"vocab-trigger\" data-vocab=\"ordeal\">ordeal<\/span> of a fierce storm of testing, but head straight for it! God is there to meet you in the center of each trial. And He will whisper to you His secrets, which will bring you out with a <span class=\"vocab-trigger\" data-vocab=\"radiant\">radiant<\/span> face and such an <span class=\"vocab-trigger\" data-vocab=\"invincible\">invincible<\/span> faith that all the demons of hell will never be able to shake it. <span class=\"vocab-trigger\" data-vocab=\"E.A. Kilbourne\">E.A. Kilbourne<\/span>",
              "zh": "是的，“在这一切之中”——即使在暴风最猛烈的风暴中——“我们都得胜有余”。你或许受试探想逃避严酷考验的磨难，却要直面它！神就在每一试炼的中心迎候你。祂要向你耳语祂的奥秘，使你带着容光焕发的脸庞和坚不可摧的信心出来，这信心是阴间一切鬼魔永不能摇动的。 基尔伯恩",
              "simpEn": "Yes, 'in all these things'—even during storms when the winds blow hardest—'we are more than winners.' You may want to run from the hard test of a fierce storm, but go straight into it! God is there to meet you in the middle of every trial. He will whisper His secrets to you, and you will come out with a shining face and a faith so strong that all the demons of hell can never shake it. E.A. Kilbourne",
              "simpZh": "是的，“在这一切事上”——甚至在风最猛烈的风暴中——“我们都是超越得胜的人”。你可能想要逃离一场严酷试炼风暴的折磨，但要直直地朝它走去！神就在每个试炼的中心迎见你。祂会小声告诉你祂的奥秘，你会带着发光的脸和一种打不败的信心走出来，连地狱里所有的鬼魔都无法动摇它。基尔伯恩"
            }

          "paragraphs": [
            {
              "en": "Bind the <span class=\"vocab-trigger\" data-vocab=\"festival sacrifice\">festival sacrifice<\/span> with <span class=\"vocab-trigger\" data-vocab=\"cords\">cords<\/span> to the <span class=\"vocab-trigger\" data-vocab=\"horns of the altar\">horns of the altar<\/span>. (Psalm 118:27 NASB)",
              "zh": "用绳索把节期的祭牲拴住，带到坛角那里。（诗篇118:27 新美国标准圣经）",
              "simpEn": "Tie the holiday offering with ropes to the horns of the altar.",
              "simpZh": "用绳子把节期祭物绑在祭坛的角上。"
            },
            {
              "en": "Is the altar of sacrifice calling you? Why not ask God to bind you to it, so you will never be tempted to turn away from a life of <span class=\"vocab-trigger\" data-vocab=\"consecration\">consecration<\/span>, or <span class=\"vocab-trigger\" data-vocab=\"dedication\">dedication<\/span>, to Him? There are times when life is full of promise and light, and we choose the cross; yet at other times, when the sky is gray, we run from it. Therefore it is wise to be bound to the altar.",
              "zh": "那祭坛在呼唤你吗？何不求神将你绑在其上，这样你永不会受试探，转离向祂分别为圣、全然奉献的生活？有时生活充满应许与光明，我们选择十架；另些时候，天色阴暗，我们就逃避它。因此，被绑在祭坛上是智慧的。",
              "simpEn": "Is the altar of sacrifice calling you? Why not ask God to tie you to it, so you will never be tempted to turn away from a life of being set apart and given to Him? Sometimes life is full of good hope and light, and we choose the cross; but at other times, when everything looks gray, we run from it. So it is wise to be tied to the altar.",
              "simpZh": "祭坛在呼唤你吗？为什么不求神把你绑在上面呢？这样你就永远不会受到诱惑，离开那种分别为圣、奉献给祂的生活。有时候生活充满了希望和亮光，我们选择了十字架；但有时候天色灰暗，我们就逃跑。所以，被绑在祭坛上才是聪明的。"
            },
            {
              "en": "Dear blessed Holy Spirit, will You bind us to the cross and fill us with such love for it that we will never abandon it? Please bind us with Your <span class=\"vocab-trigger\" data-vocab=\"scarlet cord\">scarlet cord<\/span> of <span class=\"vocab-trigger\" data-vocab=\"redemption\">redemption<\/span>, Your gold cord of love, and the silver cord of hope in Christ’s <span class=\"vocab-trigger\" data-vocab=\"second coming\">second coming<\/span>. We ask this so we will not turn from the cross of sacrifice, or desire becoming anything but humble partners with our Lord in His pain and sorrow!",
              "zh": "亲爱的圣灵，求祢把我们绑在十字架上，并以对十架的爱充满我们，使我们永不丢弃它。请用祢朱红的救赎之绳、金色的慈绳爱索、以及基督再来的银色的盼望之索绑住我们。我们如此祈求，为要不转离牺牲的十字架，也不渴望成为别的，只愿谦卑地与主同受痛苦忧伤！",
              "simpEn": "Dear blessed Holy Spirit, will You tie us to the cross and fill us with so much love for it that we will never leave it? Please tie us with Your bright red cord of saving us, Your gold cord of love, and the silver cord of hope in Christ's coming again. We ask this so we will not turn away from the cross of giving up our own way, or want to be anything but humble sharers with our Lord in His pain and sadness!",
              "simpZh": "亲爱的圣灵，求祢把我们绑在十字架上，让我们充满对十字架的爱，永远不会丢弃它。请用祢救赎的鲜红绳子、爱的金绳子、还有盼望基督再来的银绳子绑住我们。我们这样求，是为了不从舍己的十字架离开，也不想要别的，只想谦卑地和主一同分担祂的痛苦和忧伤！"
            },
            {
              "en": "“The horns of the altar” are inviting you. Will you come? Are you willing to continually live a life of total <span class=\"vocab-trigger\" data-vocab=\"surrender\">surrender<\/span>, giving yourself completely to the Lord? <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "“坛角”正在邀请你。你愿来吗？你是否愿意不断过着完全降服的生活，将自己彻底献给主？ 选自",
              "simpEn": "'The horns of the altar' are calling you. Will you come? Are you willing to keep living a life of giving up everything, handing yourself completely to the Lord? selected",
              "simpZh": "“祭坛的角”在邀请你。你愿意来吗？你愿意一直过一种完全降服的生活，把自己完全交给主吗？选自"
            },
            {
              "en": "I once heard a story of a man who attended a <span class=\"vocab-trigger\" data-vocab=\"tent revival\">tent revival<\/span> meeting and tried to give himself to God. Every night at the altar, he would <span class=\"vocab-trigger\" data-vocab=\"dedicate\">dedicate<\/span> himself to the Lord. Yet as he left each evening, the Devil would come to him and convince him that since he did not feel changed, he was not truly <span class=\"vocab-trigger\" data-vocab=\"redeemed\">redeemed<\/span>. Again and again he was defeated by the <span class=\"vocab-trigger\" data-vocab=\"Adversary\">Adversary<\/span>. Finally one evening he came to the meeting carrying an ax and a large wooden <span class=\"vocab-trigger\" data-vocab=\"stake\">stake<\/span>. After dedicating himself once more, he drove the stake into the ground where he had knelt to pray. As he was leaving the tent, the Devil came to him as usual, trying to make him believe that his <span class=\"vocab-trigger\" data-vocab=\"commitment\">commitment<\/span> to God was not genuine. He quickly returned to the stake, pointed to it, and said, “Devil, do you see this stake? This is my <span class=\"vocab-trigger\" data-vocab=\"witness\">witness<\/span> that God has forever accepted me.”",
              "zh": "我曾听过一个故事，有个参加帐篷布道会的人，试图将自己献给神。每晚在坛前，他都将自己奉献给主。但每当他晚间离开时，魔鬼就来让他相信自己并没有感觉改变，因此并非真正得救。他一次又一次被那仇敌击败。终于，有一晚他带着斧子和一根大木桩来参加聚会。再次奉献自己之后，他把木桩钉进他所跪祷之处的地里。当他正要离开帐篷，魔鬼照常来，想让他相信他的委身并不真实。他立刻回到木桩旁，指着它说：“魔鬼，你看见这木桩吗？这是我向神的见证，证明神已经永远接纳了我。”",
              "simpEn": "I once heard a story about a man who went to a tent meeting to try to give himself to God. Every night at the altar, he would give himself to the Lord. But as he left each evening, the Devil would come and make him believe that because he didn't feel different, he was not really saved. Over and over he was beaten by the Enemy. Finally one evening he came to the meeting carrying an ax and a big wooden stake. After giving himself to God once more, he hammered the stake into the ground where he had knelt to pray. As he was leaving the tent, the Devil came as usual, trying to make him think his giving was not real. He quickly went back to the stake, pointed to it, and said, 'Devil, do you see this stake? This is my proof that God has accepted me forever.'",
              "simpZh": "我听过一个故事，有一个人参加帐篷布道会，想把生命献给神。每天晚上在祭坛前，他都把自己奉献给主。可是每当他晚上离开，魔鬼就来让他相信，因为他没有感觉改变，他并不是真的得救。他一次又一次被那仇敌打败。最后，一天晚上，他带着一把斧子和一根大木桩来聚会。再次奉献自己之后，他把木桩钉在他跪着祷告的地方。当他要离开帐篷时，魔鬼像平常一样来了，想让他相信他的委身不真实。他马上回到木桩那里，指着它说：“魔鬼，你看见这根木桩吗？这是我向神的见证，证明神已经永远接纳我了。”"
            },
            {
              "en": "Immediately the Devil left him, and he never experienced doubts again. <span class=\"vocab-trigger\" data-vocab=\"from The Still Small Voice\">from The Still Small Voice<\/span>",
              "zh": "魔鬼立刻离开了他，他从此再未经历过疑惑。 摘自《微小的声音》",
              "simpEn": "Right away the Devil left him, and he never had doubts again. from The Still Small Voice",
              "simpZh": "魔鬼马上离开了他，他再也没有怀疑过。摘自《微小的声音》"
            },
            {
              "en": "Beloved, if you are tempted to doubt the <span class=\"vocab-trigger\" data-vocab=\"finality\">finality<\/span> of your salvation experience, drive a stake into the ground and then let it be your witness before God, and even the Devil, that you have settled the question forever.",
              "zh": "亲爱的，如果你受试探怀疑自己得救经历的确定终局，就钉一根木桩在地里，让它在你面前，也在神甚至魔鬼面前作你的见证，说明你已永远解决了这个问题。",
              "simpEn": "Dear friend, if you are tempted to doubt that your salvation is final and settled, drive a stake into the ground. Then let it be your proof before God, and even before the Devil, that you have settled the matter forever.",
              "simpZh": "亲爱的，如果你受到试探，怀疑自己得救是不是最终确定的，就去钉一根木桩在地上。让它在你面前、在神面前、甚至在魔鬼面前，成为你的见证，证明你已经永远解决了这个问题。"
            },
            {
              "en": "Are you <span class=\"vocab-trigger\" data-vocab=\"groping\">groping<\/span> for a blessing, Never getting there? Listen to a word of wisdom, Get somewhere. Are you struggling for salvation By your anxious prayer? Stop your struggling, simply trust, and— Get somewhere. Does the answer seem to <span class=\"vocab-trigger\" data-vocab=\"linger\">linger<\/span> To your earnest prayer? Turn your praying into praise, and— Get somewhere. You will never know His <span class=\"vocab-trigger\" data-vocab=\"fullness\">fullness<\/span> Till you <span class=\"vocab-trigger\" data-vocab=\"boldly dare\">boldly dare<\/span> To <span class=\"vocab-trigger\" data-vocab=\"commit your all\">commit your all<\/span> to Him, and— Get somewhere. <span class=\"vocab-trigger\" data-vocab=\"Songs of the Spirit\">Songs of the Spirit<\/span>",
              "zh": "你是否在摸索寻求祝福，却总达不到？请听一句智慧话：要得着某个地步。你是否藉着焦急祷告，挣扎寻求救恩？停止挣扎，单纯信靠，就要——得着地步。是否对你恳切祷告的回应，似乎迟延耽延？将你的祈求转为赞美，就要——得着地步。你永不能认识祂的丰满，直到你大胆敢将一切完全交托给祂，就要——得着地步。 《心灵之歌》",
              "simpEn": "Are you feeling around for a blessing and never getting it? Listen to a wise word: Get somewhere. Are you fighting for salvation through your worried prayer? Stop fighting, just trust, and—get somewhere. Does the answer seem slow in coming to your sincere prayer? Turn your asking into praise, and—get somewhere. You will never know all that He has until you courageously dare to give everything to Him, and—get somewhere. Songs of the Spirit",
              "simpZh": "你是不是在摸索着想得祝福，却总是得不到？听一句智慧话：要到达某个地方。你是不是用焦虑的祷告在挣扎着想得救恩？停止挣扎，单单信靠，然后——到达某个地方。是不是对你真心祈求的回答迟迟不来？把你的祈求变成赞美，然后——到达某个地方。你永远不会知道祂的全部丰盛，直到你勇敢地敢把一切交托给祂，然后——到达某个地方。《心灵之歌》"
            }
          ],

    {
      "id": 29,
      "title": "July 15–21",
      "sections": [
        {
          "sectionId": 1,
          "heading": "July 15",
          "audio": "audio/streams in the desert - July 15.m4a",
          "paragraphs": [
            {
              "en": "This is the <span class=\"vocab-trigger\" data-vocab=\"victory\">victory<\/span> that has <span class=\"vocab-trigger\" data-vocab=\"overcome\">overcome<\/span> the world, even our faith. (1 John 5:4)",
              "zh": "使我们胜了世界的，就是我们的信心。（约翰一书5:4）",
              "simpEn": "This is what wins the battle against the world—our faith.",
              "simpZh": "这就是战胜世界的东西——我们的信心。"
            },
            {
              "en": "It is easy to love Him when the blue is in the sky, When the summer winds are blowing, and we smell the roses <span class=\"vocab-trigger\" data-vocab=\"nigh\">nigh<\/span>; There is little effort needed to obey His precious will When it leads through <span class=\"vocab-trigger\" data-vocab=\"flower-decked valley\">flower-decked valley<\/span>, or over <span class=\"vocab-trigger\" data-vocab=\"sun-kissed hill\">sun-kissed hill<\/span>. It is when the rain is falling, or the <span class=\"vocab-trigger\" data-vocab=\"mist\">mist<\/span> hangs in the air, When the road is dark and <span class=\"vocab-trigger\" data-vocab=\"rugged\">rugged<\/span>, and the wind no longer fair, When the <span class=\"vocab-trigger\" data-vocab=\"rosy dawn\">rosy dawn<\/span> has settled in a <span class=\"vocab-trigger\" data-vocab=\"shadowland\">shadowland<\/span> of gray, That we find it hard to trust Him, and are slower to obey. It is easy to trust Him when the singing birds have come, And their songs of praise are echoed in our heart and in our home; But it’s when we miss the music, and the days are <span class=\"vocab-trigger\" data-vocab=\"dull and drear\">dull and drear<\/span>, That we need a faith <span class=\"vocab-trigger\" data-vocab=\"triumphant\">triumphant<\/span> over every doubt and fear. And our blessed Lord will give it; what we lack He will supply; Let us ask in faith believing—on His promises <span class=\"vocab-trigger\" data-vocab=\"rely\">rely<\/span>; He will ever be our Leader, whether smooth or rough the way, And will prove Himself <span class=\"vocab-trigger\" data-vocab=\"sufficient\">sufficient<\/span> for the needs of every day.",
              "zh": "当天空蔚蓝，夏日轻风拂面，玫瑰近在身旁飘香，那时爱祂何等容易；当祂的旨意引领我们经过花团锦簇的山谷，或阳光亲吻的山冈，顺服就无需费力。但是当雨水倾落，空中弥漫浓雾，道路黑暗崎岖，风向也不再和畅，当玫瑰色的晨曦沉入灰暗的影地，我们便感到信靠祂何等艰难，顺服也变得迟延。当歌鸟归来，赞美之歌在心中和家中回响，那时信靠祂何其容易；但是当我们失去乐声，日子沉闷阴郁，我们就需要一种胜过一切疑虑恐惧的得胜信心。我们可称颂的主必将这信心赐下；我们所缺乏的，祂必供应；让我们凭信心祈求——依靠祂的应许；无论道路平坦或崎岖，祂永作我们的领路者，并显明自己足以应付每日所需。",
              "simpEn": "It is easy to love God when the sky is blue, the summer wind blows, and we smell roses nearby. It takes little effort to obey His will when the path goes through valleys full of flowers or over sunny hills. But when rain falls, mist fills the air, the road is dark and rough, and the wind turns unfriendly, when the bright dawn turns into a gray land of shadows, then we find it hard to trust Him and slower to obey. It is easy to trust Him when the singing birds come and their praise songs echo in our heart and home. But when we miss the music and the days are gray and boring, we need a faith that wins over every doubt and fear. Our good Lord will give it; what we lack He will provide. Let us ask in faith—depend on His promises. He will always be our guide, whether the way is smooth or rough, and will show He is enough for each day's needs.",
              "simpZh": "天空蓝蓝的，夏天的风吹着，能闻到近处的玫瑰花香时，爱神很容易。当祂的带领穿过开满花的山谷，或是阳光洒满的山丘时，顺服一点都不难。但是下雨了，雾飘在空气中，路又黑又难走，风向也不好了，当美丽的晨曦变成了灰蒙蒙的阴影之地时，我们就觉得很难信靠祂，顺服也慢了。当唱歌的小鸟回来了，赞美声在心里和家里回响时，信靠祂很容易。但当我们听不到音乐，日子变得沉闷无聊时，就需要一种能够胜过一切怀疑和害怕的信心。我们那位好主会把这种信心赐给我们的；我们不够的，祂会补足。让我们用信心来求——依靠祂的应许。不管路是平坦还是难走，祂永远作我们的领路人，也会显明祂足够应付每一天的需要。"
            },
            {
              "en": "Trusting even when it appears you have been <span class=\"vocab-trigger\" data-vocab=\"forsaken\">forsaken<\/span>; praying when it seems your words are simply entering a <span class=\"vocab-trigger\" data-vocab=\"vast expanse\">vast expanse<\/span> where no one hears and no voice answers; believing that God’s love is complete and that He is <span class=\"vocab-trigger\" data-vocab=\"aware\">aware<\/span> of your circumstances, even when your world seems to <span class=\"vocab-trigger\" data-vocab=\"grind on\">grind on<\/span> as if setting its own direction and not caring for life or moving one inch in response to your <span class=\"vocab-trigger\" data-vocab=\"petitions\">petitions<\/span>; desiring only what God’s hands have planned for you; waiting patiently while seemingly <span class=\"vocab-trigger\" data-vocab=\"starving to death\">starving to death<\/span>, with your only fear being that your faith might fail—“this is the victory that has overcome the world”; this is <span class=\"vocab-trigger\" data-vocab=\"genuine faith\">genuine faith<\/span> indeed. <span class=\"vocab-trigger\" data-vocab=\"George MacDonald\">George MacDonald<\/span>",
              "zh": "即使看似被丢弃，依然信靠；即使祷告的话好像只落入浩瀚虚空，无人听见也无回应，依然祈祷；相信神的爱完全，祂知道你的处境，即使你的世界仿佛在按自己的轨道转动，对生命漠不关心，对你呼求无动于衷；只渴望神的手所安排的一切；在近乎饿死之时仍耐性等候，唯一担心的是自己的信心可能会垮——“这就是胜过世界的胜利”；这才是真正的信心。 乔治·麦克唐纳",
              "simpEn": "Trusting even when it looks like you have been left alone; praying when it feels like your words just go into a huge empty space where no one hears or answers; believing that God's love is whole and that He knows your situation, even when everything around you seems to keep moving without caring or answering your requests; wanting only what God's hands have planned for you; waiting patiently while feeling like you are dying of hunger, with your only worry being that your faith might give out—this is the victory that beats the world; this is real faith. George MacDonald",
              "simpZh": "就算看起来被丢下了，还要信靠；就算觉得祷告的话只是掉进一个大空洞里，没有人听见也没有人回答，还要祷告；相信神的爱是完全的，祂知道你的情况，就算周围的世界好像只管自己运转，毫不关心生命，对你的恳求一点反应都没有；只想要神的手为你安排的东西；在好像快要饿死的时候耐心等候，唯一怕的就是自己的信心可能会倒下——“这就是胜过世界的胜利”；这才是真信心。乔治·麦克唐纳"
            }
          ],

        {
          "sectionId": 2,
          "heading": "July 16",
          "audio": "audio/streams in the desert - July 16.m4a",
          "paragraphs": [
            {
              "en": "Because you have done this and have not <span class=\"vocab-trigger\" data-vocab=\"withheld\">withheld<\/span> your son, your only son, I will . . . make your <span class=\"vocab-trigger\" data-vocab=\"descendants\">descendants<\/span> as <span class=\"vocab-trigger\" data-vocab=\"numerous\">numerous<\/span> as the stars in the sky . . . because you have obeyed me. (Genesis 22:16–18)",
              "zh": "你既行了这事，不留下你的儿子，就是你独生的儿子，我便……叫你的子孙多起来，如同天上的星……因为你听从了我的话。（创世记22:16–18）",
              "simpEn": "Because you have done this and did not keep back your son, your only son, I will make your family as many as the stars in the sky, because you obeyed me.",
              "simpZh": "因为你做了这件事，没有把你的儿子、你独一的儿子留下，我要让你的后代多得像天上的星星，因为你听从了我。"
            },
            {
              "en": "From the time of Abraham, people have been learning that when they obey God’s voice and <span class=\"vocab-trigger\" data-vocab=\"surrender\">surrender<\/span> to Him whatever they hold most <span class=\"vocab-trigger\" data-vocab=\"precious\">precious<\/span>, He <span class=\"vocab-trigger\" data-vocab=\"multiplies\">multiplies<\/span> it thousands of times. Abraham gave up his one and only son at the Lord’s command, and in doing so, all his desires and dreams for Isaac’s life, as well as his own hope for a <span class=\"vocab-trigger\" data-vocab=\"notable heritage\">notable heritage<\/span>, disappeared. Yet God <span class=\"vocab-trigger\" data-vocab=\"restored\">restored<\/span> Isaac to his father, and Abraham’s family became “as numerous as the stars in the sky and as the <span class=\"vocab-trigger\" data-vocab=\"sand on the seashore\">sand on the seashore<\/span>” (v. 17). And through his descendants, “when the <span class=\"vocab-trigger\" data-vocab=\"time had fully come\">time had fully come<\/span>, God sent his Son” (Gal. 4:4).",
              "zh": "从亚伯拉罕的日子起，人们就认识到，一旦遵从神的声音，将最珍爱的一切交托给祂，祂就使之加增千万倍。亚伯拉罕遵从主命，献上了独一的儿子；当他如此行时，他对以撒一生所有的渴望与梦想，以及他自己对显赫后嗣的盼望，全都消失了。然而神将使以撒归回他父亲，亚伯拉罕的家族成了“如同天上的星，海边的沙”（17节）。并藉着这些后裔，“及至时候满足，神就差遣祂的儿子”（加拉太书4:4）。",
              "simpEn": "Ever since Abraham's time, people have been learning that when they obey God and give up to Him whatever they love most, He gives it back many thousands of times greater. Abraham gave up his only son at God's order, and when he did, all his hopes and dreams for Isaac, and his own hope of a famous line of descendants, vanished. Yet God gave Isaac back to him, and Abraham's family became as many as the stars in the sky and the sand on the beach. And through his descendants, when the right time came, God sent His Son.",
              "simpZh": "从亚伯拉罕的时候起，人们就学到：当他们听从神的声音，把最舍不得的东西交给祂，神就会让它翻成千上万倍。亚伯拉罕照着神的命令献出了独生儿子，那一刻，他对以撒的所有愿望和梦想，还有自己想有个了不起后代的盼望，全都没了。可是神把以撒还给了亚伯拉罕，他的家族后来多得像天上的星星和海边的沙子。并且借着这些后代，到了合适的时间，神差派了自己的儿子。"
            },
            {
              "en": "This is exactly how God deals with every child of His when we truly <span class=\"vocab-trigger\" data-vocab=\"sacrifice\">sacrifice<\/span>. We surrender everything we own and accept <span class=\"vocab-trigger\" data-vocab=\"poverty\">poverty<\/span>—then He sends wealth. We leave a growing area of ministry at His command—then He provides one better than we had ever dreamed. We surrender all our <span class=\"vocab-trigger\" data-vocab=\"cherished hopes\">cherished hopes<\/span> and <span class=\"vocab-trigger\" data-vocab=\"die to self\">die to self<\/span>—then He sends <span class=\"vocab-trigger\" data-vocab=\"overflowing joy\">overflowing joy<\/span> and His “life . . . that [we] might have it <span class=\"vocab-trigger\" data-vocab=\"more abundantly\">more abundantly<\/span>” (John 10:10 KJV).",
              "zh": "这正是神对待祂每一个儿女的方式，当我们真正牺牲时：我们交出一切财产，接受贫穷——祂就赐下财富；我们遵从命令离开正在成长的服侍工场——祂就赐下远超梦想的更美之地；我们交出所有珍爱的盼望，向己死——祂就赐下满溢的喜乐，以及祂那“叫人得生命，并且得的更丰盛”（约翰福音10:10）的生命。",
              "simpEn": "This is how God treats each of His children when we truly give up something precious. We give away everything we have and accept being poor—then He gives us wealth. We leave a growing ministry because He says so—then He gives us a better one than we ever imagined. We give up all our dear hopes and let our selfish desires die—then He sends joy that overflows and His life so that we can have it in the fullest way.",
              "simpZh": "当我们真正舍己时，神就是这样对待我们每一个儿女的。我们把所有的东西都交出去，接受贫穷——祂就赐给我们财富。我们照着祂的吩咐离开一个正在成长的服侍禾场——祂就给我们一个比梦想中更好的。我们交出所有心爱的盼望，让老旧的生命死掉——祂就赐下满出来的喜乐，还有祂那让人活得更丰盛的生命。"
            },
            {
              "en": "The greatest gift of all was Jesus Christ Himself, and we can never fully <span class=\"vocab-trigger\" data-vocab=\"comprehend\">comprehend<\/span> the <span class=\"vocab-trigger\" data-vocab=\"enormity\">enormity<\/span> of His sacrifice. Abraham, as the <span class=\"vocab-trigger\" data-vocab=\"earthly father\">earthly father<\/span> of the family of Christ, had to begin by surrendering himself and his only son, just as our heavenly Father sacrificed His only Son, Jesus. We could never have come to enjoy the <span class=\"vocab-trigger\" data-vocab=\"privileges\">privileges<\/span> and joys as members of God’s family through any other way. <span class=\"vocab-trigger\" data-vocab=\"Charles Gallaudet Trumbull\">Charles Gallaudet Trumbull<\/span>",
              "zh": "最伟大的礼物乃是耶稣基督自己，我们永远无法完全领会祂牺牲之浩大。亚伯拉罕，作为基督家族的属世之父，必须始于将自己与独子献上，正如我们的天父舍弃了独生子耶稣。我们绝不可能藉其他途径享受成为神家成员的殊荣和喜乐。 查尔斯·加劳德·特朗布尔",
              "simpEn": "The greatest gift of all was Jesus Christ Himself, and we can never fully understand how huge His sacrifice was. Abraham, as the human father of the family that would lead to Christ, had to start by giving up himself and his only son, just as our heavenly Father gave up His only Son, Jesus. We could never have enjoyed the special blessings and joys of being part of God's family any other way. Charles Gallaudet Trumbull",
              "simpZh": "所有礼物中最大的就是耶稣基督自己，我们永远无法完全理解祂的牺牲有多伟大。亚伯拉罕作为基督家族的地上祖先，必须先把自己和独生子献上，就像天父舍弃了祂的独生子耶稣一样。我们绝不可能通过别的办法来享受成为神家人的特别权利和快乐。查尔斯·加劳德·特朗布尔"
            },
            {
              "en": "We sometimes seem to forget that what God takes from us, He takes with fire, and that the only road to a life of <span class=\"vocab-trigger\" data-vocab=\"resurrection\">resurrection<\/span> and <span class=\"vocab-trigger\" data-vocab=\"ascension\">ascension<\/span> power leads us first to <span class=\"vocab-trigger\" data-vocab=\"Gethsemane\">Gethsemane<\/span>, the cross, and the <span class=\"vocab-trigger\" data-vocab=\"tomb\">tomb<\/span>. Dear soul, do you believe that Abraham’s experience was <span class=\"vocab-trigger\" data-vocab=\"unique\">unique<\/span> and <span class=\"vocab-trigger\" data-vocab=\"isolated\">isolated<\/span>? It is only an example and a <span class=\"vocab-trigger\" data-vocab=\"pattern\">pattern<\/span> of how God deals with those who are prepared to obey Him whatever the cost. “After waiting patiently, Abraham received what was promised” (Heb. 6:15), and so will you. The moment of your greatest sacrifice will also be the <span class=\"vocab-trigger\" data-vocab=\"precise\">precise<\/span> moment of your greatest and most <span class=\"vocab-trigger\" data-vocab=\"miraculous\">miraculous<\/span> blessing. God’s river, which never runs dry, will <span class=\"vocab-trigger\" data-vocab=\"overflow its banks\">overflow its banks<\/span>, bringing you a flood of wealth and grace. Indeed, there is nothing God will not do for those who will dare to step out in faith onto what appears to be only a <span class=\"vocab-trigger\" data-vocab=\"mist\">mist<\/span>. As they take their first step, they will find a rock beneath their feet. <span class=\"vocab-trigger\" data-vocab=\"F. B. Meyer\">F. B. Meyer<\/span>",
              "zh": "我们有时似乎忘了，神从我们这里取走的东西，是藉着火取走的；通往复活和升天大能的唯一道路，必须首先经过客西马尼、十字架和坟墓。亲爱的灵魂，你难道以为亚伯拉罕的经历是独特而孤立的吗？这不过是神对待那些无论代价如何都预备好顺服祂之人的一个例子和模式。“亚伯拉罕既恒久忍耐，就得了所应许的”（希伯来书6:15），你也会如此。你最大牺牲的一刻，也将是你最大最奇妙祝福的精确时刻。神那永不断流的江河，将要漫过堤岸，为你带来财富与恩典的洪流。的确，对于那些敢于凭信心踏入看似只有雾气之处的人，神没有不肯为他们成就的事。当他们迈出第一步时，就会发现脚下有磐石。 迈尔",
              "simpEn": "We sometimes forget that what God takes from us, He takes through fire. The only road to resurrection life and rising power leads first through Gethsemane, the cross, and the grave. Dear soul, do you think Abraham's experience was something that only happened to him, just once? It is only a picture of how God works with anyone ready to obey Him at any cost. 'After waiting patiently, Abraham received what was promised,' and so will you. The moment of your greatest giving up will also be the exact moment of your greatest and most amazing blessing. God's river that never dries up will spill over its edges, bringing you a flood of riches and kindness. Truly, there is nothing God will not do for those who dare to step out in faith onto what looks like only a fog. As they take the first step, they will find a solid rock under their feet. F. B. Meyer",
              "simpZh": "我们有时忘记，神拿走的东西，是借着火拿走的。通往复活生命和升天能力的唯一道路，必须先经过客西马尼园、十字架和坟墓。亲爱的灵魂，你以为亚伯拉罕的经历只是他独有的、跟别人没关系吗？这不过是一个例子，说明神怎样对待那些愿意不计代价顺服祂的人。“亚伯拉罕耐心等候，就得到了所应许的”，你也会这样。你做出最大牺牲的那一刻，也正是你得到最大最奇妙祝福的那一刻。神那条从不断流的河，会漫过堤岸，给你带来财富和恩典的大水。真的，对于那些敢凭信心踏进看起来只是一团雾气里的人，神没有不肯做的事。他们一迈出第一步，就会在脚底下找到一块磐石。迈尔"
            }
          ],
          "quiz": [
            {
              "text": "Abraham withheld his son and refused to obey God.",
              "answer": false
            },
            {
              "text": "Charles Gallaudet Trumbull wrote that Abraham is the earthly father of the family of Christ.",
              "answer": true

            {
              "text": "F. B. Meyer said that stepping out in faith means you will never find solid rock beneath your feet.",
              "answer": false
            },
            {
              "text": "According to the reading, God's river that never runs dry brings a flood of wealth and grace.",
              "answer": true
            }
          ]
        },
        {
          "sectionId": 3,
          "heading": "July 17",
          "audio": "audio/streams in the desert - July 17.m4a",
          "paragraphs": [
            {
              "en": "I will remain <span class=\"vocab-trigger\" data-vocab=\"quiet\">quiet<\/span> and will look on from my <span class=\"vocab-trigger\" data-vocab=\"dwelling place\">dwelling place<\/span>. (Isaiah 18:4)",
              "zh": "我要安静，在我的居所观看。（以赛亚书18:4）",
              "simpEn": "I will stay still and watch from my home.",
              "simpZh": "我会安静地待在我的住处观看。"
            },
            {
              "en": "In this passage, <span class=\"vocab-trigger\" data-vocab=\"Assyria\">Assyria<\/span> is marching against <span class=\"vocab-trigger\" data-vocab=\"Ethiopia\">Ethiopia<\/span>, whose people are described as “<span class=\"vocab-trigger\" data-vocab=\"tall and smooth-skinned\">tall and smooth-skinned<\/span>” (v. 2). As the army advances, God makes no effort to stop them, and it appears as though they will be allowed to do as they wish. The Lord is watching from His “dwelling place” while the sun continues to shine on them, yet “<span class=\"vocab-trigger\" data-vocab=\"before the harvest\">before the harvest<\/span>” (v. 5) the entire proud army is defeated as easily as new growth is <span class=\"vocab-trigger\" data-vocab=\"pruned\">pruned<\/span> from a vine.",
              "zh": "在这段经文里，亚述正进击古实，古实人被称为“高大光滑”（2节）。大军前进时，神丝毫不动，似乎任凭他们为所欲为。主从“祂的居所”观看，日头仍照耀他们；然而“正在收割之前”（5节），整支骄矜的军队就被剪除，如同将葡萄树的新枝修剪掉一样容易。",
              "simpEn": "In this part of the Bible, Assyria is marching against Ethiopia. The people there are described as tall and smooth-skinned. As the enemy army moves forward, God does nothing to stop them. It looks like He will let them do whatever they want. The Lord is watching from His home while the sun keeps shining on them. But just before the harvest time, the whole proud army is beaten as easily as cutting new growth off a vine.",
              "simpZh": "在圣经这一段里，亚述军队正在进攻古实，那里的人被形容为又高又皮肤光滑。敌军前进的时候，神什么也没做，看起来好像祂会任凭他们。主在祂的住处观看着，太阳继续照在他们身上。但在收割之前，整支骄傲的军队就被打败了，就像从葡萄树上剪掉嫩枝一样容易。"
            },
            {
              "en": "Isn’t this a beautiful picture of God—remaining quiet and watching? Yet His silence is not to be confused with <span class=\"vocab-trigger\" data-vocab=\"passive agreement\">passive agreement<\/span> or <span class=\"vocab-trigger\" data-vocab=\"consent\">consent<\/span>. He is simply <span class=\"vocab-trigger\" data-vocab=\"biding His time\">biding His time<\/span> and will arise at the most <span class=\"vocab-trigger\" data-vocab=\"opportune moment\">opportune moment<\/span>, just when the plans of the wicked are on the <span class=\"vocab-trigger\" data-vocab=\"verge of success\">verge of success<\/span>, in order to <span class=\"vocab-trigger\" data-vocab=\"overwhelm\">overwhelm<\/span> the enemy with <span class=\"vocab-trigger\" data-vocab=\"disaster\">disaster<\/span>. And as we see the <span class=\"vocab-trigger\" data-vocab=\"evil\">evil<\/span> of this world, as we watch the apparent success of <span class=\"vocab-trigger\" data-vocab=\"wrongdoers\">wrongdoers<\/span>, and as we suffer the <span class=\"vocab-trigger\" data-vocab=\"oppression\">oppression<\/span> of those who hate us, let us remember those <span class=\"vocab-trigger\" data-vocab=\"miraculous\">miraculous<\/span> words of God—“I will remain quiet and will look on.”",
              "zh": "这是否一幅描绘神的美妙图画——祂安静观看？然而祂的沉默不可被误认为被动赞同或默许。祂只是在等待时机，要在最合适的时刻兴起，就在恶人计谋即将成功之际，好以灾难倾覆仇敌。当我们看见这世界的罪恶，目睹作恶者表面亨通，又因恨我们之人受苦时，让我们记念神那句奇妙的话——“我要安静，在我的居所观看”。",
              "simpEn": "Isn't this a lovely picture of God—staying quiet and watching? But His quietness should not be confused with silent agreement or saying yes. He is simply waiting for the right time. He will rise up at the perfect moment, just when the plans of the wicked are about to succeed, in order to crush the enemy with ruin. And as we see the bad things in this world, watch people who do wrong seem to succeed, and suffer under those who hate us, let us remember those amazing words of God: 'I will remain quiet and will look on.'",
              "simpZh": "这难道不是一幅神的美好画面吗——祂安静看着？但祂不出声，不要以为祂是暗中同意或许可。祂只是在等时候。祂会在最合适的时刻站起来，就在坏人快要成功的时候，用灾难把敌人彻底击垮。当我们看到世界上的罪恶，看到做坏事的人好像很顺利，还被恨我们的人欺负时，让我们记住神那句奇妙的话：“我要安静，在我的居所观看。”"
            },
            {
              "en": "Yes, God does have another <span class=\"vocab-trigger\" data-vocab=\"point of view\">point of view<\/span>, and there is wisdom behind His words. Why did Jesus watch His disciples <span class=\"vocab-trigger\" data-vocab=\"straining at the oars\">straining at the oars<\/span> through the <span class=\"vocab-trigger\" data-vocab=\"stormy night\">stormy night<\/span>? Why did He, though unseen by others, watch the sequence of <span class=\"vocab-trigger\" data-vocab=\"anguishing\">anguishing<\/span> events unfold in <span class=\"vocab-trigger\" data-vocab=\"Bethany\">Bethany<\/span> as <span class=\"vocab-trigger\" data-vocab=\"Lazarus\">Lazarus<\/span> slowly passed through the stages of his <span class=\"vocab-trigger\" data-vocab=\"terminal illness\">terminal illness<\/span>, <span class=\"vocab-trigger\" data-vocab=\"succumbed\">succumbed<\/span> to death, and was finally buried in a <span class=\"vocab-trigger\" data-vocab=\"rocky tomb\">rocky tomb<\/span>? Jesus was simply waiting for the perfect moment when He could <span class=\"vocab-trigger\" data-vocab=\"intercede\">intercede<\/span> most effectively. <span class=\"vocab-trigger\" data-vocab=\"from Daily Devotional Commentary\">from Daily Devotional Commentary<\/span>",
              "zh": "是的，神确有另一视角，祂的话语背后藏着智慧。为何耶稣在暴风雨之夜旁观门徒辛苦摇橹？为何祂虽无人看见，却观看伯大尼那一系列痛苦事件的展开——拉撒路缓慢经历绝症的各阶段，最终死去，安葬在石墓中？耶稣只是在等候最完美的时刻，好在最有效的时机施行干预。 摘自《每日灵修注释》",
              "simpEn": "Yes, God does see things from a different angle, and there is wisdom behind what He says. Why did Jesus watch His disciples struggling hard with the oars through the stormy night? Why did He, though hidden from others, watch the painful events happen in Bethany as Lazarus slowly went through his deadly sickness, gave in to death, and was buried in a stone tomb? Jesus was just waiting for the best moment to step in and help in the most powerful way. from Daily Devotional Commentary",
              "simpZh": "是的，神的确有不一样的看法，祂的话里藏着智慧。为什么耶稣要在暴风雨的夜里看着门徒拼命摇桨？为什么祂虽然别人看不见，却看着伯大尼发生一连串痛苦的事——拉撒路慢慢经历绝症直到死亡，最后被安放在石头坟墓里？耶稣只是在等那个最完美的时刻，好以最有能力的方式介入。摘自《每日灵修注释》"
            },
            {
              "en": "Is the Lord being quiet with you? Nevertheless, He is <span class=\"vocab-trigger\" data-vocab=\"attentive\">attentive<\/span> and still sees everything. He has His finger on your <span class=\"vocab-trigger\" data-vocab=\"pulse\">pulse<\/span> and is extremely <span class=\"vocab-trigger\" data-vocab=\"sensitive\">sensitive<\/span> to even the slightest change. And He will come to save you when the perfect moment has arrived. Whatever the Lord may ask of us or however slow He may seem to work, we can be absolutely sure He is never a confused or <span class=\"vocab-trigger\" data-vocab=\"fearful\">fearful<\/span> Savior. O troubled soul, beneath the <span class=\"vocab-trigger\" data-vocab=\"rod\">rod<\/span>, Your Father speaks, be still, be still; Learn to be silent unto God, And let Him <span class=\"vocab-trigger\" data-vocab=\"mold\">mold<\/span> you to His will. O praying soul, be still, be still, He cannot break His promised Word; Sink down into His blessed will, And wait in patience on the Lord. O waiting soul, be still, be strong, And though He <span class=\"vocab-trigger\" data-vocab=\"tarry\">tarry<\/span>, trust and wait; Doubt not, He will not wait too long, Fear not, He will not come too late.",
              "zh": "主是否正对你沉默？即便如此，祂仍注目观看一切。祂的手指按在你的脉搏上，对最细微的变化极度敏锐。到了最完美的时刻，祂必来拯救你。无论主对我们有何要求，无论祂行事看似多缓慢，我们可以绝对肯定，祂绝不是一位困惑或惧怕的救主。哦，受苦的灵魂，杖下安静吧！你的父正说话，要静默，要静默；学会在神面前无声，让祂按己意塑造你。哦，祷告的灵魂，要安静，要安静；祂绝不会背乎所应许的话；沉入祂所赐福的旨意中，耐性等候耶和华。哦，等候的灵魂，要安静，要刚强；虽然祂迟延，仍要信靠等候；不要怀疑，祂不会耽延太久；不要惧怕，祂不会来得太晚。",
              "simpEn": "Is the Lord being quiet toward you? Even so, He is paying attention and still sees everything. He has His finger on your heartbeat and is very aware of even the smallest change. He will come to save you when the perfect time has come. Whatever the Lord may ask of us, and no matter how slow He seems to work, we can be completely sure He is never a confused or frightened Savior. O troubled soul, under the rod of correction, your Father is speaking; be still, be still. Learn to be silent before God, and let Him shape you to His will. O praying soul, be still, be still; He cannot break His promised word. Sink down into His good will, and wait patiently for the Lord. O waiting soul, be still, be strong, and even if He delays, trust and wait. Do not doubt; He will not wait too long. Do not be afraid; He will not come too late.",
              "simpZh": "主是不是对你安静不说话？即使这样，祂仍然在注意，仍然看见一切。祂的手指搭在你的脉搏上，对你哪怕最微小的变化都极其敏锐。到了最完美的时刻，祂会来救你。不管主要我们做什么，也不管祂看起来做事多慢，我们完全可以确定，祂绝不是一位糊涂或者害怕的救主。哦，在管教杖下的受苦灵魂，你的父在说话；要安静，要安静。学会在神面前不作声，让祂把你塑造成合祂心意的样子。哦，祷告的灵魂，要安静，要安静；祂绝不会违背自己应许的话。沉入祂美好的旨意里，耐心等候耶和华。哦，等候的灵魂，要安静，要刚强；即使祂迟迟未到，也要信靠等候。不要怀疑，祂不会等太久；不要害怕，祂不会来得太迟。"
            }
