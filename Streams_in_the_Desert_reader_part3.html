            {
              "en": "Where there is no <span class=\"vocab-trigger\" data-vocab=\"vision\">vision<\/span>, the people <span class=\"vocab-trigger\" data-vocab=\"perish\">perish<\/span>. (Proverbs 29:18 KJV)",
              "zh": "没有异象，民就放肆。（箴言29:18 英王钦定本）",
              "simpEn": "Where there is no vision, the people die.",
              "simpZh": "没有异象，百姓就灭亡。"
            },
            {
              "en": "Waiting upon God is <span class=\"vocab-trigger\" data-vocab=\"vital\">vital<\/span> in order to see Him and receive a vision from Him. And the amount of time spent before Him is also critical, for our hearts are like a photographer’s film—the longer exposed, the deeper the impression. For God’s vision to be impressed on our hearts, we must sit in stillness at His feet for quite a long time. Remember, the troubled surface of a lake will not reflect an image.",
              "zh": "等候神是至关重要的事，为要看见祂，从祂领受异象。而花在祂面前的时间量也是关键的，因为我们的心就像摄影师的底片——曝光越久，影像越深。要让神的异象印在我们的心上，我们就必须在祂脚前安静坐住相当长的时间。记住，湖面若动荡，就照不出影像。",
              "simpEn": "Waiting on God is very important in order to see Him and get a vision from Him. How much time we spend before Him also matters a lot, because our hearts are like camera film—the longer it is exposed, the deeper the picture. For God's vision to be stamped on our hearts, we must sit quietly at His feet for quite a while. Remember, a rough lake surface won't show a reflection.",
              "simpZh": "等候神非常要紧，这样才能看见祂、从祂得到异象。在祂面前待多长时间也很关键，因为我们的心就像照相底片——曝光越久，印记越深。要让神的异象印在我们心上，我们必须在祂脚前安静坐着很久。记住，湖面如果波动，就照不出倒影。"
            },
            {
              "en": "Yes, our lives must be quiet and peaceful if we expect to see God. And the vision we see from Him has the power to affect our lives in the same way a lovely sunset brings peace to a troubled heart. Seeing God always <span class=\"vocab-trigger\" data-vocab=\"transforms\">transforms<\/span> human life. <span class=\"vocab-trigger\" data-vocab=\"Jacob\">Jacob<\/span> “crossed the ford of the <span class=\"vocab-trigger\" data-vocab=\"Jabbok\">Jabbok<\/span>” (Gen. 32:22), saw God, and became <span class=\"vocab-trigger\" data-vocab=\"Israel\">Israel<\/span>. Seeing a vision of God transformed <span class=\"vocab-trigger\" data-vocab=\"Gideon\">Gideon<\/span> from a coward into a courageous soldier. And <span class=\"vocab-trigger\" data-vocab=\"Thomas\">Thomas<\/span>, after seeing Christ, was changed from a doubting follower into a loyal, devoted disciple.",
              "zh": "是的，我们若要期望看见神，生命就必须安静平稳。并且我们从祂所得的异象有能力影响我们的人生，如同一片美丽的日落使不安的心平静一样。看见神总能改变人的生命。雅各“过了雅博渡口”（创世记32:22），看见了神，就成了以色列。看见神的异象使基甸从懦夫变为勇敢的战士。而多马看见基督后，从疑惑的跟随者变成了忠贞热心的门徒。",
              "simpEn": "Yes, our lives must be quiet and calm if we want to see God. And the vision we get from Him has power to change our lives, just like a lovely sunset brings peace to a troubled heart. Seeing God always changes a person's life. Jacob crossed the Jabbok stream, saw God, and became Israel. A vision of God changed Gideon from a scared man into a brave soldier. And Thomas, after seeing Christ, was changed from a doubting follower into a faithful, loving disciple.",
              "simpZh": "是的，如果我们想看见神，我们的生活必须安静平稳。我们从祂得到的异象有能力改变我们的生命，就像美丽的日落使不安的心平静一样。看见神总能改变人的生命。雅各过了雅博渡口，看见神，就变成了以色列。看见神的异象把基甸从胆小鬼变成了勇敢的战士。多马看见基督以后，从怀疑的跟随者变成了忠诚、热心的门徒。"
            },
            {
              "en": "People since Bible times have also had visions of God. <span class=\"vocab-trigger\" data-vocab=\"William Carey\">William Carey<\/span>, English pioneer missionary of the eighteenth century who is considered by some to be the Father of Modern Missions, saw God and left his shoemaker’s bench to go to India. <span class=\"vocab-trigger\" data-vocab=\"David Livingstone\">David Livingstone<\/span> saw God and left everything in Britain behind to become a missionary and explorer, following the Lord’s leading through the thickest jungles of Africa during the nineteenth century. And literally thousands more have since had visions of God and today are serving Him in the uttermost parts of the earth, seeking the timely <span class=\"vocab-trigger\" data-vocab=\"evangelization\">evangelization<\/span> of the lost. <span class=\"vocab-trigger\" data-vocab=\"Dr. Pardington\">Dr. Pardington<\/span>",
              "zh": "圣经时代以后的人也看见了神的异象。威廉·克理，十八世纪英国先驱宣教士，有些人称他为现代宣教之父，他看见了神，就离开补鞋摊前往印度。大卫·李文斯敦看见了神，就撇下英国的一切，成为宣教士和探险家，在十九世纪跟随主的带领穿越非洲最浓密的丛林。此后，更有成千上万的人看见了神的异象，如今在地极服侍祂，寻求适时向失丧者传福音。 帕丁顿博士",
              "simpEn": "People after Bible times have also had visions of God. William Carey, an English pioneer missionary in the 1700s sometimes called the Father of Modern Missions, saw God and left his shoe repair shop to go to India. David Livingstone saw God and left everything in Britain to become a missionary and explorer, following God's lead through the thickest jungles of Africa in the 1800s. And thousands more have since seen visions of God and today serve Him in the farthest places of the earth, working to spread the good news to the lost. Dr. Pardington",
              "simpZh": "圣经时代以后的人也看见了神的异象。威廉·克理，十八世纪英国先驱宣教士，有人称他为现代宣教之父，他看见了神，就离开补鞋摊去了印度。大卫·李文斯敦看见了神，抛下英国的一切，成为宣教士和探险家，在十九世纪跟随神的带领穿越非洲最浓密的丛林。此外，还有成千上万的人看见了神的异象，如今在地极服事神，努力及时把福音传给失丧的人。帕丁顿博士"
            },
            {
              "en": "It is very unusual for there to be complete quiet in the soul, for God almost continually whispers to us. And whenever the sounds of the world <span class=\"vocab-trigger\" data-vocab=\"subside\">subside<\/span> in our soul, we hear the whispering of God. Yes, he continues to whisper to us, but we often do not hear Him because of the noise and distractions caused by the hurried pace of our life. <span class=\"vocab-trigger\" data-vocab=\"Frederick William Faber\">Frederick William Faber<\/span>",
              "zh": "灵魂里完全安静是非常罕见的，因为神几乎持续不断地向我们微语。每当世界的喧嚣在我们灵里退去时，我们就听见神的微语。是的，祂继续向我们微语，但我们常因生活匆忙的步调所带来的噪音和分心而听不见。 弗雷德里克·威廉·费伯",
              "simpEn": "It is very rare for the soul to be completely quiet, because God is almost always whispering to us. And whenever the noise of the world quiets down in our soul, we hear God's whisper. Yes, He keeps whispering, but we often miss it because of the noise and busyness of our fast-paced lives. Frederick William Faber",
              "simpZh": "灵魂完全安静是非常少见的，因为神几乎一直在对我们小声说话。每当世界的喧闹在我们里面静下来时，我们就听见神的微声。是的，祂一直在对我们微语，但我们常常因为生活快节奏带来的噪音和分心而听不见。弗雷德里克·威廉·费伯"
            },
            {
              "en": "Speak, Lord, in the stillness, While I wait on Thee; Hushing my heart to listen In <span class=\"vocab-trigger\" data-vocab=\"expectancy\">expectancy<\/span>. Speak, O blessed Master, In this quiet hour; Let me see Your face, Lord, Feel Your touch of power. For the words that You speak, “They are life,” indeed; Living bread from Heaven, Now my spirit feed! Speak, Your servant hears You! Be not silent, Lord; My soul on You does wait For Your life-giving word!",
              "zh": "主啊，在寂静中说话，当我等候祢时；使我心肃静，存着期盼来听。哦，可称颂的主，在这安静时刻说话；让我见祢的面，主啊，感受祢能力的触摸。因祢所说的话“就是生命”，诚然如是；从天上来的生命之粮，如今喂养我的灵！请说，祢仆人敬听！主啊，不要静默；我的灵魂等候祢，等候祢赐生命的话语！",
              "simpEn": "Speak, Lord, in the quietness, while I wait for You; quiet my heart to listen with hope. Speak, O blessed Master, in this still hour; let me see Your face, Lord, feel Your powerful touch. For the words You speak are truly life; living bread from heaven, feed my spirit now! Speak, Your servant is listening! Don't be silent, Lord; my soul waits for You, for Your life-giving word!",
              "simpZh": "主啊，在安静中说话，在我等候祢的时候；让我的心安静下来，带着期盼来听。哦，可称颂的主，在这安静的时刻说话；让我看见祢的脸，主啊，感受祢大能的触摸。因为祢说的话“就是生命”，真的；从天上来的生命粮，现在喂养我的灵！请说，祢的仆人听祢！主啊，不要不作声；我的灵魂等候祢，等候祢那赐生命的话语！"
            }
          ],

        {
          "sectionId": 4,
          "heading": "September 19",
          "audio": "audio/streams in the desert - September 19.m4a",
          "paragraphs": [
            {
              "en": "My Father is the <span class=\"vocab-trigger\" data-vocab=\"gardener\">gardener<\/span>. (John 15:1)",
              "zh": "我父是栽培的人。（约翰福音15:1）",
              "simpEn": "My Father is the gardener.",
              "simpZh": "我的父亲是园丁。"
            },
            {
              "en": "It is a comforting thought that trouble, in whatever form it comes to us, is a heavenly messenger that brings us something from God. Outwardly it may appear painful or even destructive, but inwardly its spiritual work produces blessings. Many of the richest blessings we have inherited are the fruit of sorrow or pain. We should never forget that <span class=\"vocab-trigger\" data-vocab=\"redemption\">redemption<\/span>, the world’s greatest blessing, is the fruit of the world’s greatest sorrow. And whenever a time of deep <span class=\"vocab-trigger\" data-vocab=\"pruning\">pruning<\/span> comes and the knife cuts deeply and the pain is severe, what an inexpressible comfort it is to know: “My Father is the gardener.”",
              "zh": "这是一个令人安慰的想法：患难，无论以何形式临到我们，都是天上的使者，从神给我们带来一些东西。表面上它可能显得痛苦甚至具有毁坏性，但内在的属灵工作却产生祝福。我们承受的许多最丰盛的祝福，是忧愁或痛苦的果子。我们永不可忘记，救赎——这世界最大的祝福——乃是世界最大忧伤的果子。每逢深度修剪之时临到，刀割得深、痛得厉害的时候，知道“我父是栽培的人”，是何等不可言喻的安慰。",
              "simpEn": "It is a comforting thought that trouble, in whatever shape it comes, is a messenger from heaven bringing us something from God. On the outside it may look painful or even harmful, but inside, its spiritual work brings blessings. Many of the richest gifts we have are the fruit of sadness or pain. We must never forget that redemption, the world's greatest blessing, is the fruit of the world's greatest sorrow. And whenever deep cutting comes and the knife cuts deep and it hurts badly, what a comfort beyond words to know: 'My Father is the gardener.'",
              "simpZh": "这是个让人得安慰的想法：患难，不管以什么形式临到，都是天上的使者，从神那里给我们带东西来。外面看起来可能很痛苦，甚至有破坏性，但里面所做的属灵工作却会带来祝福。我们得到的许多最丰富的祝福，都是忧伤或痛苦的果子。我们永远不要忘记，救赎——这世界最大的祝福——是从世界最大的忧伤结出来的果子。每当深度的修剪临到，刀子割得很深，疼痛剧烈的时候，知道“我父是园丁”，这是多么说不出的安慰。"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"John Vincent\">John Vincent<\/span>, a Methodist Episcopal bishop of the late-nineteenth and early-twentieth centuries and a leader of the Sunday school movement in America, once told of being in a large <span class=\"vocab-trigger\" data-vocab=\"greenhouse\">greenhouse<\/span> where clusters of <span class=\"vocab-trigger\" data-vocab=\"luscious\">luscious<\/span> grapes were hanging on each side. The owner of the greenhouse told him, “When the new gardener came here, he said he would not work with the vines unless he could cut them completely down to the <span class=\"vocab-trigger\" data-vocab=\"stalk\">stalk<\/span>. I allowed him to do so, and we had no grapes for two years, but this is now the result.”",
              "zh": "约翰·文森特，十九世纪末二十世纪初的美以美会主教、美国主日学运动的领袖，曾讲到他去到一个大温室里，两边挂着一串串多汁的葡萄。温室主人告诉他：“新园丁来的时候说，除非能把葡萄藤彻底剪到只剩主干，他就不愿管理这些藤。我允许他这样做，我们有两年没有葡萄，但现在这就是结果。”",
              "simpEn": "John Vincent, an American bishop and leader in Sunday school work long ago, once told of being in a big glass greenhouse where bunches of juicy grapes hung on both sides. The owner said, 'When the new gardener came, he said he wouldn't work with the vines unless he could cut them right down to the stem. I let him do it, and we had no grapes for two years, but this is now the result.'",
              "simpZh": "约翰·文森特是很久以前的美以美会主教、美国主日学运动领袖，他曾讲到进到一个大温室里，两边挂满了一串串多汁的葡萄。温室的主人告诉他：“新园丁来的时候说，除非能把这些葡萄藤彻底剪到只剩主干，他就不愿管理它们。我同意了，结果我们两年没有葡萄，但现在这就是结果。”"
            },
            {
              "en": "There is rich <span class=\"vocab-trigger\" data-vocab=\"symbolism\">symbolism<\/span> in this account of the pruning process when applied to the Christian life. Pruning seems to be destroying the vine, and the gardener appears to be cutting everything away. Yet he sees the future and knows that the final result will be the enrichment of the life of the vine, and a greater <span class=\"vocab-trigger\" data-vocab=\"abundance\">abundance<\/span> of fruit. There are many blessings we will never receive until we are ready to pay the price of pain, for the path of suffering is the only way to reach them. <span class=\"vocab-trigger\" data-vocab=\"J. R. Miller\">J. R. Miller<\/span>",
              "zh": "这个修剪过程的描述，当应用到基督徒生活时，含有丰富的象征意义。修剪看似在毁坏葡萄树，园丁似乎正在把一切剪掉。然而他看见将来，知道最终的结果会是葡萄树的生命更丰盛，并且结出更丰硕的果子。有许多的祝福，我们若不预备好付上疼痛的代价，就永不能领受，因为受苦之路是唯一能达到它们的路径。 密勒",
              "simpEn": "There is deep picture language in this story of cutting back when applied to the Christian life. Pruning looks like it's destroying the vine, and the gardener seems to be cutting everything off. But he sees what's coming and knows the end will be a richer life for the vine and more fruit. There are many blessings we will never get until we are ready to pay the price of pain, for the path of suffering is the only way to reach them. J. R. Miller",
              "simpZh": "这个修剪过程用到基督徒生活上，有很丰富的象征意义。修剪看起来是在毁坏葡萄树，园丁好像把一切都剪掉了。但他看到将来，知道最后会让葡萄树的生命更丰富，结出更多的果子。有很多祝福，除非我们愿意付出疼痛的代价，否则永远得不到，因为受苦的路是唯一能到达那里的路。密勒"
            },
            {
              "en": "I walked a mile with Pleasure, She <span class=\"vocab-trigger\" data-vocab=\"chattered\">chattered<\/span> all the way; But left me none the wiser For all she had to say. I walked a mile with Sorrow, And ne’er a word said she; But oh, the things I learned from her When Sorrow walked with me.",
              "zh": "我与快乐同行一里，她一路上喋喋不休；但她所说的一切，并没有使我变得更有智慧。我与忧愁同行一里，她一句话也没有说；但是哦，当忧愁与我同行时，我从她所学到的事何其多！",
              "simpEn": "I walked a mile with Pleasure; she talked all the way, but left me no wiser for everything she said. I walked a mile with Sorrow, and never a word she said; but oh, the things I learned from her when Sorrow walked with me.",
              "simpZh": "我和快乐走了一里路，她一路上说个不停；可她说的那些话，一点也没让我变得更有智慧。我和忧愁走了一里路，她一个字也没说；但是哦，当忧愁陪着我走的时候，我从她那里学到了多少东西！"
            }
          ],

        {
          "sectionId": 5,
          "heading": "September 20",
          "audio": "audio/streams in the desert - September 20.m4a",
          "paragraphs": [
            {
              "en": "Did I not tell you that if you believed, you would see the <span class=\"vocab-trigger\" data-vocab=\"glory\">glory<\/span> of God? (John 11:40)",
              "zh": "我岂不是对你说过，你若信，就必看见神的荣耀吗？（约翰福音11:40）",
              "simpEn": "Didn't I tell you that if you believed, you would see God's glory?",
              "simpZh": "我不是对你说过，如果你信，就一定会看见神的荣耀吗？"
            },
            {
              "en": "Mary and Martha could not understand what their Lord was doing. Each of them had said to Him, “Lord, if you had been here, my brother would not have died.” (vv. 21, 32). And behind their words we seem to read their true thoughts: “Lord, we do not understand why you waited so long to come or how you could allow the man you love so much to die. We do not understand how you could allow such sorrow and suffering to <span class=\"vocab-trigger\" data-vocab=\"devastate\">devastate<\/span> our lives, when your presence might have stopped it all. Why didn’t you come? Now it’s too late, because <span class=\"vocab-trigger\" data-vocab=\"Lazarus\">Lazarus<\/span> has been dead four days!” But Jesus simply had one great truth in answer to all of this. He said, in essence, “You may not understand, but I am telling you that if you believe, you will see.”",
              "zh": "马大和马利亚不明白主在做的事。她们二人都对祂说：“主啊，你若在这里，我兄弟必不死”（21、32节）。从她们的话背后，我们似乎读到她们真实的想法：“主啊，我们不明白你为什么等到这么迟才来，为什么你容许你所深爱的人死去。我们不明白你怎么能容让这样的忧伤和苦难摧残我们的生命，而你的同在本来可以阻止这一切。你为什么不来？如今太迟了，因为拉撒路已经死了四天了！”但耶稣对这一切只以一个伟大的真理作答。祂实质上在说：“你们或许不明白，但我要告诉你们，你们若信，就必看见。”",
              "simpEn": "Mary and Martha could not understand what their Lord was doing. Both had said to Him, 'Lord, if You had been here, my brother would not have died.' Behind their words we can read their real thoughts: 'Lord, we don't understand why You waited so long to come or how You could let the man You love so much die. We don't understand how You could let such sadness and pain wreck our lives when Your being here could have stopped it all. Why didn't You come? Now it's too late—Lazarus has been dead four days!' But Jesus had only one great truth to answer all this. He basically said, 'You may not understand, but I am telling you: if you believe, you will see.'",
              "simpZh": "马大和马利亚不明白主在做什么。她们两个都对祂说：“主啊，你若在这里，我兄弟就不会死。”从她们的话背后，我们能读到她们真正想说的：“主啊，我们不明白你为什么拖这么久才来，你怎么能让一个你那么爱的人死掉。我们不明白你怎么能允许这样的忧伤和痛苦毁坏我们的生活，你明明在场就可以阻止这一切。你为什么不来？现在太晚了，拉撒路已经死了四天了！”可是耶稣只用一个大真理回答这一切。祂其实在说：“你们可能不明白，但我告诉你们：你们若相信，就必看见。”"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Abraham\">Abraham<\/span> could not understand why God would ask him to sacrifice his son, but he trusted Him. Then he saw the Lord’s glory when the son he loved was restored to him. <span class=\"vocab-trigger\" data-vocab=\"Moses\">Moses<\/span> could not understand why God would require him to stay forty years in the wilderness, but he also trusted Him. Then he saw when God called him to lead Israel from Egyptian bondage. <span class=\"vocab-trigger\" data-vocab=\"Joseph\">Joseph<\/span> could not understand his brothers’ cruelty toward him, the false testimony of a <span class=\"vocab-trigger\" data-vocab=\"treacherous\">treacherous<\/span> woman, or the long years of unjust imprisonment, but he trusted God and finally he saw His glory in it all. And Joseph’s father, <span class=\"vocab-trigger\" data-vocab=\"Jacob\">Jacob<\/span>, could not understand how God’s strange <span class=\"vocab-trigger\" data-vocab=\"providence\">providence<\/span> could allow Joseph to be taken from him. Yet later he saw the Lord’s glory when he looked into the face of his son, who had become the governor for a great king and the person used to preserve his own life and the lives of an entire nation.",
              "zh": "亚伯拉罕不明白神为何要他献上儿子为祭，但他信靠了神。随后当他所爱的儿子归还给他时，他就看见了主的荣耀。摩西不明白神为何要他在旷野待上四十年，但他也信靠了神。随后当神呼召他领以色列人出埃及为奴之地时，他就看见了。约瑟不明白他哥哥们对他的残忍，一个奸诈妇人的假见证，以及多年不公的囚禁，但他信靠神，最终在这一切中看见了神的荣耀。约瑟的父亲雅各也不明白神那奇特的护理怎能让约瑟被人从他夺走。然而后来当他看见儿子的脸——他已成为大君的宰相，并且神用他保全了自己和全族的性命——他就看见了主的荣耀。",
              "simpEn": "Abraham could not understand why God would ask him to offer his son, but he trusted God. Then he saw the Lord's glory when his beloved son was given back to him. Moses could not understand why God would make him stay forty years in the desert, but he also trusted. Then he saw when God called him to lead Israel out of Egypt. Joseph could not understand his brothers' cruelty, the lying words of a sinful woman, or the long years of unfair prison, but he trusted God and at last saw His glory in it all. And Jacob could not understand how God's strange care could let Joseph be taken from him. Yet later he saw the Lord's glory when he looked at his son, who had become a great king's governor and the one used to save his own life and a whole nation.",
              "simpZh": "亚伯拉罕不明白神为什么让他把儿子献上，但他信靠了神。后来当他心爱的儿子回到他身边时，他看见了神的荣耀。摩西不明白神为什么让他在旷野待四十年，但他也信靠了神。后来神呼召他带领以色列人出埃及时，他就看见了。约瑟不明白哥哥们对他的残忍，一个坏女人的假见证，还有长年不公的坐牢，但他信靠神，最后在这一切事上都看见了神的荣耀。约瑟的父亲雅各也不明白神那奇特的安排怎么能让约瑟被人从他身边夺走。可是后来当他看见自己儿子的脸——儿子已经成了大王的宰相，神用他保全了自己和全族人的性命——他就看见了主的荣耀。"
            },
            {
              "en": "Perhaps there is also something in your life causing you to question God. Do you find yourself saying, “I do not understand why God allowed my loved one to be taken. I do not understand why <span class=\"vocab-trigger\" data-vocab=\"affliction\">affliction<\/span> has been permitted to strike me. I do not understand why the Lord has led me down these twisting paths. I do not understand why my own plans, which seemed so good, have been so disappointing. I do not understand why the blessings I so desperately need are so long in coming.” Dear friend, you do not have to understand all God’s ways of dealing with you. He does not expect you to understand them. You do not expect your children to understand everything you do—you simply want them to trust you. And someday you too will see the glory of God in the things you do not understand. <span class=\"vocab-trigger\" data-vocab=\"J. H. M.\">J. H. M.<\/span>",
              "zh": "或许你生命中也有什么事在让你质疑神。你是否发现自己在说：“我不明白神为何允许我所爱的人被取去。我不明白为何患难被容许击打我。我不明白主为何领我走这些弯曲的路。我不明白我自己的那些似乎很好的计划，为何变得如此令人失望。我不明白我极需的祝福为何迟迟不来。”亲爱的朋友，你不需要明白神对待你的一切作为。祂并不期望你明白。你也不期望你的孩子明白你所做的一切——你只想要他们信靠你。而有一天，你也必在那些你不明白的事上看见神的荣耀。 J. H. M.",
              "simpEn": "Maybe there is something in your life that makes you question God. Do you find yourself saying, 'I don't understand why God let my dear one be taken. I don't understand why trouble has been allowed to hit me. I don't understand why the Lord has led me down these curving roads. I don't understand why my own plans, which seemed so good, have been so let down. I don't understand why the blessings I need so badly are taking so long to come.' Dear friend, you don't have to understand all God's ways with you. He doesn't expect you to understand them. You don't expect your children to understand everything you do—you just want them to trust you. And someday you too will see the glory of God in the things you don't understand. J. H. M.",
              "simpZh": "也许你生活里也有什么事让你对神感到疑问。你是不是发现自己在说：“我不明白为什么神允许我所爱的人被接走。我不明白为什么患难会临到我身上。我不明白为什么主带领我走这些弯来弯去的路。我不明白为什么我自己那些看起来挺好的计划，结果这么让人失望。我不明白为什么我那么迫切需要的祝福，这么久了还不来。”亲爱的朋友，你不需要明白神对待你的一切方式。祂并没有要你完全明白。你也没有要求你的孩子明白你所做的一切——你只是希望他们信靠你。将来有一天，你也一定会在那些你现在不明白的事上，看见神的荣耀。J. H. M."
            },
            {
              "en": "If we could push ajar the gates of life, And stand within, and all God’s working see, We might interpret all this doubt and strife, And for each mystery could find a key. But not today. Then be content, dear heart; God’s plans, like lilies pure and white, unfold. We must not tear the close-shut leaves apart— Time will someday reveal the blooms of gold. And if, through patient toil, we reach the land Where tired feet, with sandals loosed, may rest, When we shall clearly know and understand, I think that we will say, “God knew best.”",
              "zh": "我们若能推开生命之门，站在里面，看见神一切的工作，或许就能解释这一切疑虑和挣扎，为每个奥秘找到一把钥匙。但不是今天。所以，亲爱的，要知足；神的计划，像纯净洁白的百合花，渐渐展开。我们不可撕开那紧闭的叶子——时间有一天必将显露金色的花朵。倘若我们借着忍耐的劳苦，得以进入那疲乏的脚可脱下鞋履安息之地，当我们清楚明白时，我想我们都会说：“神最清楚。”",
              "simpEn": "If we could push open the gates of life and stand inside and see all God is doing, we might explain all this doubt and struggle, and find a key to every mystery. But not today. So be content, dear heart; God's plans, like pure white lilies, open slowly. We must not tear apart the closed-up leaves—time will someday show the golden flowers. And if, through patient work, we reach the land where tired feet can rest with sandals off, when we clearly know and understand, I think we will say, 'God knew best.'",
              "simpZh": "如果我们能推开生命的大门，站在里面，看见神所做的一切工作，也许就能解释这一切疑虑和挣扎，为每个奥秘找到一把钥匙。但今天还不行。所以，亲爱的心啊，要知足；神的计划，像洁白纯净的百合花，慢慢展开。我们不要撕开那紧闭的花瓣——将来有一天，时间会显露出金色的花朵。如果借着耐心劳苦，我们到达那疲乏的脚可以脱下鞋得安息的地方，当我们清楚地知道并明白时，我想我们都会说：“神最清楚。”"
            }
          ],

        {
          "sectionId": 6,
          "heading": "September 21",
          "audio": "audio/streams in the desert - September 21.m4a",
          "paragraphs": [
            {
              "en": "I consider everything a loss compared to the <span class=\"vocab-trigger\" data-vocab=\"surpassing greatness\">surpassing greatness<\/span> of knowing Christ Jesus my Lord. (Philippians 3:8)",
              "zh": "我也将万事当作有损的，因我以认识我主基督耶稣为至宝。（腓立比书3:8）",
              "simpEn": "I count everything as loss compared to the far greater worth of knowing Christ Jesus my Lord.",
              "simpZh": "我把一切看作损失，因为认识我主基督耶稣比万事更宝贵。"
            },
            {
              "en": "The autumn season we are now entering is one of cornfields ripe for harvest, of the cheerful song of those who reap the crops, and of gathered and securely stored grain. So allow me to draw your attention to the sermon of the fields. This is its <span class=\"vocab-trigger\" data-vocab=\"solemn\">solemn<\/span> message: “You must die in order to live. You must refuse to consider your own comfort and well-being. You must be <span class=\"vocab-trigger\" data-vocab=\"crucified\">crucified<\/span>, not only to your desires and habits that are obviously sinful but also to many others that may appear to be <span class=\"vocab-trigger\" data-vocab=\"innocent\">innocent<\/span> and right. If you desire to save others, you cannot save yourself, and if you desire to bear much fruit, you must be buried in darkness and <span class=\"vocab-trigger\" data-vocab=\"solitude\">solitude<\/span>.”",
              "zh": "我们现正进入的秋季，是禾田成熟待收的季节，是收割者愉快歌声的季节，是五谷聚敛储藏的季节。所以请容我把你的注意力引到田地的讲道。它那严肃的信息是：“你必须死才能活。你必须拒绝考虑自己的舒适和安逸。你必须被钉十字架，不但对你的欲望和习惯中那些明显有罪的，也对许多看似无辜和正当的。你若渴望拯救别人，就不能救自己；你若渴望多结果子，就必须被埋在黑暗和孤寂里。”",
              "simpEn": "The autumn season we are entering is one of fields ripe for harvest, the happy songs of those gathering the crops, and grain safely stored away. So let me point you to the message of the fields. Its serious message is this: 'You must die to live. You must refuse to think about your own comfort. You must be crucified, not only to your clearly sinful wants and habits, but also to many that seem innocent and right. If you want to save others, you cannot save yourself; and if you want to bear much fruit, you must be buried in darkness and being alone.'",
              "simpZh": "我们正在进入的秋天，是田地成熟待收割的季节，是收割庄稼的人快乐歌唱的季节，也是粮食收进来稳妥储藏的季节。所以让我把你们的注意力引到田野的讲道。它那严肃的信息是：“你必须死，才能活。你必须拒绝为自己舒适安乐着想。你必须被钉十字架，不单是对那些明显是罪的想法和习惯，也是对许多看起来无辜、正当的事。你若想救别人，就不能救自己；你若想多结果子，就必须被埋在黑暗和孤单里。”"
            },
            {
              "en": "My heart fails me as I listen. But when the words are from Jesus, may I remind myself that it is my great <span class=\"vocab-trigger\" data-vocab=\"privilege\">privilege<\/span> to enter into “the fellowship of sharing in his sufferings” (Phil. 3:10) and I am therefore in great company. May I also remind myself that all the suffering is designed to make me a <span class=\"vocab-trigger\" data-vocab=\"vessel\">vessel<\/span> suitable for His use. And may I remember that His <span class=\"vocab-trigger\" data-vocab=\"Calvary\">Calvary<\/span> blossomed into abundant fruitfulness, and so will mine. Pain leads to plenty, and death to life—it is the law of the kingdom! <span class=\"vocab-trigger\" data-vocab=\"from In the Hour of Silence\">from In the Hour of Silence<\/span>",
              "zh": "我听着这些话，心就消化了。但这些话既是从耶稣来的，愿我提醒自己，得以进入“和祂一同受苦的相交”（腓立比书3:10）乃是我极大的特权，因此我也置身于伟大的群体中。愿我也提醒自己，所有的苦难都是为要将我做成合祂使用的器皿。并愿我记念，祂的加略山开花结出丰硕的果子，我的也必如此。疼痛引向丰盛，死亡引向生命——这是国度的定律！ 摘自《在静默的时辰》",
              "simpEn": "My heart fails as I hear this. But since the words come from Jesus, may I remind myself that it is my great honor to share in 'the fellowship of His sufferings,' so I am in wonderful company. May I also remember that all the pain is meant to shape me into a pot fit for His use. And may I recall that His cross bloomed into overflowing fruit, and so will mine. Pain leads to plenty, and death to life—this is the rule of the kingdom! from In the Hour of Silence",
              "simpZh": "我听了这些话，心都软了。但既然是从耶稣来的话，愿我提醒自己，能进入“与祂一同受苦的团契”是我极大的特权，因此我有极好的同伴。愿我也提醒自己，所有的痛苦都是为了把我做成合祂使用的器皿。愿我记住，祂的加略山开花结出了丰丰富富的果子，我的也会这样。疼痛带来丰盛，死亡带来生命——这是国度的法则！摘自《在静默的时辰》"
            },
            {
              "en": "Do we call it dying when a bud blossoms into a flower? <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span> Finding, following, keeping, struggling, Is He sure to bless? Saints, apostles, prophets, martyrs, Answer, “Yes.”",
              "zh": "花蕾绽放成花朵时，我们称之为死吗？ 选自 寻找、跟随、持守、挣扎，祂确定会赐福吗？圣徒、使徒、先知、殉道者，都回答：“是的。”",
              "simpEn": "Do we call it dying when a bud opens into a flower? selected Finding, following, keeping, struggling—is He sure to bless? Saints, apostles, prophets, martyrs answer, 'Yes.'",
              "simpZh": "当花蕾绽放成花朵时，我们叫它死吗？选自 寻找、跟随、持守、挣扎——祂一定会赐福吗？圣徒、使徒、先知、殉道者都回答：“是的。”"
            }
          ],
          "quiz": [
            {
              "text": "Philippians 3:8 says knowing Christ is of surpassing greatness compared to everything else.",
              "answer": true
            },

              "text": "The 'sermon of the fields' says we can bear much fruit without being buried in darkness.",

        {
          "sectionId": 7,
          "heading": "September 22",
          "audio": "audio/streams in the desert - September 22.m4a",
          "paragraphs": [
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Satan\">Satan<\/span> has asked to <span class=\"vocab-trigger\" data-vocab=\"sift\">sift<\/span> you as wheat. But I have prayed for you, <span class=\"vocab-trigger\" data-vocab=\"Simon\">Simon<\/span>, that your faith may not fail. (Luke 22:31–32)",
              "zh": "撒但想要得着你们，好筛你们像筛麦子一样；但我已经为你祈求，叫你不至于失了信心。（路加福音22:31–32）",
              "simpEn": "Satan has asked to shake you apart like wheat. But I have prayed for you, Simon, that your faith will not fail.",
              "simpZh": "撒但要求把你像麦子一样筛开。但我已经为你祷告，西门，叫你的信心不至失去。"
            },
            {
              "en": "Our faith is the center of the target God aims at when He tests us, and if any gift escapes <span class=\"vocab-trigger\" data-vocab=\"untested\">untested<\/span>, it certainly will not be our faith. There is nothing that pierces faith to its very <span class=\"vocab-trigger\" data-vocab=\"marrow\">marrow<\/span>—to find whether or not it is the faith of those who are <span class=\"vocab-trigger\" data-vocab=\"immortal\">immortal<\/span>—like shooting the arrow of the feeling of being <span class=\"vocab-trigger\" data-vocab=\"deserted\">deserted<\/span> into it. And only genuine faith will escape unharmed from the midst of the battle after having been stripped of its <span class=\"vocab-trigger\" data-vocab=\"armor\">armor<\/span> of earthly enjoyment and after having endured the circumstances coming against it that the powerful hand of God has allowed. Faith must be tested, and the sense of feeling deserted is “the <span class=\"vocab-trigger\" data-vocab=\"furnace\">furnace<\/span> heated seven times hotter than usual” (Dan. 3:19) into which it may be thrown. Blessed is the person who endures such an <span class=\"vocab-trigger\" data-vocab=\"ordeal\">ordeal<\/span>! <span class=\"vocab-trigger\" data-vocab=\"Charles H. Spurgeon\">Charles H. Spurgeon<\/span>",
              "zh": "我们的信心是神试验我们时所瞄准的靶心；若有什么恩赐能免于试验，那绝不会是信心。没有什么比把被遗弃的感觉之箭射入信心，更能刺透它的骨髓——为要查出它究竟是不是那种不朽之人的信心。只有真实的信心，在脱去属地享乐的铠甲之后，在忍受了神大能手所允许临到它的诸般环境之后，才能从阵中安然脱身。信心必须经过试验，而那种被遗弃的感觉，正是信心可能被投入的“比寻常加七倍热”的火窑（但以理书3:19）。忍受这样试炼的人有福了！ 司布真",
              "simpEn": "Our faith is the bull's-eye God aims for when He tests us, and if any gift goes untested, it won't be faith. Nothing cuts through faith to its very center—to see if it's the faith of those who live forever—like shooting the arrow of feeling left alone into it. Only real faith will come out of the battle unhurt after being stripped of its covering of earthly pleasures and after going through the hard things that God's mighty hand has allowed. Faith must be tested, and the feeling of being left alone is 'the furnace heated seven times hotter' into which it may be thrown. Happy is the one who makes it through such a test! Charles H. Spurgeon",
              "simpZh": "我们的信心是神试验我们时瞄准的靶心。如果有什么恩赐可以免试，那绝不是信心。没有什么比把“被离弃”的感觉之箭射进信心，更能刺透它的骨髓——看看它到底是不是那种属于不死之人的信心。只有真实的信心，在被剥掉属地快乐的外壳，并经历了神大能手所允许的各种敌对之后，才能平安走出战场。信心必须被试炼，而那种被丢弃的感觉，就是信心可能被扔进去的“比平常热七倍的火炉”。能经过这样试炼的人有福了！司布真"
            },
            {
              "en": "Paul said, “I have kept the faith” (2 Tim. 4:7), but his head was removed! They cut it off, but they could not touch his faith. This great apostle to the <span class=\"vocab-trigger\" data-vocab=\"Gentiles\">Gentiles<\/span> rejoiced in three things: he had “fought the good fight,” he had “finished the race,” and he had “kept the faith.” So what was the value of everything else? The apostle Paul had won the race and gained the <span class=\"vocab-trigger\" data-vocab=\"ultimate\">ultimate<\/span> prize—he had won not only the <span class=\"vocab-trigger\" data-vocab=\"admiration\">admiration<\/span> of those on earth today but also the admiration of heaven. So why do we not live as if it pays to lose “all things . . . that [we] may gain Christ” (Phil. 3:8)? Why are we not as loyal to the truth as Paul was? It is because our math is different—he counted in a different way than we do. What we count as gain, he counted as loss. If we desire to ultimately wear the same crown, we must have his faith and live it.",
              "zh": "保罗说：“所信的道我已经守住了”（提摩太后书4:7），但他的头却被砍了！他们砍掉了他的头，却不能碰他的信心。这位伟大的外邦人使徒为三件事欢欣：他“打过了那美好的仗”，他“跑尽了当跑的路”，他“守住了所信的道”。那么其余一切有何价值呢？使徒保罗赢得了赛跑，得着了最终的奖赏——他不仅赢得了今天地上之人的钦佩，也赢得了天上的钦佩。那么我们为何不活得好像“丢弃万事……为要得着基督”（腓立比书3:8）是合算的呢？我们为何不像保罗那样忠于真理呢？乃是因为我们的算法不同——他计算的方式和我们不同。我们算为有益的，他却算为有损的。我们若渴望最终戴上同样的冠冕，就必须有他的信心，并且活出这信心。",
              "simpEn": "Paul said, 'I have kept the faith,' but his head was cut off! They removed it, but they couldn't touch his faith. This great apostle to the non-Jews was happy about three things: he had 'fought the good fight,' 'finished the race,' and 'kept the faith.' So what was the worth of everything else? Paul had won the race and got the final prize—he had won not only the respect of people on earth today but also the respect of heaven. So why don't we live as if it's worth losing everything to gain Christ? Why aren't we as faithful to the truth as Paul was? It's because our math is different—he counted in a different way than we do. What we see as gain, he saw as loss. If we want to wear the same crown at last, we must have his faith and live it.",
              "simpZh": "保罗说：“所信的道我已经守住了”，但他的头却被砍了！他们砍了他的头，却不能碰他的信心。这位向外邦人传福音的伟大使徒为三件事欢喜：他“打了那美好的仗”，“跑完了当跑的路”，“守住了所信的道”。那么其他一切有什么价值呢？保罗赢了赛跑，得到了最终的奖赏——他不仅赢得了今天地上人们的敬佩，也赢得了天上的敬佩。那我们为什么不活得好像丢弃万事、为要得着基督是值得的呢？我们为什么不像保罗那样忠于真理呢？那是因为我们的算法不一样——他算的方法和我们不同。我们当作收获的，他当作损失。如果我们最终想戴上同样的冠冕，就必须有他那样的信心，并活出那样的信心。"

              "en": "Whoever believes in me, as the Scripture has said, <span class=\"vocab-trigger\" data-vocab=\"streams of living water\">streams of living water<\/span> will flow from within him. (John 7:38)",

            },
            {
              "en": "Some of us are troubled, wondering why the Holy Spirit doesn’t fill us. The problem is that we have plenty coming in but we are not giving out to others. If you will give the blessing you have received, planning your life around greater service and being a blessing to those around you, then you will quickly find that the Holy Spirit is with you. He will <span class=\"vocab-trigger\" data-vocab=\"bestow\">bestow<\/span> blessings to you for service, giving you all He can trust you to give away to others.",
              "zh": "我们有些人感到困惑，不明白圣灵为什么不充满我们。问题在于我们进来很多，却没有给出去。你若肯把所得的祝福分出去，围绕更大的服侍来规划生活，成为周围人的祝福，就必快快发现圣灵与你同在。祂会将为服侍所用的祝福托付给你，把祂信得过你会再给出去的一切都赐给你。",
              "simpEn": "Some wonder why the Holy Spirit doesn't fill them. The trouble is that they take in much but give out nothing. If you share the good things you've received, plan your life around serving and blessing others, you'll soon find the Spirit with you. He will give you gifts for serving, trusting you with all He knows you will pass on.",
              "simpZh": "有人困惑为何圣灵不充满自己。问题是自己领受很多，却没有给出去。你若把得到的福分分享出去，用服侍来规划人生、祝福身边人，很快就会发现圣灵与你同在。祂会把为服侍用的恩赐交托给你，因为祂信得过你会再给出去。"

              "zh": "“我若独自吃了自己那一口”，那位先祖曾轻蔑地说；若让他看见外邦世界——辽阔、凄凉、无神、无基督、灵魂饥荒，而教会的疾病竟是粮食过剩，独吃己食，他会怎么想？“你们白白地得来，也要白白地舍去，”那位将一切赐给我们的主如此说。若我们独自吃了自己那一口，那些主流血舍身为之赐粮的灵魂，正发出饥饿的呼求，我们里面的灵魂又怎能长久存活，竟对他们充耳不闻呢？ 威廉·亚历山大总主教",

              "en": "There have been times when I have experienced the same thing. Sometimes I have been interrupted in what seemed to be quite productive work. And at times, opposition came and forced me to go back, or sickness came and forced me to rest in some isolated place.",
              "zh": "我也曾多次经历同样的事。有时，我在看似相当有果效的工作中被中断。有时，反对临到，迫使我后退，或者疾病临到，迫使我待在某个孤寂之处休息。",

            {
              "en": "Don’t you know that day dawns after night, showers <span class=\"vocab-trigger\" data-vocab=\"displace\">displace<\/span> drought, and spring and summer follow winter? Then, have hope! Hope forever, for God will not fail you! <span class=\"vocab-trigger\" data-vocab=\"Charles H. Spurgeon\">Charles H. Spurgeon<\/span>",
              "zh": "你岂不知黑夜之后黎明必临，阵雨取代干旱，春天和夏天跟随冬天吗？那么，你要有盼望！永远盼望，因为神不会叫你失望！ 司布真",
              "simpEn": "Don't you know that dawn comes after night, rain takes the place of dryness, and spring and summer follow winter? So have hope! Hope forever, for God will not let you down! Charles H. Spurgeon",
              "simpZh": "你难道不知道黑夜过后黎明会来，阵雨代替干旱，春天和夏天跟在冬天后面吗？那么，你要有盼望！永远盼望，因为神不会让你失望！司布真"
            },
            {
              "en": "He was better to me than all my hopes; He was better than all my fears; He made a bridge of my broken works, And a rainbow of my tears. The stormy waves that marked my ocean path, Did carry my Lord on their crest; When I dwell on the days of my wilderness march I can lean on His love for the rest. He emptied my hands of my treasured store, And His <span class=\"vocab-trigger\" data-vocab=\"covenant\">covenant<\/span> love revealed, There was not a wound in my aching heart, The <span class=\"vocab-trigger\" data-vocab=\"balm\">balm<\/span> of His breath has not healed. Oh, tender and true was His discipline sore, In wisdom, that taught and tried, Till the soul that He sought was trusting in Him, And nothing on earth beside. He guided my paths that I could not see, By ways that I have not known; The crooked was straight, and the rough was plain As I followed the Lord alone. I praise Him still for the pleasant palms, And the desert streams by the way, For the glowing <span class=\"vocab-trigger\" data-vocab=\"pillar of flame\">pillar of flame<\/span> by night, And the sheltering cloud by day. Never a time on the dreariest day, But some promise of love endears; I read from the past, that my future will be Far better than all my fears. Like the golden jar, of the <span class=\"vocab-trigger\" data-vocab=\"wilderness bread\">wilderness bread<\/span>, Stored up with the blossoming rod, All safe in the ark, with the law of the Lord, Is the covenant care of my God.",
              "zh": "祂向我所行的，胜过我所盼望的；也胜过我所惧怕的；祂以我破碎的工作筑成桥梁，以我的眼泪作成彩虹。那些标记我海上路程的风浪，将我的主托在浪尖之上；当我回想旷野路上的日子，我便能靠着祂的爱得享安息。祂倒空了我手中积攒的珍宝，启示了祂的盟约之爱；我疼痛的心里，没有一处伤口是祂气息的香膏未曾医治的。哦，祂严厉的管教温柔而真实，充满智慧地教导和试炼，直到祂所寻找的那灵魂单单信靠祂，除祂以外在地上无所依靠。祂引导我走我看不见的路，经我未曾知道的道；当我独自跟随主的时候，弯曲的变为正直，崎岖的变为平坦。我仍要赞美祂，为路上宜人的棕树，为旷野的溪流，为夜间发光的火柱，为白昼遮蔽的云彩。在最沉闷的日子里，未尝一刻没有应许使祂的爱显得宝贵；我从过去读出，我的未来将远胜于我所惧怕的一切。正如盛吗哪的金罐与发芽的杖一同保存在法柜里，在主的律法旁安稳存放的，是我神的盟约之眷顾。",
              "simpEn": "He was better to me than all my hopes; He was better than all my fears. He made a bridge from my broken works and a rainbow from my tears. The stormy waves of my ocean path carried my Lord on their highest point; when I think back on my desert walk, I can rest on His love. He emptied my hands of the treasures I had stored, and showed me His covenant love. There was no wound in my aching heart that the healing of His breath did not heal. Oh, His hard discipline was tender and true, in wisdom that taught and tested, until the soul He wanted trusted only in Him, and in nothing on earth besides. He guided me on paths I couldn't see, by ways I had not known; the crooked became straight, the rough became smooth, as I followed the Lord alone. I still praise Him for the pleasant palm trees and the desert streams along the way, for the glowing pillar of fire by night and the sheltering cloud by day. Never a moment on the darkest day without some promise of love making it dear; I read from the past that my future will be far better than all my fears. Like the golden jar of wilderness bread, kept with the rod that budded, all safe in the ark with the law of the Lord, is the covenant care of my God.",
              "simpZh": "祂对我，比我所盼望的一切都好，也比我所害怕的一切都好；祂用我破碎的工作造了一座桥，用我的眼泪造了彩虹。我海上行路的狂风巨浪，把我的主托在浪尖上；每当我回想旷野行军的日子，我就能靠在祂的爱上得安息。祂倒空我手中珍藏的积蓄，向我显明祂的约中之爱；我疼痛的心里，没有一处伤口是祂气息的香膏没治好的。哦，祂严厉的管教又温柔又真实，满有智慧地教导和试炼，直到祂要得着的那个灵魂单单信靠祂，在地上不靠别的。祂引导我走我看不见的路，通过我不知道的途径；当我独自跟从主的时候，弯曲的变直了，崎岖的变平了。我仍要为路上愉快的棕树、为旷野路旁的溪流、为夜间的光柱和白天的云彩赞美祂。在最沉闷的日子里，没有一刻没有一些爱的应许使它变得宝贵；我从过去读出，我的将来要远胜过我所害怕的一切。就像盛着旷野粮食的金罐，和发芽的杖一同存放，在约柜里主的律法旁边安稳的，是我神的约中眷顾。"
            }
          ],

        {
          "sectionId": 4,
          "heading": "September 26",
          "audio": "audio/streams in the desert - September 26.m4a",
          "paragraphs": [
            {
              "en": "We live by faith, not by sight. (2 Corinthians 5:7)",
              "zh": "因我们行事为人是凭着信心，不是凭着眼见。（哥林多后书5:7）",
              "simpEn": "We live by faith, not by what we see.",
              "simpZh": "我们是凭信心生活，不是凭眼见。"
            },
            {
              "en": "As believers, “we live by faith, not by sight”—God never wants us to live by our feelings. Our inner self may want to live by feelings, and Satan may want us to, but God wants us to face the facts, not feelings. He wants us to face the facts of Christ and His finished and perfect work for us. And once we face these <span class=\"vocab-trigger\" data-vocab=\"precious\">precious<\/span> facts, and believe them simply because God says they are facts, He will take care of our feelings.",
              "zh": "作为信徒，“我们行事为人是凭着信心，不是凭着眼见”——神绝不要我们凭感觉生活。我们内在的自我可能想凭感觉生活，撒但也想我们这样，但神要我们面对事实，而不是感觉。祂要我们面对基督的事实，以及祂为我们已经完成且完美的工作。一旦我们面对这些宝贵的事实，并且单单因为神说它们是事实就相信，祂便会眷顾我们的感觉。",
              "simpEn": "As believers, 'we live by faith, not by sight'—God never wants us to live by our feelings. Our inner self might want to, and Satan might want us to, but God wants us to face facts, not feelings. He wants us to face the facts of Christ and His finished, perfect work for us. Once we face these precious facts and believe them simply because God says they are true, He will take care of our feelings.",
              "simpZh": "作为信徒，“我们凭信心生活，不凭眼见”——神从不要我们凭感觉生活。我们里面的自己可能想凭感觉，撒但也想我们这样，但神要我们面对事实，不是感觉。祂要我们面对基督的真相，和祂为我们完成又完美的作为。一旦我们面对这些宝贵的事实，只因神说它们是事实就相信，神就会顾念我们的感觉。"
            },
            {
              "en": "Yet God never gives us feelings to enable or encourage us to trust Him, and He never gives them to show us that we have already completely trusted Him. God only gives us feelings when He sees that we trust Him apart from our feelings, resting solely on His Word and His <span class=\"vocab-trigger\" data-vocab=\"faithfulness\">faithfulness<\/span> to His promise. And these feelings that can only come from Him will be given at such a time and to such a degree as His love sees best for each individual circumstance.",
              "zh": "然而神从不赐下感觉来促使或鼓励我们去信靠祂，也从不赐下感觉来证明我们已经完全信靠了祂。神只在看见我们不倚靠感觉而信靠祂，单单安息在祂的话语和祂对祂应许的信实上时，才赐下感觉。而这些只能从祂而来的感觉，祂会按照祂的爱看为最合适于每个个别处境的时间和程度来赐予。",
              "simpEn": "God never gives feelings to push us to trust Him, and never to show we've already fully trusted. He gives feelings only when He sees that we trust Him without feelings, resting only on His Word and His faithfulness to His promise. These feelings that come only from Him will be given at the time and to the degree His love sees as best for each case.",
              "simpZh": "神从不赐下感觉来推动我们信靠祂，也不用来证明我们已经完全信靠了。只有当祂看见我们不靠感觉而信靠祂，单单安息在祂的话语和祂对应许的信实上时，祂才赐下感觉。这些只能从祂来的感觉，祂会在祂的爱看为最合宜的时间和程度赐下来。"
            },
            {
              "en": "Therefore we must choose between facing our feelings or facing the facts of God. Our feelings may be as uncertain and changing as the sea or shifting sand. God’s facts, however, are as certain as the <span class=\"vocab-trigger\" data-vocab=\"Rock of Ages\">Rock of Ages<\/span> Himself—“Jesus Christ . . . the same yesterday and today and forever” (Heb. 13:8).",
              "zh": "因此我们必须在面对自己的感觉和面对神的事实之间作出选择。我们的感觉可能像大海或流沙一样变幻无常。然而神的事实，却如那万古磐石本身一样确定——“耶稣基督……昨日、今日、一直到永远，是一样的”（希伯来书13:8）。",
              "simpEn": "So we must choose between looking at our feelings or looking at God's facts. Our feelings may be as shaky and changing as the sea or sand. But God's facts are as sure as the Rock of Ages Himself—'Jesus Christ is the same yesterday, today, and forever.'",
              "simpZh": "所以，我们要么看自己的感觉，要么看神的事实。我们的感觉可能像大海或沙丘一样飘忽不定。但神的事实，就像万古磐石一样确定——“耶稣基督昨天、今天、直到永远，是一样的。”"
            },
            {
              "en": "When darkness <span class=\"vocab-trigger\" data-vocab=\"veils\">veils<\/span> His lovely face I rest on His unchanging grace; In every strong and stormy gale, My <span class=\"vocab-trigger\" data-vocab=\"anchor\">anchor<\/span> holds within the veil.",
              "zh": "当黑暗遮掩祂可爱的面容，我安息在祂不变的恩典中；在一切强劲的暴风里，我的锚在幔内稳牢固。",
              "simpEn": "When darkness covers His lovely face, I rest on His unchanging grace; in every strong and stormy wind, my anchor holds behind the veil.",
              "simpZh": "黑暗笼罩祂可爱的面庞时，我安息在祂不变的恩典里；每一阵强劲的暴风中，我的锚在幔子里面牢牢抓住。"
            }
          ],
          "quiz": [
            {
              "text": "God wants us to live by our feelings rather than by faith.",
              "answer": false
            },
            {
              "text": "God gives feelings to encourage us to trust Him when we don't want to.",
              "answer": false
            },
            {
              "text": "The Rock of Ages refers to Jesus Christ, who is unchangeable.",
              "answer": true
            },
            {
              "text": "The poem says our anchor holds within the veil, a reference to security in God's presence.",
              "answer": true
            }
          ]

        {
          "sectionId": 5,
          "heading": "September 27",
          "audio": "audio/streams in the desert - September 27.m4a",
          "paragraphs": [
            {
              "en": "I have found a <span class=\"vocab-trigger\" data-vocab=\"ransom\">ransom<\/span> for him. (Job 33:24)",
              "zh": "我已经得了赎价。（约伯记33:24）",
              "simpEn": "I have found a payment to set him free.",
              "simpZh": "我已经找到救赎他的代价了。"
            },
            {
              "en": "Divine healing is actually <span class=\"vocab-trigger\" data-vocab=\"divine life\">divine life<\/span>. It is the lordship of Christ over the body—or the life of Christ in the framework of the human body. It is the union of the parts of our bodies with His very body, exhibiting His life flowing throughout our bodies. It is as real as His risen and <span class=\"vocab-trigger\" data-vocab=\"glorified\">glorified<\/span> body. And it is as reasonable as the fact that He was raised from the dead, is a living person with an actual body, and sits today as an understanding soul at God’s right hand.",
              "zh": "神医实际上是神圣的生命。它是基督在身体上的主权——或说基督的生命在人体框架中。它是我们身体各部分与祂真实身体的联合，彰显祂的生命流通我们全身。它就像祂复活且得荣耀的身体那样真实。它也像祂从死里复活、是一个具有实体的活人、如今作为一位能理解我们灵魂的主坐在神右边这事实一样合理。",
              "simpEn": "Divine healing is really divine life. It is Christ's lordship over the body—the life of Christ within the human frame. It is our body parts joined with His very body, showing His life flowing through us. It is as real as His risen and glorified body, and as reasonable as the fact that He rose from the dead, is a living person with a real body, and now sits at God's right hand understanding our souls.",
              "simpZh": "神医实际上是神圣的生命。它是基督在身体上的掌权——基督的生命在我们身体这个架构里。它是我们身体各部分与祂真实身体的联合，显出祂的生命流通我们全身。这就像祂复活得荣的身体一样真实，也像祂从死里复活、是个有真实身体的活人、今天坐在神右边理解我们灵魂一样合理。"
            },
            {
              "en": "That same Christ, with all His <span class=\"vocab-trigger\" data-vocab=\"attributes\">attributes<\/span> and mighty power, belongs to us. We are members of His body, His flesh, and His bones, and if we will only believe this and receive it, we may actually draw our life from the very life of the Son of God. Dear God, help me to know and to live this verse: “The body is . . . for the Lord, and the Lord for the body” (1 Cor. 6:13). <span class=\"vocab-trigger\" data-vocab=\"A. B. Simpson\">A. B. Simpson<\/span>",
              "zh": "那位同一位基督，连同祂一切的属性和大能，都属于我们。我们是祂身体上的肢体，是祂的骨、祂的肉，只要相信并接受这事，我们就能实际地从神儿子的生命本身汲取生命。亲爱的神，求你帮助我认识并活出这节经文：“身子……乃是为主；主也是为身子”（哥林多前书6:13）。 宣信",
              "simpEn": "That same Christ, with all His qualities and mighty power, belongs to us. We are members of His body, His flesh, and His bones. If we will only believe and receive this, we can truly draw our life from the very life of the Son of God. Dear God, help me to know and live this verse: 'The body is for the Lord, and the Lord for the body.' A. B. Simpson",
              "simpZh": "那位基督，连同祂的一切属性和大能，都是我们的。我们是祂身体的肢体，是祂的骨、祂的肉。我们只要相信并领受，就能真实地从神儿子的生命支取生命。神啊，求你帮助我认识并活出这节经文：“身体是为着主，主也是为着身体。”宣信"
            },
            {
              "en": "“The Lord your God is with you, he is mighty to save” (Zeph. 3:17). This was the verse that initially brought the truth of divine healing to my mind and my worn-out body more than twenty years ago. It is now a door more wide open than ever and is the gate through which the living Christ enters moment by moment into my redeemed body. He enters to fill, <span class=\"vocab-trigger\" data-vocab=\"energize\">energize<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"vitalize\">vitalize<\/span> me with the presence and power of His own personality, transforming my entire being into “a new heaven and a new earth” (Rev. 21:1).",
              "zh": "“耶和华你的神与你同在，祂是大能拯救的”（西番雅书3:17）。二十多年前，正是这节经文初次把神医的真理带进我的思想和疲倦的身体中。如今它是一扇比从前更加敞开的门，是永活的基督时刻进入我这蒙救赎之身体的门。祂进来，以祂自己位格的同在与能力充满我、激励我、赐我活力，将我全人变化为“一个新天新地”（启示录21:1）。",
              "simpEn": "'The Lord your God is with you, He is mighty to save.' This verse first brought the truth of divine healing to my mind and worn-out body over twenty years ago. Now it is a door wider open than ever, the gate through which the living Christ enters moment by moment into my redeemed body, to fill, strengthen, and give life to me with His own presence and power, changing my whole being into 'a new heaven and a new earth.'",
              "simpZh": "“耶和华你的神与你同在，祂是大能拯救的。”二十多年前，正是这节经文头一次把神医的真理带给我的思想和疲惫的身体。现在它是一扇开得比任何时候都大的门，是永活基督每时每刻进入我这蒙救身体的门。祂进来，用祂自己的同在和能力充满我、激励我、赐我活力，把我整个人变成“一个新天新地”。"
            },
            {
              "en": "Another verse reads, “The Lord your God” (Luke 10:27). If the Lord is my God, then all that is in <span class=\"vocab-trigger\" data-vocab=\"almighty God\">almighty God<\/span> is mine. It all resides within me to the extent that I am willing and able to <span class=\"vocab-trigger\" data-vocab=\"appropriate\">appropriate<\/span> Him and all that belongs to Him. “God, whose name is the Lord Almighty” (Jer. 32:18), is indeed the all mighty God and is my inside God. Just as the sun is the center of our solar system, He is centered within me, living as the Father, Son, and Holy Spirit. He is the great generator of the power plant at the center of my threefold being, working in the midst of my physical being, including my brain and other parts of my <span class=\"vocab-trigger\" data-vocab=\"nervous system\">nervous system<\/span>.",
              "zh": "另一节经文说：“主你的神”（路加福音10:27）。如果主是我的神，那么全能神里的一切都是我的。只要我愿意并有能力领受祂和属于祂的一切，这一切就都住在我里面。“耶和华万军之神”（耶利米书32:18）的确是全能的神，是我里面的神。正如太阳是我们太阳系的中心，祂也中心居于我里面，以父、子、圣灵的身份活着。祂是我三部分存在中心的发电厂之大发电机，运行在我物质存在的里面，包括我的头脑和神经系统其他部分。",
              "simpEn": "Another verse says, 'The Lord your God.' If the Lord is my God, then all that is in almighty God is mine. It all lives in me as much as I am willing and able to take hold of Him and all that is His. 'God, whose name is the Lord Almighty,' is truly the all-powerful God and is my inside God. Just as the sun is the center of our solar system, He is centered within me, living as Father, Son, and Holy Spirit. He is the great power source at the center of my three-part being, working inside my physical body, including my brain and nervous system.",
              "simpZh": "还有一节经文说：“主你的神”。如果主是我的神，那么全能神里面的一切都是我的。只要我愿意并能支取祂和祂的一切，这一切就都住在我里面。“万军之耶和华”是全能的神，也是我里面的神。就像太阳是太阳系的中心，祂也住在我里面作中心，以父、子、圣灵的身份活着。祂是我三部分生命中心的发电厂之大发电机，在我身体里面运行，包括我的大脑和神经系统。"
            },
            {
              "en": "For twenty-one years this truth not only has been a living reality to me but has grown deeper and richer. Now, at the age of seventy, I am in every way a much younger and stronger person than I was at thirty. Today I live using God’s strength, accomplishing fully twice as much mentally and physically as I ever did in the past, yet with only half the effort. My physical, mental, and spiritual life is like an <span class=\"vocab-trigger\" data-vocab=\"artesian well\">artesian well<\/span>—always full and overflowing. Speaking, teaching, and traveling by day or by night through sudden and violent changes in weather or climate is of no more effort to me than it is for the wheels of an engine to turn when the pressure of the steam is at full force or than it is for a pipe to let water run through it.",
              "zh": "二十一年来，这真理不仅是我活生生的实际，而且变得更深更丰。如今七十岁的我，在各方面都比三十岁时更年轻、更强壮。今天我靠神的力量活着，在心智和身体上所完成的，是我过去的两倍，花费的力气却只有一半。我的身体、精神和属灵生命如同一口自流井——总是满溢。白天黑夜的讲论、教导、旅行，面对天气的骤变或气候的突变，对我而言，不比在蒸汽全力推动下引擎的轮子转动更费力，也不比水流经管子更费力。",
              "simpEn": "For twenty-one years this truth has been not only real to me but has grown deeper. Now at seventy, I am in every way younger and stronger than at thirty. I live on God's strength today, doing twice as much in mind and body as ever before, but with half the effort. My physical, mental, and spiritual life is like a deep spring well—always full and overflowing. Speaking, teaching, and traveling day or night through sudden weather changes costs me no more effort than the wheels of an engine turning under full steam or water running through a pipe.",
              "simpZh": "二十一年来，这个真理对我不但是活生生的实际，而且变得更深更丰富。如今我七十岁，各方面都比三十岁时更年轻更强壮。今天我靠神的力量活着，头脑和身体完成的事是过去的两倍，但只花一半的力气。我的身体、精神和属灵生命就像一口自流井——总是满的，还溢出来。无论白天黑夜讲论、教导、旅行，面对天气剧烈变化，对我来说都不比火车轮子在蒸汽全力驱动下转动更费力，也不比水从管子里流过更难。"
            },
            {
              "en": "My body, soul, and spirit thus redeemed, <span class=\"vocab-trigger\" data-vocab=\"Sanctified\">Sanctified<\/span> and healed I give, O Lord, to Thee, A <span class=\"vocab-trigger\" data-vocab=\"consecrated\">consecrated<\/span> offering Yours evermore to be. That all my powers with all their might In Your sole glory may unite—Hallelujah! <span class=\"vocab-trigger\" data-vocab=\"Henry Wilson\">Henry Wilson<\/span>",
              "zh": "我的身体、魂与灵既蒙救赎，被分别为圣且得医治，主啊，我将它们献给祢，作为永远归祢的甘心祭。使我所有的能力，用尽它们的全力，唯独为祢的荣耀联合——哈利路亚！ 亨利·威尔逊",
              "simpEn": "My body, soul, and spirit, now redeemed, made holy, and healed, I give to You, O Lord, an offering set apart for You forever. May all my powers with all their might join together for Your glory alone—Hallelujah! Henry Wilson",
              "simpZh": "我的身体、魂与灵已经蒙救赎，被洁净并医治，主啊，我献给你，作永远属于你的圣洁祭物。愿我所有的力量都用尽全力，只为了你的荣耀联合起来——哈利路亚！亨利·威尔逊"
            }

          "paragraphs": [
            {

              "zh": "快乐与有福之间有着巨大的差别。保罗经历了监禁、痛苦、牺牲和苦难，达到了它们的极致，然而在这一切之中他是有福的。一切八福都在他艰难的环境之中，在他心里和生命中成为真实。",

            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Paganini\">Paganini<\/span>, the great Italian violinist, once stepped onstage only to discover there was something wrong with his violin, just as the audience was ending their applause. He looked at the instrument for a moment and suddenly realized it was not his best and most valuable one. In fact, the violin was not his at all. Momentarily he felt <span class=\"vocab-trigger\" data-vocab=\"paralyzed\">paralyzed<\/span>, but he quickly turned to his audience, telling them there had been some mistake and he did not have his own violin. He stepped back behind the curtain, thinking he must have left it backstage, but discovered that someone had stolen his and left the <span class=\"vocab-trigger\" data-vocab=\"inferior\">inferior<\/span> one in its place.",
              "zh": "伟大的意大利小提琴家帕格尼尼，有一次步上舞台，正要演奏，听众的掌声方歇，便发现他的小提琴出了问题。他看了那乐器片刻，忽然意识到那不是他最好、最贵重的那一把。事实上，这琴根本就不是他的。一瞬间他感到瘫痪了，但他迅速转向听众，告诉他们发生了一些错误，他手中不是自己的琴。他退到幕后，以为一定是落在了后台，却发现有人偷走了他的琴，留下这把劣质的替代品。",
              "simpEn": "Paganini, the great Italian violinist, once came on stage just as the applause ended and found something wrong with his violin. He looked at it and suddenly knew it was not his best and most valuable one. In fact, it wasn't his at all. For a moment he felt frozen, but he quickly told the audience there had been a mistake and he didn't have his own violin. He stepped behind the curtain, thinking he'd left it backstage, but found someone had stolen his and left a poorer one in its place.",
              "simpZh": "伟大的意大利小提琴家帕格尼尼，有一次走上舞台，掌声刚落，就发现小提琴有问题。他看了一眼，忽然意识到这不是他那把最好最贵重的琴。其实这琴根本不是他的。他一下子呆住了，但很快转向观众说弄错了，他手上的不是自己的琴。他退到幕后，以为把琴落在后台了，结果发现有人偷了他的琴，留下这把差得多的代替。"

            {
              "en": "After remaining behind the curtain for a moment, Paganini stepped onstage again to speak to the audience. He said, “Ladies and Gentlemen, I will now demonstrate to you that the music is not in the instrument but in the soul.” Then he played as never before, and beautiful music flowed from that inferior instrument until the audience was so <span class=\"vocab-trigger\" data-vocab=\"enraptured\">enraptured<\/span> that their enthusiastic applause nearly lifted the ceiling of the concert hall. He had indeed revealed to them that the music was not in his instrument but in his own soul!",
              "zh": "在幕后停留片刻之后，帕格尼尼再次步上舞台，对听众说：“女士们先生们，我现在要向你们证明，音乐不在乐器里，乃在灵魂中。”然后他演奏得出奇地好，美妙的音乐从那把劣质乐器中流淌出来，直到听众如此陶醉，他们热烈的掌声几乎要掀翻音乐厅的天花板。他确实向他们显明了，音乐不在他的乐器中，乃在他自己的灵魂里！",
              "simpEn": "After a moment behind the curtain, Paganini came back out and said, 'Ladies and Gentlemen, I will now show you that the music is not in the instrument but in the soul.' Then he played like never before, and lovely music poured from that poor instrument until the audience was so thrilled that their excited applause nearly lifted the ceiling. He had truly shown them that the music was not in the instrument but in his own soul!",
              "simpZh": "在幕后停了一会儿，帕格尼尼又出来对观众说：“女士们先生们，我现在要证明，音乐不在乐器里，而在灵魂里。”然后他拉得前所未有的好，美妙的音乐从那把很差的乐器里流出来，观众听得如痴如醉，热烈的掌声几乎掀翻了音乐厅的屋顶。他确实证明了，音乐不在乐器里，乃在他自己的灵魂里！"
            },
            {
              "en": "Dear tested and tried believer, it is your mission to walk onto the stage of this world in order to reveal to all of heaven and earth that the music of life lies not in your circumstances or external things but in your own soul.",
              "zh": "亲爱的受过试炼与考验的信徒，你的使命就是走上这世界的舞台，向天上地下所有的人显明，生命的音乐不在于你的环境或外在事物，乃在于你自己的灵魂。",
              "simpEn": "Dear tested and tried believer, your calling is to walk onto the stage of this world to show all heaven and earth that the music of life is not in your circumstances or outward things but in your own soul.",
              "simpZh": "亲爱的被试炼过的信徒，你的使命就是走上这个世界舞台，向天上地上显明，生命的音乐不在乎你的环境或外面的事物，乃在乎你自己的灵魂。"
            },

              "simpEn": "Too often we are in a 'holy' rush during our quiet time. How much time do we truly spend in quiet devotion each day? Can it be measured in minutes? Can you think of one person of great spiritual height who did not spend much time in prayer? Has anyone ever shown much of the spirit of prayer who didn't give a lot of time to it?",
              "simpZh": "我们常常在灵修时“圣洁地”急匆匆。每天实际花多少时间安静灵修？能用分钟算出来吗？你能想出一个属灵身量高大却不花大量时间祷告的人吗？有谁显出很多祷告的灵，却没付上大量时间祷告？"

            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"George Whitefield\">George Whitefield<\/span>, the English preacher who was one of the leading figures in the eighteenth-century American revival known as the <span class=\"vocab-trigger\" data-vocab=\"Great Awakening\">Great Awakening<\/span>, once said, “I have spent entire days and weeks lying <span class=\"vocab-trigger\" data-vocab=\"prostrate\">prostrate<\/span> on the ground, engaged in silent or spoken prayer.” And the words of another person, whose life confirmed his own assertion, were these: “Fall to your knees and grow there.”",
              "zh": "乔治·怀特腓德，那位在十八世纪美国大觉醒复兴运动中居领导地位的英国传道人，曾说过：“我曾整日整周地俯伏在地，进行默祷或开声祷告。”而另有一人的话——其生命证实了他自己的宣言——是：“双膝跪下，并在那里成长。”",
              "simpEn": "George Whitefield, the English preacher who was a leader in the Great Awakening revival in America in the 1700s, once said, 'I have spent whole days and weeks lying face down on the ground in silent or spoken prayer.' And another person, whose life proved his words, said: 'Fall to your knees and grow there.'",
              "simpZh": "乔治·怀特腓德，十八世纪美国大觉醒复兴的领袖之一，曾说过：“我曾经整日整周俯伏在地，默默祷告或开声祷告。”另外有一个人，他的生命印证了他自己的话，这样说：“双膝跪下，在那里长大。”"
            },
            {
              "en": "It has been said that no great work of literature or science has ever been produced by someone who did not love solitude. It is also a <span class=\"vocab-trigger\" data-vocab=\"fundamental\">fundamental<\/span> principle of faith that no tremendous growth in holiness has ever been achieved by anyone who has not taken the time frequently, and for long periods, to be alone with God. <span class=\"vocab-trigger\" data-vocab=\"from The Still Hour\">from The Still Hour<\/span>",
              "zh": "有人说，从未有不爱孤寂的人产生过伟大的文学或科学著作。而信心的一条基本原则也是：从未有不常花时间、长时间单独与神同在的人，能在圣洁上有巨大长进。 摘自《静默的时辰》",
              "simpEn": "It's been said that no great book or scientific work ever came from someone who didn't love being alone. It's also a basic rule of faith that no great growth in holiness has ever been reached by anyone who didn't often take long times to be alone with God. from The Still Hour",
              "simpZh": "据说，从来没有不爱独处的人写出了伟大的文学或科学作品。信心的一条基本原则也是：没有人不经常花很长时间单独与神在一起，能在圣洁上有巨大的长进。摘自《静默的时辰》"

            {

              "zh": "从前有一株小植物，长得矮小、生长受阻，因为它住在一棵大橡树的荫下。它珍惜覆盖它的浓荫，看重这位高贵朋友所提供的安静歇息。然而，有一份更大的祝福为这株小植物预备好了。一天，一个伐木人带着利斧进入森林，砍倒了那棵大橡树。小植物开始哭泣，喊着说：“我的庇护被夺去了！如今一切猛烈的风都要吹在我身上，一切风暴都要设法把我连根拔起！”它的守护天使回答说：“不！如今太阳将照耀你，雨水将比以前更丰沛地落在你身上。如今你这受阻的形体要向上窜发，变成美丽，你的花朵，那些在荫下永不能开到完全的花朵，要在阳光中欢笑。人们会惊讶地说：‘看那株植物长得多么好！挪去了那曾为它荫蔽和喜悦的东西之后，它竟变得如此荣美！’”",
              "simpEn": "There was once a tiny plant that stayed small and undergrown because it lived in the shade of a huge oak. The little plant loved the shade and the quiet rest its noble friend gave. But a greater blessing was waiting for it. One day a woodsman came with a sharp ax and cut down the big oak. The little plant cried out, 'My cover is gone! Now every fierce wind will blow on me, and every storm will try to uproot me!' Its guardian angel said, 'No! Now the sun will shine and rain will fall on you more than ever. Now your small shape will spring up into beauty, and your flowers, which could never grow full in the shade, will laugh in the sun. People will say in wonder, “Look how that plant has grown! How wonderfully beautiful it became once its shade and delight were taken away!”'",
              "simpZh": "从前有一棵小植物，长得矮矮小小，因为住在一棵大橡树的浓荫下。它珍惜这荫蔽，也看重这高贵朋友给的安息。但有一个更大的祝福为它预备好了。一天，一个樵夫带着利斧进来，砍倒了那棵大橡树。小植物开始哭泣，喊着说：“我的遮盖没了！现在每一阵大风都会吹我，每一场风暴都要把我连根拔起！”它的守护天使回答说：“不！现在太阳会照你，雨水会更多地降在你身上。你原来受限制的身体要长成美丽的样子，你的花，那些在荫下绝开不到完全的花，要在阳光中欢笑。人们会惊讶地说：‘看这棵植物长得多好！挪走了它的遮盖和喜悦之物后，它变得多么荣美！’”"
            },
            {
              "en": "Dear believer, do you understand that God may take away your comforts and privileges in order to make you a stronger Christian? Do you see why the Lord always trains His soldiers not by allowing them to lie on beds of ease but by calling them to difficult marches and service? He makes them wade through streams, swim across rivers, climb steep mountains, and walk many long marches carrying heavy <span class=\"vocab-trigger\" data-vocab=\"backpacks\">backpacks<\/span> of sorrow. This is how He develops soldiers—not by dressing them up in fine uniforms to <span class=\"vocab-trigger\" data-vocab=\"strut\">strut<\/span> at the gates of the barracks or to appear as handsome gentlemen to those who are strolling through the park. No, God knows that soldiers can only be made in battle and are not developed in times of peace. We may be able to grow the raw materials of which soldiers are made, but turning them into true warriors requires the education brought about by the smell of gunpowder and by fighting in the midst of flying bullets and exploding bombs, not by living through pleasant and peaceful times. So, dear Christian, could this account for your situation? Is the Lord uncovering your gifts and causing them to grow? Is He developing in you the qualities of a soldier by shoving you into the heat of the battle? Should you not then use every gift and weapon He has given you to become a conqueror? <span class=\"vocab-trigger\" data-vocab=\"Charles H. Spurgeon\">Charles H. Spurgeon<\/span>",
              "zh": "亲爱的信徒，你是否明白神可能要拿走你的安逸和特权，为要使你成为更刚强的基督徒？你是否看见主为何总是借着呼召士兵去艰难行军和服侍来训练他们，而不是让他们躺在安逸的床上？祂使他们蹚过溪流，游过江河，攀登陡峭高山，背着沉重的忧伤行囊长途行军。这就是祂培养士兵的方式——不是给他们穿上漂亮制服，让他们在营房门口高视阔步，或者像英俊绅士一样出现在公园散步的人面前。不，神知道士兵只能在战场上造就，而不能在平安时期培养。我们或许能种出造成士兵的原料，但要将他们变成真正的战士，需要火药味和穿梭于飞弹与爆炸中的战斗来教育，而不是靠着安逸和平的日子来生活。所以，亲爱的基督徒，这能否解释你目前的处境？主是否正在发掘你的恩赐并使它们成长？祂是否借着把你推进激战中，将你培养成战士？那么，你岂不应当使用祂所赐的每一恩赐和兵器，成为得胜者吗？ 司布真",
              "simpEn": "Dear believer, do you understand that God may take away your comforts and special things to make you a stronger Christian? Do you see why the Lord trains His soldiers not by letting them rest in soft beds, but by calling them to hard marches and service? He makes them wade through streams, swim across rivers, climb steep mountains, and walk long paths carrying heavy loads of sadness. This is how He builds soldiers—not by dressing them in nice uniforms to show off at the gates or look handsome in the park. No, God knows that soldiers are made only in battle, not in times of peace. We may be able to grow the raw stuff of which soldiers are formed, but turning them into true warriors needs the training that comes from the smell of gunpowder and fighting amid flying bullets and exploding bombs, not from living through pleasant, quiet times. So, dear Christian, could this explain your life right now? Is the Lord uncovering your gifts and making them grow? Is He building a soldier's heart in you by pushing you into the heat of battle? Shouldn't you then use every gift and weapon He has given you to become a conqueror? Charles H. Spurgeon",
              "simpZh": "亲爱的信徒，你明白神可能要拿走你的舒适和特权，为要把你锻炼成更刚强的基督徒吗？你看见主总是怎样训练祂的士兵吗？不是让他们躺卧在安逸的床上，而是呼召他们去艰难行军和服事。祂让他们涉过溪水，游过江河，爬陡峭的山，背着沉重的忧伤背包长途行军。这就是祂培养战士的方法——不是给他们穿上漂亮制服，在军营门口高视阔步，或像英俊的绅士那样出现在公园散步的人面前。不，神知道战士只能在战场上造就，不能在和平时期培养。我们也许能种出制作士兵的原料，但要把他们变成真正的勇士，需要火药味和在飞弹爆炸中战斗的教育，而不是靠着愉快平静的日子生活。所以，亲爱的基督徒，这能不能解释你现在的处境？主是不是正在发掘你的恩赐，让它们成长？祂是不是把你推进战斗的热浪中，培养你的战士品质？那么，你岂不应该使用祂给你的一切恩赐和武器，成为得胜者吗？司布真"
            }
          ],
          "quiz": [
            {
              "text": "Deuteronomy 32 describes God as an eagle that stirs up its nest and hovers over its young.",
              "answer": true
            },
            {
              "text": "The little plant grew better when the oak tree was left standing.",
              "answer": false
            },
            {

            {
              "text": "God sometimes removes our comforts to make us stronger Christians.",
