            },
            {
              "en": "God will make our <span class=\"vocab-trigger\" data-vocab=\"obstacles\">obstacles<\/span> serve His <span class=\"vocab-trigger\" data-vocab=\"purposes\">purposes<\/span>. We all have mountains in our lives, and often they are people and things that threaten to block the progress of our spiritual life. The obstacles may be <span class=\"vocab-trigger\" data-vocab=\"untruths\">untruths<\/span> told about us; a difficult <span class=\"vocab-trigger\" data-vocab=\"occupation\">occupation<\/span>; “a <span class=\"vocab-trigger\" data-vocab=\"thorn in the flesh\">thorn in the flesh<\/span>” (2 Cor. 12:7); or our daily <span class=\"vocab-trigger\" data-vocab=\"cross\">cross<\/span>. And often we pray for their <span class=\"vocab-trigger\" data-vocab=\"removal\">removal<\/span>, for we tend to think that if only these were removed, we would live a more tender, pure, and holy life.",
              "zh": "神会叫我们的障碍为祂的旨意效力。我们生命中都有山，它们常是威胁要拦阻我们灵命长进的人和事。这些障碍可能是关于我们的谎言；艰难的职务；“肉体上的一根刺”（林后12:7）；或我们每日的十字架。我们常为挪去它们祷告，因我们总以为只要把这些挪开，我们就能活得更温柔、纯洁、圣洁。",
              "simpEn": "God will make our blocks and problems work for His plans. We all have mountains in our lives, and often they are people and things that try to stop our spiritual growth. These blocks may be lies told about us, a hard job, 'a thorn in the flesh,' or our daily cross. We often pray for God to take them away, because we think that if only they were gone, we would live a softer, cleaner, holier life.",
              "simpZh": "神会让我们的障碍为祂的旨意服务。我们生活中都有大山，它们常常是那些要拦住我们灵命进步的人和事。这些障碍可能是别人编造的关于我们的谎话，一份很难的工作，“肉中的一根刺”，或者我们每天要背的十字架。我们常常祷告求神把它们拿走，因为我们总以为只要这些东西被移开了，我们就能活得更温柔、更纯洁、更圣洁。"
            },
            {
              "en": "“How <span class=\"vocab-trigger\" data-vocab=\"foolish\">foolish<\/span> you are, and how slow of heart . . . !” (Luke 24:25). These are the very <span class=\"vocab-trigger\" data-vocab=\"conditions\">conditions<\/span> we need for <span class=\"vocab-trigger\" data-vocab=\"achievement\">achievement<\/span>, and they have been put in our lives as the means of producing the gifts and qualities for which we have been praying so long. We pray for <span class=\"vocab-trigger\" data-vocab=\"patience\">patience<\/span> for many years, and when something begins to test us beyond our <span class=\"vocab-trigger\" data-vocab=\"endurance\">endurance<\/span>, we run from it. We try to <span class=\"vocab-trigger\" data-vocab=\"avoid\">avoid<\/span> it, we see it as some <span class=\"vocab-trigger\" data-vocab=\"insurmountable\">insurmountable<\/span> obstacle to our desired goal, and we believe that if it was removed, we would experience immediate <span class=\"vocab-trigger\" data-vocab=\"deliverance\">deliverance<\/span> and victory. This is not true! We would simply see the <span class=\"vocab-trigger\" data-vocab=\"temptations\">temptations<\/span> to be impatient end. This would not be patience. The only way genuine patience can be <span class=\"vocab-trigger\" data-vocab=\"acquired\">acquired<\/span> is by enduring the very trials that seem so <span class=\"vocab-trigger\" data-vocab=\"unbearable\">unbearable<\/span> today.",
              "zh": "“你们的心信得太迟钝了……！”（路加福音24:25）。这些恰恰是我们达成目标所需的条件，它们被放在我们生命中，正是要产生我们祷告多时的恩赐和品格。我们祈求忍耐多年，但当某事开始试炼我们超过忍受极限时，我们就逃避。我们试图回避它，把它看作通往目标的无法逾越的障碍，并相信只要它被除去，我们就立刻得到解脱和胜利。这不是真的！我们只会看到急躁的试探停止，这却不是忍耐。获得真正忍耐的唯一途径，就是忍受今日那看似难以承受的试炼。",
              "simpEn": "'How foolish you are, and how slow of heart!' These are the exact things we need to grow and reach our goal. They are put in our lives to build the very gifts and character we have been praying for so long. We pray for patience for years, but when something tests us past what we think we can bear, we run away. We try to get out of it, see it as a block too big to climb, and think that if it were taken away we would be free and win at once. That is not true! We would just stop being tempted to be impatient. That is not patience. The only way to gain real patience is to go through the very hard tests that feel so impossible today.",
              "simpZh": "“你们多么愚昧，心里多么迟钝……！”这正是我们成长需要的环境，是神放在我们生命里，为要生出我们祷告许久的品格。我们祈求忍耐许多年，可是当某件事开始考验我们超过能忍受的限度时，我们就逃跑。我们试着躲开，把它看成无法越过的障碍，相信只要它被挪走，我们就能立刻得解脱、得胜。这是不对的！那样我们只会看到急躁的试探结束，那并不是忍耐。要得到真正的忍耐，唯一的方法就是忍受今天这些看起来完全受不了的试炼。"
            },
            {
              "en": "Turn from your running and <span class=\"vocab-trigger\" data-vocab=\"submit\">submit<\/span>. Claim by faith to be a <span class=\"vocab-trigger\" data-vocab=\"partaker\">partaker<\/span> in the patience of Jesus and face your trials in Him. There is nothing in your life that <span class=\"vocab-trigger\" data-vocab=\"distresses\">distresses<\/span> or concerns you that cannot become <span class=\"vocab-trigger\" data-vocab=\"submissive\">submissive<\/span> to the highest purpose. Remember, they are God’s mountains. He puts them there for a reason, and we know He will never fail to keep His <span class=\"vocab-trigger\" data-vocab=\"promise\">promise<\/span>. “God understands the way to it and he alone knows where it <span class=\"vocab-trigger\" data-vocab=\"dwells\">dwells<\/span>, for he views the ends of the earth and sees everything under the heavens” (Job 28:23–24). So when we come to the foot of the mountains, we will find our way. <span class=\"vocab-trigger\" data-vocab=\"from Christ in Isaiah, by F. B. Meyer\">from Christ in Isaiah, by F. B. Meyer<\/span> The purpose of our trials is not only to test our <span class=\"vocab-trigger\" data-vocab=\"worthiness\">worthiness<\/span> but also to increase it, just as the mighty <span class=\"vocab-trigger\" data-vocab=\"oak\">oak<\/span> is tested by the storms as well as strengthened by them.",
              "zh": "不要再逃跑，要顺服。凭信心宣告自己在耶稣的忍耐上有分，并在祂里面面对试炼。你生命中任何使你痛苦或挂虑的事，都能降服于最高的目的之下。记住，这是神的山。祂把它们放在那里是有原因的，我们也知道祂必不忘记祂的应许。“神明白智慧的道路，知道智慧的所在，因祂鉴察直到地极，遍观普天之下”（约伯记28:23–24）。所以我们走到山脚时，必能找到路。 摘自迈尔《以赛亚书中的基督》 试炼的目的不单要考验我们的价值，更是要加增它，正如大橡树既受风暴考验，也因而更坚固。",
              "simpEn": "Stop running and yield. By faith, take a share in the patience of Jesus and face your tests in Him. There is nothing in your life that worries or upsets you that cannot be brought under the highest plan. Remember, they are God's mountains. He puts them there for a reason, and we know He will always keep His promise. 'God knows the way to it and He alone knows where it lives, for He looks to the ends of the earth and sees everything under the sky.' So when we come to the bottom of the mountains, we will find our road. from Christ in Isaiah, by F. B. Meyer The purpose of our hard times is not just to check if we are good enough but to make us better, just as the strong oak tree is tested by storms and made stronger by them.",
              "simpZh": "不要再逃跑了，要顺服。凭信心支取耶稣的忍耐，在祂里面面对试炼。你生活中任何让你烦恼、担心的事，都能被最高的目的掌管。记住，这些是神的山。祂把它们放在那里是有原因的，我们知道祂绝不会不守应许。“神明白那条路，也只有祂知道智慧住在哪里，因为祂看到地极，看见天下一切。”所以我们走到山脚下的时候，就必找到路。摘自迈尔《以赛亚书中的基督》 试炼的目的不只是考验我们够不够好，更是要让我们变得更好，就像大橡树被风暴考验，也因风暴变得更强。"

          "paragraphs": [
            {
              "en": "Be men of <span class=\"vocab-trigger\" data-vocab=\"courage\">courage<\/span>; be strong. (1 Corinthians 16:13)",

              "zh": "绝不要祈求更轻松的生活——要祈求成为更刚强的人！绝不要祈求工作与你的能力相等——要祈求能力与你的工作相等。这样，做成工作就不是神迹——你本身就成了神迹。 菲利普斯·布鲁克斯",

            },
            {
              "en": "We must remember that Christ will not lead us to <span class=\"vocab-trigger\" data-vocab=\"greatness\">greatness<\/span> through an easy or <span class=\"vocab-trigger\" data-vocab=\"self-indulgent\">self-indulgent<\/span> life. An easy life does not lift us up but only takes us down. Heaven is always above us, and we must continually be looking toward it. Some people always avoid things that are <span class=\"vocab-trigger\" data-vocab=\"costly\">costly<\/span>, or things that require <span class=\"vocab-trigger\" data-vocab=\"self-denial\">self-denial<\/span>, <span class=\"vocab-trigger\" data-vocab=\"self-restraint\">self-restraint<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"self-sacrifice\">self-sacrifice<\/span>. Yet it is hard work and difficulties that <span class=\"vocab-trigger\" data-vocab=\"ultimately\">ultimately<\/span> lead us to greatness, for greatness is not found by walking the <span class=\"vocab-trigger\" data-vocab=\"moss-covered path\">moss-covered path<\/span> laid out for us through the <span class=\"vocab-trigger\" data-vocab=\"meadow\">meadow<\/span>. It is found by being sent to <span class=\"vocab-trigger\" data-vocab=\"carve out\">carve out<\/span> our own path with our own hands. Are you willing to <span class=\"vocab-trigger\" data-vocab=\"sacrifice\">sacrifice<\/span> to reach the glorious <span class=\"vocab-trigger\" data-vocab=\"mountain peaks\">mountain peaks<\/span> of God’s purpose for you? <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "我们必须记住，基督不会借着轻松或放纵的生活领我们到伟大之境。安逸的生活不会提升我们，只会带我们下沉。天永远在我们之上，我们必须不断仰望它。有些人总是躲避代价高昂的事，或那些需要舍己、自律和自我牺牲的事。然而，正是艰苦的工作和困难最终领我们到伟大之境，因为伟大不是走在铺好的青苔小径上穿过草场就能找到的；它乃是奉差派去用自己的双手凿出一条路来才能得着的。你愿为达到神旨意中荣耀的峰顶而付出牺牲吗？ 选自",
              "simpEn": "We must remember that Christ will not lead us to become great through a life of ease and pleasing ourselves. An easy life does not lift us up; it only pulls us down. Heaven is always above us, and we must keep looking up. Some people always stay away from things that are hard or that need saying no to self, holding back desires, and giving up things. Yet it is hard work and troubles that finally bring us to real greatness. Greatness is not found by walking on a soft, green path already made for us through the field. It is found by being sent to cut out our own path with our own hands. Are you ready to give up things to reach the high, shining peaks of God's plan for you? selected",
              "simpZh": "我们必须记住，基督不会通过轻松、放纵自己的生活来领我们到伟大。安逸的生活不会提升我们，只会拉我们下去。天永远在我们上方，我们必须不停地向它看。有些人总是躲开那些代价很高的事，或者那些需要舍己、克制自己和牺牲的事。可是，正是艰苦的工作和困难最后领我们到真正的伟大，因为伟大不是走在草地上那条铺好的长满青苔的小路上就能找到的。伟大是被差去用自己的手开凿自己的路才能找到的。你愿意为了达到神旨意中荣耀的山顶而付上代价吗？选自"
            },
            {
              "en": "Be strong! We are not here to play, to dream, to <span class=\"vocab-trigger\" data-vocab=\"drift\">drift<\/span>; We have hard work to do, and loads to lift. <span class=\"vocab-trigger\" data-vocab=\"Shun\">Shun<\/span> not the <span class=\"vocab-trigger\" data-vocab=\"struggle\">struggle<\/span>; face it. It’s God’s gift. Be strong! Say not the days are evil—Who’s to blame? Or fold your hands, as in <span class=\"vocab-trigger\" data-vocab=\"defeat\">defeat<\/span>—O shame! Stand up, speak out, and <span class=\"vocab-trigger\" data-vocab=\"bravely\">bravely<\/span>, In God’s name. Be strong! It matters not how deep <span class=\"vocab-trigger\" data-vocab=\"entrenched\">entrenched<\/span> the wrong, How hard the battle goes, the day how long, <span class=\"vocab-trigger\" data-vocab=\"Faint not\">Faint not<\/span>, fight on! Tomorrow comes the song. <span class=\"vocab-trigger\" data-vocab=\"Maltbie D. Babcock\">Maltbie D. Babcock<\/span>",
              "zh": "要刚强！我们不是来这里玩耍、做梦、漂流的；我们有苦工要做，有重担要背。不要回避争战，要面对它。这是神的礼物。要刚强！不要说这日子邪恶——该怪谁呢？或抱手如败军——何耻！站起来，放胆讲论，奉神的名。要刚强！不论错谬根深柢固，无论战事多艰难，白日多漫长，不要手软，奋战到底！明天凯歌就要响起。 马尔特比·巴布科克",
              "simpEn": "Be strong! We are not here to play, to dream, to float along. We have hard work to do and heavy loads to carry. Do not run from the fight; face it. It is God's gift. Be strong! Do not say these days are bad—who is to blame? Or fold your hands as if you are beaten—O shame! Stand up, speak out, and bravely, in God's name. Be strong! It does not matter how deeply the wrong is dug in, how hard the battle goes, how long the day. Do not grow weak; keep fighting! Tomorrow the song comes. Maltbie D. Babcock",
              "simpZh": "要刚强！我们不是来这里玩、做梦、到处漂的。我们有苦工要做，有重担要扛。不要躲开争战，要面对它。那是神的礼物。要刚强！不要说日子不好——怪谁呢？也不要像打败了一样垂着双手——真羞耻！站起来，开口说，奉神的名勇敢地做。要刚强！无论错误扎根多深，仗打得多难，日子多长，不要手软，继续战斗！明天凯歌就会响起。马尔特比·巴布科克"
            }
          ],

        {
          "sectionId": 7,
          "heading": "August 4",
          "audio": "audio/streams in the desert - August 4.m4a",
          "paragraphs": [
            {
              "en": "Jesus looked up and said, “Father, I thank you that you have heard me.” (John 11:41)",
              "zh": "耶稣举目望天说：“父啊，我感谢你，因为你已经听我。”（约翰福音11:41）",
              "simpEn": "Jesus looked up and said, 'Father, I thank You that You have heard Me.'",
              "simpZh": "耶稣抬头望天，说：“父啊，我感谢你，因为你已经听了我。”"
            },
            {
              "en": "The sequence of events in this passage seems strange and unusual. <span class=\"vocab-trigger\" data-vocab=\"Lazarus\">Lazarus<\/span> was still in his <span class=\"vocab-trigger\" data-vocab=\"tomb\">tomb<\/span>, yet Jesus’ <span class=\"vocab-trigger\" data-vocab=\"thanksgiving\">thanksgiving<\/span> <span class=\"vocab-trigger\" data-vocab=\"preceded\">preceded<\/span> the <span class=\"vocab-trigger\" data-vocab=\"miracle\">miracle<\/span> of raising him from the dead. It seems that thanks would only have been lifted up once the great miracle had been <span class=\"vocab-trigger\" data-vocab=\"accomplished\">accomplished<\/span> and Lazarus had been <span class=\"vocab-trigger\" data-vocab=\"restored\">restored<\/span> to life. But Jesus gave thanks for what He was about to receive. His <span class=\"vocab-trigger\" data-vocab=\"gratitude\">gratitude<\/span> <span class=\"vocab-trigger\" data-vocab=\"sprang forth\">sprang forth<\/span> before the blessing had arrived, in an expression of <span class=\"vocab-trigger\" data-vocab=\"assurance\">assurance<\/span> that it was certainly on its way. The song of <span class=\"vocab-trigger\" data-vocab=\"victory\">victory<\/span> was sung before the battle had been fought. It was the <span class=\"vocab-trigger\" data-vocab=\"Sower\">Sower<\/span> singing the song of <span class=\"vocab-trigger\" data-vocab=\"harvest\">harvest<\/span>—it was thanksgiving before the miracle!",
              "zh": "这段经文的顺序看起来奇怪且不寻常。拉撒路还在坟墓里，耶稣却先献上感谢，然后才行了叫他从死里复活的神迹。按理说，总要等大神迹成就，拉撒路恢复了生命才献感谢。但耶稣为祂将要得着的献上感谢。祂的感恩在祝福到来之前就涌出，显明了祂确信祝福已在路上。得胜之歌在战斗之前就已唱响。这是撒种者在唱收割的歌——是神迹之前的感谢！",
              "simpEn": "The order of events in this part of the Bible seems odd. Lazarus was still in the grave, but Jesus gave thanks before the miracle of raising him from the dead. You would think thanks would wait until the great miracle was done and Lazarus was alive again. But Jesus thanked God for what He was about to get. His thanks poured out before the gift came, showing He was sure it was coming. The winning song was sung before the fight. It was the Planter singing the harvest song—thanksgiving before the miracle!",
              "simpZh": "这段经文里事情发生的顺序看起来很奇怪。拉撒路还在坟墓里，但耶稣在行叫他从死里复活的神迹之前就先感谢了。本来以为要等大神迹完成、拉撒路活过来才感谢。但耶稣为祂即将要得到的东西感谢。祂的感恩在祝福还没到的时候就涌出来了，显出祂确信祝福一定已经在路上了。胜仗的歌在仗还没打之前就唱了。这是撒种的人唱收割的歌——是神迹之前的感谢！"
            },
            {
              "en": "Who ever thinks of <span class=\"vocab-trigger\" data-vocab=\"announcing\">announcing<\/span> a victory song as the army is just heading out to the <span class=\"vocab-trigger\" data-vocab=\"battlefield\">battlefield<\/span>? And where do we ever hear a song of gratitude and thanksgiving for an answer that has not yet been received? Yet in this Scripture passage, there is nothing strange, forced, or <span class=\"vocab-trigger\" data-vocab=\"unreasonable\">unreasonable<\/span> to the Master’s sequence of praise before the miracle. <span class=\"vocab-trigger\" data-vocab=\"Praise\">Praise<\/span> is actually the most <span class=\"vocab-trigger\" data-vocab=\"vital preparation\">vital preparation<\/span> to the working of miracles. Miracles are performed through <span class=\"vocab-trigger\" data-vocab=\"spiritual power\">spiritual power<\/span>, and our spiritual power is always in <span class=\"vocab-trigger\" data-vocab=\"proportion\">proportion<\/span> to our faith. <span class=\"vocab-trigger\" data-vocab=\"John Henry Jowett\">John Henry Jowett<\/span>",
              "zh": "有谁想过在军队正要开赴战场时就宣告凯歌？在哪里听过为尚未得到的应允而唱的感恩之歌？然而在这段经文中，主在神迹之前先赞美的次序，并无丝毫奇特、勉强或不合理之处。赞美实际上是为奇迹发生所作的最重要预备。奇迹是借着属灵能力行出的，而我们的属灵能力总是与信心成正比。 约翰·亨利·乔维特",
              "simpEn": "Who would ever think of telling about a victory song as the army is just heading to the fight? And where do we ever hear a thankful song for an answer that hasn't come yet? But in this Bible part, there is nothing weird, forced, or silly about the Master's order of praise before the miracle. Praise is actually the most important way to get ready for miracles. Miracles happen through spiritual strength, and our spiritual strength is always in line with our faith. John Henry Jowett",
              "simpZh": "谁会想到在军队正要上战场的时候就宣布胜利的凯歌？我们什么时候听过为还没得到的回应而唱的感恩歌呢？但在这段经文里，主在神迹之前先赞美，这一点都不奇怪、不勉强、也不无理。赞美其实是为神迹发生所作的最重要的准备。神迹是靠着属灵的能力行出来的，而我们的属灵能力总是和信心成正比的。约翰·亨利·乔维特"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Praise Changes Things\">Praise Changes Things<\/span> Nothing pleases God more than praise as part of our prayer life, and nothing <span class=\"vocab-trigger\" data-vocab=\"blesses\">blesses<\/span> someone who prays as much as the praise that is offered. I once received a great blessing from this while in <span class=\"vocab-trigger\" data-vocab=\"China\">China<\/span>. I had recently received bad news from home, and deep <span class=\"vocab-trigger\" data-vocab=\"shadows\">shadows<\/span> of darkness seemed to cover my soul. I prayed but the darkness remained. I forced myself to <span class=\"vocab-trigger\" data-vocab=\"endure\">endure<\/span> but the shadows only deepened. Then suddenly one day, as I entered a <span class=\"vocab-trigger\" data-vocab=\"missionary’s\">missionary’s<\/span> home at an <span class=\"vocab-trigger\" data-vocab=\"inland station\">inland station<\/span>, I saw these words on the wall: “Try giving thanks.” So I did, and in a moment every shadow was gone, never to return. Yes, the <span class=\"vocab-trigger\" data-vocab=\"psalmist\">psalmist<\/span> was right: “It is good to praise the Lord” (Ps. 92:1). <span class=\"vocab-trigger\" data-vocab=\"Henry W. Frost\">Henry W. Frost<\/span>",
              "zh": "赞美能改变万事。在祷告生活中，没有什么比赞美更讨神喜悦，也没有什么事比献上的赞美更能祝福祷告的人。我在中国时曾因此大大蒙福。当时我刚接到家乡的坏消息，深沉的黑暗阴影似乎笼罩了我的灵魂。我祷告，黑暗依旧。我强忍着，阴影却更深了。忽然有一天，我进入一个内地站的宣教士家中，看见墙上写着：“试试感谢。”我照做了，刹那间所有阴影全消，永不再来。是的，诗人说得对：“称谢耶和华……是美好的”（诗篇92:1）。 亨利·弗罗斯特",
              "simpEn": "Praise Changes Things. Nothing makes God happier than praise when we pray, and nothing helps a praying person more than the praise they give. I once had a great blessing from this while in China. I had just gotten bad news from home, and deep dark shadows seemed to cover my heart. I prayed, but the dark stayed. I forced myself to keep going, but the shadows only grew deeper. Then suddenly one day, as I walked into a missionary's house at a station far inland, I saw these words on the wall: 'Try giving thanks.' So I did, and right away every shadow was gone and never came back. Yes, the psalm writer was right: 'It is good to praise the Lord.' Henry W. Frost",
              "simpZh": "赞美能改变事情。在祷告生活中，没有什么比赞美更让神喜悦，也没有比献上赞美更能祝福祷告的人。我在中国的时候曾因此得到一个很大的祝福。那时我刚收到从家乡来的坏消息，深深的黑暗阴影好像笼罩了我的灵魂。我祷告了，但黑暗还在。我强忍着，阴影却更深了。然后突然有一天，我走进内地一个宣教士的家，看见墙上写着：“试试感谢。”我照做了，就在那一刻，所有阴影都消失了，再也没有回来。是啊，诗篇作者说得对：“赞美耶和华是好的。”亨利·弗罗斯特"
            }
          ],

    {
      "id": 32,
      "title": "August 5–11",
      "sections": [
        {
          "sectionId": 1,
          "heading": "August 5",
          "audio": "audio/streams in the desert - August 5.m4a",
          "paragraphs": [
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"My grace\">My grace<\/span> is <span class=\"vocab-trigger\" data-vocab=\"sufficient\">sufficient<\/span> for you. (2 Corinthians 12:9)",
              "zh": "我的恩典够你用的。（哥林多后书12:9）",
              "simpEn": "My kindness and help are enough for you.",
              "simpZh": "我的恩典足够你用了。"
            },
            {
              "en": "God was pleased” (1 Cor. 1:21) to take my youngest child from this world, under circumstances that caused me severe trials and pain. And as I returned home from the church <span class=\"vocab-trigger\" data-vocab=\"cemetery\">cemetery<\/span>, having just laid my little one’s body in the grave, I felt a <span class=\"vocab-trigger\" data-vocab=\"compulsion\">compulsion<\/span> to preach to my people on the meaning of trials.",
              "zh": "神按照祂的美意（林前1:21）将我最年幼的孩子从世界取去，当时的情况给我带来极大的试炼和痛苦。当我从教会墓园回家，刚将小家伙的身体安放进坟墓，我感到一股催逼，要向我的会众传讲试炼的意义。",
              "simpEn": "It pleased God to take my youngest child from this world in a way that caused me deep pain. As I came home from the church graveyard after burying my little one, I felt a strong push to preach to my people about the meaning of hard times.",
              "simpZh": "神按美意把我最小的孩子从世上接走，事情经过让我非常痛苦。我从教会墓地回家，刚把小孩的身体埋进坟墓，心里就有一股强烈的催逼，要去向会众讲苦难的意义。"
            },
            {
              "en": "I found that the verse “My grace is sufficient for you” was the text of next week’s Sunday school lesson, so I chose it as my Master’s message to the <span class=\"vocab-trigger\" data-vocab=\"congregation\">congregation<\/span>, as well as His message to me. Yet while trying to write the <span class=\"vocab-trigger\" data-vocab=\"sermon\">sermon<\/span>, I found that in all honesty, I could not say that the words were true in my life. Therefore I knelt down and asked the Lord to make His grace sufficient for me. While I was <span class=\"vocab-trigger\" data-vocab=\"pleading\">pleading<\/span> in this way, I opened my eyes and saw this exact verse <span class=\"vocab-trigger\" data-vocab=\"framed\">framed<\/span> and hanging on the wall. My mother had given it to me a few days before, when I was still at the <span class=\"vocab-trigger\" data-vocab=\"vacation resort\">vacation resort<\/span> where our little child had been taken from us. I had asked someone to hang it on the wall at home during my <span class=\"vocab-trigger\" data-vocab=\"absence\">absence<\/span> but had not yet noticed its words.",
              "zh": "我发现“我的恩典够你用的”这节经文正是下周主日学课程的经文，于是我选择它作为主给会众的信息，也是祂给我的信息。然而，在试着写讲章时，我诚实地说不出这句话在我生命中是真的。于是我跪下，求主使祂的恩典够我使用。就在这样恳求时，我睁开眼，看见正正这节经文被框着挂在墙上。那是几天前母亲送给我的，当时我还在度假地，我们的孩子正是在那里被取去的。我曾请人在我不在时把它挂在家中的墙上，却还没有留意到上面的字句。",
              "simpEn": "I found that the verse 'My grace is enough for you' was the lesson text for next Sunday. So I chose it as God's word to the church and to me. But when I tried to write the talk, I honestly could not say it was real in my life. So I knelt and asked the Lord to make His grace enough for me. While I was begging like this, I opened my eyes and saw that very verse in a frame on the wall. My mother had given it to me a few days before, when I was still at the holiday place where our child was taken from us. I had asked someone to hang it at home while I was away but had not yet looked at the words.",
              "simpZh": "我发现“我的恩典够你用的”这节经文正好是下周主日学的课程，就选它作神给我和会众的话。但写讲道稿时，我诚实地说不出这句话在我生命里是真的。于是我跪下，求主让祂的恩典够我用。我这样恳求着，睁开眼，正好看见这节经文被框着挂在墙上。那是几天前母亲给我的，当时我还在度假的地方，我们的孩子就是在那里被带走的。我请人在我离家时把它挂在墙上，却还没注意上面的字。"
            },
            {
              "en": "Now as I looked up and wiped my eyes, the words met my gaze: “My grace is sufficient for you.” The word “is” was <span class=\"vocab-trigger\" data-vocab=\"highlighted\">highlighted<\/span> in bright green, while the words “my” and “you” were painted in yet another color. In a moment, a message flashed straight to my soul, coming as a <span class=\"vocab-trigger\" data-vocab=\"rebuke\">rebuke<\/span> for having prayed such a prayer as, “Lord, make Your grace sufficient for me.” His answer was almost an <span class=\"vocab-trigger\" data-vocab=\"audible\">audible<\/span> voice that said, “How dare you ask for something that is? I cannot make My grace any more sufficient than I have already made it. Get up and believe it, and you will find it to be true in your life.”",
              "zh": "如今我抬起头，擦干眼泪，那些字映入眼帘：“我的恩典够你用的。”“够”这个字用鲜绿色突出，而“我的”和“你”则涂着另一种颜色。霎时间，一道信息直闪入我灵魂，乃是对我那样祷告的责备——“主啊，求祢使祢的恩典够我用”。祂的回答几乎是一个听得见的声音：“你怎敢求那已经是的东西？我不能使我的恩典比已经成就的更够用。起来相信，你就在生命中看见它是真的。”",
              "simpEn": "Now as I looked up and dried my eyes, the words met my eyes: 'My grace is enough for you.' The word 'is' stood out in bright green, and 'my' and 'you' were in another color. In a flash, a message hit my soul, scolding me for praying, 'Lord, make Your grace enough for me.' His answer was almost a voice I could hear: 'How dare you ask for what already is? I cannot make My grace any more enough than I already have. Get up and believe it, and you will find it to be true in your life.'",
              "simpZh": "我抬起头擦眼泪，那些字就进入我视线：“我的恩典够你用的”。“够”字是亮绿色的，很突出，“我的”和“你”是另一种颜色。一瞬间，一道信息直冲我灵魂，那是对我那种祷告的责备：“主啊，求你让你的恩典够我用”。祂的回答几乎像能听见的声音：“你怎么敢求那本来就是的东西？我不能让我的恩典比现在更够用了。起来相信，你就会在生命中发现这是真的。”"
            },
            {
              "en": "The Lord says it in the simplest way: “My grace is [not will be or may be] sufficient for you.” The words “my,” “is,” and “you” were from that moment <span class=\"vocab-trigger\" data-vocab=\"indelibly\">indelibly<\/span> written upon my heart. And thankfully, I have been trying to live in the reality of that truth from that day to the present time. The underlying lesson that came to me through this experience, and that I seek to <span class=\"vocab-trigger\" data-vocab=\"convey\">convey<\/span> to others, is this: <span class=\"vocab-trigger\" data-vocab=\"Never change God’s facts into hopes or prayers but simply accept them as realities\">Never change God’s facts into hopes or prayers but simply accept them as realities<\/span>, and you will find them to be powerful as you believe them. <span class=\"vocab-trigger\" data-vocab=\"H. W. Webb Peploe\">H. W. Webb Peploe<\/span>",
              "zh": "主以最简单的方式说：“我的恩典够你用的”（不是将会够，也不是可能够）。“我的”、“够”和“你”这几个字，从那时起就不可磨灭地刻在了我心上。感谢主，从那天直到如今，我一直努力活在这真理的实际中。借着这经历临到我的根本功课，也是我渴望传给他人的就是：永远不要把神的事实变成盼望或祷告，只要单纯地接受它们为现实，你信的时候，就必发现它们大有能力。 韦伯·佩普洛伊",
              "simpEn": "The Lord says it in the simplest way: 'My grace is enough for you' (not will be or may be). The words 'my,' 'is,' and 'you' were from that moment forever written on my heart. Thank God, from that day until now I have tried to live in the truth of that fact. The deep lesson I learned and want to pass on is this: Never turn God's facts into hopes or prayers; just accept them as real, and you will find them powerful as you believe. H. W. Webb Peploe",
              "simpZh": "主用最简单的话说：“我的恩典够你用的”（不是将会够，也不是可能够）。“我的”、“够”和“你”这几个字从那时起就永远刻在我心上了。感谢主，从那天直到现在，我一直努力活在这个真理的实际里。我从这经历得到并且想传给别人的根本功课是：永远不要把神的事实变成盼望或祷告，只要单纯接受它们是事实，你信的时候就会发现它们大有能力。韦伯·佩普洛伊"
            },
            {
              "en": "He <span class=\"vocab-trigger\" data-vocab=\"giveth\">giveth<\/span> more grace when the burdens grow greater, He sendeth more strength when the labors increase; To added <span class=\"vocab-trigger\" data-vocab=\"affliction\">affliction<\/span> He addeth His mercies, To <span class=\"vocab-trigger\" data-vocab=\"multiplied\">multiplied<\/span> trials His multiplied peace. When we have exhausted our store of <span class=\"vocab-trigger\" data-vocab=\"endurance\">endurance<\/span>, When our strength has failed ere the day is half done, When we reach the end of our <span class=\"vocab-trigger\" data-vocab=\"hoarded\">hoarded<\/span> resources Our Father’s full giving is only begun. His love has no limit, His grace has no measure, His power no <span class=\"vocab-trigger\" data-vocab=\"boundary\">boundary<\/span> known unto men; For out of His <span class=\"vocab-trigger\" data-vocab=\"infinite\">infinite<\/span> riches in Jesus He giveth and giveth and giveth again. <span class=\"vocab-trigger\" data-vocab=\"Annie Johnson Flint\">Annie Johnson Flint<\/span>",
              "zh": "重担愈沉，祂赐更多恩典；劳苦愈增，祂赐更多力量；苦难加添，祂的怜悯也加添；试炼倍增，祂的平安也倍增。当我们耗尽了忍耐的积蓄，力量在半天未完就已衰竭，当我们用尽了积攒的资源，父的全面给予才刚开始。祂的爱无限，祂恩典无度，祂的能力无边，无人能测；因祂从耶稣里无穷的丰富，赐予又赐予，再赐予。 安妮·约翰逊·弗林特",
              "simpEn": "He gives more grace when loads grow heavier, more strength when work grows more. To more pain He adds more kindness, to more trials He adds more peace. When we have used up all our ability to hold on, when our strength is gone before the day is half over, when we come to the end of our saved-up supplies, our Father's full giving has only just started. His love has no limit, His grace cannot be measured, His power has no edges that people know; for out of His endless riches in Jesus, He gives and gives and gives again. Annie Johnson Flint",
              "simpZh": "担子越重，祂给越多恩典；工作越多，祂赐越多力量；苦难加增，祂的怜悯也加增；试炼加倍，祂的平安也加倍。当我们用尽了所有忍耐的积蓄，还没到半天力量就没了，当我们积攒的资源用到尽头，天父全备的赐予才刚开始。祂的爱无限，恩典无法量，能力没有边界；从耶稣里无穷的丰富中，祂给了又给，再给。安妮·约翰逊·弗林特"
            }

          "paragraphs": [
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Awake\">Awake<\/span>, north wind, and come, south wind! Blow on my garden, that its <span class=\"vocab-trigger\" data-vocab=\"fragrance\">fragrance<\/span> may spread abroad. (Song of Songs 4:16)",
              "zh": "北风啊，兴起！南风啊，吹来！吹在我的园内，使其中的香气散发出来。（雅歌4:16）",
              "simpEn": "Wake up, north wind! Come, south wind! Blow on my garden so its sweet smell will spread everywhere.",
              "simpZh": "北风啊，醒起来！南风啊，来吧！吹在我的园子里，让香气飘出去。"
            },
            {
              "en": "Let us examine the meaning of this prayer for a moment. It is rooted in the fact that in the same way beautiful fragrances may lie hidden in a <span class=\"vocab-trigger\" data-vocab=\"spice plant\">spice plant<\/span>, certain gifts may lie unused or undeveloped in a Christian’s heart. Many seeds of a <span class=\"vocab-trigger\" data-vocab=\"profession of faith\">profession of faith<\/span> may be planted, but from some the air is never filled with the <span class=\"vocab-trigger\" data-vocab=\"aroma\">aroma<\/span> of holy desires or godly deeds. The same winds blow on the <span class=\"vocab-trigger\" data-vocab=\"thistle\">thistle<\/span> and the spice plant, but only one of them <span class=\"vocab-trigger\" data-vocab=\"emits\">emits<\/span> a rich fragrance.",
              "zh": "让我们花一点时间来思考这个祷告的意义。它基于这样一个事实：正如美丽的香气可能隐藏在香料植物中，某些恩赐也可能埋没或未开发在基督徒心里。许多人撒下了信仰的种子，但从有些人那里，空气中从未充满圣洁渴慕或敬虔行为的馨香。同样的风吹在蒺藜和香料植物上，但只有一样发出浓郁的香气。",
              "simpEn": "Let's look at what this prayer means for a moment. It is based on the truth that just as a sweet smell may be hidden inside a spice plant, certain gifts may lie unused or not yet grown in a Christian's heart. Many seeds of saying one believes in God may be planted, but from some, the air is never filled with the sweet smell of holy wants or godly acts. The same winds blow on the thistle and the spice plant, but only the spice plant gives off a rich smell.",
              "simpZh": "我们来想想这个祷告的意思。它的根据是：就像香料植物里面可以藏着香气，基督徒心里也可能藏着没用或没开发的恩赐。很多人种下了信心的种子，但有些人从没有让圣洁的渴慕和敬虔的行为发出香气。同样的风吹过杂草和香料植物，但只有香料植物发出浓浓的香气。"
            },
            {
              "en": "Sometimes God causes severe winds of trial to blow upon His children to develop their gifts. Just as a <span class=\"vocab-trigger\" data-vocab=\"torch\">torch<\/span> burns more brightly when waved back and forth, and just as a <span class=\"vocab-trigger\" data-vocab=\"juniper\">juniper<\/span> plant smells sweetest when thrown into the flames, so the richest qualities of a Christian often arise under the strong winds of suffering and <span class=\"vocab-trigger\" data-vocab=\"adversity\">adversity<\/span>. <span class=\"vocab-trigger\" data-vocab=\"Bruised\">Bruised<\/span> hearts often <span class=\"vocab-trigger\" data-vocab=\"emit\">emit<\/span> the fragrance that God loves to smell.",
              "zh": "有时神让试炼的烈风吹在祂儿女身上，为要发展他们的恩赐。正如火炬来回挥舞时烧得更亮，又如杜松投在火中时气味最香，基督徒最丰盛的品质也常在受苦和逆境的强风中显出。压伤的心常发出神喜爱闻的香气。",
              "simpEn": "Sometimes God sends hard winds of trouble to blow on His children to make their gifts grow. Just as a flame burns brighter when waved around, and just as a juniper bush smells sweetest when thrown into the fire, the best qualities of a Christian often show up under the strong winds of pain and hardship. Bruised hearts often give off the sweet smell that God loves.",
              "simpZh": "有时候神让试炼的大风吹在祂儿女身上，是为叫他们的恩赐发展起来。就像火把来回摇的时候烧得更亮，杜松枝扔进火里时最香，基督徒最美好的品格也常常在痛苦和逆境的强风下显现。受伤的心往往发出神爱闻的香气。"
            },
            {
              "en": "I had a tiny box, a precious box Of human love—my <span class=\"vocab-trigger\" data-vocab=\"perfume of great price\">perfume of great price<\/span>; I kept it close within my heart of hearts And <span class=\"vocab-trigger\" data-vocab=\"scarce\">scarce<\/span> would lift the lid lest it should waste Its fragrance on the air. One day a strange Deep sorrow came with crushing weight, and fell Upon my costly treasure, sweet and rare, And broke the box to pieces. All my heart Rose in <span class=\"vocab-trigger\" data-vocab=\"dismay\">dismay<\/span> and sorrow at this waste, But as I mourned, behold a <span class=\"vocab-trigger\" data-vocab=\"miracle\">miracle<\/span> Of grace <span class=\"vocab-trigger\" data-vocab=\"Divine\">Divine<\/span>. My human love was changed To Heaven’s own, and poured in healing streams On other broken hearts, while soft and clear A voice above me whispered, “Child of Mine, With comfort wherewith you are comforted, From this time forth, go comfort others, And you will know <span class=\"vocab-trigger\" data-vocab=\"blest fellowship\">blest fellowship<\/span> with Me, Whose broken heart of love has healed the world.”",
              "zh": "我有一只小小盒子，宝贵的盒子，装着人的爱——我极贵重的香膏；我把它珍藏在心之心里，几乎不敢掀盖，唯恐香气消散在空气中。一天，一阵奇特的深重忧伤，带着碾压力道坠落，砸在我那甜蜜珍贵的宝物上，把盒子打得粉碎。我的心因这浪费而充满惊愕和悲伤，但正当我哀恸时，看哪，一个属天恩典的奇迹发生了。我那属人的爱变成了属天的爱，如医治的溪流倾倒在别的破碎之心上；同时，一道柔和清晰的声音在我上方低语：“我的孩子，用你所得的安慰，从今以后，去安慰别人，你就必认识与我有福的相交，因我破碎的爱心已经医治了世界。”",
              "simpEn": "I had a small box, a dear box of human love—my perfume of great value. I kept it close deep in my heart and hardly lifted the lid, afraid it would lose its sweet smell into the air. One day a strange, deep sadness came with crushing heaviness and fell on my costly treasure, so sweet and rare, and broke the box into pieces. My whole heart rose up in shock and sadness at this waste. But as I cried, look—a wonder of God's grace happened. My human love was changed into heaven's own love and poured out like healing water onto other broken hearts. Meanwhile, a soft, clear voice above me whispered, 'My child, with the comfort you have received, from now on go and comfort others. And you will know the blessed friendship with Me, whose broken heart of love has healed the world.'",
              "simpZh": "我有一只小盒子，是人的爱——非常贵重的香膏。我把它藏在我心的最深处，几乎不敢打开盖子，怕香气白白散到空气里。有一天，一阵奇怪的深沉忧伤，像碾碎一样的重量，掉在我这又甜又宝贵的珍品上，把盒子打得粉碎。我的心为这浪费充满惊愕和悲伤，但当我哀哭时，看哪，发生了一个恩典的奇迹。我那人的爱变成了天上的爱，像医治的溪流浇在别的破碎心上。同时，一个柔和清晰的声音在我上方低声说：“我的孩子，用你所得到的安慰，从今以后，去安慰别人。你就必认识和我有福的相交，我那因爱破碎的心已经医治了世界。”"

              "zh": "十八世纪末十九世纪初的威尔士传道人圣诞节·伊文斯，曾在日记中写下下面这段话。“一个星期天下午，我骑马赶赴一个约会。突然，在一条很偏僻的路上，我蒙光照看见自己内心冷淡。我翻身下马，把马拴在树上，找了一处僻静的地方。然后，我在痛苦中走来走去，回顾自己的一生。我在破碎和忧伤中等候神三个小时。终于，一阵甜美感觉——祂赦免的爱——漫过我身，我领受了圣灵全新的充满。",
              "simpEn": "Christmas Evans, a Welsh preacher long ago, once wrote this in his diary: 'One Sunday afternoon I was riding a horse to an appointment. Suddenly on a very empty road, I felt guilty about having a cold heart. I got off, tied my horse to a tree, and found a quiet spot. Walking back and forth in deep pain, I looked over my life. I waited before God in brokenness and sadness for three hours. At last a sweet feeling of His forgiving love washed over me, and I received a new filling of His Holy Spirit.'",
              "simpZh": "很久以前的威尔士传道人圣诞节·伊文斯在日记里写道：“一个星期天下午，我骑马去赴约。忽然在一条很偏僻的路上，我被提醒自己内心冷淡。我下了马，把马拴在树上，找了个安静的地方。我在痛苦中走来走去，回顾自己的人生。我在破碎和忧伤中等候神三个小时。终于，一阵祂赦免之爱的甜美感觉临到我，我领受了圣灵全新的充满。”"

            {

              "zh": "“日落时分，我走回路上，找到马，骑往约定之处。第二天，我带着那么大的新能力，向山坡上广大的人群讲道，以致复兴爆发，最终遍及整个威尔士。”这解释了重生之人那个重大问题——早期教会的通关密语——“你们信的时候受了圣灵没有？”（使徒行传19:2）。",
              "simpEn": "'As the sun set, I walked back to the road, found my horse, and rode to my meeting. The next day I preached with such new power to a huge crowd on a hillside that a revival broke out and at last spread through all of Wales.' This explains the big question of the born-again—the password of the early church: 'Did you receive the Holy Spirit when you believed?'",
              "simpZh": "“太阳下山时，我走回路上，找到马，骑去聚会。第二天，我带着全新的能力向山坡上广大的人群讲道，结果复兴爆发，最后传遍了整个威尔士。”这解释了重生之人那个最大的问题——早期教会的口令：“你们信的时候受了圣灵没有？”"
            },
            {
              "en": "Oh, the Spirit-filled life; is it thine, is it thine? Is your soul <span class=\"vocab-trigger\" data-vocab=\"wholly\">wholly<\/span> filled with the Spirit <span class=\"vocab-trigger\" data-vocab=\"Divine\">Divine<\/span>? As a child of the King, has He fallen on thee? Does He reign in your soul, so that all men may see The dear Savior’s <span class=\"vocab-trigger\" data-vocab=\"blest image\">blest image<\/span> reflected in thee? Has He swept through your soul like the waves of the sea? Does the Spirit of God daily rest upon thee? Does He <span class=\"vocab-trigger\" data-vocab=\"sweeten\">sweeten<\/span> your life, does He keep you from care? Does He guide you and bless you in answer to prayer? Is your joy to be led of the Lord ev’rywhere? Is He near you each hour, does He stand at your side? Does He <span class=\"vocab-trigger\" data-vocab=\"clothe\">clothe<\/span> you with strength, has He come to <span class=\"vocab-trigger\" data-vocab=\"abide\">abide<\/span>? Does He teach you to know that all things may be done Through the grace and the power of the <span class=\"vocab-trigger\" data-vocab=\"Crucified One\">Crucified One<\/span>? Does He witness to you of the <span class=\"vocab-trigger\" data-vocab=\"glorified Son\">glorified Son<\/span>? Has He purified you with the fire from above? Is He first in your thoughts, does He have all your love? Is His service your choice, and your sacrifice sweet? Is your doing His will both your drink and your meat? Do you run at His calling with glad <span class=\"vocab-trigger\" data-vocab=\"eager feet\">eager feet<\/span>? Has He freed you from self and from all of your <span class=\"vocab-trigger\" data-vocab=\"greed\">greed<\/span>? Do you <span class=\"vocab-trigger\" data-vocab=\"hasten\">hasten<\/span> to comfort your brother in need? As a soldier of Christ does your power endure? Is your hope in the Lord everlasting and sure? Are you patient and <span class=\"vocab-trigger\" data-vocab=\"meek\               "zh": "哦，圣灵充满的生命，是你的吗？你的灵魂完全被神圣之灵充满了吗？身为王的儿女，祂可曾降在你身上？祂是否在你灵魂中掌权，使人人都看见亲爱救主的佳美形像从你返照出来？祂可曾如海涛漫过你灵魂？神的灵是否每日安息于你？祂是否甘甜你的生活，使你无忧虑？祂是否引导你，在应允祷告中祝福你？你以被主各处引领为喜乐吗？祂是否每时靠近你，站在你身旁？祂是否以能力为衣给你穿上，祂可曾来居住？祂是否教导你知道，凡事都能藉着被钉之主宰的恩典与能力而作？祂是否向你见证那得荣耀的圣子？祂是否用上头来的火洁净了你？祂是否在你思想中居首位，是否得着你全部的爱？你是否以事奉祂为选择，以牺牲为甘甜？遵行祂旨意是否成为你的饮食？你是否以欢快急切的脚步响应祂的呼召？祂是否将你从自我和一切贪欲中释放？你是否急忙去安慰有需要的弟兄？作为基督的精兵，你的能力是否持久？你在主里的盼望是否永远坚固？你是否忍耐温柔，纯洁无瑕？哦，圣灵充满的生命可以是你的，可以是你的，神的荣耀光辉（舍吉拿荣耀）可以永远照在你灵魂里；你有分于那风暴尽平的生命，你有分于被神所赐福的圣灵充满；这是你的，正是你的，因你的主早已如此命定。",
              "simpEn": "O the life filled with the Spirit; is it yours? Is your soul completely filled with God's Spirit? As a child of the King, has He come upon you? Does He rule in your soul so that everyone can see the dear Savior's lovely image shining from you? Has He swept through your soul like ocean waves? Does God's Spirit rest on you each day? Does He make your life sweet, keep you from worry? Does He lead and bless you when you pray? Is your joy to be led by the Lord everywhere? Is He near you every hour, standing by your side? Does He cover you with strength, has He come to stay? Does He teach you that all things can be done through the grace and power of the One who died on the cross? Does He tell you about the Son now in glory? Has He cleaned you with fire from above? Is He first in your thoughts, does He have all your love? Is serving Him your choice, and your giving sweet? Is doing His will your food and drink? Do you run at His call with glad, ready feet? Has He freed you from self and all selfish wants? Do you hurry to comfort a brother in need? As Christ's soldier, does your strength last? Is your hope in the Lord forever and sure? Are you patient and gentle, tender and pure? O the Spirit-filled life can be yours! God's shining glory can always fill your soul. It is yours to live with all storms quieted, it is yours to be filled with God's blessed Holy Spirit. It is yours, really yours, because your Lord has willed it so.",
              "simpZh": "哦，被圣灵充满的生命，是不是你的？你的灵魂完全被神的灵充满了吗？作为王的儿女，祂有没有降在你身上？祂有没有在你心里掌权，让人人都能从你身上看见亲爱救主的美丽形象？祂有没有像海浪一样扫过你的灵魂？神的灵是不是每天停留在你身上？祂有没有让你的生命变甜，让你无忧无虑？祂有没有引导你，在祷告中祝福你？你是否以主随处引导为快乐？祂是不是每时每刻靠近你，站在你身边？祂有没有用力量遮蔽你，祂有没有来住在你里面？祂有没有教导你，所有事情都可以借着那位钉十字架的主的恩典和能力做成？祂有没有向你见证那位得了荣耀的神子？祂有没有用上面来的火洁净你？祂是不是你心思中居首位的，是否得到了你全部的爱？你是不是选择事奉祂，以牺牲为甘甜？遵行祂旨意是不是你的饮食？你是不是用快乐急切的脚步回应祂的呼召？祂有没有把你从自我和贪心中释放出来？你是不是赶紧去安慰有需要的弟兄？作为基督的战士，你的能力持久吗？你在主里的盼望是否永远确定？你是不是忍耐温柔，又纯洁？哦，圣灵充满的生命可以是你的，神的荣耀光辉可以永远在你灵魂里照耀；你可以活在风浪全都平息的生命中，你可以被神所赐的圣灵充满；这是你的，就是你的，因为你的主已经这样定了。"

            {
              "en": "You are my King and my God, who <span class=\"vocab-trigger\" data-vocab=\"decrees\">decrees<\/span> victories for Jacob. (Psalm 44:4)",

              "zh": "任何拦阻你恩典长进或你基业工作的仇敌，都已经包含在你救主的得胜之中。当记住：“耶和华对约书亚说：‘你不要因他们惧怕。……我要将他们全都交在[你]手中’”（约书亚记11:6）。也当想起：你们若抵挡仇敌，“他们必离开你们逃跑”（雅各书4:7）。并要记住约书亚对百姓所说的话：“你们不要惧怕，也不要惊惶。应当刚强壮胆”（约书亚记10:25）。主与你们同在，“你们都是大能的勇士”（约书亚记1:14），你们既然与全能者合一，就大有能力。所以，要宣告得胜！",
              "simpEn": "No enemy that tries to stop your growth in grace or your work for Christ was left out of your Savior's victory. Remember, 'The Lord said to Joshua, Don't be afraid of them, because I will give all of them to you.' Also remember that when you stand against your enemies, they will run from you. And remember Joshua's words to the people: 'Do not be afraid; do not be discouraged. Be strong and brave.' The Lord is with you, 'mighty men of courage,' and you are mighty because you are one with the Mightiest. So claim the win!",
              "simpZh": "凡是拦阻你恩典长进和基督徒工作的仇敌，都已经被包含在你救主的得胜里了。要记住，主曾对约书亚说：“不要怕他们，因为我要把他们全都交在你手里。”也要记住，你抵挡仇敌，他们就必逃跑。还有约书亚对百姓说的话：“不要惧怕，不要惊惶，要刚强壮胆。”主与你们同在，你们是“大能的勇士”，你们与最全能者合一，所以大有能力。因此，宣告胜利吧！"
            },
            {
              "en": "Whenever your enemies are closing in on you, claim victory! Whenever your heart and your flesh fail you, look up and claim VICTORY! Be sure you claim your share in the <span class=\"vocab-trigger\" data-vocab=\"triumph\">triumph<\/span> that Jesus won, for He won it not for Himself alone but for us all. Remember that you were in Him when He won it—so claim victory! Count Christ’s victory as yours and gather the <span class=\"vocab-trigger\" data-vocab=\"spoils\">spoils<\/span> of the war. Neither the giant “<span class=\"vocab-trigger\" data-vocab=\"descendants of Anak\">descendants of Anak<\/span>” (Num. 13:33) nor <span class=\"vocab-trigger\" data-vocab=\"fortified cities\">fortified cities<\/span> need <span class=\"vocab-trigger\" data-vocab=\"intimidate\">intimidate<\/span> or defeat you. You are a part of the <span class=\"vocab-trigger\" data-vocab=\"conquering army\">conquering army<\/span>. Claim your share in the Savior’s victory. <span class=\"vocab-trigger\" data-vocab=\"from Joshua, by F. B. Meyer\">from Joshua, by F. B. Meyer<\/span>",
              "zh": "每逢仇敌逼近你时，要宣告得胜！每逢你的心与肉体衰残时，要向上望，宣告得胜！务要确保你支取了耶稣所赢得的凯旋中属你的那份，因为祂不是单为自己赢的，乃是为我们众人赢的。当记住祂得胜时你也在祂里面——所以要宣告得胜！算基督的得胜为你的，收取战争的掠物。无论是“亚衲族”的巨人（民数记13:33），还是坚固的城池，都无需使你恐惧或被击败。你是得胜军队的一份子。领取救主得胜中你那份吧。 摘自迈尔《约书亚记》",
              "simpEn": "Whenever your enemies are closing in, claim the win! Whenever your heart and body fail you, look up and claim VICTORY! Be sure to take your share of the winning that Jesus won, because He won it not just for Himself but for all of us. Remember you were in Him when He won—so claim it! Count Christ's victory as yours and gather the goods of the war. Neither the giant 'children of Anak' nor walled cities need to scare or beat you. You are part of the winning army. Take your share in the Savior's victory. from Joshua, by F. B. Meyer",
              "simpZh": "每当仇敌逼近，就要宣告得胜！每当你的心和你身体衰败，就向上看，宣告胜利！一定要支取耶稣所赢得的胜利中属于你的部分，因为祂不是只为自己赢，是为我们所有人赢的。要记住祂得胜时你也在祂里面——所以要宣告得胜！把基督的胜利算作你的，收取战利品。不管是“亚衲族”的巨人还是坚固的城池，都不用惧怕，也不用被打败。你是得胜军队的一员。领取救主得胜中你那份吧。 摘自迈尔《约书亚记》"
            },
            {
              "en": "We are children of the King. Therefore which of these most honors our <span class=\"vocab-trigger\" data-vocab=\"divine Sovereign\">divine Sovereign<\/span>: failing to claim our rights and even doubting they belong to us, or <span class=\"vocab-trigger\" data-vocab=\"asserting\">asserting<\/span> our <span class=\"vocab-trigger\" data-vocab=\"privilege\">privilege<\/span> as children of the Royal Family and demanding the rights that accompany our <span class=\"vocab-trigger\" data-vocab=\"inheritance\">inheritance<\/span>?",
              "zh": "我们是王的儿女。那么，哪一样更尊荣我们这位神圣的君王呢：是不认领自己的权利，甚至怀疑这些权利是否属于我们；还是坚持以王室儿女的身份，要求那随基业而来的权利？",

        {
          "sectionId": 5,
          "heading": "August 9",
          "audio": "audio/streams in the desert - August 9.m4a",
          "paragraphs": [
            {
              "en": "Blessed are those whose <span class=\"vocab-trigger\" data-vocab=\"strength\">strength<\/span> is in you. . . . As they pass through the <span class=\"vocab-trigger\" data-vocab=\"Valley of Baca\">Valley of Baca<\/span>, they make it a place of <span class=\"vocab-trigger\" data-vocab=\"springs\">springs<\/span>. (Psalm 84:5–6)",
              "zh": "靠你有力量……的人有福了！他们经过流泪谷，叫这谷变为泉源之地。（诗篇84:5–6）",
              "simpEn": "Happy are those whose power comes from You. . . . As they go through the Valley of Weeping, they turn it into a place of water springs.",
              "simpZh": "那些从你得到力量的人是有福的……他们走过流泪谷，就把它变成有泉水的地方。"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Comfort\">Comfort<\/span> is not given to us when we are <span class=\"vocab-trigger\" data-vocab=\"lighthearted\">lighthearted<\/span> and cheerful. We must travel the depths of <span class=\"vocab-trigger\" data-vocab=\"emotion\">emotion<\/span> in order to experience comfort—one of God’s most <span class=\"vocab-trigger\" data-vocab=\"precious gifts\">precious gifts<\/span>. And then we must be prepared to become coworkers with Him. When the <span class=\"vocab-trigger\" data-vocab=\"shadows of night\">shadows of night<\/span>—needed night—gather over the garden of our souls, when leaves close up and flowers no longer reflect any sunlight within their folded <span class=\"vocab-trigger\" data-vocab=\"petals\">petals<\/span>, and when we experience even the thickest darkness, we must remember that we will never be found <span class=\"vocab-trigger\" data-vocab=\"wanting\">wanting<\/span> and that the comforting drops of heavenly <span class=\"vocab-trigger\" data-vocab=\"dew\">dew<\/span> fall only after the sun has set.",
              "zh": "安慰并非在我们轻松愉快时赐下。我们必须经历情感的深处，才能得着安慰——神最珍贵的恩赐之一。然后我们还必须准备好与祂同工。当夜影——必需的夜影——聚集在我们心灵的园子上空，当叶子合拢，花朵在合起的花瓣里不再反射日光，当我们经历甚至最深的黑暗时，必须记住我们永不会缺乏，那安慰的天露只在日落后才降下。",
              "simpEn": "Comfort is not given to us when we are happy and cheerful. We must go through deep feelings in order to know comfort—one of God's most dear gifts. And then we must be ready to work with Him. When the shadows of night—night that we need—gather over the garden of our souls, when leaves fold up and flowers no longer shine with sunlight inside their closed petals, and when we go through even the darkest times, we must remember that we will never be without what we need, and the comforting drops of heaven's dew fall only after the sun has gone down.",
              "simpZh": "安慰不是在我们开心快乐的时候给我们的。我们必须走过情感的深处，才能经历安慰——那是神最宝贵的礼物之一。然后我们还必须准备好与祂同工。当黑夜的影子——我们需要的那种黑夜——罩在我们灵魂的园子上方，当叶子合起来，花在闭合的花瓣里不再反射阳光，甚至当我们经历最深的黑暗时，我们必须记住，我们永远不会缺乏，因为天上的安慰甘露只有在太阳下山后才降下来。"
            },
            {
              "en": "I have been through the <span class=\"vocab-trigger\" data-vocab=\"valley of weeping\">valley of weeping<\/span>, The valley of sorrow and pain; But the “God of all comfort” was with me, At hand to <span class=\"vocab-trigger\" data-vocab=\"uphold\">uphold<\/span> and <span class=\"vocab-trigger\" data-vocab=\"sustain\">sustain<\/span>. As the earth needs the clouds and sunshine, Our souls need both sorrow and joy; So He places us oft in the <span class=\"vocab-trigger\" data-vocab=\"furnace\">furnace<\/span>, The <span class=\"vocab-trigger\" data-vocab=\"dross\">dross<\/span> from the gold to destroy. When he leads through some valley of trouble, His <span class=\"vocab-trigger\" data-vocab=\"omnipotent hand\">omnipotent hand<\/span> we trace; For the trials and sorrows He sends us, Are part of His lessons in grace. Oft we run from the <span class=\"vocab-trigger\" data-vocab=\"purging\">purging<\/span> and <span class=\"vocab-trigger\" data-vocab=\"pruning\">pruning<\/span>, Forgetting the <span class=\"vocab-trigger\" data-vocab=\"Gardener\">Gardener<\/span> knows That the deeper the cutting and trimming, The richer the <span class=\"vocab-trigger\" data-vocab=\"cluster\">cluster<\/span> that grows. Well He knows that <span class=\"vocab-trigger\" data-vocab=\"affliction\">affliction<\/span> is needed; He has a wise purpose in view, And in the dark valley He whispers, “Soon you’ll understand what I do.” As we travel through life’s shadowed valley, Fresh springs of His love ever rise; And we learn that our sorrows and losses, Are <span class=\"vocab-trigger\" data-vocab=\"blessings just sent in disguise\">blessings just sent in disguise<\/span>. So we’ll follow wherever He leads us, Let the path be <span class=\"vocab-trigger\" data-vocab=\"dreary\">dreary<\/span> or bright; For we’ve proved that our God can give comfort; Our God can give <span class=\"vocab-trigger\" data-vocab=\"songs in the night\">songs in the night<\/span>.",
              "zh": "我曾行过流泪谷，忧伤痛苦的谷；但“赐各样安慰的神”与我同在，随时扶持并托住我。正如大地需要云朵和阳光，我们的灵魂也需要忧伤和喜乐；因此祂常将我们放在炉中，为要烧掉金子里的渣滓。当祂领过某个患难之谷，我们就能追踪祂全能的膀臂；因为祂所赐的试炼和忧愁，都是祂恩典课程的一部分。我们常常逃避修剪和炼净，忘了园丁深知，越深的修削与剪枝，所长出的果串便越丰硕。祂很清楚我们需要患难；祂心中有智慧的美意，在幽暗的谷中祂轻声说：“不久你就必明白我所做的。”当我们行过人生中荫蔽的幽谷，祂爱的新泉不住涌起；我们便认识到，我们的忧伤与损失，不过是化了装的祝福。因此，无论祂领我们往何处，无论路途阴郁或光明，我们都必跟随；因为我们已经证明，我们的神能赐安慰；我们的神能在夜间赐下歌声。",
              "simpEn": "I have walked through the valley of tears, the valley of sadness and hurt; but the 'God of all comfort' was with me, ready to hold me up and keep me. Just as the earth needs clouds and sunshine, our souls need both sadness and joy; so He often puts us in the hot oven to burn away the waste from the gold. When He leads through some valley of trouble, we can see His all-powerful hand; for the tests and sorrows He sends us are part of His lessons of grace. Often we run from the cleaning and cutting back, forgetting the Gardener knows that the deeper the cutting, the richer the bunch of fruit that grows. He knows well that trouble is needed; He has a wise plan in mind, and in the dark valley He whispers, 'Soon you will understand what I am doing.' As we walk through life's shadowed valley, new springs of His love keep rising up; and we learn that our sorrows and losses are really blessings sent in a hidden form. So we will follow wherever He leads, whether the road is sad or bright; for we have proved that our God can give comfort; our God can give songs in the night.",
              "simpZh": "我走过了流泪谷，那是悲伤和痛苦的谷；但“赐各样安慰的神”与我同在，随时扶助我、托住我。就像大地需要乌云和阳光，我们的灵魂也需要忧伤和喜乐；所以祂常常把我们放进火炉里，要烧掉金子里的杂质。当祂带领走过患难的深谷，我们就能认出祂全能的膀臂；因为祂给我们的试炼和忧伤，都是祂恩典功课的一部分。我们常常逃避炼净和修剪，忘了园丁知道，修剪得越深，结出的果串就越丰盛。祂完全知道我们需要患难；祂心中有一个智慧的计划，在暗谷里祂轻声说：“很快你就会明白我所做的。”当我们走过人生中布满阴影的山谷，祂爱的新鲜泉水不断涌出；我们才明白，我们的忧伤和损失，不过是装成另外样子的祝福。所以无论祂领我们去哪里，不管道路是阴沉还是光明，我们都要跟随；因为我们已经证实，我们的神能赐下安慰；我们的神能在夜间赐下歌声。"
            }

        {

          "paragraphs": [
            {
              "en": "Yet when he heard that <span class=\"vocab-trigger\" data-vocab=\"Lazarus\">Lazarus<\/span> was sick, he stayed where he was two more days. (John 11:6)",

            },
            {
              "en": "This <span class=\"vocab-trigger\" data-vocab=\"miraculous\">miraculous<\/span> story begins with the following <span class=\"vocab-trigger\" data-vocab=\"declaration\">declaration<\/span>: “Jesus loved Martha and her sister and Lazarus” (v. 5). It is as if God were teaching us that at the very heart and foundation of all His <span class=\"vocab-trigger\" data-vocab=\"dealings\">dealings<\/span> with us, no matter how dark and mysterious they may be, we must dare to believe in and <span class=\"vocab-trigger\" data-vocab=\"affirm\">affirm<\/span> His <span class=\"vocab-trigger\" data-vocab=\"infinite\">infinite<\/span>, <span class=\"vocab-trigger\" data-vocab=\"unmerited\">unmerited<\/span>, and unchanging love. Yet love permits pain to occur. Mary and Martha never doubted that Jesus would quickly <span class=\"vocab-trigger\" data-vocab=\"avert\">avert<\/span> every obstacle to keep their brother from death, “yet when he heard that Lazarus was sick, he stayed where he was two more days.”",
              "zh": "这个奇妙的故事以这样的宣告开头：“耶稣素来爱马大和她妹子并拉撒路”（5节）。仿佛神正在教导我们：在祂与我们交往的最深处和根基上，无论那些作为看似多黑暗、多奥秘，我们必须敢于相信并确认祂那无限、不配得、永不改变的爱。然而，爱容许痛苦发生。马大和马利亚从未怀疑耶稣会快快排除一切障碍，保守她们的兄弟不死，“然而听见拉撒路病了，就在所居之地仍住了两天。”",
              "simpEn": "This wonderful story starts with the clear words: 'Jesus loved Martha and her sister and Lazarus.' It is as if God is teaching us that at the very center of all He does with us, no matter how dark and hard to understand, we must dare to believe and say firmly that His love is endless, not earned, and never changing. Yet love allows pain to happen. Mary and Martha never doubted that Jesus would quickly stop anything that would let their brother die, 'yet when He heard Lazarus was sick, He stayed where He was two more days.'",
              "simpZh": "这个奇妙的故事以这样一句清楚的话开始：“耶稣爱马大和她妹妹以及拉撒路。”就好像神在教导我们，在祂与我们交往的最深之处和根基上，无论事情看起来多黑暗、多难理解，我们必须敢相信并坚定地承认祂那无限、不配得、永不改变的爱。然而，爱允许痛苦发生。马大和马利亚从没怀疑耶稣会快快拦阻一切障碍，不让她们的兄弟死，“然而，当祂听见拉撒路病了，却在原地又住了两天。”"
            },
            {
              "en": "What a startling word: “<span class=\"vocab-trigger\" data-vocab=\"Yet\">Yet<\/span>”! Jesus <span class=\"vocab-trigger\" data-vocab=\"refrained\">refrained<\/span> from going not because He did not love them but because He did love them. It was His love alone that kept Him from hurrying at once to their beloved yet <span class=\"vocab-trigger\" data-vocab=\"grief-stricken\">grief-stricken<\/span> home. Anything less than <span class=\"vocab-trigger\" data-vocab=\"infinite love\">infinite love<\/span> would have rushed instantly to the relief of those beloved and troubled hearts, in an effort to end their grief, to have the blessing of wiping and stopping the flow of their tears, and to cause their sorrow and pain to flee. Only the power of <span class=\"vocab-trigger\" data-vocab=\"divine love\">divine love<\/span> could have held back the <span class=\"vocab-trigger\" data-vocab=\"spontaneity\">spontaneity<\/span> of the Savior’s <span class=\"vocab-trigger\" data-vocab=\"tender-heartedness\">tender-heartedness<\/span> until the angel of pain had finished his work.",
              "zh": "这是何等惊人的字眼：“然而”！耶稣之所以不去，不是因为不爱他们，而正是因为爱他们。单单是祂的爱阻止了祂立刻赶赴那蒙爱却满有忧伤的家。任何不及无限之爱的事物，都会即刻冲去解救那些可爱又受困的心，要了结他们的伤痛，得着擦干并止住他们眼泪的祝福，使他们的忧愁痛苦消失。只有神圣之爱的能力能抑制救主那温柔心肠的天然流露，直到痛苦的天使完成了他的工作。",
              "simpEn": "What a surprising word: 'Yet'! Jesus held back from going not because He did not love them, but because He did love them. His love alone kept Him from rushing at once to their loved but heartbroken home. Anything less than a perfect, endless love would have hurried right away to help those dear troubled hearts, to end their sadness, to have the joy of drying their tears, and to make their pain run away. Only the power of God's love could have held back the quick, tender feelings of the Savior until the angel of pain had finished his work.",
              "simpZh": "多么让人惊讶的一个字：“然而”！耶稣忍住不去，不是因为不爱他们，而正是因为爱他们。单单是祂的爱阻止了祂立刻冲到那个蒙爱却充满悲伤的家。任何比无限之爱少一点的爱，都会马上冲去帮助那些可爱又受困的心，去结束他们的痛苦，去得着擦干并止住他们眼泪的福气，让他们的忧伤和痛苦快跑离开。只有神圣之爱的能力才能压住救主那温柔心肠的自然冲动，直到痛苦的天使做完了他的工。"

            {
              "en": "Who can <span class=\"vocab-trigger\" data-vocab=\"estimate\">estimate<\/span> the great debt we owe to suffering and pain? If not for them, we would have little <span class=\"vocab-trigger\" data-vocab=\"capacity\">capacity<\/span> for many of the great <span class=\"vocab-trigger\" data-vocab=\"virtues\">virtues<\/span> of the Christian life. Where would our faith be if not for the trials that test it; or <span class=\"vocab-trigger\" data-vocab=\"patience\">patience<\/span>, without anything to endure or experience and without <span class=\"vocab-trigger\" data-vocab=\"tribulations\">tribulations<\/span> to develop it? <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "谁能测度我们欠痛苦和患难的多大恩情呢？若没有它们，我们对基督徒生命中许多伟大美德就很少有容量去承受。如果没有考验它的试炼，我们的信心在哪里呢？若没有需要忍受和经历的事，没有患难来造就它，忍耐又在哪里呢？ 选自",
              "simpEn": "Who can measure how much we owe to suffering and pain? Without them, we would not be able to hold many of the great good qualities of the Christian life. Where would our faith be without the hard times that test it? Or patience, without anything to bear or go through, and without troubles to grow it? selected",
              "simpZh": "谁能估算我们欠了痛苦和患难多大的人情？要是没有它们，我们对于基督徒生命里许多伟大的美德，就没有多少容量去承受。如果没有考验它的试炼，我们的信心会怎么样？如果没有需要忍受的事，没有患难来培养它，忍耐又会怎么样？选自"

            {
              "en": "Loved! then the way will not be <span class=\"vocab-trigger\" data-vocab=\"drear\">drear<\/span>; For One we know is ever near, Proving it to our hearts so clear That we are loved. Loved when our sky is clouded o’er, And days of sorrow press us <span class=\"vocab-trigger\" data-vocab=\"sore\">sore<\/span>; Still we will trust Him evermore, For we are loved. Time, that affects all things below, Can never change the love He’ll show; The heart of Christ with love will flow, And we are loved.",
              "zh": "蒙爱！路途就不阴郁；因我们所知的那一位永远相近，清楚向我们的心证明，我们蒙了爱。蒙爱！当我们的天空乌云密布，忧苦日子重压我们；我们仍要永远信靠祂，因我们蒙了爱。时间虽影响地上万事，却永不能改变祂的爱；基督之心满溢着爱，我们蒙了爱。",
              "simpEn": "Loved! Then the road will not be sad; for One we know is always near, making it so clear to our hearts that we are loved. Loved when our sky is cloudy and days of sadness press us hard; still we will trust Him forever, for we are loved. Time, which changes everything here below, can never change the love He shows; the heart of Christ will flow with love, and we are loved.",

            {
              "en": "Though the <span class=\"vocab-trigger\" data-vocab=\"fig tree\">fig tree<\/span> does not <span class=\"vocab-trigger\" data-vocab=\"bud\">bud<\/span> and there are no grapes on the <span class=\"vocab-trigger\" data-vocab=\"vines\">vines<\/span>, though the olive crop fails and the fields produce no food, though there are no sheep in the <span class=\"vocab-trigger\" data-vocab=\"pen\">pen<\/span> and no <span class=\"vocab-trigger\" data-vocab=\"cattle\">cattle<\/span> in the <span class=\"vocab-trigger\" data-vocab=\"stalls\">stalls<\/span>, yet I will <span class=\"vocab-trigger\" data-vocab=\"rejoice\">rejoice<\/span> in the Lord, I will be joyful in God my <span class=\"vocab-trigger\" data-vocab=\"Savior\">Savior<\/span>. (Habakkuk 3:17–18)",

              "simpZh": "就算无花果树不发芽，葡萄树不结果，橄榄树没有收成，田地不出粮食，羊圈里没有羊，牛棚里没有牛——我还是要因耶和华快乐，因救我的神欢喜。"

            {
              "en": "I ask you to observe what a <span class=\"vocab-trigger\" data-vocab=\"disastrous\">disastrous<\/span> situation is being described in this passage and to notice how <span class=\"vocab-trigger\" data-vocab=\"courageous\">courageous<\/span> is the faith that is expressed. It is as if the writer were actually saying, “Even if I am forced to undergo the <span class=\"vocab-trigger\" data-vocab=\"extreme condition\">extreme condition<\/span> of not knowing where to find my next meal, and although my house is empty and my fields yield no crops and I see the evidence of divine <span class=\"vocab-trigger\" data-vocab=\"pestilence\">pestilence<\/span> where I once saw the fruits of God’s <span class=\"vocab-trigger\" data-vocab=\"plentiful provision\">plentiful provision<\/span>, ‘yet I will rejoice in the Lord.’” I believe that these words are worthy of being written forever in stone with a <span class=\"vocab-trigger\" data-vocab=\"diamond tool\">diamond tool<\/span>. Oh, by God’s grace, may they be deeply <span class=\"vocab-trigger\" data-vocab=\"etched\">etched<\/span> on the <span class=\"vocab-trigger\" data-vocab=\"tablets\">tablets<\/span> of each of our hearts! Although the above verse is very <span class=\"vocab-trigger\" data-vocab=\"concise\">concise<\/span>, it nevertheless <span class=\"vocab-trigger\" data-vocab=\"implies\">implies<\/span> or expresses the following thoughts of the writer: that in his time of <span class=\"vocab-trigger\" data-vocab=\"distress\">distress<\/span> he would flee to God; that he would maintain his spiritual <span class=\"vocab-trigger\" data-vocab=\"composure\">composure<\/span> under the darkest of circumstances; and that in the midst of everything, he would delight himself with a <span class=\"vocab-trigger\" data-vocab=\"sacred joy\">sacred joy<\/span> in God and have cheerful <span class=\"vocab-trigger\" data-vocab=\"expectations\">expectations<\/span> of Him. <span class=\"vocab-trigger\" data-vocab=\"Heroic\">Heroic<\/span> confidence! Glorious faith! <span class=\"vocab-trigger\" data-vocab=\"Unconquerable\">Unconquerable<\/span> love! <span class=\"vocab-trigger\" data-vocab=\"Philip Doddridge\">Philip Doddridge<\/span>",
              "zh": "我请诸位注意这段经文所描述的灾难性局面是何等严重，也请留意所表达的信仰是何等勇敢。仿佛作者实际上在说：“即使我被迫面临不知道下一餐从何而来的极端处境，虽然我的房屋空空，田地不出庄稼，在曾见神丰盛供应之处如今只见神降灾的证据，‘然而我仍要因耶和华欢欣’。”我相信这些话配得用金刚钻永远刻在石头上。哦，愿靠神的恩典，它们深深铭刻在我们各人的心版上！虽然这节经文非常简洁，却隐含并表达了作者的以下心意：在危难中，他要投奔神；在最黑暗的环境中，他要持守灵里的镇静；并在一切之中，他要以神为神圣的喜乐，并以愉快的盼望仰望祂。英勇的信心！荣耀的信靠！不可征服的爱！ 菲利普·多德里奇",
              "simpEn": "I want you to see what a terrible situation this describes and notice how brave the faith is. It is as if the writer were saying, 'Even if I am forced into the hardest place of not knowing where my next meal will come from, even if my house is empty and my fields give no crops, and I see signs of God's punishing sickness where I once saw His rich giving, yet I will be happy in the Lord.' I believe these words are worth writing forever in stone with a diamond. Oh, by God's grace, may they be cut deep on the tablets of our hearts! Although the verse is short, it holds these thoughts: in his time of trouble he would run to God; he would keep his spirit calm in the darkest times; and through it all he would find a holy joy in God and have happy hopes in Him. Heroic trust! Glorious faith! Unbeatable love! Philip Doddridge",
              "simpZh": "请你们看看，这段经文描述的是多么悲惨的情况，也请注意这里表达的信仰有多么勇敢。好像作者在说：“就算我被逼到不知道下一顿饭在哪里的极端处境，就算房子空荡荡，田地不长粮食，以前看见神丰富供应的地方现在只看见神降灾的记号，然而我还是要因耶和华快乐。”我相信这些话值得用钻石工具永远刻在石头上。哦，靠神的恩典，愿这些话深深地刻在我们每个人的心版上！虽然这节经文很短，却隐含了作者这些心意：在患难时他要逃向神；在最黑暗的情况下他要保持灵里镇静；在这一切之中，他要以神为圣洁的喜乐，并对神抱着愉快的盼望。英勇的信心！荣耀的信仰！不可征服的爱！菲利普·多德里奇"
            },
            {
              "en": "Last night I heard a <span class=\"vocab-trigger\" data-vocab=\"robin\">robin<\/span> singing in the rain, And the raindrop’s <span class=\"vocab-trigger\" data-vocab=\"patter\">patter<\/span> made a sweet <span class=\"vocab-trigger\" data-vocab=\"refrain\">refrain<\/span>, Making all the sweeter the music of the <span class=\"vocab-trigger\" data-vocab=\"strain\">strain<\/span>. So, I thought, when trouble comes, as trouble will, Why should I stop singing? Just beyond the hill It may be that sunshine <span class=\"vocab-trigger\" data-vocab=\"floods\">floods<\/span> the green world still. He who faces the trouble with a heart of cheer Makes the burden lighter. If there falls a tear, Sweeter is the <span class=\"vocab-trigger\" data-vocab=\"cadence\">cadence<\/span> in the song we hear. I have learned your lesson, bird with <span class=\"vocab-trigger\" data-vocab=\"spotted wing\">spotted wing<\/span>, Listening to your music with its tune of spring— When the storm cloud darkens, it’s the TIME to sing. <span class=\"vocab-trigger\" data-vocab=\"Eben Eugene Rexford\">Eben Eugene Rexford<\/span>",

              "simpEn": "Last night I heard a robin singing in the rain, and the sound of the raindrops made a sweet background, making the song even sweeter. So I thought, when trouble comes, as it will, why should I stop singing? Just over the hill, maybe the sunshine is still pouring over the green world. The one who faces trouble with a happy heart makes the load lighter. If a tear falls, the rhythm of the song we hear is even sweeter. I have learned your lesson, bird with the spotted wing, listening to your music full of spring—when the storm cloud darkens, that is the TIME to sing. Eben Eugene Rexford",

            {
              "en": "How can we have rain without clouds? Our troubles have always brought us blessings, and they always will, for they are the dark <span class=\"vocab-trigger\" data-vocab=\"chariots\">chariots<\/span> of God’s bright and glorious grace. Before long the clouds will be emptied, and every tender plant will be happier due to the showers. Our God may <span class=\"vocab-trigger\" data-vocab=\"drench\">drench<\/span> us with grief, but He will refresh us with His mercy. Our Lord’s love letters often come to us in dark envelopes. His <span class=\"vocab-trigger\" data-vocab=\"wagons\">wagons<\/span> may <span class=\"vocab-trigger\" data-vocab=\"rumble\">rumble<\/span> noisily across the sky, but they are loaded with <span class=\"vocab-trigger\" data-vocab=\"benefits\">benefits<\/span>. And His <span class=\"vocab-trigger\" data-vocab=\"rod\">rod<\/span> blossoms with sweet flowers and <span class=\"vocab-trigger\" data-vocab=\"nourishing\">nourishing<\/span> fruits. So let us not worry about the clouds. Instead, let us sing because May flowers are brought to us through April clouds and showers.",

            {
              "en": "What seems so dark to your <span class=\"vocab-trigger\" data-vocab=\"dim sight\">dim sight<\/span> May be a <span class=\"vocab-trigger\" data-vocab=\"shadow\">shadow<\/span>, seen aright Making some brightness doubly bright. The flash that struck your tree—no more To shelter thee—lets heaven’s blue floor Shine where it never shone before. The cry <span class=\"vocab-trigger\" data-vocab=\"wrung\">wrung<\/span> from your spirit’s pain May echo on some far-off plain, And guide a <span class=\"vocab-trigger\" data-vocab=\"wanderer\">wanderer<\/span> home again. The blue sky of heaven is much larger than the dark clouds.",
              "zh": "你昏暗眼目看为极黑的事，或许只是阴影，看得合宜，反叫某些光辉加倍明亮。那击打你树——不再为你遮荫——的闪电，反让天蓝的穹苍照耀在从未照过之处。你灵魂痛苦中挤出的呼喊，或会回响在远方的平原，引导一个流浪者归家。天上的蔚蓝远比乌云更大。",

              "simpZh": "任何不属于神旨意的事，都不会被允许进入一个信靠并顺服祂的人的生命。这个真理应该足够让我们的生命充满不住的感谢和喜乐，因为神的旨意是世上最有盼望、最美好、最荣耀的事。那是祂用全部的能力不断地为我们的益处工作，只要我们保持降服和相信，就没有什么能拦阻。"

            {

              "zh": "一个正行过苦难深水的人写信给朋友说：“知道无论事情多么不公义，即使看似从撒但自己而来，到了我们这里时已经是神对我们的旨意，最终要叫我们得益处——这岂不是极荣耀吗？”“我们晓得万事都互相效力，叫爱神的人得益处”（罗马书8:28）。再想想基督在被卖的时候所说的话：“我父所给我的那杯，我岂可不喝呢？”（约翰福音18:11）。",

              "simpZh": "在我小屋门边长着一株最美丽娇嫩的花，那是一丛野蔷薇。在带露水的早晨或黄昏时，这株奇特的野玫瑰发出最稀罕的香气。可是当雨点打在上面，啊，它的味道就更甜美了，绕在我的脚边。我常常带着爱的温柔，轻轻抚摸它柔软的绿叶，爱抚它。我手指越收拢、压碎这玫瑰，就越流出奇妙的香气。亲爱的主啊，愿我的生命也是这样，当大风吹来的时候，它的香气能更甜美地流出来。如果祢的美意是要用碾碎的忧伤充满我的心，那就再加力压吧。当它临死的香气流出来时，我要低声说：“祂爱祂的这株被压碎的野蔷薇，祂知道它。”"

          "paragraphs": [
            {
              "en": "I waited <span class=\"vocab-trigger\" data-vocab=\"patiently\">patiently<\/span> for the Lord. (Psalm 40:1)",

            },
            {
              "en": "Waiting is much more difficult than walking, for waiting requires patience, and patience is a rare <span class=\"vocab-trigger\" data-vocab=\"virtue\">virtue<\/span>. We enjoy knowing that God builds <span class=\"vocab-trigger\" data-vocab=\"hedges\">hedges<\/span> around His people, when we look at the hedge from the aspect of protection. But when we see it growing higher and higher until we can no longer see over it, we wonder if we will ever get out of our little <span class=\"vocab-trigger\" data-vocab=\"sphere of influence\">sphere of influence<\/span> and service, where we feel <span class=\"vocab-trigger\" data-vocab=\"trapped\">trapped<\/span>. Sometimes it is hard for us to understand why we do not have a larger area of service, and it becomes difficult for us to “<span class=\"vocab-trigger\" data-vocab=\"brighten the corner\">brighten the corner<\/span>” where we are. But God has a purpose in all of His delays. “The steps of a good man are ordered by the Lord” (Ps. 37:23 KJV).",
              "zh": "等候比行走难得多，因为等候需要忍耐，而忍耐是一种罕见的美德。我们从保护的角度看神在祂百姓四围筑起的篱笆，便觉喜悦。可当看见篱笆越长越高，直到我们无法望过去时，就怀疑自己是否永远走不出这小小的影响范围和服事领域，感觉被困住了。有时我们很难明白为什么我们没有更大的服事区域，也很难“照亮所在角落”。但神在祂所有的迟延中都有目的。“义人的脚步被耶和华立定”（诗篇37:23）。",
              "simpEn": "Waiting is much harder than walking, because waiting needs patience, and patience is a rare good quality. We like knowing that God builds fences around His people when we see the fence as protection. But when we see it growing higher and higher until we can't see over it, we wonder if we will ever get out of our small place of influence and work, where we feel stuck. Sometimes it's hard to understand why we don't have a bigger place to serve, and it becomes hard to 'brighten the corner' where we are. But God has a reason in all His waiting times. 'The steps of a good man are ordered by the Lord.'",
              "simpZh": "等候比走路难多了，因为等候需要耐心，而耐心是一种很少见的好品质。我们喜欢知道神在祂百姓周围筑篱笆，当我们从保护的角度看篱笆时很开心。但当我们看见它越长越高，高到我们再也看不见外面时，我们就怀疑自己是不是永远走不出这个小小的活动范围和服事领域，感觉被困住了。有时候我们很难理解为什么我们没有更大的服事区域，也很难“照亮我们所在的角落”。但是神所有的耽延都有目的。“义人的脚步被耶和华立定。”"
            },
            {
              "en": "Next to this verse, in the margin of his Bible, <span class=\"vocab-trigger\" data-vocab=\"George Mueller\">George Mueller<\/span> made this note: “And the stops too.” It is a sad mistake for someone to break through God’s hedges. It is a <span class=\"vocab-trigger\" data-vocab=\"vital principle\">vital principle<\/span> of the Lord’s guidance for a Christian never to move from the spot where he is sure God has placed him, until the “<span class=\"vocab-trigger\" data-vocab=\"pillar of cloud\">pillar of cloud<\/span>” (Ex. 13:21) moves. <span class=\"vocab-trigger\" data-vocab=\"from Sunday School Times\">from Sunday School Times<\/span>",
              "zh": "在这节经文旁边的空白处，乔治·慕勒在他的圣经里写下批注：“并停步之处亦是。”人若冲破神的篱笆，乃是一个可悲的错误。对基督徒而言，主引导的一个极其重要的原则是：在他确知神所安置他的地方，绝不移动，直到“云柱”（出埃及记13:21）移动。 摘自《主日学报》",
              "simpEn": "Beside this verse, in the margin of his Bible, George Mueller wrote: 'And the stops too.' It is a sad mistake to break through God's fences. A very important rule of the Lord's leading for a Christian is never to move from the place where he is sure God has put him, until the 'pillar of cloud' moves. from Sunday School Times",
              "simpZh": "在这节经文旁边的空白处，乔治·慕勒在他的圣经上写了一句批注：“停下的地方也一样。”一个人冲破神的篱笆是可悲的错误。对基督徒来说，主引导的一个非常重要的原则是：绝不要离开你确信神安置你的地方，直到“云柱”移动。摘自《主日学报》"
            },
            {
              "en": "Once we learn to wait for the Lord’s leading in everything, we will know the strength that finds its highest point in an even and steady walk. Many of us are lacking the strength we so desire, but God gives complete power for every task He calls us to perform. Waiting—keeping yourself faithful to His leading—this is the secret of strength. And anything that does not align with obedience to Him is a waste of time and energy. Watch and wait for His leading. <span class=\"vocab-trigger\" data-vocab=\"Samuel Dickey Gordon\">Samuel Dickey Gordon<\/span>",
              "zh": "一旦我们学会凡事等候主的引导，就会认识那在平稳坚定步履中达到最高点的力量。我们许多人缺乏所渴望的力量，但神为祂呼召我们完成的每项任务都赐下完全的能力。等候——保守自己忠心于祂的引领——这就是能力的秘诀。凡与顺服祂不一致的事，都是浪费时间和精力。要警醒等候祂的引导。 撒母耳·迪基·戈登",
              "simpEn": "Once we learn to wait for the Lord's leading in everything, we will know the strength that reaches its peak in a smooth and steady walk. Many of us lack the strength we want so much, but God gives full power for every job He calls us to do. Waiting—keeping yourself true to His leading—this is the secret of strength. And anything that does not fit with obeying Him is a waste of time and effort. Watch and wait for His leading. Samuel Dickey Gordon",
              "simpZh": "我们一旦学会凡事等候主的引导，就会经历一种力量，这种力量在平稳坚定的步伐中达到顶点。我们许多人缺少自己渴望的力量，但神对祂呼召我们做的每一件事，都会赐下完全的能力。等候——保守自己忠实于祂的引导——这就是力量的秘诀。任何与顺服祂不一致的事，都是浪费时间和精力。要警醒等候祂的引导。撒母耳·迪基·戈登"
            },
            {
              "en": "Must life be considered a failure for someone <span class=\"vocab-trigger\" data-vocab=\"compelled\">compelled<\/span> to stand still, forced into <span class=\"vocab-trigger\" data-vocab=\"inaction\">inaction<\/span> and required to watch the great, roaring <span class=\"vocab-trigger\" data-vocab=\"tides\">tides<\/span> of life from shore? No—victory is then to be won by standing still and quietly waiting. Yet this is a thousand times harder to do than in the past, when you rushed <span class=\"vocab-trigger\" data-vocab=\"headlong\">headlong<\/span> into the busyness of life. It requires much more courage to stand and wait and still not lose heart or lose hope, to submit to the will of God, to give up opportunities for work and leave honors to others, and to be quiet, confident, and rejoicing while the busy <span class=\"vocab-trigger\" data-vocab=\"multitude\">multitude<\/span> goes happily along their way. The greatest life is: “after you have done everything, to stand” (Eph. 6:13). <span class=\"vocab-trigger\" data-vocab=\"J. R. Miller\">J. R. Miller<\/span>",
              "zh": "一个被迫静立不动、不得已处于停歇状态，只能从岸边观望生活巨浪的人，他的人生就当被视为失败吗？不——这时得胜就在于站住不动，静静等候。然而，这比你从前一味冲进人生忙碌时，要难上千倍。站住、等候，仍不灰心失望，顺服神旨，放弃工作机会，把荣耀让给别人，在忙碌的群众欢然奔走时仍能安静、笃信、喜乐——这需要更大的勇气。最伟大的生命是：“成就了一切，还能站立得住”（以弗所书6:13）。 密勒",
              "simpEn": "Should life be seen as a failure for someone forced to stand still, pushed into not doing anything, and made to watch the great, loud waves of life from the shore? No—victory is won then by standing still and quietly waiting. Yet this is a thousand times harder than when you used to rush wildly into the busyness of life. It takes much more courage to stand and wait and still not lose heart or hope, to accept God's will, to give up chances to work and let others have the honor, and to be calm, full of trust, and joyful while the busy crowd goes happily along its way. The greatest life is: 'after you have done everything, to stand.' J. R. Miller",
              "simpZh": "一个人被迫站着不动，被逼到不能做什么，只能从岸边看着人生的大浪翻滚，这样的人生就应该算是失败吗？不——那时得胜就在于站住不动，安静地等。可是这比你从前一头冲进忙碌的生活，要难上一千倍。站着、等候、却不灰心失望，顺服神的旨意，放弃工作的机会，把荣誉让给别人，在忙碌的人群高高兴兴往前走的时候，还能安静、有信心、喜乐——这需要更大的勇气。最伟大的生命是：“做完了这一切，还能站立得住。”密勒"
