          "paragraphs": [
            {
              "en": "The eyes of the Lord <span class=\"vocab-trigger\" data-vocab=\"range throughout the earth\">range throughout the earth<\/span> to <span class=\"vocab-trigger\" data-vocab=\"strengthen\">strengthen<\/span> those whose hearts are <span class=\"vocab-trigger\" data-vocab=\"fully committed\">fully committed<\/span> to him. (2 Chronicles 16:9)",
              "zh": "耶和华的眼目遍察全地，要显大能帮助向祂心存诚实的人。（历代志下16:9）",
              "simpEn": "The Lord's eyes move everywhere over the earth to give strength to those whose hearts are completely given to Him.",
              "simpZh": "主的眼睛巡视全地，要加力量给那些全心归向祂的人。"
            },
            {
              "en": "God is looking for men and women whose hearts are <span class=\"vocab-trigger\" data-vocab=\"firmly fixed\">firmly fixed<\/span> on Him and who will continually trust Him for all He desires to do with their lives. God is ready and eager to work more powerfully than ever through His people, and the clock of the centuries is striking the <span class=\"vocab-trigger\" data-vocab=\"eleventh hour\">eleventh hour<\/span>. The world is watching and waiting to see what God can do through a life <span class=\"vocab-trigger\" data-vocab=\"committed\">committed<\/span> to Him. And not only is the world waiting but God Himself <span class=\"vocab-trigger\" data-vocab=\"awaits\">awaits<\/span> to see who will be the most completely <span class=\"vocab-trigger\" data-vocab=\"devoted\">devoted<\/span> person who has ever lived: willing to be nothing so Christ may be everything; fully accepting God’s purposes as his own; receiving Christ’s <span class=\"vocab-trigger\" data-vocab=\"humility\">humility<\/span>, faith, love, and power yet never <span class=\"vocab-trigger\" data-vocab=\"hindering\">hindering<\/span> God’s plan but always allowing Him to continue His <span class=\"vocab-trigger\" data-vocab=\"miraculous work\">miraculous work<\/span>. <span class=\"vocab-trigger\" data-vocab=\"C. H. P.\">C. H. P.<\/span>",
              "zh": "神正在寻找心向祂坚定、不断信靠祂要在其生命中施行一切旨意的人。神已预备好并渴望比以往更有能力地藉祂的百姓作工，而世纪之钟正敲响十一点钟。世界正在观看、等候，要看神能藉一个委身于祂的生命成就什么。不单是世界在等候，神自己也在等候，要看谁会成为有史以来最完全献上的人：甘愿成为无有，好让基督成为一切；全然接纳神的旨意为己意；领受基督的谦卑、信心、爱和能力，却不拦阻神的计划，而是始终容让祂继续施行奇妙的工。 C. H. P.",
              "simpEn": "God is looking for people whose hearts are set solidly on Him and who will keep trusting Him for everything He wants to do in their lives. God is ready and eager to work through His people with more power than ever, and the clock of history is striking the last hour. The world is watching and waiting to see what God can do through a life given to Him. And not only is the world waiting, but God Himself is waiting to see who will be the most completely given-up person who has ever lived: willing to be nothing so that Christ may be everything; fully accepting God's plans as his own; taking in Christ's lowliness, faith, love, and power, yet never getting in the way of God's plan but always letting Him carry on His wonderful work. C. H. P.",
              "simpZh": "神在寻找那些心向祂坚固、不断地为祂要在他们生命中做的事来信靠祂的人。神已经准备好并且迫切地想通过祂的百姓比以前更有能力地作工，历史的大钟正在敲响最后的时刻。世界在看着、等着，要看神能通过一个奉献给祂的生命做什么。而且不光是世界在等，神自己也在等，要看谁会成为有史以来最完全献上自己的人：甘愿成为无有，让基督成为一切；完全接受神的计划当作自己的；领受基督的谦卑、信心、爱和能力，却从不拦阻神的计划，总是让祂继续祂奇妙的作为。C. H. P."
            },
            {
              "en": "There is no limit to what God can do through you, provided you do not <span class=\"vocab-trigger\" data-vocab=\"seek your own glory\">seek your own glory<\/span>. <span class=\"vocab-trigger\" data-vocab=\"George Mueller\">George Mueller<\/span>, at more than ninety years of age, in an address to ministers and other Christian workers, said, “I was <span class=\"vocab-trigger\" data-vocab=\"converted\">converted<\/span> in November 1825, but I didn’t come to the point of total surrender of my heart until four years later, in July 1829. It was then I realized my love for money, <span class=\"vocab-trigger\" data-vocab=\"prominence\">prominence<\/span>, position, power, and <span class=\"vocab-trigger\" data-vocab=\"worldly pleasure\">worldly pleasure<\/span> was gone. God, and He alone, became my <span class=\"vocab-trigger\" data-vocab=\"all in all\">all in all<\/span>. In Him I found everything I needed, and I desired nothing else. By God’s grace, my understanding of His <span class=\"vocab-trigger\" data-vocab=\"sufficiency\">sufficiency<\/span> has remained to this day, making me an <span class=\"vocab-trigger\" data-vocab=\"exceedingly happy\">exceedingly happy<\/span> man. It has led me to care only about the things of God. And so, dear believers, I kindly ask if you have totally surrendered your heart to God, or is there something in your life you refuse to <span class=\"vocab-trigger\" data-vocab=\"release\">release<\/span>, in spite of God’s call?”",
              "zh": "只要你不求自己的荣耀，神能藉你成就的便没有限量。九十多岁高龄的乔治·慕勒在对牧师和基督徒工人的演讲中说：“我在1825年11月悔改归主，但直到四年后，1829年7月，我才达到了心灵完全降服的地步。那时我才意识到自己对金钱、名望、地位、权力和世俗享乐的贪爱已经消失了。神，惟独神，成了我的一切。在祂里面我找到了所需的一切，别无所求。靠着神的恩典，我对祂充足性的认识一直保持至今，这使我成为一个极其快乐的人。它使我只看重神的事。因此，亲爱的信徒，我恳切地问你们，你们是否已将心完全降服于神，还是生命中有什么东西尽管神呼召，你仍不肯放手？”",
              "simpEn": "There is no limit to what God can do through you, as long as you do not try to make yourself look great. George Mueller, when he was over ninety years old, spoke to pastors and Christian workers and said, 'I turned to God in November 1825, but I did not come to the place of giving up my heart completely until four years later, in July 1829. Then I saw that my love for money, being important, high position, power, and the fun of this world was gone. God, and He only, became everything to me. In Him I found all I needed, and I wanted nothing else. By God's kindness, my understanding of His enoughness has stayed with me to this day, making me a very happy man. It has made me care only about God's things. So, dear believers, I kindly ask: have you completely given up your heart to God, or is there something in your life you won't let go of, even though God is calling you to?'",
              "simpZh": "只要你不追求自己的荣耀，神能藉你做的事就没有限量。九十多岁的乔治·慕勒在一次对牧师和基督徒同工的讲话中说：“我1825年11月悔改信主，但直到四年后的1829年7月，我才达到内心完全降服的地步。那时我才发现，我对金钱、出名、地位、权力和世俗享乐的贪爱都消失了。神，唯独神，成了我的一切。在祂里面我找到了需要的一切，别的都不要了。靠着神的恩典，我对祂足够能力的认识一直保持到今天，这让我成为一个极其喜乐的人。这认识让我只关心神的事情。所以，亲爱的信徒，我真心问你，你是不是已经把心完全交给了神，还是生命中有些东西就算神呼召你，你也不肯放？”"
            },
            {
              "en": "“Before the point at which I surrendered my life, I read a little of the Scriptures but preferred other books. Yet since that time, the truth He has revealed to me of Himself has become an <span class=\"vocab-trigger\" data-vocab=\"inexpressible blessing\">inexpressible blessing<\/span>. Now I can honestly say from the depth of my heart that God is an <span class=\"vocab-trigger\" data-vocab=\"infinitely wonderful Being\">infinitely wonderful Being<\/span>. Please, never be satisfied until you too can express from your <span class=\"vocab-trigger\" data-vocab=\"innermost soul\">innermost soul<\/span>, ‘God is an infinitely wonderful Being!’” <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "“在我生命降服之前，我读一点圣经，却更喜欢别的书。但从那时起，祂向我启示的关乎祂自己的真理，成了无法言喻的祝福。如今我诚然能从心底说，神是一位无限奇妙的存有。请你永远不要满足，直到你也能从灵魂最深处说：‘神是一位无限奇妙的存有！’” 选自",
              "simpEn": "'Before I gave up my life to God, I read a little of the Bible but liked other books better. But since that time, the truth about Himself that He has shown me has become a blessing too great to put into words. Now I can truly say from deep inside my heart that God is an endlessly amazing Being. Please, never be satisfied until you too can say from the deepest part of your soul, “God is an endlessly amazing Being!”' selected",
              "simpZh": "“在我把生命交托给神之前，我读一点点圣经，但更喜欢读别的书。但从那以后，祂向我显明的关于祂自己的真理，成了说不出的祝福。现在我真心可以从内心深处说，神是一位无限奇妙的存有。请你永远不要满足，直到你也能从灵魂最深处说出：‘神是一位无限奇妙的存有！’”选自"

        {
          "sectionId": 5,
          "heading": "July 19",
          "audio": "audio/streams in the desert - July 19.m4a",
          "paragraphs": [
            {
              "en": "Shall I not <span class=\"vocab-trigger\" data-vocab=\"drink the cup\">drink the cup<\/span> the Father has given me? (John 18:11)",
              "zh": "我父所给我的那杯，我岂可不喝呢？（约翰福音18:11）",
              "simpEn": "Shouldn't I take the cup of suffering the Father has given me?",
              "simpZh": "父神给我的苦杯，我怎么能不喝呢？"
            },
            {
              "en": "To “drink the cup” was a greater thing than <span class=\"vocab-trigger\" data-vocab=\"calming the seas\">calming the seas<\/span> or <span class=\"vocab-trigger\" data-vocab=\"raising the dead\">raising the dead<\/span>. The <span class=\"vocab-trigger\" data-vocab=\"prophets\">prophets<\/span> and <span class=\"vocab-trigger\" data-vocab=\"apostles\">apostles<\/span> could do amazing miracles, but they did not always do the will of God and thereby suffered as a result. Doing God’s will and thus experiencing suffering is still the <span class=\"vocab-trigger\" data-vocab=\"highest form of faith\">highest form of faith<\/span>, and the most <span class=\"vocab-trigger\" data-vocab=\"glorious Christian achievement\">glorious Christian achievement<\/span>. Having your <span class=\"vocab-trigger\" data-vocab=\"brightest aspirations\">brightest aspirations<\/span> as a young person forever <span class=\"vocab-trigger\" data-vocab=\"crushed\">crushed<\/span>; bearing <span class=\"vocab-trigger\" data-vocab=\"burdens\">burdens<\/span> daily that are always difficult, and never seeing relief; finding yourself <span class=\"vocab-trigger\" data-vocab=\"worn down\">worn down<\/span> by poverty while simply desiring to do good for others and provide a comfortable living for those you love; being <span class=\"vocab-trigger\" data-vocab=\"shackled\">shackled<\/span> by an <span class=\"vocab-trigger\" data-vocab=\"incurable\">incurable<\/span> physical <span class=\"vocab-trigger\" data-vocab=\"disability\">disability<\/span>; being completely alone, separated from all those you love, to face the <span class=\"vocab-trigger\" data-vocab=\"trauma\">trauma<\/span> of life alone; yet in all these, still being able to say through such a difficult <span class=\"vocab-trigger\" data-vocab=\"school of discipline\">school of discipline<\/span>, “Shall I not drink the cup the Father has given me?”—this is faith at its highest, and spiritual success at its <span class=\"vocab-trigger\" data-vocab=\"crowning point\">crowning point<\/span>. <span class=\"vocab-trigger\" data-vocab=\"Charles Parkhurst\">Charles Parkhurst<\/span>",
              "zh": "“喝这杯”是比平静风浪或叫死人复活更伟大的事。先知和使徒能行惊人的神迹，但他们并不常行神的旨意，因此受了许多苦。遵行神的旨意并因而经历苦难，仍是信心的最高形式，也是最荣耀的基督徒成就。你年轻时代最光明的抱负被永远粉碎；每日背负难当的重担，永不见解脱；被贫穷耗尽精力，一心只想造福他人、为所爱的人提供舒适生活；被无法治愈的残疾所捆绑；孤身一人，与所爱之人分离，独自面对生活的创伤；然而在这一切之中，仍能在这所严厉的管教学校里说：“我父所给我的杯，我岂可不喝呢？”——这就是信心至高之处，是属灵成功的冠冕。 查尔斯·帕克赫斯特",
              "simpEn": "Drinking the cup of suffering was a greater act than quieting the sea or bringing dead people back to life. The prophets and apostles could do amazing miracles, but they did not always do God's will and so they suffered. Doing God's will and suffering because of it is still the highest kind of faith and the greatest Christian success. Having your best hopes as a young person crushed forever; carrying hard loads every day with no relief; being worn out by poverty while just wanting to help others and care for your loved ones; being held down by a sickness that cannot be healed; being completely alone, cut off from everyone you love, facing life's hurts by yourself—and yet in all this, still being able to say through such a hard training school, 'Shall I not drink the cup the Father has given me?'—this is faith at its best, and spiritual winning at its highest point. Charles Parkhurst",
              "simpZh": "喝这苦杯，比平静海浪、叫死人复活更伟大。先知和使徒能行厉害的神迹，但他们并不总是遵行神的旨意，所以也为此受苦。遵行神的旨意并因此受苦，仍是信心的最高形式，也是最了不起的基督徒成就。年轻时候最光明的梦想永远破灭；每天担着重担，总看不见解脱；被贫穷耗尽了，只想做点好事、给自己爱的人温饱；被治不好的残疾绑住；完全孤单一人，跟所有爱的人分开，独自面对生活的伤痛——然而在这所严厉的训练学校里，还能说：‘父所给我的杯，我岂可不喝呢？’——这就是顶级的信心，是属灵成功的最高点。查尔斯·帕克赫斯特"
            },
            {
              "en": "In order to have a <span class=\"vocab-trigger\" data-vocab=\"sympathetic God\">sympathetic God<\/span>, we must have a <span class=\"vocab-trigger\" data-vocab=\"suffering Savior\">suffering Savior<\/span>, for true sympathy comes from understanding another person’s hurt by suffering the same <span class=\"vocab-trigger\" data-vocab=\"affliction\">affliction<\/span>. Therefore we cannot help others who suffer without paying a price ourselves, because afflictions are the cost we pay for our ability to sympathize. Those who wish to help others must first suffer. If we wish to <span class=\"vocab-trigger\" data-vocab=\"rescue\">rescue<\/span> others, we must be willing to face the cross; experiencing the greatest happiness in life through <span class=\"vocab-trigger\" data-vocab=\"ministering\">ministering<\/span> to others is impossible without drinking the cup Jesus drank and without <span class=\"vocab-trigger\" data-vocab=\"submitting\">submitting<\/span> to the <span class=\"vocab-trigger\" data-vocab=\"baptism\">baptism<\/span> He endured. The most comforting of David’s <span class=\"vocab-trigger\" data-vocab=\"psalms\">psalms<\/span> were squeezed from his life by suffering, and if Paul had not been given “a <span class=\"vocab-trigger\" data-vocab=\"thorn in the flesh\">thorn in the flesh<\/span>” (2 Cor. 12:7 KJV), we would have missed much of the <span class=\"vocab-trigger\" data-vocab=\"heartbeat of tenderness\">heartbeat of tenderness<\/span> that resonates through so many of his letters.",
              "zh": "为得一位能同情我们的神，必先有一位受苦的救主，因为真正的同情来自亲身经历相同的苦难而理解他人的伤痛。因此，若不出代价，我们就无法帮助受苦的人，因苦难正是我们获得同情能力所付的代价。渴望帮助别人的人，必须先受苦。我们若要拯救别人，就必须甘愿面对十架；若不喝耶稣所喝的杯，不伏在祂所承受的洗之下，就不可能透过服侍他人经历生命最大的喜乐。大卫诗篇中最安慰人心的部分，是从苦难中压榨出来的；保罗若没有“一根刺加在肉体上”，我们将错失他许多书信中那跳动着温柔心肠的脉搏。",
              "simpEn": "To have a God who feels with us, we must have a Savior who suffered. True sympathy comes from knowing someone else's pain by going through the same hard thing. So we cannot help suffering people without paying a price ourselves, because hard times are the price we pay for the ability to understand and care. Those who want to help others must first go through pain. If we want to save others, we must be willing to face the cross; living the happiest life by serving others is impossible without drinking the cup Jesus drank and going through the deep experience He went through. The most comforting of David's songs were pressed out of his life by pain, and if Paul had not been given a painful thorn in his body, we would have missed much of the tender feeling that beats through so many of his letters.",
              "simpZh": "我们要有一位能同情我们的神，就必须有一位受过苦的救主。真正的同情来自于自己也经历过同样的苦，从而理解别人的痛。所以，如果我们不自己付出代价，就不能帮助受苦的人，因为苦难正是我们获得同情能力所付的代价。想帮助别人的人，自己必须先受苦。我们想拯救别人，就必须愿意面对十字架；如果不喝耶稣喝过的杯，不经历祂所承受的那种洗，就不可能通过服侍别人经历人生最大的喜乐。大卫诗篇里最安慰人的那些话，是苦难从他的生命中挤出来的。保罗如果没有那根“肉体上的刺”，我们就会错过他许多书信中那种温柔的脉搏。"

          "paragraphs": [
            {
              "en": "Since we have a <span class=\"vocab-trigger\" data-vocab=\"great high priest\">great high priest<\/span> . . . , Jesus the Son of God, let us <span class=\"vocab-trigger\" data-vocab=\"hold firmly\">hold firmly<\/span> to the faith we <span class=\"vocab-trigger\" data-vocab=\"profess\">profess<\/span>. . . . Let us then <span class=\"vocab-trigger\" data-vocab=\"approach the throne of grace\">approach the throne of grace<\/span> with <span class=\"vocab-trigger\" data-vocab=\"confidence\">confidence<\/span>, so that we may receive <span class=\"vocab-trigger\" data-vocab=\"mercy\">mercy<\/span> and find <span class=\"vocab-trigger\" data-vocab=\"grace to help\">grace to help<\/span> us in our <span class=\"vocab-trigger\" data-vocab=\"time of need\">time of need<\/span>. (Hebrews 4:14, 16)",
              "zh": "我们既然有一位已经升入高天尊荣的大祭司，就是神的儿子耶稣，便当持定所承认的道……所以我们只管坦然无惧地来到施恩的宝座前，为要得怜恤，蒙恩惠，作随时的帮助。（希伯来书4:14, 16）",
              "simpEn": "Since we have a great high priest, Jesus the Son of God, let us hold tightly to the faith we say we believe. Let us then come boldly to the throne of grace, so we can receive mercy and find grace to help when we need it.",
              "simpZh": "既然我们有一位伟大的大祭司，就是神的儿子耶稣，让我们紧紧抓住我们所信的信仰。然后，我们只管坦然无惧地来到恩典的宝座前，好得到怜悯，并在需要的时候找到帮助的恩典。"
            },
            {
              "en": "Our great Helper in prayer is the Lord Jesus Christ. He is our <span class=\"vocab-trigger\" data-vocab=\"Advocate\">Advocate<\/span>, ever <span class=\"vocab-trigger\" data-vocab=\"pleading our case\">pleading our case<\/span> before the Father. He is our “great high priest,” whose primary <span class=\"vocab-trigger\" data-vocab=\"ministry\">ministry<\/span> has for centuries been <span class=\"vocab-trigger\" data-vocab=\"intercession\">intercession<\/span> and prayer on our behalf. It is He who receives our <span class=\"vocab-trigger\" data-vocab=\"imperfect petitions\">imperfect petitions<\/span> from our hands, <span class=\"vocab-trigger\" data-vocab=\"cleanses\">cleanses<\/span> them of their <span class=\"vocab-trigger\" data-vocab=\"defects\">defects<\/span>, corrects their error, and then <span class=\"vocab-trigger\" data-vocab=\"claims their answer\">claims their answer<\/span> from His Father. And He does so strictly on the basis of His <span class=\"vocab-trigger\" data-vocab=\"worth\">worth<\/span> and <span class=\"vocab-trigger\" data-vocab=\"righteousness\">righteousness<\/span> through the <span class=\"vocab-trigger\" data-vocab=\"sufficiency of His atonement\">sufficiency of His atonement<\/span>. Believer, are you lacking power in prayer? Look to Christ, for your blessed Advocate has already claimed your answer. And if you give up the fight just as the moment of victory approaches, you will <span class=\"vocab-trigger\" data-vocab=\"grieve\">grieve<\/span> and disappoint Him. He has already entered “the <span class=\"vocab-trigger\" data-vocab=\"Most Holy Place\">Most Holy Place<\/span>” (Ex. 26:33) on your behalf, holding up your name on the palms of His hands. The messenger is now on his way to bring you your blessing, and the Holy Spirit simply <span class=\"vocab-trigger\" data-vocab=\"awaits\">awaits<\/span> your act of trust, so He may whisper in your heart the <span class=\"vocab-trigger\" data-vocab=\"echo\">echo<\/span> of the answer from the throne of God, “<span class=\"vocab-trigger\" data-vocab=\"It is done\">It is done<\/span>” (Rev. 21:6). <span class=\"vocab-trigger\" data-vocab=\"A. B. Simpson\">A. B. Simpson<\/span>",
              "zh": "我们祷告中的伟大帮助者就是主耶稣基督。祂是我们的中保，永远在父面前替我们辩护。祂是我们“尊荣的大祭司”，历代以来主要的事工就是为我们代求和祷告。祂从我们手中接过那些不完全的祈求，洁净其中的瑕疵，改正其中的错误，然后基于祂自己的价值和公义，透过祂充足赎罪的功效，向父索求应允。信徒啊，你是否感到祷告缺乏能力？仰望基督吧，因你那可称颂的中保已为你求得了应允。你若在得胜的关头放弃，就会让祂忧伤失望。祂已经为你进入了“至圣所”，将你的名字刻在掌上。使者如今已上路要将福分带来；圣灵只等候你信心的行动，好在你心中低声传出从神宝座来的回应：“成了！”（启示录21:6）。 宣信",
              "simpEn": "Our great Helper in prayer is the Lord Jesus Christ. He is our Lawyer, always speaking for us before the Father. He is our 'great high priest,' whose main work for centuries has been talking to God and praying for us. He takes our weak, faulty prayers from our hands, cleans them from their mistakes, corrects their wrongs, and then asks His Father to give the answer. He does this based totally on His own value and goodness through the full power of His payment for sin. Believer, are you short on power in prayer? Look to Christ, for your blessed Lawyer has already asked for your answer. If you stop fighting just when you are about to win, you will sadden and disappoint Him. He has already gone into the Most Holy Place for you, holding up your name on His hands. The messenger is now on the way to bring you your blessing, and the Holy Spirit is just waiting for you to trust, so He can whisper in your heart the echo of the answer from God's throne: 'It is done.' A. B. Simpson",
              "simpZh": "我们在祷告中最伟大的帮助者就是主耶稣基督。祂是我们的辩护律师，永远在父面前为我们说话。祂是我们“伟大的大祭司”，历世历代主要的工作就是为我们代求、祷告。祂从我们手中接过那些不完美的祈求，把其中的瑕疵洗干净，改正里面的错误，然后凭着祂自己的价值和公义，借着祂赎罪的充足功效，向父要求应允。信徒啊，你祷告是不是缺少力量？仰望基督吧，因为你那位可称颂的辩护律师已经为你求到了应允。如果你在快要得胜的时候放弃争战，就会让祂伤心失望。祂已经为你进入了“至圣所”，把你的名字捧在手上。传信的天使正在路上，要把福分带给你；圣灵只等着你信心的行动，好在你的心里轻轻回响从神宝座来的回答：“成了。”宣信"
            },
            {
              "en": "The Holy Spirit is the one who works to make our prayers <span class=\"vocab-trigger\" data-vocab=\"acceptable\">acceptable<\/span>, yet we often forget this truth. He <span class=\"vocab-trigger\" data-vocab=\"enlightens\">enlightens<\/span> our mind so we may clearly see our desires, then <span class=\"vocab-trigger\" data-vocab=\"softens\">softens<\/span> our heart so we may feel them, and finally He <span class=\"vocab-trigger\" data-vocab=\"awakens\">awakens<\/span> and <span class=\"vocab-trigger\" data-vocab=\"focuses\">focuses<\/span> those desires toward <span class=\"vocab-trigger\" data-vocab=\"godly things\">godly things<\/span>. He gives us a clear view of God’s power and wisdom, provides grace “in our time of need,” and strengthens our confidence in His truth so we will never <span class=\"vocab-trigger\" data-vocab=\"waver\">waver<\/span>. Prayer is a wonderful thing, and each person of the <span class=\"vocab-trigger\" data-vocab=\"Trinity\">Trinity<\/span> is involved in every acceptable prayer. <span class=\"vocab-trigger\" data-vocab=\"J. Angell James\">J. Angell James<\/span>",
              "zh": "圣灵是那位运行作工使我们的祷告蒙悦纳的，我们却常忘了这真理。祂光照我们的心思，使我们清楚看见自己的渴望，继而软化我们的心，使我们感受这些渴望，最后祂唤醒并凝聚这些渴望向着敬虔的事。祂使我们清楚看见神的大能和智慧，在“随时的需要”中赐下恩典，并坚固我们对祂真理的信心，使我们永不动摇。祷告是一件奇妙的事，三位一体的每一位都参与每一个蒙悦纳的祷告。 雅各·安格尔·詹姆士",
              "simpEn": "The Holy Spirit is the one who works to make our prayers pleasing to God, yet we often forget this. He lights up our mind so we can see clearly what we want, then softens our heart so we can feel those wants, and finally He stirs them up and points them toward things that honor God. He gives us a clear sight of God's power and wisdom, provides kindness when we need it, and makes our trust in His truth stronger so we will never shake. Prayer is a wonderful thing, and every part of the Trinity is involved in every prayer that pleases God. J. Angell James",
              "simpZh": "圣灵是那一位使我们的祷告能被神悦纳的，我们却常常忘记这个真理。祂照亮我们的心思，让我们看清楚自己渴望什么；接着软化我们的心，让我们能够感受这些渴望；最后祂唤醒这些渴望，把它们集中指向敬虔的事上。祂让我们看清楚神的大能和智慧，在我们需要的时候赐下恩典，又坚固我们对祂真理的信心，使我们永远不会摇摆。祷告是一件奇妙的事，三位一体的每一位都参与了每一个蒙悦纳的祷告。雅各·安格尔·詹姆士"
            }

          "paragraphs": [
            {
              "en": "Let me make just one more request. Allow me one more test with the <span class=\"vocab-trigger\" data-vocab=\"fleece\">fleece<\/span>. (Judges 6:39)",
              "zh": "求你再让我试一次。容我再用羊毛试一次。（士师记6:39）",
              "simpEn": "Please let me ask just one more thing. Let me test once more with the wool.",
              "simpZh": "请让我再求一件事。让我用羊毛再试一次。"
            },
            {
              "en": "There are three levels of faith in the Christian experience. The first is being able to believe only when we see some <span class=\"vocab-trigger\" data-vocab=\"sign\">sign<\/span> or have some strong <span class=\"vocab-trigger\" data-vocab=\"emotion\">emotion<\/span>. Like <span class=\"vocab-trigger\" data-vocab=\"Gideon\">Gideon<\/span>, we feel the fleece and are willing to trust God if it is wet. This may be <span class=\"vocab-trigger\" data-vocab=\"genuine\">genuine<\/span> faith but it is <span class=\"vocab-trigger\" data-vocab=\"imperfect\">imperfect<\/span>. It is continually looking to feelings or some other sign instead of the Word of God. We have taken a great step toward <span class=\"vocab-trigger\" data-vocab=\"maturity\">maturity<\/span> when we trust God without relying on our feelings. It is more of a blessing when we believe without experiencing any emotion. While the first level of faith believes when our emotions are <span class=\"vocab-trigger\" data-vocab=\"favorable\">favorable<\/span>, the second believes when all feelings are <span class=\"vocab-trigger\" data-vocab=\"absent\">absent<\/span>. And the third level <span class=\"vocab-trigger\" data-vocab=\"transcends\">transcends<\/span> the other two, for it is faith that believes God and His Word when <span class=\"vocab-trigger\" data-vocab=\"circumstances\">circumstances<\/span>, emotions, <span class=\"vocab-trigger\" data-vocab=\"appearances\">appearances<\/span>, people, and human reason all seem to <span class=\"vocab-trigger\" data-vocab=\"urge\">urge<\/span> something to the <span class=\"vocab-trigger\" data-vocab=\"contrary\">contrary<\/span>. Paul exercised this level of faith when he said, “When neither sun nor stars appeared for many days and the storm continued raging, we finally <span class=\"vocab-trigger\" data-vocab=\"gave up all hope\">gave up all hope<\/span> of being saved” (Acts 27:20), then nevertheless went on to say, “<span class=\"vocab-trigger\" data-vocab=\"Keep up your courage\">Keep up your courage<\/span>, men, for I have faith in God that it will happen just as he told me” (Acts 27:25). <span class=\"vocab-trigger\" data-vocab=\"C. H. P.\">C. H. P.<\/span>",
              "zh": "基督徒经历中有三个层次的信心。第一层，是唯有见到某种征兆或经历强烈情感时才能相信。就如基甸，摸了羊毛，如果羊毛是湿的，就愿意信靠神。这或许是真实的信心，却是不完全的。它不断仰望感觉或别的记认，而忽略了神的话。当我们不依赖感觉而信靠神时，就向成熟迈了一大步。在没有感受任何情感时仍能相信，是更大的祝福。第一层次的信心是在情绪正面时相信；第二层次是在所有感觉都消失时相信。而第三层次超越了前两者，那是在环境、情绪、表象、人、属人理性全都催逼反方向时，仍然相信神和祂话语的信心。保罗行使这层信心，当他说：“太阳和星辰多日不显露，又有狂风大浪催逼，我们得救的指望就都绝了”（使徒行传27:20），但接着又说：“所以众位可以放心，我信神祂怎样对我说，事情也要怎样成就”（使徒行传27:25）。 C. H. P.",
              "simpEn": "In the Christian walk there are three levels of faith. The first is believing only when we see a sign or feel a strong feeling. Like Gideon, we touch the wool and are willing to trust God if it is wet. This might be real faith but it is not yet complete. It keeps looking at feelings or other signs instead of God's Word. We take a big step toward growing up when we trust God without leaning on our feelings. It is an even greater blessing when we believe without any warm feeling. The first level of faith believes when our feelings are good; the second believes when all feelings are gone. And the third level goes beyond both, because it is faith that believes God and His Word when everything around us—troubles, feelings, how things look, people, and human thinking—all push us to believe the opposite. Paul used this level of faith when he said, 'When we could not see the sun or stars for many days and the storm kept pounding us, we at last gave up all hope of being saved,' but then he added, 'Keep up your courage, men, for I have faith in God that it will happen exactly as He told me.' C. H. P.",
              "simpZh": "在基督徒的经历里，信心有三个层次。第一个层次是，只有看到记号或者有强烈感觉的时候才能相信。就像基甸一样，我们摸一摸羊毛，如果羊毛湿了就愿意信靠神。这可能是真的信心，但还不完全。它一直看感觉或者其他记号，而不是看神的话。当我们不靠感觉来信靠神时，就往成熟迈了一大步。在没有任何感受的时候还能相信，是更大的祝福。第一层次的信心是在感觉好的时候相信；第二层次是在所有感觉都消失的时候相信。第三层次则超越了前两种，因为它是当环境、情绪、外表、人、人的理智都在催逼我们往反方向想的时候，依然相信神和祂话语的信心。保罗就用了这层次的信心，他说：“一连多日看不见太阳和星星，狂风大浪不断冲击，我们最后完全放弃了获救的指望”，然后他却又说：“各位可以打起精神，因为我相信神，事情一定会照着祂对我说的那样发生。” C. H. P."
            },
            {
              "en": "May God grant us faith to completely trust His Word, even when every other sign <span class=\"vocab-trigger\" data-vocab=\"points the other way\">points the other way<\/span>. When is the time to trust? Is it when all is calm, When waves the <span class=\"vocab-trigger\" data-vocab=\"victor’s palm\">victor’s palm<\/span>, And life is one glad <span class=\"vocab-trigger\" data-vocab=\"psalm\">psalm<\/span> Of joy and praise? No! For the time to trust Is when the waves beat high, When storm clouds fill the sky, And prayer is one long cry, “Oh, help and save!” When is the time to trust? Is it when friends are true? Is it when <span class=\"vocab-trigger\" data-vocab=\"comforts woo\">comforts woo<\/span>, And in all we say and do We meet but praise? No! For the time to trust Is when we stand alone, And summer birds have flown, And every <span class=\"vocab-trigger\" data-vocab=\"prop\">prop<\/span> is gone, All else but God. When is the time to trust? Is it some future day, When you have tried your way, And learned to trust and pray By bitter <span class=\"vocab-trigger\" data-vocab=\"woe\">woe<\/span>? No! For the time to trust Is in this moment’s need, Poor, broken, <span class=\"vocab-trigger\" data-vocab=\"bruised reed\">bruised reed<\/span>! Poor, troubled soul, make speed To trust your God. When is the time to trust? Is it when hopes beat high, When sunshine <span class=\"vocab-trigger\" data-vocab=\"gilds\">gilds<\/span> the sky, And joy and <span class=\"vocab-trigger\" data-vocab=\"ecstasy\">ecstasy<\/span> Fill all the heart? No! For the time to trust Is when our joy has <span class=\"vocab-trigger\" data-vocab=\"fled\">fled<\/span>, When sorrow <span class=\"vocab-trigger\" data-vocab=\"bows the head\">bows the head<\/span>, And all is cold and dead, All else but God. <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "愿神赐我们信心，即使在每个迹象都指向反面时，仍能全然信靠祂的话。何时才是信靠之时？是在一片风平浪静，挥舞得胜的棕枝，人生是一首喜乐赞美诗的时候吗？不！信靠之时乃是在波浪翻腾，暴风云布满天空，祷告化作一声长呼：“哦，求祢帮助拯救！”之时。何时才是信靠之时？是在朋友忠诚，安逸诱人，言行皆得称赞的时候吗？不！信靠之时乃是在我们独自站立，夏鸟飞走，一切依靠尽失，除了神以外别无所有之时。何时才是信靠之时？岂是将来某日，等你试尽己路，透过痛苦学会了信靠祷告之时吗？不！信靠之时乃是在此刻的急需中，你这可怜、破碎、压伤的芦苇！可怜受困的灵魂啊，赶紧来信靠你的神。何时才是信靠之时？是在盼望高扬，阳光镀金天际，喜乐和狂喜充满全心之时吗？不！信靠之时乃是在我们的喜乐飞逝，忧伤使人低头，一切冰冷死寂，除了神以外别无所有之时。 选自",
              "simpEn": "May God give us faith to trust His Word completely, even when everything else points the opposite way. When is the right time to trust? Is it when everything is calm, when you wave the winner's branch, and life is one happy song of joy and praise? No! The time to trust is when the waves rise high, when storm clouds cover the sky, and prayer is one long cry, 'Oh, help and save!' When is the right time to trust? Is it when friends are faithful, when comforts invite you, and everything you say and do meets only praise? No! The time to trust is when you stand alone, the summer birds have flown away, every support is gone, and nothing is left but God. When is the right time to trust? Is it some day in the future, after you have tried your own way and learned to trust and pray through bitter pain? No! The time to trust is right now, in this moment of need—poor, broken, crushed reed! Poor, troubled soul, hurry to trust your God. When is the right time to trust? Is it when hopes soar high, when sunshine turns the sky gold, and joy and extreme happiness fill the whole heart? No! The time to trust is when our joy has run away, when sadness makes our head hang low, and everything is cold and dead—all else but God. selected",
              "simpZh": "愿神赐给我们信心，能在一切迹象都指向反方向时，完全信靠祂的话。什么时候才是该信靠的时候呢？是一切都平静，手里挥着得胜的棕枝，生活是一首喜乐赞美诗的时候吗？不！该信靠的时候是，波浪高高翻腾，暴风云布满天空，祷告变成一声长长的呼喊：“哦，求你帮忙，救救我！”的时候。什么时候才是该信靠的时候？是朋友忠心，舒适的生活在引诱你，你所说所做的全都得到称赞的时候吗？不！该信靠的时候是，你一个人站着，夏天的鸟都飞走了，所有的依靠都没有了，除了神什么都没有的时候。什么时候才是该信靠的时候？是将来的某一天，当你试过自己的路，在痛苦的苦难里学会了信靠和祷告之后吗？不！该信靠的时候就是现在这个需要的时刻，可怜、破碎、被压伤的芦苇啊！可怜、忧愁的灵魂啊，赶快来信靠你的神。什么时候才是该信靠的时候？是盼望高飞，阳光把天空染成金色，喜乐和狂喜充满整颗心的时候吗？不！该信靠的时候是，我们的喜乐逃跑了，忧伤压低了头，一切冰冷死寂，除了神什么都没有的时候。选自"
            }

              "en": "Therefore will the Lord <span class=\"vocab-trigger\" data-vocab=\"wait\">wait<\/span>, that he may be <span class=\"vocab-trigger\" data-vocab=\"gracious\">gracious<\/span> unto you . . . <span class=\"vocab-trigger\" data-vocab=\"blessed\">blessed<\/span> are all they that wait for him. (Isaiah 30:18 KJV)",
              "zh": "因此耶和华必然等候，要施恩给你们……凡等候祂的都是有福的。（以赛亚书30:18 英王钦定本）",

          "paragraphs": [
            {
              "en": "Then they believed his promises and sang his praise. But they soon forgot what he had done and did not wait for his <span class=\"vocab-trigger\" data-vocab=\"counsel\">counsel<\/span>. In the <span class=\"vocab-trigger\" data-vocab=\"desert\">desert<\/span> they <span class=\"vocab-trigger\" data-vocab=\"gave in to their craving\">gave in to their craving<\/span>; in the <span class=\"vocab-trigger\" data-vocab=\"wasteland\">wasteland<\/span> they put God to the test. So he gave them what they asked for, but sent a <span class=\"vocab-trigger\" data-vocab=\"wasting disease\">wasting disease<\/span> upon them. (Psalm 106:12–15)",
              "zh": "那时他们才信了祂的话，歌唱赞美祂。但很快他们就忘了祂的作为，不仰望祂的指教；反倒在旷野大起贪欲，在荒地试探神。祂将他们所求的赐给他们，却使他们的心灵软弱。（诗篇106:12–15）",
              "simpEn": "Then they believed His promises and sang praise. But they soon forgot what He had done and did not wait for His advice. In the dry land they gave in to their strong wants; in the empty place they tested God. So He gave them what they asked for, but sent a sickness that wasted them away.",
              "simpZh": "那时他们才相信祂的应许，唱歌赞美祂。但很快他们就忘了祂做的事，不等候祂的指引。在旷野里他们放纵贪欲，在荒地试探神。祂把他们求的给了他们，却让消耗的病临到他们。"
            },
            {
              "en": "In Hebrews 11:27, we read that Moses “<span class=\"vocab-trigger\" data-vocab=\"persevered\">persevered<\/span> because he saw him who is <span class=\"vocab-trigger\" data-vocab=\"invisible\">invisible<\/span>.” Yet in the above passage, exactly the opposite was true of the children of Israel. They persevered only when their <span class=\"vocab-trigger\" data-vocab=\"circumstances\">circumstances<\/span> were <span class=\"vocab-trigger\" data-vocab=\"favorable\">favorable<\/span>, because they were primarily influenced by whatever <span class=\"vocab-trigger\" data-vocab=\"appealed to their senses\">appealed to their senses<\/span>, instead of trusting in the invisible and <span class=\"vocab-trigger\" data-vocab=\"eternal\">eternal<\/span> God. Even today we have people who live an <span class=\"vocab-trigger\" data-vocab=\"inconsistent\">inconsistent<\/span> Christian life because they have become <span class=\"vocab-trigger\" data-vocab=\"preoccupied\">preoccupied<\/span> with things that are <span class=\"vocab-trigger\" data-vocab=\"external\">external<\/span>. Therefore they focus on their circumstances rather than focusing on God. And God desires that we grow in our ability to see Him in everything and to realize the importance of <span class=\"vocab-trigger\" data-vocab=\"seemingly insignificant\">seemingly insignificant<\/span> circumstances if they are used to <span class=\"vocab-trigger\" data-vocab=\"deliver a message\">deliver a message<\/span> from Him.",
              "zh": "希伯来书11:27说，摩西“恒心忍耐，如同看见那不能看见的主。”而在上面的经文中，以色列人却恰恰相反。他们只在环境顺遂时才忍耐，因为他们主要受感官所见的影响，而非信靠那位看不见的永生神。即使在今天，仍有些人的基督徒生命反复无常，因为他们过于专注外表的事物。他们专注于环境而非专注神。神渴望我们越来越能在凡事上看见祂，并明白那些看似微不足道的环境若被神用来传递信息，是何等重要。",
              "simpEn": "In Hebrews we read that Moses kept going because he saw the One who cannot be seen. Yet in the verse above, the children of Israel did the exact opposite. They kept going only when things around them were good, because they were mainly moved by whatever their eyes and ears liked, instead of trusting the unseen, forever God. Even now, some people have a Christian life that goes up and down because they are too caught up with things on the outside. So they focus on what's happening around them instead of on God. God wants us to grow in being able to see Him in everything and to know that even tiny, small-looking events matter if He uses them to speak to us.",
              "simpZh": "在希伯来书里，我们读到摩西坚持忍耐，因为他看见了那位肉眼看不见的主。可是在今天读的诗篇里，以色列人却完全相反。他们只有在环境好的时候才能坚持，因为他们主要是被眼目和感官喜欢的东西影响，而不是信靠那位看不见的永生神。就是现在，还有些人过着反复无常的基督徒生活，因为他们太关注外面的事情了。他们专注于环境，而不专注神。神希望我们越来越能在每一件事上看见祂，并且明白，就算是看起来微不足道的小事，如果神用它传信息，那也是重要的。"
            },
            {
              "en": "We read of the children of Israel, “Then they believed his promises.” They did not believe until after they saw—once they saw Him work, “then they believed.” They <span class=\"vocab-trigger\" data-vocab=\"unabashedly\">unabashedly<\/span> doubted God when they came to the <span class=\"vocab-trigger\" data-vocab=\"Red Sea\">Red Sea<\/span>, but when He opened the way and led them across and they saw <span class=\"vocab-trigger\" data-vocab=\"Pharaoh\">Pharaoh<\/span> and his army <span class=\"vocab-trigger\" data-vocab=\"drowned\">drowned<\/span>—“then they believed.” The Israelites continued to live this kind of <span class=\"vocab-trigger\" data-vocab=\"up-and-down existence\">up-and-down existence<\/span>, because their faith was <span class=\"vocab-trigger\" data-vocab=\"dependent\">dependent<\/span> on their circumstances. And this is certainly not the kind of faith God wants us to have.",
              "zh": "我们读到以色列人“那时他们才信了祂的话”。他们是在看见之后才信——看见祂的作为，“那时才信”。他们在红海边公然怀疑神；但当神开了路，领他们过去，看见法老全军被淹死——“那时才信”。以色列人不断过着这种时起时落的生活，因为他们的信心依赖环境。这绝非神愿意我们拥有的信心。",
              "simpEn": "We read of Israel, 'Then they believed his promises.' They did not believe until after they saw—once they saw God work, then they believed. They openly doubted God when they stood at the Red Sea, but when He made a way through and led them over and they saw Pharaoh and his army dead in the water—then they believed. The people of Israel lived this kind of up-and-down life all the time, because their faith depended on what was happening around them. And this is surely not the kind of faith God wants us to have.",
              "simpZh": "我们读到以色列人“那时才信了祂的话”。他们是看见之后才信的——看见神做事，那时才信。他们在红海面前公然怀疑神；但当神开了路，领他们过去，他们看见法老和他的全军被淹死——那时才信。以色列人一直过着这样起起伏伏的生活，因为他们的信心是随着环境变的。这肯定不是神要我们有的那种信心。"
            },
            {
              "en": "The world says that “seeing is believing,” but God wants us to believe in order to see. The <span class=\"vocab-trigger\" data-vocab=\"psalmist\">psalmist<\/span> said, “I would have <span class=\"vocab-trigger\" data-vocab=\"despaired\">despaired<\/span> unless I had believed that I would see the <span class=\"vocab-trigger\" data-vocab=\"goodness\">goodness<\/span> of the Lord in the land of the living” (Ps. 27:13 NASB). Do you believe God only when your circumstances are favorable, or do you believe no matter what your circumstances may be? <span class=\"vocab-trigger\" data-vocab=\"C. H. P.\">C. H. P.<\/span> Faith is believing what we do not see, and the reward for this kind of faith is to see what we believe. <span class=\"vocab-trigger\" data-vocab=\"Saint Augustine\">Saint Augustine<\/span>",
              "zh": "世人说“眼见为实”，神却要我们先信后见。诗人说：“我若不信在活人之地得见耶和华的恩惠，就早已丧胆了。”（诗篇27:13）你只当环境顺遂时才信神吗？还是无论环境如何，你都相信？ C. H. P. 信心是相信那看不见的，这信心的奖赏就是看见所信的。 奥古斯丁",
              "simpEn": "The world says you must see to believe, but God wants us to believe so that we can see. The writer of the Psalms said, 'I would have lost all hope unless I had believed that I would see the goodness of the Lord in the land of the living.' Do you believe God only when things are going well, or do you believe no matter what is happening? C. H. P. Faith is believing what we do not see, and the reward of this faith is to see what we believe. Saint Augustine",
              "simpZh": "世人说看见了才信，但神要我们先信后见。诗篇作者说：“我若不相信在活人之地能看见耶和华的恩惠，早就绝望了。”你只在事情顺利的时候才信神吗？还是无论情况怎样，你都相信？ C. H. P. 信心是相信那看不见的，这种信心的奖赏就是看见我们所信的。奥古斯丁"
            }
          ],

        {
          "sectionId": 4,
          "heading": "July 25",
          "audio": "audio/streams in the desert - July 25.m4a",
          "paragraphs": [
            {
              "en": "You do not realize now what I am doing, but later you will understand. (John 13:7)",
              "zh": "我所作的，你如今不知道，后来必明白。（约翰福音13:7）",
              "simpEn": "Right now you don't understand what I am doing, but later you will understand.",
              "simpZh": "你现在不知道我在做什么，但以后你会明白的。"
            },
            {
              "en": "In this life, we have an <span class=\"vocab-trigger\" data-vocab=\"incomplete\">incomplete<\/span> view of God’s <span class=\"vocab-trigger\" data-vocab=\"dealings\">dealings<\/span>, seeing His plan only half finished and <span class=\"vocab-trigger\" data-vocab=\"underdeveloped\">underdeveloped<\/span>. Yet once we stand in the <span class=\"vocab-trigger\" data-vocab=\"magnificent temple\">magnificent temple<\/span> of <span class=\"vocab-trigger\" data-vocab=\"eternity\">eternity<\/span>, we will have the proper <span class=\"vocab-trigger\" data-vocab=\"perspective\">perspective<\/span> and will see everything fitting <span class=\"vocab-trigger\" data-vocab=\"gracefully\">gracefully<\/span> together!",
              "zh": "今生我们只能片面地看见神的作为，祂的计划只见一半、尚在进展之中。然而一旦我们站在永恒宏伟的殿中，就会拥有正确的眼光，看见一切精巧地联合在一起！",
              "simpEn": "In this life, we only see part of what God is doing; His plan looks half done and not yet complete. But when we stand in the great temple of forever, we will see things the right way and watch everything fit together in a beautiful way.",
              "simpZh": "今生我们只能看见神工作的一部分，祂的计划看起来只完成了一半，还没展开。但当我们站在永恒那宏伟的殿中时，就会看得清楚，看见每件事都精美地拼在一起。"
            },
            {
              "en": "Imagine going to the mountains of <span class=\"vocab-trigger\" data-vocab=\"Lebanon\">Lebanon<\/span> during the reign of Israel’s great king <span class=\"vocab-trigger\" data-vocab=\"Solomon\">Solomon<\/span>. Can you see the <span class=\"vocab-trigger\" data-vocab=\"majestic cedar\">majestic cedar<\/span>? It is the pride of all the other trees and has <span class=\"vocab-trigger\" data-vocab=\"wrestled\">wrestled<\/span> many years with the cold north winds! The summer sun has loved to smile upon it, while the night has caused its soft leaves to <span class=\"vocab-trigger\" data-vocab=\"glisten\">glisten<\/span> with drops of <span class=\"vocab-trigger\" data-vocab=\"dew\">dew<\/span>. Birds have built their nests in its branches, and weary travelers and wandering <span class=\"vocab-trigger\" data-vocab=\"shepherds\">shepherds<\/span> have rested in its shade from the <span class=\"vocab-trigger\" data-vocab=\"midday heat\">midday heat<\/span> or taken shelter from the <span class=\"vocab-trigger\" data-vocab=\"raging storms\">raging storms<\/span>. And suddenly we realize that this old <span class=\"vocab-trigger\" data-vocab=\"inhabitant\">inhabitant<\/span> of the forest has been <span class=\"vocab-trigger\" data-vocab=\"doomed\">doomed<\/span> to fall <span class=\"vocab-trigger\" data-vocab=\"victim\">victim<\/span> to the <span class=\"vocab-trigger\" data-vocab=\"woodsman’s ax\">woodsman’s ax<\/span>! We watch as the ax makes its first <span class=\"vocab-trigger\" data-vocab=\"gash\">gash<\/span> on the cedar’s <span class=\"vocab-trigger\" data-vocab=\"gnarled\">gnarled<\/span> trunk. Then we see its <span class=\"vocab-trigger\" data-vocab=\"noble limbs\">noble limbs<\/span> stripped of their branches as the tree comes crashing to the ground. We cry out against the <span class=\"vocab-trigger\" data-vocab=\"wanton destruction\">wanton destruction<\/span> of this “Tree of God,” as it is <span class=\"vocab-trigger\" data-vocab=\"distinctively\">distinctively<\/span> known, and express our anger over the <span class=\"vocab-trigger\" data-vocab=\"demolition\">demolition<\/span> of this proud <span class=\"vocab-trigger\" data-vocab=\"pillar\">pillar<\/span> in the forest temple of nature.",
              "zh": "想象你当所罗门王统治时走进黎巴嫩山区。你看见那棵雄伟的香柏树了吗？它是众树之骄，多年来与凛冽的北风摔跤！夏日阳光喜爱向它微笑，夜间露珠在它柔软的叶上闪烁。飞鸟在它枝间搭窝，困倦的旅客和游荡的牧人在它的荫下躲避正午的炎热，或躲避狂暴的风雨。突然我们得知这森林老居民注定要倒在伐木者的斧下！我们看见斧头在它盘曲的树干上劈下第一道裂口；随即它尊贵的枝子被剥去，大树轰然倒地。我们为这素有“神树”之称的巨木遭此任意毁坏而愤呼，为这大自然森林圣殿中骄傲柱石的摧毁而愤怒。",
              "simpEn": "Picture going to the mountains of Lebanon when Israel's great King Solomon ruled. Do you see the grand cedar tree? It is the pride of all the other trees and has fought against the cold north winds for many years. The summer sun loved to smile on it, while night made its soft leaves shine with dewdrops. Birds built nests in its branches, and tired travelers and wandering shepherds rested in its shade from the hot midday sun or hid from fierce storms. Then suddenly we learn that this old tree of the woods is marked to be cut down by the woodcutter's ax. We watch as the ax makes its first cut into the tree's twisted trunk. Then we see its fine branches torn off as the tree falls to the ground with a crash. We cry out against the senseless wrecking of this 'Tree of God,' as it is specially called, and we are angry over the tearing down of this proud pillar in nature's forest temple.",
              "simpZh": "想象在所罗门王在位时，你走进黎巴嫩的山里。你看见那棵雄伟的香柏树了吗？它是所有树中的骄傲，多年与寒冷的北风搏斗。夏天的太阳喜爱对它微笑，夜里露珠在它柔软的叶子上闪闪发光。鸟儿在它的树枝上筑窝，疲倦的旅人和游走的牧人在它树荫下躲避中午的酷热，或是躲避狂风暴雨。然后我们忽然知道，这森林里的老居民注定要丧命在伐木者的斧头下了。我们看着斧头在那盘曲的树干上劈下第一道口子，看着它高贵的大枝被剥光，大树轰然倒塌。我们为这棵被称为“神树”的巨树遭到任意毁坏而愤喊，为这自然界森林殿中骄傲的柱子被拆毁而生气。"
            },
            {
              "en": "We are tempted to <span class=\"vocab-trigger\" data-vocab=\"exclaim\">exclaim<\/span> with the prophet <span class=\"vocab-trigger\" data-vocab=\"Zechariah\">Zechariah<\/span>, “<span class=\"vocab-trigger\" data-vocab=\"Wail\">Wail<\/span>, O pine tree, for the cedar has fallen . . . !” (Zech. 11:2), as if inviting the <span class=\"vocab-trigger\" data-vocab=\"sympathy\">sympathy<\/span> of every less-<span class=\"vocab-trigger\" data-vocab=\"majestic\">majestic<\/span> plant and <span class=\"vocab-trigger\" data-vocab=\"invoking\">invoking<\/span> <span class=\"vocab-trigger\" data-vocab=\"inanimate\">inanimate<\/span> things to also <span class=\"vocab-trigger\" data-vocab=\"resent\">resent<\/span> the offense. We should not be so quick to complain but should follow the <span class=\"vocab-trigger\" data-vocab=\"gigantic\">gigantic<\/span> tree as the workmen of “<span class=\"vocab-trigger\" data-vocab=\"Hiram\">Hiram<\/span> king of Tyre” (2 Chron. 2:3) take it down the mountainside. From there we should watch it being sailed on <span class=\"vocab-trigger\" data-vocab=\"rafts\">rafts<\/span> along the blue water of the <span class=\"vocab-trigger\" data-vocab=\"Mediterranean\">Mediterranean<\/span>. And finally, we should behold it being placed as a glorious and polished <span class=\"vocab-trigger\" data-vocab=\"beam\">beam<\/span> in the temple of God. As you <span class=\"vocab-trigger\" data-vocab=\"contemplate\">contemplate<\/span> its final <span class=\"vocab-trigger\" data-vocab=\"destination\">destination<\/span>, seeing it in the <span class=\"vocab-trigger\" data-vocab=\"Holy of Holies\">Holy of Holies<\/span> as a jewel in the <span class=\"vocab-trigger\" data-vocab=\"diadem\">diadem<\/span> of the <span class=\"vocab-trigger\" data-vocab=\"almighty King\">almighty King<\/span>, can you honestly complain that this “crown jewel of Lebanon” was cut down, removed from the forest, and placed in such a <span class=\"vocab-trigger\" data-vocab=\"noble setting\">noble setting<\/span>? The cedar had once stood majestically in nature’s sanctuary, but “the glory of this present house will be greater than the glory of the former house” (Hag. 2:9).",
              "zh": "我们几乎要随先知撒迦利亚呼喊：“松树啊，应当哀号，因为香柏树已经倾倒……！”（撒迦利亚书11:2），仿佛邀集一切较卑微的植物同情，又煽动无生命之物同来怨恨这暴行。但我们不要如此急于抱怨，应当跟随那棵巨树，看着推罗王希兰的匠人将它运下山坡。再从那里看它被扎成筏子，沿着地中海蔚蓝的水面航行。最后，我们看见它成为一根磨得光滑的荣美栋梁，安放在神的殿中。当你思想它最终的归宿，看见它在至圣所里，成为全能君王冠冕上的珠宝，你还能真诚地抱怨这“黎巴嫩的王冠宝石”被砍下、移出森林，并被安置在如此高贵之处吗？那香柏树曾庄严地矗立在自然的圣所中，但“这殿后来的荣耀必大过先前的荣耀”（哈该书2:9）。",
              "simpEn": "We feel like crying out with the prophet Zechariah, 'Cry out, O pine tree, for the cedar has fallen!' as if we want every smaller plant to feel sorry and even non-living things to be upset about the wrong. But we should not be so quick to complain. Instead we should follow that huge tree as the workers of Hiram, king of Tyre, take it down the mountain. Then we should watch it being floated on rafts across the blue Mediterranean Sea. And at last, we see it put up as a beautiful, polished beam in God's temple. As you think about where it ends up, seeing it in the Most Holy Place as a jewel in the crown of the all-powerful King, can you honestly say it was wrong that this 'crown jewel of Lebanon' was cut down, taken from the woods, and put in such a grand place? The cedar once stood tall in the forest temple of nature, but 'the glory of this new house will be greater than the glory of the old one.'",
              "simpZh": "我们真想跟先知撒迦利亚一起喊：“松树啊，哀号吧，因为香柏树倒了！”好像在请所有不如它高大的植物都同情，连没有生命的东西都要为这暴行生气。但我们别那么快抱怨，反而该跟着那棵大树，看推罗王希兰的工人把它运下山。然后看它被扎成筏子，沿着地中海蔚蓝的海水漂行。最后，我们看见它成了一根又美又滑的梁，安放在神的殿里。你想着它最后的归宿，看到它在至圣所里，成为全能之王冠冕上的宝石，还能真心抱怨说这棵“黎巴嫩的王冠宝石”被砍了、从森林里挪走、放在这么高贵的地方是不对吗？香柏树曾经威严地站在大自然的圣所里，但“这新殿的荣耀要大过先前那殿的荣耀”。"
            },
            {
              "en": "So many people are like these <span class=\"vocab-trigger\" data-vocab=\"cedars of old\">cedars of old<\/span>! God’s axes of trials have <span class=\"vocab-trigger\" data-vocab=\"stripped them bare\">stripped them bare<\/span>, and yet we can see no reason for such <span class=\"vocab-trigger\" data-vocab=\"harsh\">harsh<\/span> and difficult circumstances. But God has a noble goal and purpose in mind: to place them as <span class=\"vocab-trigger\" data-vocab=\"everlasting pillars\">everlasting pillars<\/span> and <span class=\"vocab-trigger\" data-vocab=\"rafters\">rafters<\/span> in His heavenly <span class=\"vocab-trigger\" data-vocab=\"Zion\">Zion<\/span>. And He says to them, “You will be a <span class=\"vocab-trigger\" data-vocab=\"crown of splendor\">crown of splendor<\/span> in the Lord’s hand, a royal diadem in the hand of your God” (Isa. 62:3). <span class=\"vocab-trigger\" data-vocab=\"J. R. Macduff\">J. R. Macduff<\/span> I do not ask my cross to understand, My way to see— Better in darkness just to feel Your hand, And follow Thee.",
              "zh": "许多人正如这些古老的香柏树！神用试炼的斧子把他们剥得精光，我们却看不出如此严酷艰难的环境有何意义。但神心中怀有高贵的目标和旨意：要让他们成为祂天上锡安的永柱和梁木。祂对他们说：“你在耶和华的手中要作为华冠，在你神的掌上必作为冕旒。”（以赛亚书62:3） 麦克达夫 我不求明白我的十字架，不求看清前路——宁在黑暗中只感受祢的手，跟随祢。",
              "simpEn": "So many people are like those old cedars! God's axes of testing have cut them down until they are bare, and we see no reason for such hard times. But God has a great goal in mind: to set them up as pillars and beams that last forever in His heavenly home. He says to them, 'You will be a shining crown in the Lord's hand, a king's crown in the hand of your God.' J. R. Macduff I do not ask to understand my cross, or to see my way. It is better in the dark just to feel Your hand and follow You.",

              "en": "By faith we <span class=\"vocab-trigger\" data-vocab=\"eagerly await\">eagerly await<\/span> through the Spirit the <span class=\"vocab-trigger\" data-vocab=\"righteousness\">righteousness<\/span> for which we hope. (Galatians 5:5)",

              "simpZh": "有时候，我觉得周围的一切都极其黑暗，黑到一个地步，我连盼望都得等。有盼望地等候已经很难了，但真正的忍耐表现在我们连盼望都要等的时候。看不到一丝成功的迹象，却不肯绝望；透过窗户只看到黑夜，却还开着窗板，因为星星可能会出来；心里有个空洞，却不肯让任何比不上神最好旨意的东西填进去——这就是宇宙间最伟大的忍耐。这是约伯在风暴中、亚伯拉罕往摩利亚的路上、摩西在米甸旷野、人子在客西马尼园的故事。没有一种忍耐比因为看见了那不能看见的主而坚持到底更刚强。这就是等候盼望的忍耐。"

            {
              "en": "I remember when I was a young person attending school in the <span class=\"vocab-trigger\" data-vocab=\"vicinity\">vicinity<\/span> of <span class=\"vocab-trigger\" data-vocab=\"Mount Pleasant\">Mount Pleasant<\/span>. One day I sat on the side of the mountain and watched a storm as it moved through the valley. The skies were filled with darkness, and thunder began to shake the earth. It seemed as though the <span class=\"vocab-trigger\" data-vocab=\"lush\">lush<\/span> <span class=\"vocab-trigger\" data-vocab=\"landscape\">landscape<\/span> were completely changed, and its beauty gone forever. But the storm passed quickly and soon moved out of the valley. If I had sat in the same place the following day and said, “Where is that <span class=\"vocab-trigger\" data-vocab=\"intense\">intense<\/span> storm and all its terrible darkness?” the grass would have said, “Part of it is in me.” The beautiful <span class=\"vocab-trigger\" data-vocab=\"daisy\">daisy<\/span> would have said, “Part of it is in me.” And all the other flowers, fruits, and everything that grows in the ground would have said, “Part of the storm has produced the <span class=\"vocab-trigger\" data-vocab=\"radiance\">radiance<\/span> in me.”",
              "zh": "我记得年轻时在宜人山附近读书。一天，我坐在山坡上，观看一场风暴掠经山谷。天空布满黑暗，雷声震动大地。那本来郁郁葱葱的美景好像全变了，美丽一去不返。但风暴很快过去，不久便离开了山谷。如果我次日再坐原地，问道：“那场剧烈的风暴和一切可怕的黑暗在哪里呢？”青草会说：“一部分在我里面。”美丽的雏菊会说：“一部分在我里面。”其他所有花朵、果实和地上生长的一切都会说：“风暴的一部分，已化作我里面的光彩。”",

              "simpZh": "我记得小时候在宜人山附近上学。有一天我坐在山腰，看着一场风暴扫过山谷。天空全是黑的，雷声撼动大地。那本来绿油油的美景好像全毁了，美丽一去不回。但风暴很快过去了，不久就离开了山谷。要是我第二天还坐在原处，问：“那场猛烈的风暴和所有可怕的黑暗去哪儿了？”青草会说：“一部分在我里面。”美丽的雏菊会说：“一部分在我里面。”其余所有的花、果实和地里长的一切都会说：“风暴的一部分，变成了我里面的光彩。”"
            },
            {
              "en": "Have you ever asked the Lord to make you like Him? Have you ever desired the <span class=\"vocab-trigger\" data-vocab=\"fruit of the Spirit\">fruit of the Spirit<\/span> and prayed for <span class=\"vocab-trigger\" data-vocab=\"sweetness\">sweetness<\/span>, <span class=\"vocab-trigger\" data-vocab=\"gentleness\">gentleness<\/span>, and love? If so, then never fear the fierce storms that even now may be blowing through your life. Storms bring blessings, and rich fruit will be <span class=\"vocab-trigger\" data-vocab=\"harvested\">harvested<\/span> later. <span class=\"vocab-trigger\" data-vocab=\"Henry Ward Beecher\">Henry Ward Beecher<\/span>",
              "zh": "你可曾求主使你像祂？你可曾渴慕圣灵的果子，祈求甘甜、温柔和爱？若是这样，就永远不要惧怕那可能正刮过你生命的暴烈风雨。风暴带来祝福，日后必有丰盛的果子收成。 亨利·沃德·比彻",
              "simpEn": "Have you ever asked the Lord to make you like Him? Have you ever wanted the spiritual fruit and prayed for kindness, gentleness, and love? If you have, then never be afraid of the wild storms that might be blowing through your life right now. Storms bring good things, and rich fruit will be gathered later. Henry Ward Beecher",
              "simpZh": "你有没有求主让你像祂？有没有渴望圣灵的果子，祷告求温柔、良善和爱心？如果有，那就永远别害怕现在正吹过你生命的猛烈风暴。风暴会带来祝福，以后会收到丰盛的果子。亨利·沃德·比彻"

            {

              "simpEn": "The flowers live on the tears that drop from the sky's sad face. And life would have no happiness at all if there were no wet eyes. Love the sadness, because in later years the pain will bring its own blessing. Look at the rainbow! See what a beautiful thing God has made out of tears. Henry S. Sutton",

            {
              "en": "Have you entered the <span class=\"vocab-trigger\" data-vocab=\"storehouses\">storehouses<\/span> . . . which I <span class=\"vocab-trigger\" data-vocab=\"reserve\">reserve<\/span> for times of trouble? (Job 38:22–23)",

            },
            {
              "en": "Our trials are great <span class=\"vocab-trigger\" data-vocab=\"opportunities\">opportunities<\/span>, but all too often we simply see them as large <span class=\"vocab-trigger\" data-vocab=\"obstacles\">obstacles<\/span>. If only we would recognize every difficult situation as something God has chosen to <span class=\"vocab-trigger\" data-vocab=\"prove\">prove<\/span> His love to us, each obstacle would then become a place of shelter and rest, and a <span class=\"vocab-trigger\" data-vocab=\"demonstration\">demonstration<\/span> to others of His <span class=\"vocab-trigger\" data-vocab=\"inexpressible\">inexpressible<\/span> power. If we would look for the signs of His glorious <span class=\"vocab-trigger\" data-vocab=\"handiwork\">handiwork<\/span>, then every cloud would indeed become a <span class=\"vocab-trigger\" data-vocab=\"rainbow\">rainbow<\/span>, and every difficult mountain path would become one of <span class=\"vocab-trigger\" data-vocab=\"ascension\">ascension<\/span>, <span class=\"vocab-trigger\" data-vocab=\"transformation\">transformation<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"glorification\">glorification<\/span>.",
              "zh": "我们的试炼是巨大的机遇，但我们常常只看它们为巨大的障碍。只要我们认识每个困境都是神所选来向我们证明祂爱的途径，每个障碍就会变成安息之所，并向他人显明祂无法言喻的能力。我们若留心寻找祂荣耀作为的痕迹，每一片云都将化为彩虹，每一条艰难的山路都将成为上升、变化和得荣耀之路。",
              "simpEn": "Our hard times are big chances to grow, but we too often just see them as big problems. If only we saw every hard situation as something God uses to show His love, each problem would become a place of rest and a way to show others His amazing power. If we looked for signs of His wonderful work, every dark cloud would become a rainbow, and every hard mountain path would become a way to go higher, be changed, and be honored.",

            {
              "en": "If we would look at our past, most of us would realize that the times we <span class=\"vocab-trigger\" data-vocab=\"endured\">endured<\/span> the greatest stress and felt that every path was blocked were the very times our heavenly Father chose to do the kindest things for us and <span class=\"vocab-trigger\" data-vocab=\"bestow\">bestow<\/span> His richest blessings. God’s most beautiful <span class=\"vocab-trigger\" data-vocab=\"jewels\">jewels<\/span> are often delivered in rough packages by very difficult people, but within the package we will find the very <span class=\"vocab-trigger\" data-vocab=\"treasures\">treasures<\/span> of the King’s palace and the <span class=\"vocab-trigger\" data-vocab=\"Bridegroom’s\">Bridegroom’s<\/span> love. <span class=\"vocab-trigger\" data-vocab=\"A. B. Simpson\">A. B. Simpson<\/span>",
              "zh": "回顾过往，我们大多数人都能发现，我们承受最大压力、感觉条条路都被堵死的时刻，正是天父向我们行最慈爱之事、赐最丰盛祝福的时刻。神最美的宝石，常包裹在粗糙的包装里，由极难相处的人送来；但打开包装，我们必看见王宫的珍宝和新郎的爱情。 宣信",

              "simpZh": "我们必须在黑暗中信任主，哪怕在艰难的环境中也要用不动摇的信心尊敬祂。这种信心的赏赐，就像老鹰换羽毛时得到的那样——重新变得年轻力壮。麦克达夫"

              "zh": "我们若能看见今天之后，如同神所看见的；若一切乌云消散，黑影飞逝；我们就不会为眼前的忧伤烦躁。每件伤心事我们都会很快忘记，因为还有许多喜乐在等候你和我。我们若知道今天之后，如同神所知道的，为何最珍爱的宝物会逝去，为何眼泪必须流淌；为何黑暗引向光明，为何阴郁的路很快就明亮；总有一天人生的冤屈会得平反，信心如此告诉我们。“我们若能看见，若能知道，”我们常说，但神在爱中把一层帕子蒙在我们路上；我们看不见前头的事，因此就越发紧紧抓住祂，祂带领我们直到此生尽头；只要信靠顺服。",
              "simpEn": "If we could see past today the way God sees; if all the clouds rolled away and the shadows ran off; we would not worry over today's sadness. We would soon forget every sorrow, because many joys are still waiting for you and me. If we could know beyond today the way God knows, why the things we love most are taken and tears must fall; and why dark times lead to light, why sad roads will soon turn bright; someday life's wrongs will be fixed, faith tells us so. 'If we could see, if we could know,' we often say, but God in love puts a covering over our path. We cannot see what is ahead, so we hold on to Him even more. He leads us until this life is over; trust and obey.",
              "simpZh": "如果我们能看见今天以后的事，像神看见的那样；如果所有乌云都散开，黑影都跑掉；我们就不会为眼前的难过烦躁了。我们会很快忘记每件伤心事，因为还有许多快乐在等着你和我。如果我们能知道今天以后的事，像神知道的那样，为什么最心爱的东西会失去，眼泪一定要流；为什么黑暗会引向光明，为什么阴沉的路很快就会亮起来；总有一天，生命中的冤屈会被纠正，信心这样告诉我们。“如果我们能看见，如果能知道，”我们常常这样说，但神在爱里把一层纱蒙在我们的路上；我们看不见前面是什么，所以就更加紧紧抓住祂，祂带领我们直到这辈子结束；只要信靠和顺服。"

              "zh": "使你心痛苦难堪的，亲爱的，不是你做了的事，而是你未做的事，在日落之时；那未出口的温柔话，那未写成的信，那本可送出的花，亲爱的，是夜间缠绕你的幽灵。那本可替弟兄从路上挪开的石头，那因太匆忙而未说的由衷劝言；那爱心的手之轻抚，亲爱的，那温和而动人的语调，你因自己烦恼缠身，竟无暇无心顾及。这些小小的善行，如此容易被遗忘，这些作天使的机会，连凡人也能遇见——它们就在寂静的夜里来临，要带走忧伤，当盼望微弱无力，干旱使信心枯竭之时。生命太短暂了，亲爱的，忧愁也太沉重，容不得我们迟钝的同情心迟迟才发动。使你心痛苦难堪的，亲爱的，不是你做了的事，而是你未做的事，在日落之时。 阿德莱德·普罗克特",
              "simpEn": "It is not what you do, dear, it is what you leave not done that gives you the sharp pain at the end of the day. The soft word you did not speak, the letter you did not write, the flower you could have sent, dear, are the ghosts that haunt you at night. The stone you could have lifted out of your brother's path, the little piece of deep advice you were too rushed to say; the loving touch of your hand, dear, the kind and lovely tone of voice that you had no time or thought for because you had enough troubles of your own. These small acts of kindness, so easy to forget, these chances to be like angels that even humans can find—they come back in quiet nights to take away sadness, when hope is weak and tiny, and a dry time has stopped belief. Life is just too short, dear, and sadness is too great, to let our slow care wait until it is too late. And it's not what you do, dear, it's what you leave undone that gives you the bitter pain at the end of the day. Adelaide Proctor",
              "simpZh": "让你心里深深疼痛的，亲爱的，不是你做了的事，而是你没做的事，在太阳下山的时候。你没说出口的那句温柔话，你没写的那封信，你本可以送出的那朵花，亲爱的，这些都在夜里变成缠着你的鬼魂。那块你本可以替弟兄从路上搬开的石头，那句你因为太匆忙而没有说出的真心劝告；你那只爱心的手本可以轻轻触摸，亲爱的，还有那温柔好听的声音，你却因为自己的麻烦够多而没有时间、也没有心思去给。这些小小的善行太容易被忘掉，这些做天使的机会，连普通人都能碰到——它们在安静的夜晚回来，带走忧伤，当希望又弱又小，干旱已经让信心停止的时候。生命实在太短了，亲爱的，忧伤也太重了，我们不能让迟钝的同情一直拖到太晚。让你心里深深疼痛的，不是做了的事，是没做的事，在太阳下山的时候。阿德莱德·普罗克特"

          "paragraphs": [
            {
              "en": "With <span class=\"vocab-trigger\" data-vocab=\"skillful hands\">skillful hands<\/span> he led them. (Psalm 78:72)",

            {
              "en": "When you are unsure which course to take, totally <span class=\"vocab-trigger\" data-vocab=\"submit\">submit<\/span> your own <span class=\"vocab-trigger\" data-vocab=\"judgment\">judgment<\/span> to that of the <span class=\"vocab-trigger\" data-vocab=\"Spirit of God\">Spirit of God<\/span>, asking Him to shut every door except the right one. But meanwhile keep moving ahead and consider the <span class=\"vocab-trigger\" data-vocab=\"absence\">absence<\/span> of a direct <span class=\"vocab-trigger\" data-vocab=\"indication\">indication<\/span> from God to be the <span class=\"vocab-trigger\" data-vocab=\"evidence\">evidence<\/span> of His will that you are on His path. And as you continue down the long road, you will find that He has gone before you, locking doors you otherwise would have been <span class=\"vocab-trigger\" data-vocab=\"inclined\">inclined<\/span> to enter. Yet you can be sure that somewhere beyond the locked doors is one He has left <span class=\"vocab-trigger\" data-vocab=\"unlocked\">unlocked<\/span>. And when you open it and walk through, you will find yourself face to face with a turn in the river of <span class=\"vocab-trigger\" data-vocab=\"opportunity\">opportunity<\/span>—one that is broader and deeper than anything you ever dared to imagine, even in your <span class=\"vocab-trigger\" data-vocab=\"wildest dreams\">wildest dreams<\/span>. So set sail on it, because it flows to the open sea.",
              "zh": "当你不能确定该走哪条路时，当完全将自己判断顺服于神的灵，求祂关闭每一扇门，只留下正确的那扇。但与此同时，要继续前行，并将神未直接拦阻视为祂旨意的凭据，说明你正在祂的路上。当你沿着漫漫长路继续走，必发现祂已行在你前面，锁上了你本来有意进入的门。然而你可以确信，在被锁之门后面的某处，有一扇祂留而未锁的。当你打开它，穿过去，就会发现自己正面对机遇之河的转弯处——那河比你最大胆想象过的更广阔、更深邃。所以扬帆其上吧，因为它流向广阔的大海。",
              "simpEn": "When you are not sure what path to take, give up your own thinking to God's Spirit and ask Him to close every door but the right one. But while you wait, keep moving forward and take the fact that God does not stop you as a sign that you are on His road. As you keep going down the long road, you will find He went ahead of you, shutting doors you would have wanted to enter. But you can be sure that beyond the locked doors there is one He has left open. When you open it and walk through, you will come to a bend in a river of new chances—one that is wider and deeper than anything you ever dreamed. So put up your sail and go, because it flows to the open sea.",
              "simpZh": "当你拿不准该走哪条路时，就把自己的判断完全交给神的灵，求祂关掉所有门，只留下对的那一扇。但同时要继续往前走，把神没有明确阻止当作祂的记号，说明你正走在祂的路上。你沿着这条长路继续走，就会发现祂已经走在你前面，把那些你本来可能想进去的门锁上了。但你可以放心，在那些锁着的门后面，有一扇祂留着没锁的。等你打开它走过去，就会发现自己遇见了一个机会河流的拐弯——那河比你做梦敢想的还要宽、还要深。所以，扬起帆往前走吧，因为它是流向大海的。"
            },
            {
              "en": "God often guides us through our <span class=\"vocab-trigger\" data-vocab=\"circumstances\">circumstances<\/span>. One moment, our way may seem totally blocked, but then suddenly some seemingly <span class=\"vocab-trigger\" data-vocab=\"trivial incident\">trivial incident<\/span> occurs, appearing as nothing to others but speaking <span class=\"vocab-trigger\" data-vocab=\"volumes\">volumes<\/span> to the keen eye of faith. And sometimes these events are repeated in various ways in response to our prayers. They certainly are not <span class=\"vocab-trigger\" data-vocab=\"haphazard\">haphazard<\/span> results of chance but are God opening up the way we should walk, by directing our circumstances. And they begin to <span class=\"vocab-trigger\" data-vocab=\"multiply\">multiply<\/span> as we advance toward our goal, just as the lights of a city seem to increase as we speed toward it while traveling at night. <span class=\"vocab-trigger\" data-vocab=\"F. B. Meyer\">F. B. Meyer<\/span>",
              "zh": "神常借着环境引导我们。有时，我们的路看似完全被堵，但突然间一些看似微不足道的小事发生，别人看作无谓，但有敏锐信心的眼睛却看出深意。这些事有时会反复以不同方式出现，回应我们的祷告。它们绝不是偶然的巧合，而是神借着调度环境，为我们打开当走的路。随着我们向目标前进，这些事就渐渐增多，如同夜间赶路时，城市的灯火越近越密集。 迈尔",
              "simpEn": "God often leads us by what happens around us. One moment our way may look totally shut, but then suddenly some small thing happens that seems like nothing to others but speaks a lot to the sharp eye of faith. Sometimes these little things happen again in different ways, answering our prayers. They are not just random chance; they are God opening the path we should take by guiding our situation. And they start to grow in number as we move toward our goal, just like the lights of a city seem to grow as we speed toward it at night. F. B. Meyer",
              "simpZh": "神常常通过我们周围的事情来引导我们。前一刻，路好像完全堵死了，但忽然间，有些看起来微不足道的小事发生，在别人眼里不算什么，但对信心的敏锐眼睛却讲了很多。有时候，这些事会以不同的方式重复出现，回应我们的祷告。它们绝不是随随便便的巧合，而是神在通过安排环境，为我们打开该走的路。随着我们向目标前进，这些事就越来越多了，就像晚上开车时，越靠近城市，灯光就越密。迈尔"
            },

              "zh": "你若向神寻求引导，祂必引导你。但不要在你显出不信或半信半疑时，期望祂用一张有关你的旨意清单来安慰你。你若肯信靠祂，当祂给你开路时欢欢喜喜前行，祂要做的就是引导你走得更远。 贺拉斯·布什内尔",
              "simpEn": "If you ask God to lead you, He will lead you. But do not expect Him to make you feel better by showing you a list of His plans for you when you have shown doubt or even half-trust in Him. What He will do, if you trust Him and go forward happily when He shows you the way, is to lead you even farther. Horace Bushnell",
              "simpZh": "如果你去找神求引领，祂一定会引领你。但不要在你显出不信或半信的时候，期待祂给你看一份关于你的计划表来安慰你。只要你肯信靠祂，当祂给你指出路的时候欢欢喜喜地向前走，祂就会带领你走得更远。贺拉斯·布什内尔"

              "zh": "我脆弱的小舟横渡暴风肆虐的海，巨浪拍打船舷，北风怒号；黑暗深处藏着威胁的礁石与暗沙；但这一切，以及更多，我的领航员全都知道。有时黑夜降临，每一盏灯都熄灭，我不知脆弱之舟驶向何方港湾；虽然夜漫长，我辗转难眠，但我确信，我遥远的目标，我的领航员知道。 多马·柯蒂斯·克拉克",
              "simpEn": "As my weak little boat moves across the storm-hit sea, huge waves crash over its side while the north wind blows. Deep in the darkness hide threatening rocks and sharp reefs. But all this and more, my Pilot knows. Sometimes when darkness falls and every light has gone out, I wonder toward what harbor my weak boat is going. Though the night is long and I cannot rest, my far-off goal, I am sure, my Pilot knows. Thomas Curtis Clark",

          "paragraphs": [
            {
              "en": "Offer yourselves to God, as those who have been brought from death to life. (Romans 6:13)",
              "zh": "倒要像从死里复活的人，将自己献给神。（罗马书6:13）",
              "simpEn": "Give yourselves to God, like people who have been brought from death to life.",
              "simpZh": "把你们自己献给神，就像一个从死里活过来的人。"
            },
            {
              "en": "One night I went to hear a <span class=\"vocab-trigger\" data-vocab=\"sermon\">sermon<\/span> on <span class=\"vocab-trigger\" data-vocab=\"consecration\">consecration<\/span>. Nothing special came to me from the message, but as the preacher knelt to pray, he said, “O Lord, You know we can trust the Man who died for us.” That was my message. As I rose from my knees and walked down the street to catch the train, I deeply <span class=\"vocab-trigger\" data-vocab=\"pondered\">pondered<\/span> all that consecration would mean to my life. I was afraid as I considered the personal cost, and suddenly, above the noise of the street traffic, came this message: “You can trust the Man who died for you.” I boarded the train, and as I traveled toward home, I thought of the changes, <span class=\"vocab-trigger\" data-vocab=\"sacrifices\">sacrifices<\/span>, and disappointments that consecration might mean in my life—and I was still afraid.",
              "zh": "一天晚上，我去听了一场关于奉献的讲道。信息本身对我没什么特别触动，但当讲员跪下祷告时，他说：“主啊，你知道我们可以信靠那位为我们死的人。”这正是给我的信息。我从地上起来，沿街走去赶火车时，深深思想奉献对我一生的意义。考虑到个人的代价，我感到害怕。突然，在街上的车声之上，传来一句话：“你可以信靠那位为你死的人。”我上了火车，在回家的路上，想到奉献可能带来的改变、牺牲和失望——我仍然害怕。",
              "simpEn": "One night I went to hear a talk about giving oneself fully to God. Nothing special hit me from the message, but when the preacher knelt to pray, he said, 'O Lord, You know we can trust the Man who died for us.' That word was for me. As I stood up and walked down the street to catch the train, I thought deeply about what total giving would mean for my life. I was scared as I thought about what it would cost me. Suddenly, above the noise of the street, I heard this message: 'You can trust the Man who died for you.' I got on the train, and as I rode home, I thought about the changes, the giving up, and the letdowns that total giving might bring—and I was still afraid.",
              "simpZh": "一天晚上，我去听了一场关于把自己完全献给神的讲道。信息本身没什么特别打动我的，但当讲员跪下祷告时说：“主啊，你知道我们可以信靠那位为我们死的人。”那句话是给我的。我站起来，沿着街走去赶火车时，深深思考完全的奉献对我的生活会意味着什么。一想到要付出的代价，我就害怕。忽然，在街道的嘈杂声之上，我听到一句话：“你可以信靠那位为你死的人。”我上了火车，在回家的路上，想着奉献可能带来的改变、牺牲和失望——我还是害怕。"
            },
            {
              "en": "Upon arriving home, I went straight to my room, fell on my knees, and saw my life pass before my eyes. I was a Christian, an <span class=\"vocab-trigger\" data-vocab=\"officer\">officer<\/span> in the church, and a Sunday school <span class=\"vocab-trigger\" data-vocab=\"superintendent\">superintendent<\/span>, but I had never <span class=\"vocab-trigger\" data-vocab=\"yielded\">yielded<\/span> my life to God with a <span class=\"vocab-trigger\" data-vocab=\"definite\">definite<\/span> act of my will. Yet as I thought of my own “<span class=\"vocab-trigger\" data-vocab=\"precious\">precious<\/span>” plans that might be <span class=\"vocab-trigger\" data-vocab=\"thwarted\">thwarted<\/span>, my beloved hopes to be <span class=\"vocab-trigger\" data-vocab=\"surrendered\">surrendered<\/span>, and my chosen <span class=\"vocab-trigger\" data-vocab=\"profession\">profession<\/span> that I might have to <span class=\"vocab-trigger\" data-vocab=\"abandon\">abandon<\/span>—I was afraid. I completely failed to see the better things God had for me, so my soul was running from Him. And then for the last time, with a <span class=\"vocab-trigger\" data-vocab=\"swift force\">swift force<\/span> of <span class=\"vocab-trigger\" data-vocab=\"convicting power\">convicting power<\/span> to my <span class=\"vocab-trigger\" data-vocab=\"inmost heart\">inmost heart<\/span>, came that searching message: “My child, you can trust the Man who died for you. If you cannot trust Him, then whom can you trust?” Finally that <span class=\"vocab-trigger\" data-vocab=\"settled\">settled<\/span> it for me, for in a <span class=\"vocab-trigger\" data-vocab=\"flash of light\">flash of light<\/span> I realized that the Man who loved me enough to die for me could be absolutely trusted with the total <span class=\"vocab-trigger\" data-vocab=\"concerns\">concerns<\/span> of the life He had saved.",
              "zh": "回到家，我径直进房间跪下，眼见自己的一生在眼前闪过。我是基督徒，教会的执事，主日学校长，但我从未用明确的意志行动将生命献给神。我想到自己那些“宝贵”的计划或许会受挫，心爱的盼望不得不放弃，所选的职业可能得撇下——我就害怕。我完全看不到神为我预备的更美之事，所以我的灵魂一直在躲避祂。最后，带着一股迅速的定罪能力，刺入我心最深处，那探寻的信息临到：“我的孩子，你可以信靠那位为你死的人。你若不能信靠祂，还能信靠谁呢？”这一下终于为我解决了问题，因为在刹那的亮光中，我认识到那位爱我爱到为我死的人，完全可以被信托以祂所拯救生命的全部事务。",
              "simpEn": "When I got home, I went right to my room, knelt down, and saw my whole life pass before my eyes. I was a Christian, a leader in the church, and a Sunday school head, but I had never given my life to God with a clear, strong choice of my will. As I thought about my own 'dear' plans that might be stopped, my loved hopes that would have to be given up, and my chosen job that I might have to leave—I was afraid. I could not see the better things God had for me, so my heart was running from Him. Then for the last time, with a quick, strong power that made me see my wrong, right into the deepest part of my heart, came that searching word: 'My child, you can trust the Man who died for you. If you cannot trust Him, then who can you trust?' At last that made it final for me. In a sudden moment of light I saw that the Man who loved me enough to die for me could be fully trusted with everything in the life He had saved.",
              "simpZh": "到家后，我直接进房间跪下，看见自己的一生从眼前闪过。我是个基督徒，是教会的执事，也当主日学校长，但我从来没有用一次明确的意志行动把生命献给神。我想到自己那些“宝贵”的计划可能会被拦阻，心爱的盼望要交出去，自己选择的职业可能得放弃——我就害怕。我完全看不到神为我预备的更好的东西，所以我的心一直在逃避祂。最后，带着一股迅速的定罪力量，直达我内心最深处，那个搜寻的信息来了：“我的孩子，你可以信靠那位为你死的人。如果你不能信靠祂，还能信靠谁呢？”终于，这句话帮我定了局，因为在一道闪光里我明白了，那位爱我爱到为我死的人，绝对可以信托祂所拯救的生命的全部事情。"
            },
            {
              "en": "Dear friend, you can trust the Man who died for you. You can trust Him to <span class=\"vocab-trigger\" data-vocab=\"thwart\">thwart<\/span> each plan that should be stopped and to complete each one that results in His greatest <span class=\"vocab-trigger\" data-vocab=\"glory\">glory<\/span> and your highest good. You can trust Him to lead you down the path that is the very best in this world for you. <span class=\"vocab-trigger\" data-vocab=\"J. H. M.\">J. H. M.<\/span> Just as I am, Thy love unknown, Has broken every <span class=\"vocab-trigger\" data-vocab=\"barrier\">barrier<\/span> down, Now to be Thine, yea, Thine ALONE, O <span class=\"vocab-trigger\" data-vocab=\"Lamb of God\">Lamb of God<\/span>, I come! Life is not <span class=\"vocab-trigger\" data-vocab=\"wreckage\">wreckage<\/span> to be saved out of the world but an <span class=\"vocab-trigger\" data-vocab=\"investment\">investment<\/span> to be used in the world.",
              "zh": "亲爱的朋友，你可以信靠那位为你死的人。你可以信靠祂去拦阻每一个当被阻止的计划，并成就每一个使祂得最大荣耀、你得益处的计划。你可以信靠祂带你走上这世上于你最好的道路。 J. H. M. 我正如我，祢那未识之爱，已打破一切障碍，今愿属祢，专一属祢，哦，神之羔羊，我来就祢！生命不是要从世界里打捞的残骸，而是要用于世界的投资。",
              "simpEn": "Dear friend, you can trust the Man who died for you. You can trust Him to stop every plan that should be stopped and to finish every plan that brings Him the most honor and brings you the best good. You can trust Him to lead you on the path that is the very best in this world for you. J. H. M. Just as I am, Your love I never fully knew has broken down every wall. Now to be Yours, yes, Yours completely, O Lamb of God, I come! Life is not broken pieces to be rescued from the world but something valuable to be used in the world.",
              "simpZh": "亲爱的朋友，你可以信靠那位为你死的人。你可以信靠祂拦阻每一个该被拦阻的计划，成就每一个让祂最得荣耀、让你得最大益处的计划。你可以信靠祂带领你走这世上对你最好的那条路。 J. H. M. 就像我现在这样，你那我不完全知道的爱，已经打破了每一道障碍。现在我要属于你，单单属于你，哦，神的羔羊，我来了！生命不是要从世界里救出来的破烂，而是要投资在世界里的东西。"
            }
          ],

          "paragraphs": [
            {
              "en": "I will turn all my <span class=\"vocab-trigger\" data-vocab=\"mountains\">mountains<\/span> into roads. (Isaiah 49:11)",

              "simpEn": "I will turn all my mountains into roads.",
