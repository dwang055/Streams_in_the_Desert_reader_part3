        {
          "sectionId": 4,
          "heading": "September 5",
          "audio": "audio/streams in the desert - September 5.m4a",
          "paragraphs": [
            {
              "en": "Blessed are all who wait for him! (Isaiah 30:18)",
              "zh": "凡等候祂的都是有福的！（以赛亚书30:18）",
              "simpEn": "Happy are all who wait for Him!",
              "simpZh": "所有等候祂的人都是有福的！"
            },
            {
              "en": "We often hear about waiting on God, which actually means that He is waiting until we are ready. There is another side, however. When we wait for God, we are waiting until He is ready. Some people say, and many more believe, that as soon as we meet all His conditions, God will answer our prayer. They teach that He lives in an <span class=\"vocab-trigger\" data-vocab=\"eternal now\">eternal now<\/span>, that with Him there is no past or future, and that if we can fulfill all He requires to be obedient to His will, immediately our needs will be met, our desires satisfied, and our prayers answered.",
              "zh": "我们常听说等候神，那实际上意味着祂在等待我们预备好。然而还有另一面。当我们等候神的时候，我们是在等祂预备好。有人说——且有更多人相信——我们一旦满足了祂所有条件，神就立刻应允祷告。他们教导说，神活在永恒的现在，在祂没有过去或将来，如果我们能履行祂所要求的一切，顺服祂的旨意，我们的需要就会立刻得到供应，渴望得到满足，祷告得到应允。",
              "simpEn": "We often hear about waiting on God, which really means He is waiting until we are ready. But there is another side. When we wait for God, we are waiting until He is ready. Some say, and many believe, that as soon as we meet all His conditions, God will answer our prayers. They teach that He lives in an endless 'now,' with no past or future, and if we can do all He asks to obey His will, right away our needs are met, our wants satisfied, and our prayers answered.",
              "simpZh": "我们常听说等候神，其实那是指祂在等我们预备好。但还有另一面。当我们等候神时，我们是在等祂预备好。有人说，而且更多人相信，只要我们满足祂所有条件，神就会马上应允祷告。他们教导说神活在永恒的“现在”，祂没有过去和将来，如果我们能履行祂要求的一切、顺服祂的旨意，立刻我们的需要就满足了，渴望实现了，祷告也应允了。"
            },
            {
              "en": "While there is much truth in this belief, it expresses only one side of the truth. God does live in an eternal now, yet He works out His purposes over time. A <span class=\"vocab-trigger\" data-vocab=\"petition\">petition<\/span> presented to God is like a seed dropped into the ground. Forces above and beyond our control must work on it until the actual accomplishment of the answer. <span class=\"vocab-trigger\" data-vocab=\"from The Still Small Voice\">from The Still Small Voice<\/span>",
              "zh": "这种信念虽含有许多真理，却只表达了真理的一面。神确实活在永恒的现在，但祂是在时间中逐步成就祂的旨意。递呈给神的祈求，就像一粒种子落在地里。有超乎我们控制以上的力量必须作用于它，直到答应实际成就。 摘自《微小的声音》",
              "simpEn": "Though there is much truth in this belief, it tells only one side. God does live in an eternal now, but He works out His plans over time. A request brought to God is like a seed dropped into the ground. Forces above and beyond our control must work on it until the answer is actually done. from The Still Small Voice",
              "simpZh": "这个信念虽然有很多真理，但只讲了真理的一面。神的确活在永恒的现在，但祂是在时间里成就祂的旨意。一个向神提出的请求，就像一颗种子落在地里。有超乎我们控制的力量必须在它上面工作，直到答案实际成就。摘自《微小的声音》"
            },
            {
              "en": "I longed to walk along an easy road, And leave behind the dull <span class=\"vocab-trigger\" data-vocab=\"routine\">routine<\/span> of home, Thinking in other fields to serve my God; But Jesus said, “My time has not yet come.” I longed to sow the seed in other soil, To be <span class=\"vocab-trigger\" data-vocab=\"unshackled\">unshackled<\/span> in the work, and free, To join with other laborers in their toil; But Jesus said, “It’s not My choice for thee.” I longed to leave the desert, and be led To work where souls were sunk in sin and shame, That I might win them; but the Master said, “I have not called you, publish here My name.” I longed to fight the battles of my King, Lift high His standards in the thickest strife; But my great Captain had me wait and sing Songs of His conquests in my quiet life. I longed to leave the hard and difficult sphere, Where all alone I seemed to stand and wait, To feel I had some human helper near, But Jesus had me guard one lonely gate. I longed to leave the common daily toil, Where no one seemed to understand or care; But Jesus said, “I choose for you this soil, That you might raise for Me some blossoms rare.” And now I have no longing but to do At home, or far away, His blessed will, To work amid the many or the few; Thus, “choosing not to choose,” my heart is still. <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "我渴望走在容易的路上，丢开家中枯燥的例常，以为在别处能服侍神；但耶稣说：“我的时候还没有到。”我渴望将种子撒在别的土里，在工作上不受束缚，得以自由，与其他工人一同劳苦；但耶稣说：“这不是我对你的选择。”我渴望离开旷野，被领去灵魂深陷罪与羞耻之地作工，好叫我能得着他们；但主说：“我未曾呼召你，在这里宣扬我的名。”我渴望为我王争战，在最烈的冲突中高举祂旌旗；但我伟大的元帅要我等候，并在我安静的生活中歌唱祂的得胜。我渴望离开那艰难困苦之地，在那里我似乎孤单站立等候，渴望身边有人帮助；但耶稣要我独守那孤寂的城门。我渴望离开日常普通的劳碌，在那里似乎无人明白或关顾；但耶稣说：“我为你选了这片土，好叫你为我栽种一些稀有的花朵。”如今我别无渴望，只求在家中，或远方，遵行祂可称颂的旨意，或在众人中，或在少数人中作工；如此，“选择不去选择”，我的心便平静了。 选自",
              "simpEn": "I wanted to walk on an easy road and leave behind the boring daily life at home, thinking I could serve my God in other fields. But Jesus said, 'My time has not yet come.' I wanted to plant seed in other soil, to be free and unbound in the work, to join with other workers in their labor. But Jesus said, 'It's not My choice for you.' I wanted to leave the desert and be led to work where people were deep in sin and shame, that I might win them. But the Master said, 'I have not called you; make My name known here.' I wanted to fight the battles of my King, lift His flag high in the thickest fight. But my great Captain had me wait and sing songs of His wins in my quiet life. I wanted to leave the hard and difficult place, where I seemed to stand and wait all alone, to feel I had some human helper near. But Jesus had me guard one lonely gate. I wanted to leave the common daily work where no one seemed to understand or care. But Jesus said, 'I choose this soil for you, that you might grow some rare flowers for Me.' And now I have no other wish but to do, at home or far away, His blessed will, to work among the many or the few. So, 'choosing not to choose,' my heart is still. selected",
              "simpZh": "我渴望走容易的路，丢开家里平淡的日常，以为在别的地方能服侍神；但耶稣说：“我的时候还没有到。”我渴望把种子撒在别的土地上，在工作上不受捆绑、自由，和其他工人一起辛苦；但耶稣说：“这不是我为你选的。”我渴望离开旷野，被领去灵魂深深陷在罪和羞耻里的地方做工，好叫我能赢得他们；但主人说：“我没有呼召你，在这里宣扬我的名。”我渴望为我王打仗，在最激烈的战斗中高举祂的旗帜；但我伟大的元帅要我等候，在我安静的生活中唱祂得胜的歌。我渴望离开那艰难困苦的地方，在那里好像只有我独自站着等候，我想身边有个人的帮助；但耶稣要我独自把守一个孤单的门。我渴望离开平凡日常的劳作，那里好像没人理解、没人关心；但耶稣说：“我为你选了这片土，好叫你为我种出一些稀罕的花。”现在我没有别的渴望，只愿在家或远方，遵行祂可称颂的旨意，在众人或少数人中作工；这样，“选择不去选择”，我的心就平静了。选自"
            },
            {

              "zh": "忍耐愿意等候。 摘自《天路历程》",

              "simpZh": "而忍耐愿意等候。摘自《天路历程》"

        {
          "sectionId": 5,
          "heading": "September 6",
          "audio": "audio/streams in the desert - September 6.m4a",
          "paragraphs": [
            {
              "en": "You remain. (Hebrews 1:11)",
              "zh": "惟有你长存。（希伯来书1:11）",
              "simpEn": "You stay the same forever.",
              "simpZh": "你永远长存。"
            },
            {
              "en": "There are so many people who sit by their fireplace all alone! They sit by another chair, once filled, and cannot <span class=\"vocab-trigger\" data-vocab=\"restrain\">restrain<\/span> the tears that flow. They sit alone so much, but there is someone who is unseen and just within their reach. But for some reason, they don’t realize His presence. Realizing it is blessed yet quite rare. It is dependent upon their <span class=\"vocab-trigger\" data-vocab=\"mood\">mood<\/span>, their feelings, their physical condition, and the weather. The rain or thick fog outside, the lack of sleep and the intense pain, seem to affect their mood and blur their vision so they do not realize His presence.",
              "zh": "有多少人孤零零地坐在火炉旁！他们坐在另一张曾经坐满人的椅子旁边，无法抑制夺眶而出的泪水。他们常常独自坐着，但那看不见的一位就在旁边，触手可及。然而出于某种原因，他们并没有察觉祂的同在。察觉祂同在是蒙福的，却相当罕见。它取决于他们的心情、感受、身体状况和天气。外面的雨或浓雾、缺乏睡眠和剧烈疼痛，似乎都影响他们的情绪，模糊他们的视线，以致不能觉察祂的同在。",
              "simpEn": "There are so many who sit alone by their fireplace! They sit by another chair, once filled, and cannot hold back the tears that fall. They sit alone so much, but there is Someone unseen, just within reach. But for some reason, they don't notice He is there. Noticing it is blessed but rare. It depends on their mood, their feelings, their health, and the weather. The rain or thick fog outside, the lack of sleep, and deep pain seem to change their mood and cloud their sight so they don't see He is near.",
              "simpZh": "有多少人孤单地坐在壁炉旁！他们坐在另一张曾经有人坐的椅子旁边，止不住流下的眼泪。他们常常独自坐着，但那看不见的一位就在旁边，随手可及。但不知道为什么，他们没察觉祂的同在。察觉到是蒙福的，但很稀有。这取决于他们的心情、感觉、身体状况和天气。外面的雨或浓雾，睡眠不足和剧烈疼痛，似乎都影响情绪、模糊视线，让他们觉察不到祂的同在。"
            },
            {
              "en": "There is, however, something even better than realizing, and even more blessed. It is completely independent of these other conditions and is something that will <span class=\"vocab-trigger\" data-vocab=\"abide\">abide<\/span> with you. It is this: recognizing that unseen presence, which is so wonderful, <span class=\"vocab-trigger\" data-vocab=\"quieting\">quieting<\/span>, <span class=\"vocab-trigger\" data-vocab=\"soothing\">soothing<\/span>, calming, and warming. So recognize the presence of the Master. He is here, close to you, and His presence is real. Recognizing will also help your ability to realize but is never dependent upon it.",
              "zh": "然而，有一件事比察觉更好、更蒙福。它完全独立于上述各种条件，是会与你同住的。它就是：认定那看不见的同在，这同在如此奇妙，能安静、抚慰、镇定、温暖人心。所以，要认定主的同在。祂在这里，亲近你，祂的同在是真实的。认定也会帮助你察觉的能力，但绝不依赖于它。",
              "simpEn": "But there is something even better than noticing, and even more blessed. It doesn't depend on those other things at all and will stay with you. It is this: accepting that unseen presence, which is so wonderful, quieting, soothing, calming, and warming. So accept the presence of the Master. He is here, close to you, and His presence is real. Accepting it will help you notice it too, but it never depends on noticing.",
              "simpZh": "但有一件事比察觉到更好、更蒙福。它完全不靠那些条件，是能一直陪着你的。那就是：认定那看不见的同在，这同在如此奇妙，让人安静、得安慰、心里平静、温暖。所以要认定主的同在。祂就在这里，靠近你，祂的同在是真的。认定祂同在也会帮助你察觉到，但绝不靠察觉。"
            },
            {
              "en": "Yes, there is <span class=\"vocab-trigger\" data-vocab=\"immeasurably\">immeasurably<\/span> more—the truth is a presence, not a thing, a fact, or a statement. Some One is present, and He is a <span class=\"vocab-trigger\" data-vocab=\"warmhearted\">warmhearted<\/span> Friend and the all-powerful Lord. This is a joyful truth for weeping hearts everywhere, no matter the reason for the tears, or whatever stream their <span class=\"vocab-trigger\" data-vocab=\"weeping willow\">weeping willow<\/span> is planted beside. <span class=\"vocab-trigger\" data-vocab=\"Samuel Dickey Gordon\">Samuel Dickey Gordon<\/span>",
              "zh": "是的，还有无法量度的更多——这真理乃是一个同在，而非一样东西、一个事实或一句陈述。有一位在这里，祂是热心的朋友，也是全能的主。对每一处哭泣的心灵，无论为何流泪，无论他们的垂柳栽在何溪之旁，这都是大喜的信息。 撒母耳·迪基·戈登",
              "simpEn": "Yes, there is so much more—the truth is a presence, not a thing, a fact, or a statement. Someone is here, and He is a warm-hearted Friend and the all-powerful Lord. This is happy news for crying hearts everywhere, no matter why the tears fall, or what stream their sad tree is planted by. Samuel Dickey Gordon",
              "simpZh": "是的，还有多得无法测量的——这真理是一个同在，不是一个东西、事实或陈述。有一位在这里，祂是热心的朋友，也是全能的主。这对各处哭泣的心灵都是大喜的消息，不管为什么流泪，不管他们悲伤的柳树栽在哪条溪水旁。撒母耳·迪基·戈登"
            },
            {
              "en": "When from my life the old-time joys have <span class=\"vocab-trigger\" data-vocab=\"vanished\">vanished<\/span>, Treasures once mine, I may no longer claim, This truth may feed my hungry heart, and <span class=\"vocab-trigger\" data-vocab=\"famished\">famished<\/span>: Lord, YOU REMAIN HERE! YOU are still the same! When streams have dried, those streams of glad refreshing— Friendships so <span class=\"vocab-trigger\" data-vocab=\"blest\">blest<\/span>, so rich, so free; When sun-kissed skies give place to clouds depressing, Lord, YOU REMAIN HERE! Still my heart has THEE. When strength has failed, and feet, now worn and weary, On happy <span class=\"vocab-trigger\" data-vocab=\"errands\">errands<\/span> may no longer go, Why should I sigh, or let the days be <span class=\"vocab-trigger\" data-vocab=\"dreary\">dreary<\/span>? Lord, YOU REMAIN HERE! Could YOU more <span class=\"vocab-trigger\" data-vocab=\"bestow\">bestow<\/span>? Thus through life’s days—whoe’er or what may fail me, Friends, friendships, joys, in small or great degree, Songs may be mine, no sadness need <span class=\"vocab-trigger\" data-vocab=\"assault\">assault<\/span> me, Lord, YOU REMAIN HERE! Still my heart has THEE. <span class=\"vocab-trigger\" data-vocab=\"J. Danson Smith\">J. Danson Smith<\/span>",
              "zh": "当旧日的欢乐从我生命中消逝，那些曾属我的财宝，我或不再能说属我，这真理仍能喂养我饥肠辘辘的心：主啊，你仍在此！你仍是那样！当溪流枯干，那些欢喜畅快的活泉——那些蒙福、丰富、自由无拘的友谊；当阳光普照的天空让位给阴沉的云翳，主啊，你仍在此！我的心仍有你。当力量衰竭，疲乏的脚不再能奔驰快乐的差事，我为何要叹息，或任凭日子变得阴郁？主啊，你仍在此！你岂能赐下更多？如此，终我一生——无论何人何事令我失望，朋友、友谊、喜乐，不论大小，我仍可歌唱，无需忧伤害我，主啊，你仍在此！我的心仍有你。 J. 丹森·史密斯",
              "simpEn": "When the old-time joys have gone from my life, treasures once mine that I may no longer hold, this truth can feed my hungry, starved heart: Lord, YOU REMAIN HERE! YOU are still the same! When streams have dried—those streams of happy refreshing, friendships so blessed, so rich, so free; when sun-kissed skies give way to gloomy clouds, Lord, YOU REMAIN HERE! Still my heart has YOU. When strength is gone, and feet, now worn and tired, can no longer run happy tasks, why should I sigh or let the days be dark? Lord, YOU REMAIN HERE! Could YOU give more? So through life's days—whoever or whatever fails me, friends, friendships, joys, big or small, songs may be mine, no sadness needs to attack me, Lord, YOU REMAIN HERE! Still my heart has YOU. J. Danson Smith",
              "simpZh": "当旧日的快乐从我生命中消失，那些曾经属于我的宝贝，我可能不能再说是我的了，这个真理仍然能喂养我饥饿的心：主啊，你仍在这里！你还是原来那样！当溪流干了——那些快乐畅快的泉源，那些蒙福、丰富、自由的友谊；当阳光照亮的天空变成阴沉的乌云，主啊，你仍在这里！我的心还有你。当力气没了，双脚现在又累又乏，不能再跑快乐的差事了，我为什么要叹气，或者让日子变得凄凉？主啊，你仍在这里！你还能多给什么呢？就这样，走过人生的日子——不管谁或什么事让我失望，朋友、友谊、喜乐，或大或小，我都能有歌可唱，不需要有忧伤来攻击我，主啊，你仍在这里！我的心还有你。 J. 丹森·史密斯"
            }
          ],

          "sectionId": 6,
          "heading": "September 7",
          "audio": "audio/streams in the desert - September 7.m4a",
          "paragraphs": [
            {
              "en": "God is our <span class=\"vocab-trigger\" data-vocab=\"refuge\">refuge<\/span> and strength, an ever-present help in trouble. (Psalm 46:1)",
              "zh": "神是我们的避难所，是我们的力量，是我们在患难中随时的帮助。（诗篇46:1）",
              "simpEn": "God is our safe place and strength, a help always there in trouble.",
              "simpZh": "神是我们的避难所和力量，是患难中随时都在的帮助。"
            },
            {
              "en": "Why didn’t God help me sooner?” This is a question that is often asked, but it is not His will to act on your schedule. He desires to change you through the trouble and cause you to learn a lesson from it. He has promised, “I will be with him in trouble, I will deliver him and honor him” (Ps. 91:15). He will be with you in trouble all day and through the night. Afterward he will take you out of it, but not until you have stopped being restless and worried over it and have become calm and quiet. Then He will say, “It is enough.”",
              "zh": "“神为什么不早些帮助我？”这是人常问的问题，但按你的时间表行事并非祂的旨意。祂渴望借着患难改变你，使你在其中学到功课。祂曾应许：“他若求告我，我就应允他；他在急难中，我要与他同在；我要搭救他，使他尊贵”（诗篇91:15）。祂要终日终夜在患难中与你同在，然后祂要带你出来，但要等到你不再为它焦躁忧虑、变得平静安稳为止。那时祂才说：“够了。”",
              "simpEn": "'Why didn't God help me sooner?' This is often asked, but it is not His plan to act on our time. He wants to change you through the trouble and teach you a lesson. He has promised, 'I will be with him in trouble; I will save him and honor him.' He will be with you all day and through the night. Then He will take you out, but not until you have stopped being restless and worried, and have become calm and quiet. Then He will say, 'It is enough.'",
              "simpZh": "“神为什么不早一点帮助我？”这是人常问的问题，但祂没有义务按你的时间表行事。祂想借着患难改变你，让你学到功课。祂应许过：“他在急难中，我要与他同在；我要搭救他，使他尊贵。”祂要在患难中整天整夜陪着你，然后才带你出来，但要等到你不再烦躁焦虑，变得平静安稳。那时祂才会说：“够了。”"
            },
            {
              "en": "God uses trouble to teach His children precious lessons. Difficulties are intended to educate us, and when their good work is done, a glorious <span class=\"vocab-trigger\" data-vocab=\"reward\">reward<\/span> will become ours through them. There is a sweet joy and a real value in difficulties, for He regards them not as difficulties but as <span class=\"vocab-trigger\" data-vocab=\"opportunities\">opportunities<\/span>. <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "神使用患难来教导祂儿女宝贵的功课。困难是为教育我们而设的，当它们的善工成就之后，借着它们，一个荣耀的奖赏将归于我们。困难中有一种甜美的喜乐和真正的价值，因为祂看它们不是困难，而是机遇。 选自",
              "simpEn": "God uses trouble to teach His children dear lessons. Hard times are meant to train us, and when their good work is done, a wonderful prize comes to us through them. There is a sweet joy and real worth in hard times, for He sees them not as troubles but as chances. selected",
              "simpZh": "神用患难教导祂儿女宝贵的功课。困难是为了教育我们，当它们的好工作完成后，我们会借着它们得到一个荣耀的奖赏。困难里面有一种甜美的喜乐和真正的价值，因为祂不把它们看作困难，而是看作机会。选自"
            },
            {
              "en": "Not always OUT of our troubled times, And the struggles fierce and <span class=\"vocab-trigger\" data-vocab=\"grim\">grim<\/span>, But IN—deeper IN—to our sure rest, The place of our peace, in Him. <span class=\"vocab-trigger\" data-vocab=\"Annie Johnson Flint\">Annie Johnson Flint<\/span>",
              "zh": "并不总是从患难时刻和凶猛严酷的挣扎中被带出来，而是进——更深的进入——到那确实的安息里，就是在祂里面的平安之所。 安妮·约翰逊·弗林特",
              "simpEn": "Not always out of our troubled times and the fierce, hard struggles, but in—deeper in—to our sure rest, the place of our peace, in Him. Annie Johnson Flint",
              "simpZh": "不总是从患难和凶猛艰苦的挣扎中出来，而是进入——更深地进入——到我们确实的安息里，就是在祂里面的平安之处。安妮·约翰逊·弗林特"
            },
            {
              "en": "I once heard the following statement from a simple old man, and I have never forgotten it: “When God tests you, it is a good time to test Him by putting His promises to the test and then claiming from Him exactly what your trials have made necessary.”",
              "zh": "我曾从一位朴素的老人那里听到下面这句话，从未忘记：“神试验你的时候，正是你试验祂的好时机——将祂的应许付诸试验，然后向祂索要你的试炼所必需的一切。”",
              "simpEn": "I once heard this from a simple old man and never forgot it: 'When God tests you, it is a good time to test Him by putting His promises to the test and then asking from Him exactly what your trials have made necessary.'",
              "simpZh": "我曾从一个普通的老人那里听到这句话，从来忘不掉：“当神试验你时，正是你试验祂的好时候——把祂的应许拿来试试，然后向祂支取你试炼中正需要的东西。”"
            },
            {
              "en": "There are two ways of getting out of a trial. One is simply to try to get rid of the trial, and then to be thankful when it is over. The other is to recognize the trial as a <span class=\"vocab-trigger\" data-vocab=\"challenge\">challenge<\/span> from God to claim a larger blessing than we have ever before experienced, and to accept it with delight as an opportunity of receiving a greater measure of God’s divine <span class=\"vocab-trigger\" data-vocab=\"grace\">grace<\/span>. In this way, even the <span class=\"vocab-trigger\" data-vocab=\"Adversary\">Adversary<\/span> becomes a help to us, and all the things that seem to be against us turn out to assist us along our way. Surely this is what is meant by the words “In all these things we are more than <span class=\"vocab-trigger\" data-vocab=\"conquerors\">conquerors<\/span> through him who loved us” (Rom. 8:37). <span class=\"vocab-trigger\" data-vocab=\"A. B. Simpson\">A. B. Simpson<\/span>",
              "zh": "摆脱试炼有两种方式。一种是单纯设法除掉试炼，然后在它结束时感谢神。另一种是认清试炼乃是神发出的挑战，要叫我们去支取比从前所经历的更大的祝福，并欢喜地接受它，看为领受更大分量神圣恩典的机遇。这样一来，就连那仇敌也成了我们的帮助，似乎一切敌对的事，最终都变成沿途辅助我们的了。这正是“靠着爱我们的主，在这一切的事上已经得胜有余了”（罗马书8:37）这句话的意思。 宣信",
              "simpEn": "There are two ways to get out of a trial. One is simply to try to get rid of the trial and then be thankful when it ends. The other is to see the trial as a dare from God to claim a bigger blessing than we have ever known, and to take it with joy as a chance to receive a greater share of God's heavenly grace. In this way, even the Enemy helps us, and everything that seems against us turns out to help us on our way. Surely this is what is meant by 'In all these things we are more than winners through Him who loved us.' A. B. Simpson",
              "simpZh": "走出试炼有两种方法。一种只是设法把试炼弄掉，然后结束了感谢神。另一种是把试炼看成神发出的挑战，要我们支取比从前更大的祝福，而且欢欢喜喜地接受它，当作得到更大分量的神圣恩典的机会。这样，就连那仇敌也成了我们的帮助，所有看似反对我们的事，都变成沿途帮助我们了。这肯定就是“靠着那爱我们的主，在这一切事上，我们都得胜有余了”的意思。宣信"
            }

        {
          "sectionId": 7,
          "heading": "September 8",
          "audio": "audio/streams in the desert - September 8.m4a",
          "paragraphs": [
            {
              "en": "Thou hast <span class=\"vocab-trigger\" data-vocab=\"enlarged\">enlarged<\/span> me when I was in <span class=\"vocab-trigger\" data-vocab=\"distress\">distress<\/span>. (Psalm 4:1 KJV)",
              "zh": "我在困苦中，你曾使我宽广。（诗篇4:1 英王钦定本）",
              "simpEn": "You have made me bigger inside when I was in trouble.",
              "simpZh": "我在患难中，你扩张了我。"
            },
            {
              "en": "This verse is one of the greatest <span class=\"vocab-trigger\" data-vocab=\"testimonies\">testimonies<\/span> ever written regarding the effectiveness of God’s work on our behalf during times of crisis. It is a statement of thanksgiving for having been set free not from suffering but rather through suffering. In stating, “Thou hast enlarged me when I was in distress,” the <span class=\"vocab-trigger\" data-vocab=\"psalmist\">psalmist<\/span> is declaring that the sorrows of life have themselves been the source of life’s enlargement.",
              "zh": "这节经文是历来最伟大的见证之一，论到神在危机时刻为我们行事之有效。它是一个感恩的宣告，不是为了从苦难中得解脱，而是借着苦难得扩张。诗人说“我在困苦中，你曾使我宽广”，乃是在宣告，人生的忧患本身就是生命得扩张的源头。",
              "simpEn": "This verse is one of the greatest statements ever about how well God works for us in hard times. It is a thank-you for being set free not from suffering but through suffering. In saying, 'You have enlarged me when I was in distress,' the psalm writer is saying that life's sorrows have themselves been the cause of life becoming wider and richer.",
              "simpZh": "这节经文是有史以来最伟大的见证之一，讲述神在危机中为我们工作的果效。它是一个感谢的宣告，不是脱离苦难，而是借着苦难被扩大。诗人说“我在困苦中，你曾使我宽广”，是在表明人生的忧伤本身就是生命得扩张的来源。"
            },
            {
              "en": "Haven’t each of us experienced this a thousand times and found it to be true? Someone once said of <span class=\"vocab-trigger\" data-vocab=\"Joseph\">Joseph<\/span> that when he was in the <span class=\"vocab-trigger\" data-vocab=\"dungeon\">dungeon<\/span>, “iron entered his soul.” And the strength of iron is exactly what he needed, for earlier he had only experienced the <span class=\"vocab-trigger\" data-vocab=\"glitter\">glitter<\/span> of gold. He had been rejoicing in youthful dreams, and dreaming actually hardens the heart. Someone who sheds great tears over a simple romance will not be of much help in a real crisis, for true sorrow will be too deep for him. We all need the iron in life to enlarge our character. The gold is simply a passing vision, whereas the iron is the true experience of life. The chain that is the common bond uniting us to others must be one of iron. The common touch of <span class=\"vocab-trigger\" data-vocab=\"humanity\">humanity<\/span> that gives the world true <span class=\"vocab-trigger\" data-vocab=\"kinship\">kinship<\/span> is not joy but sorrow—gold is partial to only a few, but iron is <span class=\"vocab-trigger\" data-vocab=\"universal\">universal<\/span>.",
              "zh": "我们每个人岂不是千百次经历并证明这事是真实的吗？有人曾这样论到约瑟，说当他在地牢里时，“铁进入了他的灵魂”。而铁一般的力量正是他所需要的，因为早先他只经历过金子的闪光。他曾在少年的梦里欢喜，而做梦实际上使心刚硬。一个为简单浪漫故事大流眼泪的人，在真正的危机中并无多大帮助，因真实的忧伤对他而言太深了。我们都需要生命中的铁来扩张我们的品格。金子不过是过眼的异象，而铁才是真实的生命经历。那把我们与他人联结在一起的共同链环，必须是铁的。那给世界以真正亲情的共通人性，不是喜乐，而是忧伤——金子只偏向少数人，铁却是普世的。",
              "simpEn": "Haven't we each lived this a thousand times and found it true? Someone once said of Joseph that when he was in the prison, 'iron went into his soul.' And the strength of iron was just what he needed, because earlier he had only known the shine of gold. He had been happy in young dreams, and dreaming actually makes the heart hard. Someone who cries a lot over a simple love story will not be much help in a real crisis, for true sadness will be too deep for him. We all need the iron in life to make our character bigger. Gold is just a passing sight; iron is the real experience of life. The chain that ties us together with others must be made of iron. The common touch of humanness that gives the world real family feeling is not joy but sorrow—gold is for only a few, but iron is for everyone.",
              "simpZh": "我们每个人岂不是都经历过千百次，发现这是真的吗？有人说到约瑟，说他在监牢里时，“铁进入了他的灵魂”。铁一般的力量正是他需要的，因为从前他只经历过金子的闪光。他曾在少年梦想里快乐，而做梦其实会让人心变硬。一个为简单爱情故事就大哭的人，在真正的危机中帮不上什么忙，因为真实的忧伤对他太深了。我们都需要生命中的铁来扩大我们的品格。金子只是眼前的幻象，铁才是生命的真实经历。那把我们和别人连在一起的共同链条，必须是铁的。给世界真正亲情的共通人性，不是喜乐，而是忧伤——金子只偏袒少数人，铁却是人人都有的。"
            },
            {
              "en": "Dear soul, if you want your sympathy for others to be enlarged, you must be willing to have your life narrowed to certain degrees of suffering. Joseph’s dungeon was the very road to his <span class=\"vocab-trigger\" data-vocab=\"throne\">throne<\/span>, and he would have been unable to lift the iron load of his brothers had he not experienced the iron in his own life. Your life will be enlarged in <span class=\"vocab-trigger\" data-vocab=\"proportion\">proportion<\/span> to the amount of iron you have endured, for it is in the shadows of your life that you will find the actual fulfillment of your dreams of glory. So do not complain about the shadows of darkness—in reality, they are better than your dreams could ever be. Do not say that the darkness of the prison has <span class=\"vocab-trigger\" data-vocab=\"shackled\">shackled<\/span> you, for your shackles are wings—wings of flight into the heart and soul of humanity. And the gate of your prison is the gate into the heart of the universe. God has enlarged you through the suffering of sorrow’s chain. <span class=\"vocab-trigger\" data-vocab=\"George Matheson\">George Matheson<\/span>",
              "zh": "亲爱的灵魂，你若愿自己对他人的同情得以扩张，就必须甘愿让自己的生命被缩减到某种受苦的程度。约瑟的监牢正是通往他宝座的道路，若没有在自己生命中经历过铁，他就无法举起弟兄们铁一般的重担。你的生命会照着你所忍受铁的分量而得着扩张，因为正是在你人生的暗影中，你要寻见荣耀梦想的真正实现。所以，不要为黑暗的阴影抱怨——实际上，它们比你梦想的还要好。不要说你监牢的黑暗已经将你上了锁，因为你的锁链乃是翅膀——飞入人类内心与灵魂的翅膀。你监狱的门正是通往宇宙之心的门。神已经借着忧伤链条之苦使你宽广了。 乔治·马西森",
              "simpEn": "Dear soul, if you want your care for others to grow, you must be willing to have your life narrowed down to some degree of pain. Joseph's prison was the very road to his throne, and he could not have lifted the heavy load of his brothers if he had not known iron in his own life. Your life will grow bigger in measure with the amount of iron you have gone through, for it is in the shadows that you will find the real coming true of your dreams of glory. So do not complain about the dark shadows—in fact, they are better than your dreams could ever be. Do not say the darkness of the prison has chained you, for your chains are wings—wings to fly into the heart and soul of all people. And the gate of your prison is the gate into the heart of the universe. God has enlarged you through the pain of sorrow's chain. George Matheson",
              "simpZh": "亲爱的灵魂，如果你想对别人的同情得以扩大，就必须愿意让自己的生命被缩减到某种受苦的程度。约瑟的监牢正是通往他宝座的道路，如果他自己生命中没经历过铁，他就无法举起弟兄们铁一样的重担。你的生命会按你忍受了多少铁而成比例地扩大，因为正是在人生的阴影里，你会发现荣耀梦想的真实实现。所以不要为黑暗的阴影抱怨——实际上，它们比你梦想的还要好。不要说监狱的黑暗已经把你锁住了，因为你的锁链是翅膀——飞进人类内心和灵魂的翅膀。你监狱的门正是通往宇宙之心的门。神已经借着忧伤链条的痛苦使你宽广了。乔治·马西森"

              "zh": "如果约瑟从未成为埃及的囚犯，他就永远不会成为埃及的宰相。那锁住他脚的铁链，带来了挂在他颈上的金链。 选自",
              "simpEn": "If Joseph had never been a prisoner in Egypt, he would never have been Egypt's ruler. The iron chain that tied his feet brought the golden chain around his neck. selected",
              "simpZh": "如果约瑟从来没有当过埃及的囚犯，他就永远不会成为埃及的宰相。那条绑住他脚的铁链，带来了他脖子上的金链。选自"

          "audio": "audio/streams in the desert - September 9.m4a",
          "paragraphs": [
            {
              "en": "Some [seed] fell on rocky places, where it did not have much soil. It sprang up quickly, because the soil was <span class=\"vocab-trigger\" data-vocab=\"shallow\">shallow<\/span>. (Matthew 13:5)",

              "simpEn": "Some seeds fell on rocky ground with little soil. They grew fast because the soil was not deep.",
              "simpZh": "有些种子落在石头地上，土很少。因为土不深，很快就发芽了。"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Shallow\">Shallow<\/span>! From the context of the teaching of this <span class=\"vocab-trigger\" data-vocab=\"parable\">parable<\/span>, it seems that we must have something to do with the depth of the soil. The fruitful seed fell on “good soil” (v. 8), or good and <span class=\"vocab-trigger\" data-vocab=\"honest\">honest<\/span> hearts. I suppose the shallow people are those who “did not have much soil”—those who have no real purpose in life and are easily <span class=\"vocab-trigger\" data-vocab=\"swayed\">swayed<\/span> by a tender appeal, a good sermon, or a simple melody. And at first it seems as if they will amount to something for God, but because they “[do] not have much soil,” they have no depth or <span class=\"vocab-trigger\" data-vocab=\"genuine\">genuine<\/span> purpose, and no <span class=\"vocab-trigger\" data-vocab=\"earnest\">earnest<\/span> desire to know His will in order to do it. Therefore we should be careful to maintain the soil of our hearts.",
              "zh": "浅！从这比喻的教导上下文看，我们似乎与土壤的深度有关系。那结实的种子落在“好土”里（8节），就是善良诚实的心。我想那浅土之人正是“没有多少土”的人——他们人生没有真正的目的，很容易被温柔的呼吁、一篇好的讲道、或简单的旋律所动摇。起先看似他们要为神有所成就，但因“没有多少土”，他们没有深度或真诚的目标，也缺乏认真渴望认识神旨意并遵行的心。因此我们应当小心保守心田的土壤。",
              "simpEn": "Shallow! From the teaching of this story, it seems we must do with the depth of the soil. The seed that grew fruit fell on 'good soil,' that is, good and true hearts. Shallow people are those with 'not much soil'—no real purpose in life, easily moved by a soft appeal, a good talk, or a simple tune. At first they seem to be something for God, but because they lack deep soil, they have no depth or real purpose, and no strong desire to know God's will to do it. So we should be careful to keep the soil of our hearts.",
              "simpZh": "浅！从这个比喻的教导来看，我们和土壤的深度有关系。结果子的种子落在“好土”里，就是善良诚实的心。浅土的人就是那些“没有多少土”的人——生活没有真正目的，容易被温柔的请求、一篇好的讲道或简单的旋律打动。起先好像能为神做点什么，但因为“没有多少土”，他们缺乏深度或真实的目标，也没有认真想认识神旨意并遵行的心。所以我们要小心保守心里的土壤。"
            },
            {
              "en": "When a Roman soldier was told by his guide that if he insisted on taking a certain journey, it would probably be <span class=\"vocab-trigger\" data-vocab=\"fatal\">fatal<\/span>, he answered, “It is necessary for me to go—it is not necessary for me to live.” That was true depth of <span class=\"vocab-trigger\" data-vocab=\"conviction\">conviction<\/span>, and only when we are likewise convicted will our lives amount to something. But a shallow life lives on its <span class=\"vocab-trigger\" data-vocab=\"impulses\">impulses<\/span>, impressions, <span class=\"vocab-trigger\" data-vocab=\"intuitions\">intuitions<\/span>, <span class=\"vocab-trigger\" data-vocab=\"instincts\">instincts<\/span>, and largely on its circumstances. Those with <span class=\"vocab-trigger\" data-vocab=\"profound\">profound<\/span> character, however, look beyond all these and move steadily ahead, seeing the future, where sorrow, seeming defeat, and failure will be reversed. They sail right through storm clouds into the bright sunshine, which always awaits them on the other side.",
              "zh": "当一个罗马士兵被告知，如果他坚持走某条路，很可能致命，他回答说：“我必须前往——并非必须活着。”那是何等的信念深度，只有当我们同样被说服，我们的生命才能有所成就。但肤浅的生命靠的是冲动、印象、直觉、本能，并且大半依赖环境。然而，那些品格深厚的人，却能超越这一切，稳步前行，看见将来，在那里忧伤、看似失败和跌倒都将翻转。他们径直穿过暴风云层，进入那总在另一边等候的灿烂阳光。",
              "simpEn": "A Roman soldier was told that if he took a certain path, it would likely kill him. He answered, 'It is necessary for me to go—it is not necessary for me to live.' That was real depth of strong belief, and only when we have such belief will our lives count. But a shallow life acts on sudden urges, feelings, gut thoughts, animal drives, and mostly on what's happening around it. Those with deep character, however, look past all that and move steadily forward, seeing a future where sadness, what looks like defeat, and failure will be turned around. They sail right through dark clouds into bright sunshine waiting on the other side.",
              "simpZh": "一个罗马士兵被向导告知，如果他非要走某条路，可能会死。他回答：“我必须走——我不一定非要活着。”这就是真正深刻的信念，只有当我们也有这样的确信，生命才会有价值。但浅薄的生命凭冲动、印象、直觉、本能，和很大程度上凭环境而活。可是品格深厚的人，能超越这一切，稳步向前，看到未来，那时忧伤、看似失败和跌倒都会被翻转。他们直接穿过暴风云，进入另一面一直在等的灿烂阳光。"

              "simpEn": "Once God makes us deep, He can give us His deepest truths, most hidden secrets, and trust us with greater power. Lord, lead us into the deep things of Your life and save us from a life without depth! On to wider fields of holy sight; on to higher places of faith and love; onward, upward, understanding fully all that He calls you to from above. A. B. Simpson",

              "en": "Abraham was tested for a very long time, but he was richly rewarded. The Lord tested him by <span class=\"vocab-trigger\" data-vocab=\"delaying\">delaying<\/span> the fulfillment of His promise. Satan tested him through <span class=\"vocab-trigger\" data-vocab=\"temptation\">temptation<\/span>, and people tested him through their <span class=\"vocab-trigger\" data-vocab=\"jealousy\">jealousy<\/span>, <span class=\"vocab-trigger\" data-vocab=\"distrust\">distrust<\/span>, and <span class=\"vocab-trigger\" data-vocab=\"opposition\">opposition<\/span> to him. Sarah tested him through her <span class=\"vocab-trigger\" data-vocab=\"worrisome\">worrisome<\/span> <span class=\"vocab-trigger\" data-vocab=\"temperament\">temperament<\/span>. Yet he patiently endured, not questioning God’s truthfulness and power or doubting God’s faithfulness and love. Instead, Abraham submitted to God’s <span class=\"vocab-trigger\" data-vocab=\"divine sovereignty\">divine sovereignty<\/span> and <span class=\"vocab-trigger\" data-vocab=\"infinite wisdom\">infinite wisdom<\/span>. And he was silent through many delays, willing to wait for the Lord’s timing. Having patiently endured, he then obtained the fulfillment of the promise.",
              "zh": "亚伯拉罕经受了极长时间的试验，却得了丰盛的赏赐。主用迟延应许的应验来试验他；撒但用试探来试验他；人用嫉妒、不信和反对来试验他；撒拉用她那爱挂虑的性情来试验他。然而他恒久忍耐，不怀疑神的信实和能力，也不质疑神的良善和慈爱。相反，亚伯拉罕顺服神的主权和无穷智慧。他在许多迟延中默然不语，甘愿等候主所定的时间。他既恒久忍耐，就得了所应许的。",
              "simpEn": "Abraham was tested for a very long time, but he received a rich reward. The Lord tested him by making the promise wait. Satan tested him through trying to pull him into sin, and people tested him through being jealous, not trusting, and standing against him. Sarah tested him through her worrying nature. Yet he waited patiently, never doubting that God is true and powerful, or questioning God's faithfulness and love. Instead, Abraham bowed to God's supreme rule and endless wisdom. He kept quiet through many waits, willing to wait for God's time. After he waited patiently, he got what was promised.",
              "simpZh": "亚伯拉罕受了很长时间的考验，但得到了丰富的奖赏。主用推迟应许来试验他。撒但用试探试验他。人用嫉妒、不信和反对试验他。撒拉也用她爱挂虑的脾性试验他。可是他耐心忍受了，没有怀疑神的真实和能力，也没有怀疑神的信实和爱。相反，亚伯拉罕顺服了神的至高主权和无限智慧。他在许多耽延中默不作声，愿意等主的时间。他既耐心忍受，就得到了所应许的。"
            },
            {
              "en": "Beloved, God’s promises can never fail to be accomplished, and those who patiently wait can never be disappointed, for believing faith leads to <span class=\"vocab-trigger\" data-vocab=\"realization\">realization<\/span>. Abraham’s life <span class=\"vocab-trigger\" data-vocab=\"condemns\">condemns<\/span> a spirit of <span class=\"vocab-trigger\" data-vocab=\"hastiness\">hastiness<\/span>, <span class=\"vocab-trigger\" data-vocab=\"admonishes\">admonishes<\/span> those who complain, <span class=\"vocab-trigger\" data-vocab=\"commends\">commends<\/span> those who are patient, and encourages quiet <span class=\"vocab-trigger\" data-vocab=\"submission\">submission<\/span> to God’s will and way. Remember, Abraham was tested but he patiently waited, ultimately received what was promised, and was satisfied. If you will <span class=\"vocab-trigger\" data-vocab=\"imitate\">imitate<\/span> his example, you will share the same blessing. <span class=\"vocab-trigger\" data-vocab=\"selected\">selected<\/span>",
              "zh": "亲爱的，神的应许永不会落空，耐心等候的人也永不会失望，因为相信的信心引向实现。亚伯拉罕的一生谴责急躁的灵，劝诫抱怨的人，嘉许忍耐的人，并鼓励人安静顺服神的旨意与道路。务要记住，亚伯拉罕受过试验，但他耐心等候，最终得着所应许的，并且心满意足。你若效法他的榜样，就必同享一样的祝福。 选自",
              "simpEn": "Dear friends, God's promises can never fail to come true, and those who wait patiently can never be let down, for trusting faith leads to the thing becoming real. Abraham's life speaks against being in a hurry, warns those who complain, praises the patient, and encourages quiet giving-in to God's will and way. Remember, Abraham was tested but he waited with patience, at last got what was promised, and was filled. If you follow his example, you will share the same blessing. selected",
              "simpZh": "亲爱的，神的应许永远不会落空，耐心等候的人也永远不会失望，因为相信的信心会带出实现。亚伯拉罕的一生责备急躁的态度，警告抱怨的人，称赞有耐心的人，鼓励安静顺服神的旨意和道路。记住，亚伯拉罕受过考验，但他耐心等候，最后得到了所应许的，也心满意足了。如果你效法他的榜样，就会同享同样的祝福。选自"

              "simpZh": "你有没有什么“偏斜的侧面”？这个谦卑人的祷告用一种新的方式描绘这些侧面，也用新的亮光描绘那位大扶持者。他看见神总是走在基督徒身边，随时准备伸出大能的膀臂，在“每一个偏斜的侧面”扶稳软弱的人。"
            },
            {
              "en": "Child of My love, <span class=\"vocab-trigger\" data-vocab=\"lean hard\">lean hard<\/span>, And let Me feel the pressure of your care; I know your burden, child. I shaped it; Balanced it in Mine Own hand; made no <span class=\"vocab-trigger\" data-vocab=\"proportion\">proportion<\/span> In its weight to your <span class=\"vocab-trigger\" data-vocab=\"unaided\">unaided<\/span> strength, For even as I laid it on, I said, “I will be near, and while she leans on Me, This burden will be Mine, not hers; So will I keep My child within the circling arms Of My Own love.” Here lay it down, nor fear To impose it on a shoulder that <span class=\"vocab-trigger\" data-vocab=\"upholds\">upholds<\/span> The government of worlds. Yet closer come: You are not near enough. I would <span class=\"vocab-trigger\" data-vocab=\"embrace\">embrace<\/span> your care; So I might feel My child <span class=\"vocab-trigger\" data-vocab=\"reclining\">reclining<\/span> on My breast. You love Me, I know. So then do not doubt; But loving Me, lean hard.",

            {
              "en": "The “morning” is the time I have set to meet with the Lord. “Morning”—the very word itself is like a cluster of <span class=\"vocab-trigger\" data-vocab=\"luscious\">luscious<\/span> grapes to crush into sacred wine for me to drink. In the morning! This is when God wants me at my best in strength and hope so that I may begin my daily climb, not in weakness but in strength. Last night I buried yesterday’s <span class=\"vocab-trigger\" data-vocab=\"fatigue\">fatigue<\/span>, and this morning I took on a new supply of energy. Blessed is the day when the morning is <span class=\"vocab-trigger\" data-vocab=\"sanctified\">sanctified<\/span>—set apart to God! Successful is the day when the first victory is won in prayer! Holy is the day when the dawn finds me on the mountaintop with God!",
              "zh": "“早晨”是我定下与主会面的时间。“早晨”——这个词本身就像一串多汁的葡萄，可以榨成圣酒给我喝。在早晨！这正是神要我处于力量与盼望最佳状态的时候，好使我开始每日的攀登，不是靠着软弱，乃是靠着能力。昨夜我已埋葬了昨日的疲惫，今晨我取用了新的能量供应。有福的日子，乃是以早晨分别为圣归神开始的！成功的日子，乃是在祷告中赢得首胜的！圣洁的日子，乃是黎明发现我在山顶上与神同在的！",
              "simpEn": "The 'morning' is the time I have chosen to meet with the Lord. 'Morning'—the very word is like a bunch of juicy grapes to crush into holy wine for me to drink. In the morning! This is when God wants me at my best in strength and hope, so I may start my daily climb, not in weakness but in power. Last night I buried yesterday's tiredness, and this morning I took on new energy. Blessed is the day when the morning is set apart for God! Successful is the day when the first win is won in prayer! Holy is the day when sunrise finds me on the mountain top with God!",
              "simpZh": "“早晨”是我定下和主见面的时间。“早晨”——这个词就像一串多汁的葡萄，可以榨成圣酒给我喝。在早晨！这正是神要我处于力量和盼望最好的时候，好开始每天向上的攀登，不是凭软弱，乃是凭力量。昨天晚上我埋葬了昨天的疲倦，今天早晨我领受了新的精力供应。有福的日子，是从把早晨分别为圣归给神开始的！成功的日子，是在祷告中赢得第一场胜利的！圣洁的日子，是清晨发现我在山顶与神同在的！"

            {
              "en": "Dear Father, I am coming to meet with You. Nothing on the common, everyday plain of life will keep me away from Your holy heights. At Your calling I come, so I have the <span class=\"vocab-trigger\" data-vocab=\"assurance\">assurance<\/span> that You will meet with me. Each morning begun so well on the mountain will make me strong and glad the rest of the day! <span class=\"vocab-trigger\" data-vocab=\"Joseph Parker\">Joseph Parker<\/span>",
              "zh": "亲爱的父，我来迎见祢。生命中凡俗日常平原上的任何事物，都不能阻我远离祢圣洁的高处。我应祢的呼召而来，因此我确信祢必会面见我。每一个在山上开始得如此美好的早晨，必使我在那天余下的时间又强壮又喜乐！ 约瑟夫·帕克",

            },
            {
              "en": "Still, still with You, when the purple morning breaks, When the birds awake, and the shadows flee; Fairer than morning, lovelier than daylight, Dawns the sweet <span class=\"vocab-trigger\" data-vocab=\"consciousness\">consciousness<\/span>, I am with Thee. Alone with You, amid the misty shadows, The <span class=\"vocab-trigger\" data-vocab=\"solemn hush\">solemn hush<\/span> of nature newly born; Alone with You in breathless <span class=\"vocab-trigger\" data-vocab=\"adoration\">adoration<\/span>, In the calm dew and freshness of the morn. As in a sunrise o’er a waveless ocean, The image of the morning star does rest, So in this stillness,You <span class=\"vocab-trigger\" data-vocab=\"discerning\">discerning<\/span> only Your image in the waters of my breast. When sinks the soul, <span class=\"vocab-trigger\" data-vocab=\"subdued\">subdued<\/span> by toil, to slumber, Its closing eyes look up to You in prayer; Sweet the <span class=\"vocab-trigger\" data-vocab=\"repose\">repose<\/span>, beneath Your wings o’ershadowing, But sweeter still to wake and find You there. <span class=\"vocab-trigger\" data-vocab=\"Harriet Beecher Stowe\">Harriet Beecher Stowe<\/span>",
              "zh": "静，静与祢同在，当紫红的黎明破晓，百鸟醒起，黑影飞逝；比清晨更美，比白昼更可爱的，是那甜美的意识破晓——我正与祢同在。单独与祢同在，在雾蒙蒙的幽影中，在自然新生般的庄严寂静里；单独与祢同在，在屏息的崇敬中，在清晨宁静的露水与清新里。如同日出时在无波的洋面上，晨星的形象安然倒映，同样在这静谧中，祢只看见自己的形像，倒映在我胸怀中。当灵魂因劳苦而沉入微睡，它合上的眼睛在祷告中仰望祢；在祢覆翼的荫下，安息何等甘甜，但更甘甜的是醒来发觉祢仍在彼处。 哈丽特·比彻·斯托",
              "simpEn": "Quiet, quiet with You, when the purple morning breaks, when birds wake up and shadows run away; fairer than morning, lovelier than daylight, dawns the sweet knowing that I am with Thee. Alone with You, in the middle of misty shadows, the deep quiet of freshly born nature; alone with You in breathless worship, in the calm dew and freshness of the morning. As in a sunrise over a still ocean, the picture of the morning star rests, so in this quietness, You seeing only Your own image in the waters of my heart. When the soul, tired from work, sinks to sleep, its closing eyes look up to You in prayer; sweet is the rest beneath Your covering wings, but sweeter still to wake and find You there. Harriet Beecher Stowe",
              "simpZh": "安静，安静地与你同在，当紫色的清晨破晓，鸟儿醒来，黑影逃散；那甜美的知觉破晓——我正与你同在，比清晨更美，比白天更可爱。在雾蒙蒙的影子里，在大自然刚刚生出的庄严寂静中，独自与你同在；在屏住呼吸的敬拜中，在清晨宁静的露水和清新里。就像日出时，在没有波浪的海面上，晨星的形像安稳停驻，同样，在这寂静里，你只看见自己的形像倒映在我心里的水面上。当灵魂被劳苦压下，沉入睡眠，它闭上的眼睛在祷告中仰望你；在你覆翼的荫下安息何等甜美，但更甜美的是醒来发现你在那里。哈丽特·比彻·斯托"

              "zh": "我母亲养成了一个习惯，每天早饭后立刻在她房间里花一小时，读圣经，默想，向主祷告。那一个小时就像一个蒙福的泉源，她从中汲取力量和甜美，预备她完成一切任务。这也使她能在正常烦累的忧虑和挤迫邻里常伴的琐碎之中，保持一种真正的平安。",
              "simpEn": "My mother made it a daily habit, right after breakfast, to spend an hour in her room, reading the Bible, thinking deeply on it, and praying to the Lord. That hour was like a blessed spring from which she drew strength and sweetness that made her ready to do all her tasks. It also helped her keep a real peace in spite of the usual hard worries and small troubles that often come with life in a crowded neighborhood.",
              "simpZh": "我母亲每天有一个习惯，吃完早饭就马上在房间里花一个小时，读圣经，默想，向主祷告。那一个小时就像一口蒙福的泉源，她从中汲取力量和甜美，准备好去完成所有的工作。这也让她在拥挤邻里生活中常有的烦恼忧虑和琐碎事情当中，仍然能保持真正的平安。"
            },
            {
              "en": "As I think of her life and all that she had to endure, I see the absolute triumph of the grace of God in the ideal Christian lady. She was such a lovely person that I never saw her lose her temper or speak even one word in anger. I never heard her participate in idle <span class=\"vocab-trigger\" data-vocab=\"gossip\">gossip<\/span> or make a <span class=\"vocab-trigger\" data-vocab=\"disparaging\">disparaging<\/span> remark about another person. In fact, I never saw in her even the hint of an emotion <span class=\"vocab-trigger\" data-vocab=\"unbecoming\">unbecoming<\/span> to someone who had drunk from “the river of the water of life” (Rev. 22:1) and who had eaten of “the living bread that came down from heaven” (John 6:51). <span class=\"vocab-trigger\" data-vocab=\"Frederick William Farrar\">Frederick William Farrar<\/span>",
              "zh": "我想到她的一生和她所忍受的一切，便看见神恩典在一个理想基督徒女士身上的完全得胜。她那样可爱，我从未见她发过脾气，或说过一句愤怒的话。我从未听见她参与闲言闲语，或对别人作出轻蔑的评论。事实上，我从未在她身上看见一丝与喝了“生命水的河”（启示录22:1）、吃了“从天上降下来的生命之粮”（约翰福音6:51）之人不相称的情绪。 弗雷德里克·威廉·法勒",
              "simpEn": "As I think of her life and all she had to bear, I see the total victory of God's grace in the perfect Christian lady. She was so lovely that I never saw her lose her temper or speak even one angry word. I never heard her join in empty talk or say a mean word about another. In fact, I never saw even a trace of feeling not fitting for someone who had drunk from 'the river of the water of life' and eaten 'the living bread that came down from heaven.' Frederick William Farrar",
              "simpZh": "我想到她的一生和她所忍受的一切，就看见神恩典在一个理想的基督徒女士身上完全得胜。她那么可爱，我从来没见她发过脾气，甚至没说过一句生气的话。我从来没听过她参与闲话，或者对别人说轻看的话。事实上，我从没见过她身上有一丝与喝了“生命水的河”、吃了“从天上降下来的生命之粮”之人不相配的情绪。弗雷德里克·威廉·法勒"

        {
          "sectionId": 6,
          "heading": "September 14",
          "audio": "audio/streams in the desert - September 14.m4a",
          "paragraphs": [
            {
              "en": "If anyone would come after me, he must <span class=\"vocab-trigger\" data-vocab=\"deny himself\">deny himself<\/span> and take up his cross and follow me. (Mark 8:34)",
              "zh": "若有人要跟从我，就当舍己，背起他的十字架来跟从我。（马可福音8:34）",
              "simpEn": "If anyone wants to follow Me, he must say no to himself, pick up his cross, and follow Me.",
              "simpZh": "如果有人要跟从我，就要舍己，背起十字架，跟从我。"
            },
            {
              "en": "The cross that my Lord calls me to carry may assume many different shapes. I may have to be content with <span class=\"vocab-trigger\" data-vocab=\"mundane\">mundane<\/span> tasks in a limited area of service, when I may believe my abilities are suited for much greater work. I may be required to continually cultivate the same field year after year, even though it <span class=\"vocab-trigger\" data-vocab=\"yields\">yields<\/span> no harvest whatsoever. I may be asked of God to <span class=\"vocab-trigger\" data-vocab=\"nurture\">nurture<\/span> kind and loving thoughts about the very person who has wronged me and to speak gently to him, take his side when others oppose him, and <span class=\"vocab-trigger\" data-vocab=\"bestow\">bestow<\/span> sympathy and comfort to him. I may have to openly testify of my Master before those who do not want to be reminded of Him or His claims. And I may be called to walk through this world with a bright, smiling face while my heart is breaking.",
              "zh": "主召我背起的十字架可能以许多不同形式出现。我可能不得不在有限的事奉范围内，满足于平凡的工作，尽管我相信自己的能力配做更大的事。我可能被要求年复一年地耕种同一块田地，即使它毫无收成。神可能要我培养仁爱良善的意念，对待那冤屈过我的人，并且温柔地对他说话，在别人反对他时站在他一边，向他施予同情和安慰。我可能不得不在那些不愿被提醒主和祂的要求的人面前，公开为我的主作见证。我也可能被召以一张明亮微笑的脸行过这世界，而我的心却在破碎。",
              "simpEn": "The cross my Lord calls me to carry can come in many different forms. I may have to be happy with plain, ordinary work in a small place of service, when I think I could do much bigger things. I may have to keep working the same field year after year, even if it gives no crop. God may ask me to hold kind and loving thoughts toward the very person who has hurt me, to speak softly to him, stand with him when others turn against him, and give him care and comfort. I may have to speak openly of my Master before those who don't want to be reminded of Him. And I may be called to walk through this world with a bright, smiling face while my heart is breaking inside.",
              "simpZh": "主叫我背的十字架可能有各种不同的形状。我可能得满足于在一个小范围里做平凡的工作，而我相信自己的能力可以做更大的事。我可能得年复一年耕种同一块田，虽然一点收成都没有。神可能要我对那亏待我的人培养仁爱良善的意念，温柔对他说话，别人反对他时站在他那边，给他同情和安慰。我可能得在那些不愿意被提醒主和祂的要求的人面前，公开为主作见证。我也可能被呼召以一张明亮微笑的脸走过世界，而我的心正在碎掉。"
            },
            {
              "en": "Yes, there are many crosses, and every one of them is heavy and painful. And it is unlikely that I would seek out even one of them on my own. Yet Jesus is never as near to me as when I lift my cross, lay it <span class=\"vocab-trigger\" data-vocab=\"submissively\">submissively<\/span> on my shoulder, and welcome it with a patient and <span class=\"vocab-trigger\" data-vocab=\"uncomplaining\">uncomplaining<\/span> spirit. He draws close to me in order to mature my wisdom, deepen my peace, increase my courage, and <span class=\"vocab-trigger\" data-vocab=\"supplement\">supplement<\/span> my power. All this He does so that through the very experience that is so painful and distressing to me, I will be of greater use to others.",
              "zh": "是的，有许多十字架，而且每一个都是沉重而痛苦的。我大概自己连一个都不会去寻。然而，耶稣从未像在我背起十字架，将它顺服地放在肩上，以忍耐和无怨言的灵欢迎它时，那样亲近我。祂靠近我，为要成熟我的智慧，加深我的平安，增我的勇气，补足我的能力。祂做这一切，好叫我借着那对我极其痛苦和压抑的经历，能对别人更有用处。",
              "simpEn": "Yes, there are many crosses, and each one is heavy and hurts. I would not likely choose even one of them myself. Yet Jesus is never as close to me as when I pick up my cross, lay it with a giving-in heart on my shoulder, and welcome it with a patient and quiet spirit. He comes near to grow my wisdom, make my peace deeper, give me more courage, and add to my strength. He does all this so that through the very thing that is so painful and hard for me, I will be of more help to others.",
              "simpZh": "没错，有很多十字架，每一个都很重、很疼。我自己大概连一个都不会去找。可是，耶稣从来没有像当我背起十字架，顺服地放在肩上，用忍耐和不抱怨的态度迎接它时，那样靠近我。祂靠近我，要让我的智慧成熟，加深我的平安，增加我的勇气，补足我的力量。祂做这一切，是为了让我借着那个对我而言极其痛苦和难受的经历，能对别人更有用。"
            },
            {
              "en": "And then I will echo these words of one of the Scottish <span class=\"vocab-trigger\" data-vocab=\"Covenantors\">Covenantors<\/span> of the seventeenth century, imprisoned for his faith by John Graham of <span class=\"vocab-trigger\" data-vocab=\"Claverhouse\">Claverhouse<\/span>—“I grow under the load.” <span class=\"vocab-trigger\" data-vocab=\"Alexander Smellie\">Alexander Smellie<\/span>",
              "zh": "然后我就要回声响应十七世纪一位苏格兰誓约派的话，他因信仰被克拉弗豪斯的约翰·格雷厄姆下在监里——“我在重担下生长。” 亚历山大·斯梅利",
              "simpEn": "And then I will say again these words of one of the Scottish Covenantors long ago, put in jail for his faith by John Graham of Claverhouse—'I grow under the load.' Alexander Smellie",
              "simpZh": "然后我也要重述十七世纪一位苏格兰圣约派的话，他因为信仰被克拉弗豪斯的约翰·格雷厄姆关进监狱——“我在重担下成长。”亚历山大·斯梅利"
            },
            {
              "en": "Use the cross you bear as a <span class=\"vocab-trigger\" data-vocab=\"crutch\">crutch<\/span> to help you on your way, not as a <span class=\"vocab-trigger\" data-vocab=\"stumbling block\">stumbling block<\/span> that causes you to fall. You may others from sadness to gladness <span class=\"vocab-trigger\" data-vocab=\"beguile\">beguile<\/span>, If you carry your cross with a smile.",
              "zh": "要将你所背的十字架用作帮助行路的拐杖，而不是叫你跌倒的绊脚石。你若带着微笑背十架，便能诱使别人从忧伤转为欢畅。",
              "simpEn": "Use the cross you carry as a helping stick for your way, not as a block that trips you. You may draw others from sadness to joy, if you carry your cross with a smile.",
              "simpZh": "把你背的十字架当作帮助走路的拐杖，不要当作绊倒你的石头。如果你带着微笑背十字架，就能把别人从忧伤引到欢乐。"
            }

        {
          "sectionId": 7,
          "heading": "September 15",
          "audio": "audio/streams in the desert - September 15.m4a",
          "paragraphs": [
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Awake\">Awake<\/span>, north wind, and come, south wind! Blow on my garden, that its <span class=\"vocab-trigger\" data-vocab=\"fragrance\">fragrance<\/span> may spread abroad. (Song of Songs 4:16)",
              "zh": "北风啊，兴起！南风啊，吹来！吹在我的园内，使其中的香气散发出来。（雅歌4:16）",
              "simpEn": "Wake up, north wind! Come, south wind! Blow on my garden so its sweet smell will spread everywhere.",
              "simpZh": "北风啊，醒起来！南风啊，来吧！吹在我的园子里，让香气飘出去。"
            },
            {
              "en": "Some of the spices and plants mentioned in verse 14 of the above chapter are very descriptive and symbolic. The juice of the <span class=\"vocab-trigger\" data-vocab=\"aloe\">aloe<\/span> plant has a bitter taste but is soothing when applied to the skin, so it tells us of the sweetness of bitter things, the <span class=\"vocab-trigger\" data-vocab=\"bittersweet\">bittersweet<\/span>, having an important application that only those who have used it will understand. <span class=\"vocab-trigger\" data-vocab=\"Myrrh\">Myrrh<\/span> is symbolic of death, having been used to <span class=\"vocab-trigger\" data-vocab=\"embalm\">embalm<\/span> the dead. It represents the sweetness that comes to the heart after it has died to self-will, pride, and sin.",
              "zh": "上一章第14节提到的一些香料和植物很具描述性和象征意义。芦荟的汁液味苦，但敷在皮肤上却有舒缓作用，它告诉我们苦中之甜，苦甜交织，有重要的实际应用，只有使用过的人才能明白。没药是死的象征，曾被用来涂抹尸体。它代表那向己意、骄傲和罪死了之后临到心灵的甘甜。",
              "simpEn": "Some of the spices and plants mentioned in verse 14 are very picture-like and full of meaning. The juice of the aloe plant tastes bitter but is soothing on the skin, so it tells of the sweetness in bitter things, the bittersweet, which has a real use that only those who have tried it understand. Myrrh stands for death, used to wrap dead bodies. It shows the sweetness that comes to the heart after it has died to its own will, pride, and sin.",
              "simpZh": "第14节提到的一些香料和植物很有画面和象征意义。芦荟的汁是苦的，但擦在皮肤上很舒服，这告诉我们苦中的甜，那种苦甜交织，有很重要的用处，只有用过的人才明白。没药代表死亡，曾被用来抹在尸体上。它描绘的是当人心向自己的意思、骄傲和罪死了之后，临到心中的那种甘甜。"
            },
            {
              "en": "What <span class=\"vocab-trigger\" data-vocab=\"inexpressible\">inexpressible<\/span> charm seems to <span class=\"vocab-trigger\" data-vocab=\"encircle\">encircle<\/span> some Christians, simply because they carry upon their pure <span class=\"vocab-trigger\" data-vocab=\"countenance\">countenance<\/span> and gentle spirit the <span class=\"vocab-trigger\" data-vocab=\"imprint\">imprint<\/span> of the cross! It is the holy evidence of having died to something that was once proud and strong but is now forever surrendered at the feet of Jesus. And it is also the heavenly charm of a broken spirit and a <span class=\"vocab-trigger\" data-vocab=\"contrite\">contrite<\/span> heart, the beautiful music that rises from a minor key, and the sweetness brought about by the touch of frost on <span class=\"vocab-trigger\" data-vocab=\"ripened\">ripened<\/span> fruit.",
              "zh": "有些基督徒身上笼罩着何等难以言喻的魅力，只因他们纯良的面容和温柔的灵带着十字架的印记！这是神圣的证据，表明他们已经向着某件曾骄傲而强壮、如今却永远降服在耶稣脚前的事物死了。这也是破碎心灵和痛悔之心的属天魅力，是小调所扬起的美丽音乐，是霜打成熟果实所带来的甘甜。",
              "simpEn": "What a beauty beyond words seems to wrap around some Christians, just because they carry on their pure face and gentle spirit the mark of the cross! It is the holy proof of having died to something once proud and strong but now forever given up at Jesus' feet. It is also the heaven-sent loveliness of a broken spirit and a heart sorry for sin, the beautiful music that comes from a sad key, and the sweetness brought by frost touching ripe fruit.",
              "simpZh": "有些基督徒身上围绕着一股说不出的魅力，只因为他们纯净的脸上和温柔的灵里带着十字架的印记！这是神圣的证明，显明他们已经对某件曾经骄傲强壮、如今永远降服在耶稣脚前的东西死了。这也是破碎的灵和痛悔的心所带来的属天魅力，是小调里升起的美丽音乐，是霜打在熟果上带来的甘甜。"
            },
            {
              "en": "Finally, <span class=\"vocab-trigger\" data-vocab=\"frankincense\">frankincense<\/span> was a fragrance that arose only after being touched with fire. The burning incense became clouds of sweetness arising from the heart of the flames. It symbolizes a person’s heart whose sweetness has been brought forth by the <span class=\"vocab-trigger\" data-vocab=\"flames of affliction\">flames of affliction<\/span> until the holy, innermost part of the soul is filled with clouds of praise and prayer. Beloved, are our lives <span class=\"vocab-trigger\" data-vocab=\"yielding\">yielding<\/span> spices and perfumes—sweet fragrances of the heart? <span class=\"vocab-trigger\" data-vocab=\"from The Love-Life of Our Lord\">from The Love-Life of Our Lord<\/span>",
              "zh": "最后，乳香是一种只在被火触及之后才散发的香气。那燃烧的香成为从火焰之心升起的馨香云朵。它象征一个人的心，其甘甜是由患难之火带出来的，直到灵魂圣洁的最深处充满了赞美和祷告的烟云。亲爱的，我们生命是否正产出香料和馨香——心中的甜美芬芳呢？ 摘自《我们主的爱情生活》",
              "simpEn": "Lastly, frankincense was a sweet smell that came only after being touched by fire. The burning incense turned into clouds of sweetness rising from the heart of the flames. It pictures a person's heart whose sweetness has been brought out by the fires of suffering, until the holy, deepest part of the soul is filled with clouds of praise and prayer. Beloved, are our lives giving off spices and perfumes—sweet smells of the heart? from The Love-Life of Our Lord",
              "simpZh": "最后，乳香是一种只有被火烧过之后才发出的香气。那燃烧的香变成从火焰中心升起的甜香云朵。它象征一个人的心，其甘甜是由苦难的火焰带出来的，直到灵魂最神圣的深处充满了赞美和祷告的云彩。亲爱的，我们的生命有没有产出香料和馨香——就是内心的甜美芬芳呢？摘自《我们主的爱情生活》"
            },
            {
              "en": "A Persian <span class=\"vocab-trigger\" data-vocab=\"fable\">fable<\/span> says: One day A wanderer found a lump of clay So savory of sweet perfume Its odors scented all the room. “What are you?” was his quick demand, “Are you some gem from <span class=\"vocab-trigger\" data-vocab=\"Samarkand\">Samarkand<\/span>, Or pure <span class=\"vocab-trigger\" data-vocab=\"nard\">nard<\/span> in this plain disguise, Or other costly merchandise?” “No, I am but a lump of clay.” “Then whence this wondrous perfume—say!” “Friend, if the secret I disclose, I have been dwelling with the rose.” Sweet parable! and will not those Who love to dwell with <span class=\"vocab-trigger\" data-vocab=\"Sharon’s rose\">Sharon’s rose<\/span>, <span class=\"vocab-trigger\" data-vocab=\"Distill\">Distill<\/span> sweet odors all around, Though low and poor themselves are found? Dear Lord, <span class=\"vocab-trigger\" data-vocab=\"abide\">abide<\/span> with us that we May draw our perfume fresh from Thee.",
              "zh": "一个波斯寓言说：有一天，一个流浪者找到一团泥土，散发着如此可悦的甜香，满室芬芳。“你是什么？”他急问，“你是来自撒马尔罕的宝石，还是以平凡外形伪装的真哪哒香膏，或别的昂贵商品？”“不，我只是一团泥土。”“那么，这奇妙的香气从何而来——请说！”“朋友，我若泄露秘密，那就是我一直与玫瑰同住。”甘甜的比喻！那些喜爱与沙仑的玫瑰同住的人，虽然自己卑微贫寒，岂不也在四周散发甜美芬芳吗？亲爱的主，与我们同住，好叫我们从祢汲取新鲜的香气。",
              "simpEn": "A Persian story says: One day a wanderer found a lump of clay so full of sweet smell that its scent filled the whole room. 'What are you?' he quickly asked. 'Are you some jewel from Samarkand, or pure nard in plain clothing, or other costly goods?' 'No, I am just a lump of clay.' 'Then tell me where this wonderful smell comes from!' 'Friend, if I tell the secret, I have been living with the rose.' Sweet story! And won't those who love to live with Sharon's rose, spread sweet smells all around, even if they are poor and low? Dear Lord, stay with us so we may draw our fresh perfume from You.",
              "simpZh": "一个波斯寓言说：有一天，一个流浪汉找到一块泥土，香气满室。“你是什么？”他急着问，“你是撒马尔罕的宝石，还是纯哪哒香膏随便包着，或是别的值钱货物？”“不，我只是一块泥巴。”“那你从哪里来的这奇妙的香气——快说！”“朋友，如果我泄露秘密，就是我一直在和玫瑰住在一起。”好甜的比喻！那些喜爱与沙仑的玫瑰同住的人，虽然自己卑微贫寒，岂不也会在四周洒满香气吗？亲爱的主，求你与我们同住，好让我们不断从你吸取新鲜的香气。"
            }

            {
              "en": "God’s servants must be taught the value of the hidden side of life. The person who is to serve in a <span class=\"vocab-trigger\" data-vocab=\"lofty\">lofty<\/span> place before others must also assume a <span class=\"vocab-trigger\" data-vocab=\"lowly\">lowly<\/span> place before his God. We should not be surprised if God occasionally says to us, “Dear child, you have had enough of this hurried pace, excitement, and <span class=\"vocab-trigger\" data-vocab=\"publicity\">publicity<\/span>. Now I want you to go and hide yourself—‘hide in the Kerith Ravine’ of sickness, the ‘Kerith Ravine’ of sorrow, or some place of total <span class=\"vocab-trigger\" data-vocab=\"solitude\">solitude<\/span>, from which the crowds have turned away.”",
              "zh": "神的仆人必须学会隐藏生活的价值。一个要在人前居于崇高地位服侍的人，也必须先在神面前处卑微的位置。如果神偶尔对我们说：“亲爱的孩子，你这匆忙、兴奋、抛头露面的生活已经够了。现在我要你去藏起来——藏在疾病的‘基立溪旁’，藏在忧伤的‘基立溪旁’，或某个众人远离、全然孤寂的地方”，我们不应感到惊奇。",
              "simpEn": "God's servants must learn the worth of the hidden life. The one who will serve in a high place before others must also take a low place before God. Don't be shocked if God sometimes tells you, 'Dear child, you've had enough rushing, excitement, and being seen. Now I want you to go hide—hide in the Kerith Ravine of sickness, or sorrow, or a lonely place where crowds don't go.'",
              "simpZh": "神的仆人必须学会隐藏生活的价值。一个将来在众人面前有高位服事的人，也必须先在神面前处于卑微。如果神偶尔对我们说：“亲爱的孩子，你已经经历够多匆忙、兴奋和公开露面了。现在我要你藏起来——藏在疾病的‘基立溪旁’，藏在忧伤的‘基立溪旁’，或者某个远离人群、完全孤单的地方”，我们不用惊讶。"
            },
            {
              "en": "And happy is the person who can reply to the Lord, “Your will is also mine. Therefore I run to hide myself in You. ‘I long to dwell in your tent forever and take <span class=\"vocab-trigger\" data-vocab=\"refuge\">refuge<\/span> in the shelter of your wings’ [Ps. 61:4].” Every saintly soul that desires to wield great influence over others must first win the power in some hidden “Kerith Ravine.” Acquiring spiritual power is impossible unless we hide from others and ourselves in some deep ravine where we may absorb the power of the eternal God. May our lives be like the <span class=\"vocab-trigger\" data-vocab=\"vegetation\">vegetation<\/span> centuries ago that absorbed the power of the sunshine and now gives the energy back after having become coal.",
              "zh": "能如此回答主的人是幸福的：“祢的旨意也是我的。因此我跑来藏在祢里面。‘我渴望永远住在祢的帐幕里，投靠在祢翅膀的荫下’（诗篇61:4）。”每一个渴想对他人发挥重大影响的圣洁心灵，都必须先在某个隐藏的“基立溪旁”赢得能力。除非我们向他人、也向自己隐藏，在某个深处溪谷里吸收永生神的能力，否则获得属灵能力是不可能的。愿我们的生命像久远以前的植物，吸收了太阳的能力，如今变成煤以后，再把能量释放出来。",
              "simpEn": "Happy is the one who can say to God, 'Your will is mine too. So I run to hide in You. I long to live in Your tent forever and find safety under Your wings.' Every holy person who wants to have great effect on others must first win power in some hidden Kerith Ravine. We cannot get spiritual power unless we hide from people and ourselves in a deep place where we can take in the power of the forever God. May our lives be like the plants long ago that drank in the sun's power and now give back energy as coal.",
              "simpZh": "能这样回答主的人是有福的：“你的旨意也是我的。所以我跑进你里面藏身。我渴望永远住在你的帐幕里，在你翅膀的遮盖下避难。”每一个想要深深影响别人的圣洁心灵，都必须先在某个隐藏的“基立溪旁”得到能力。除非我们离开别人的眼目、也离开自己的感觉，藏在深处吸收永生神的能力，否则我们就得不到属灵能力。愿我们的生命像古时的植物，吸收阳光的力量，后来变成煤再释放出来。"
            },
            {
              "en": "<span class=\"vocab-trigger\" data-vocab=\"Lancelot Andrews\">Lancelot Andrews<\/span>, a bishop of the Church of England and one of the translators of the King James Bible of 1611, experienced his “Kerith Ravine,” in which he spent five hours of every day in prayer and devotion to God. <span class=\"vocab-trigger\" data-vocab=\"John Welsh\">John Welsh<\/span>, a contemporary of Andrews, and a Presbyterian who was imprisoned for his faith by <span class=\"vocab-trigger\" data-vocab=\"James VI of Scotland\">James VI of Scotland<\/span>, also had his “ravine.” He believed his day to be wasted if he did not spend eight to ten hours of isolated <span class=\"vocab-trigger\" data-vocab=\"communion\">communion<\/span> with God. <span class=\"vocab-trigger\" data-vocab=\"David Brainerd\">David Brainerd<\/span>’s “ravine” was the forests of North America while he served as a pioneer missionary to the American Indians during the eighteenth century. And <span class=\"vocab-trigger\" data-vocab=\"Christmas Evans\">Christmas Evans<\/span>, a preacher of the late-eighteenth and early-nineteenth centuries, had his long and lonely journeys through the hills of Wales.",
              "zh": "兰斯洛特·安德鲁斯，英国圣公会主教，1611年英王钦定本圣经的译者之一，经历过他的“基立溪旁”，每天花五个小时祷告亲近神。与安德鲁斯同时代的约翰·威尔士，是一位因信仰被苏格兰的詹姆斯六世下监的长老会信徒，也有他的“溪旁”。他相信，若没有花八到十小时与神单独交通，那一天就是虚度了。大卫·布雷纳德的“溪旁”是北美的森林，他在十八世纪向印第安人作拓荒宣教士时经历了。十八世纪末到十九世纪初的传道人圣诞节·伊文斯，则在威尔士的山岭中有他漫长孤单的旅程。",
              "simpEn": "Lancelot Andrews, an English bishop who helped translate the King James Bible, had his Kerith Ravine, spending five hours a day in prayer. John Welsh, a Scottish preacher put in prison for his faith, also had his ravine; he thought his day was wasted if he didn't spend eight to ten hours alone with God. David Brainerd's ravine was the forests of America while he worked as a missionary to Native Americans. Christmas Evans, a Welsh preacher, had his long lonely trips through the hills of Wales.",
              "simpZh": "兰斯洛特·安德鲁斯，一位英国主教，曾参与翻译英王钦定本圣经，他有过自己的“基立溪旁”，每天花五个小时祷告和亲近神。与他同时代的约翰·威尔士，一位因信仰坐牢的苏格兰牧师，也有他的“溪旁”。他认为如果一天没有花八到十小时单独与神交通，这一天就浪费了。大卫·布雷纳德是十八世纪向美洲印第安人传教的拓荒宣教士，他的“溪旁”是北美的森林。圣诞节·伊文斯是十八世纪末十九世纪初的威尔士传道人，他的“溪旁”是他穿越威尔士山岭的漫长孤单旅程。"
            },
            {
              "en": "Looking back to the blessed age from which we date the centuries, there are many notable “ravines.” The <span class=\"vocab-trigger\" data-vocab=\"Isle of Patmos\">Isle of Patmos<\/span>, the solitude of the Roman prisons, the <span class=\"vocab-trigger\" data-vocab=\"Arabian Desert\">Arabian Desert<\/span>, and the hills and valleys of <span class=\"vocab-trigger\" data-vocab=\"Palestine\">Palestine<\/span> are all as enduringly memorable as those experienced by the people who have shaped our modern world. Our Lord Himself lived through His “Kerith Ravine” in <span class=\"vocab-trigger\" data-vocab=\"Nazareth\">Nazareth<\/span>, in the wilderness of <span class=\"vocab-trigger\" data-vocab=\"Judea\">Judea<\/span>, amid the olive trees of <span class=\"vocab-trigger\" data-vocab=\"Bethany\">Bethany<\/span>, and in the solitude of the city of <span class=\"vocab-trigger\" data-vocab=\"Gadara\">Gadara<\/span>. So none of us is <span class=\"vocab-trigger\" data-vocab=\"exempt\">exempt<\/span> from a “ravine” experience, where the sounds of human voices are exchanged for the waters of quietness that flow from the throne of God, and where we taste the sweetness and soak up the power of a life “hidden with Christ” (Col. 3:3). <span class=\"vocab-trigger\" data-vocab=\"From Elijah, by F. B. Meyer\">From Elijah, by F. B. Meyer<\/span>",
              "zh": "回望我们所纪年的蒙福世代，有许多值得记念的“溪旁”。拔摩海岛、罗马监牢的孤寂、阿拉伯旷野、巴勒斯坦的群山深谷，都与那些塑造了现代世界的人所经历的同样值得永久记念。我们的主自己也在拿撒勒、犹太旷野、伯大尼的橄榄树林中，以及加大拉城的孤独里，经历了祂的“基立溪旁”。所以，我们无人能免于“溪旁”的经历，在那里，人声被从神宝座流出的安静之水取代，我们在那里尝到甘甜，吸收那“与基督一同隐藏”（歌罗西书3:3）的生命之能力。 摘自迈尔《以利亚》",
              "simpEn": "Looking back to the holy age that started our calendar, there are many great 'ravines.' The Island of Patmos, the lonely Roman prisons, the Arabian Desert, and the hills of Palestine are as unforgettable as those of the people who changed our world. Jesus Himself lived through His Kerith Ravine in Nazareth, the Judean wilderness, among Bethany's olive trees, and in the lonely city of Gadara. So none of us can escape a 'ravine' time, where human voices are traded for quiet waters from God's throne, and we taste the sweetness and take in the power of a life 'hidden with Christ.' From Elijah, by F. B. Meyer",
              "simpZh": "回顾我们用以纪年的蒙福时代，有许多著名的“溪旁”。拔摩海岛、罗马监狱的孤单、阿拉伯旷野、巴勒斯坦的山谷，都和那些塑造了现代世界的人们所经历的一样，值得永远铭记。我们的主自己也在拿撒勒、犹太旷野、伯大尼的橄榄树林和加大拉的孤独中，经历了祂的“基立溪旁”。所以我们没有人能躲开“溪旁”的经历，在那里，人的声音被从神宝座流出的安静之水代替，我们在那里尝到甘甜，吸收“与基督一同隐藏”的生命大能。摘自迈尔《以利亚》"
            }
          ],

        {
          "sectionId": 2,
          "heading": "September 17",
          "audio": "audio/streams in the desert - September 17.m4a",
          "paragraphs": [
            {
              "en": "He is the Lord; let him do what is good in his eyes. (1 Samuel 3:18)",
              "zh": "这是耶和华，愿祂凭自己的意旨而行。（撒母耳记上3:18）",
              "simpEn": "He is the Lord; let Him do what He sees as good.",
              "simpZh": "祂是耶和华，让祂照自己看为好的去行。"
            },
            {
              "en": "If I see God in everything, He will calm and color everything I see! Perhaps the circumstances causing my sorrows will not be removed and my situation will remain the same, but if Christ is brought into my grief and gloom as my Lord and Master, He will “surround me with songs of <span class=\"vocab-trigger\" data-vocab=\"deliverance\">deliverance<\/span>” (Ps. 32:7). To see Him and to be sure that His wisdom and power never fail and His love never changes, to know that even His most distressing dealings with me are for my deepest spiritual gain, is to be able to say in the midst of <span class=\"vocab-trigger\" data-vocab=\"bereavement\">bereavement<\/span>, sorrow, pain, and loss, “The Lord gave and the Lord has taken away; may the name of the Lord be praised” (Job 1:21).",
              "zh": "我若在凡事上看见神，祂就必使我所见的一切变为平静、富有色彩！或许造成我忧伤的环境不会挪开，我的处境也保持原样，但若让基督作为我的主进入我的忧愁与幽暗中，祂就要“用拯救的乐歌四面环绕我”（诗篇32:7）。看见祂，确信祂的智慧和能力永不失灵，祂的爱永不改变，知道祂对我最痛苦的作为乃是为我灵里最深的好处，这就能使我在丧亲、忧伤、痛苦和损失中说：“赏赐的是耶和华，收取的也是耶和华；耶和华的名是应当称颂的”（约伯记1:21）。",
              "simpEn": "If I see God in everything, He will make everything I see calm and full of color! Maybe the things that make me sad won't be taken away and my life will stay the same, but if Christ is brought into my sadness as my Lord, He will 'put songs of rescue all around me.' To see Him and know that His wisdom and strength never fail, His love never changes, and that even His hardest ways with me are for my deepest good—this lets me say in the middle of losing loved ones, sadness, pain, and loss, 'The Lord gave, and the Lord has taken away; may the Lord's name be praised.'",
              "simpZh": "如果我在一切事上都看见神，祂就会让我看见的一切变得平静、有色彩！也许让我忧愁的环境不会改变，我的处境还是那样，但如果让基督进入我的忧伤和黑暗里作我的主，祂就会“用拯救的歌四面环绕我”。看见祂，确信祂的智慧和能力永不出错，祂的爱永远不变，知道祂对我最难受的安排是为了我灵里最大的好处，这样我就能在失去亲人、忧伤、痛苦和损失中说：“赏赐的是耶和华，收取的也是耶和华；耶和华的名是应当称颂的。”"
            },
            {
              "en": "Seeing God in everything is the only thing that will make me loving and patient with people who annoy and trouble me. Then I will see others as the instruments God uses to accomplish His tender and wise purpose for me, and I will even find myself inwardly thanking them for the blessing they have become to me. Nothing but seeing God will completely put an end to all complaining and thoughts of <span class=\"vocab-trigger\" data-vocab=\"rebellion\">rebellion<\/span>. <span class=\"vocab-trigger\" data-vocab=\"Hannah Whitall Smith\">Hannah Whitall Smith<\/span>",
              "zh": "在凡事上看见神，是唯一能使我以爱心和忍耐对待那些烦扰我之人的事。那时我就看别人为神用以成就祂温柔智慧旨意的工具，甚至发觉自己在内心里为他们带给我的祝福感谢他们。除了看见神以外，别无他法能完全止息一切怨言和悖逆的意念。 汉娜·惠特·史密斯",
              "simpEn": "Seeing God in everything is the only thing that will make me loving and patient with people who bother me. Then I'll see others as tools God uses to do His kind and wise plan for me, and I'll even find myself thanking them inside for the good they've brought me. Nothing but seeing God will completely stop all complaining and thoughts of fighting back. Hannah Whitall Smith",
              "simpZh": "只有在凡事上看见神，才能让我对那些烦我、惹我的人有爱心和耐心。那时我就能把别人看成神用来完成祂温柔智慧计划的工具，甚至心里会为他们带给我的好处而感谢他们。只有看见神，才能完全停止所有的抱怨和反抗的念头。汉娜·惠特·史密斯"
            },
            {
              "en": "“Give me a new idea,” I said, While thinking on a sleepless bed; “A new idea that’ll bring to earth A balm for souls of priceless worth; That’ll give men thoughts of things above, And teach them how to serve and love, That’ll banish every selfish thought, And rid men of the sins they’ve fought.” The new thought came, just how, I’ll tell: ’Twas when on bended knee I fell, And sought from HIM who knows full well The way our sorrow to <span class=\"vocab-trigger\" data-vocab=\"expel\">expel<\/span>. SEE GOD IN ALL THINGS, great and small, And give HIM praise whate’er <span class=\"vocab-trigger\" data-vocab=\"befall\">befall<\/span>, In life or death, in pain or woe, See God, and overcome your foe. I saw HIM in the morning light, HE made the day shine clear and bright; I saw HIM in the noontide hour, And gained from HIM refreshing shower. At evening, when worn and sad, HE gave me help, and made me glad. At midnight, when on tossing bed My weary soul to sleep HE led. I saw HIM when great losses came, And found HE loved me just the same. When heavy loads I had to bear, I found HE lightened every care. By sickness, sorrow, sore distress, HE calmed my mind and gave me rest. HE’S filled my heart with joyous praise Since I gave HIM the upward gaze. ’Twas new to me, yet old to some, This thought that to me has become A revelation of the way We all should live throughout the day; For as each day unfolds its light, We’ll walk by faith and not by sight. Life will, indeed, a blessing bring, If we SEE GOD IN EVERYTHING. <span class=\"vocab-trigger\" data-vocab=\"A. E. Finn\">A. E. Finn<\/span>",
              "zh": "“给我一个新意念，”我在无眠的床上思想时说；“一个新意念，能将无价之宝的灵魂香膏带到地上；使人思想上面的事，教导他们如何服侍和爱；能驱逐一切自私的念头，使人脱离所挣扎的罪恶。”新意念来了，我告诉你怎样来的：乃是在我屈膝跪下，向那位深知如何驱除我们忧愁的主寻求的时候。在万事万物中看见神，或大或小都归荣给祂，或生或死，或痛苦或祸患，看见神，就能胜过仇敌。我在晨光中看见了祂，祂使那日清朗明亮；我在正午时刻看见了祂，从祂得着苏醒的阵雨。黄昏时分，疲乏忧愁之时，祂帮助我，使我欢欣。夜半，在辗转的床上，祂引导我疲乏的灵魂入睡。当大损失临到时，我看见了祂，发现祂爱我一如既往。当我必须背负沉重担子时，我发现祂减轻了每样挂虑。借疾病、忧伤和极重的痛苦，祂平静我的思绪，赐我安息。自从我向祂抬起仰望的目光，祂便以喜乐的赞美充满我心。对我来说，这意念虽新，但对有些人却是旧的；它成了我关于我们每日当如何生活的启示；因为每一天铺展其光明时，我们都要凭信心而行，不凭眼见。生命诚然会带来祝福，只要我们在万事万物中看见神。 芬恩",
              "simpEn": "'Give me a new idea,' I said, lying in bed unable to sleep; 'a new idea that will bring a healing medicine for souls of endless worth, give people thoughts of heaven, teach them to serve and love, drive out selfish thoughts, and free them from the sins they've fought.' The new thought came—I'll tell you how: when I fell on my knees and looked to Him who knows well how to drive out our sadness. SEE GOD IN ALL THINGS, big and small, and praise Him whatever happens. In life or death, in pain or trouble, see God, and beat your enemy. I saw Him in the morning light, He made the day bright and clear; I saw Him at noon, and got a cooling shower from Him. At evening, tired and sad, He helped me and made me glad. At midnight, on my restless bed, He led my tired soul to sleep. I saw Him when big losses came, and found He loved me just the same. When I had heavy loads to carry, I found He made each worry lighter. Through sickness, sorrow, deep pain, He calmed my mind and gave me rest. He's filled my heart with happy praise since I looked up to Him. This thought was new to me, but old to some—it has shown me how we all should live each day. As each day brings its light, we'll walk by faith and not by sight. Life will truly bring a blessing if we SEE GOD IN EVERYTHING. A. E. Finn",
              "simpZh": "“给我一个新想法，”我睡不着觉时这样想；“一个能把无价的心灵药膏带到地上来的新想法；让人思想天上的事，教他们怎样服事和爱；能赶走所有自私的念头，救人脱离一直在挣扎的罪。”新想法来了，我告诉你怎样来的：是在我屈膝跪下，向那位非常清楚怎样赶走我们忧愁的主寻求的时候。在一切事上看见神，无论大小，无论遭遇什么都赞美祂，或生或死，或痛或苦，看见神，就能胜过仇敌。我在晨光中看见祂，祂使那天又亮又清；我在正午时刻看见祂，从祂得到清凉的阵雨。黄昏时分，又累又难过，祂帮助我，使我快乐。半夜，我在床上翻来翻去，祂领我疲倦的灵魂入睡。当大损失临到时，我看见祂，发现祂还是一样爱我。当我必须背负沉重担子时，我发现祂减轻了每个挂虑。借着疾病、忧伤、极深的痛苦，祂平静我的心，赐我安息。自从我向祂抬起头仰望，祂就用喜乐的赞美充满我的心。这个想法对我是新的，但对有些人却是旧的——它启示了我每天应当怎样生活；每一天展开光明时，我们要凭信心走，不凭眼见。生命的确会带来祝福，如果我们能在一切事上看见神。芬恩"
            }
          ],
